apiVersion: v1
kind: Namespace
metadata:
  name: faultlab-01
  labels:
    workshop/fault: "01"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: faultlab-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # was: imagePullPolicy Never, which forbade the required external digest pull
          image: docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
