# Cloudbox Console — bespoke workshop portal (module 08). First-party app:
# source lives in apps/portal of this repo, image built by CI on GitHub.
# It reads platform state via the Kubernetes API (read-only ClusterRole),
# shows the picture gallery straight from RustFS and hands uploads to the
# uploader Knative Service from picture-pipeline.
#
# XR self-service (the Databases page) requires the module-08 Role in
# gitops/components/demo/ — it ships alongside the `demo` namespace so this
# component never references a namespace from a later sync wave (module 08
# teaches pushing that Role as a one-file change). Until it lands, the
# Databases page shows a friendly forbidden error.
apiVersion: v1
kind: Namespace
metadata:
  name: portal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-workspace-app-adapter
  namespace: portal
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: portal
          per_connection_buffer_limit_bytes: 1048576
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 18080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: portal_workspace_app
                    normalize_path: false
                    merge_slashes: false
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    route_config:
                      name: portal
                      virtual_hosts:
                        - name: portal
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: /__intar-s3/
                                headers:
                                  - name: ":method"
                                    safe_regex_match:
                                      google_re2: {}
                                      regex: "^(GET|HEAD)$"
                              route:
                                cluster: rustfs
                                prefix_rewrite: /
                                host_rewrite_literal: localhost:30900
                                timeout: 0s
                              request_headers_to_remove:
                                - forwarded
                                - x-forwarded-for
                                - x-forwarded-host
                                - x-forwarded-proto
                                - x-forwarded-port
                              response_headers_to_add:
                                - header:
                                    key: cache-control
                                    value: private, no-store
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                - header:
                                    key: referrer-policy
                                    value: no-referrer
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - match:
                                prefix: /__intar-s3/
                              direct_response:
                                status: 405
                                body:
                                  inline_string: "method not allowed\n"
                            - match:
                                prefix: /__intar-grafana
                              direct_response:
                                status: 200
                                body:
                                  inline_string: >-
                                    <!doctype html><meta charset="utf-8"><title>Open Grafana</title><p>Return to the Intar workshop room and choose <b>Workspace applications → Grafana</b>.</p>
                              response_headers_to_add:
                                - header:
                                    key: content-type
                                    value: text/html; charset=utf-8
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                - header:
                                    key: cache-control
                                    value: private, no-store
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                                - header:
                                    key: content-security-policy
                                    value: "default-src 'none'; style-src 'unsafe-inline'"
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - match:
                                prefix: /agent/ask
                                headers:
                                  - name: ":method"
                                    exact_match: POST
                              name: portal-agent-stream
                              route:
                                cluster: portal
                                timeout: 130s
                              request_headers_to_remove:
                                - accept-encoding
                            - match:
                                prefix: /
                              name: portal-ui
                              route:
                                cluster: portal
                                timeout: 70s
                              request_headers_to_remove:
                                - accept-encoding
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          inline_code: |
                            local function replace_all(value, needle, replacement)
                              local result = {}
                              local offset = 1
                              while true do
                                local first, last = string.find(value, needle, offset, true)
                                if first == nil then
                                  table.insert(result, string.sub(value, offset))
                                  break
                                end
                                table.insert(result, string.sub(value, offset, first - 1))
                                table.insert(result, replacement)
                                offset = last + 1
                              end
                              return table.concat(result)
                            end

                            local function public_base(authority)
                              if authority == "localhost:30600" or authority == "127.0.0.1:30600" then
                                return "http://" .. authority
                              end
                              local label = string.match(
                                authority,
                                "^(wa%-[a-z0-9][a-z0-9%-]*)%.intar%.app$"
                              )
                              if label == nil or #label > 63 or string.sub(label, -1) == "-" then
                                return nil
                              end
                              return "https://" .. authority
                            end

                            function envoy_on_request(handle)
                              local base = public_base(handle:headers():get(":authority") or "")
                              if base == nil then
                                handle:respond(
                                  {
                                    [":status"] = "400",
                                    ["content-type"] = "text/plain",
                                    ["cache-control"] = "no-store"
                                  },
                                  "invalid Host\n"
                                )
                                return
                              end
                              handle:streamInfo():dynamicMetadata():set(
                                "intar.portal-adapter",
                                "public_base",
                                base
                              )
                            end

                            function envoy_on_response(handle)
                              if handle:streamInfo():routeName() ~= "portal-ui" then
                                return
                              end
                              local content_type = handle:headers():get("content-type") or ""
                              if string.find(content_type, "text/html", 1, true) == nil then
                                return
                              end
                              local metadata = handle:streamInfo():dynamicMetadata():get(
                                "intar.portal-adapter"
                              )
                              if metadata == nil or metadata.public_base == nil then
                                return
                              end
                              local body = handle:body()
                              if body == nil then
                                return
                              end
                              local content = body:getBytes(0, body:length())
                              content = replace_all(
                                content,
                                "http://localhost:30900",
                                metadata.public_base .. "/__intar-s3"
                              )
                              content = replace_all(
                                content,
                                "http://localhost:30030",
                                metadata.public_base .. "/__intar-grafana"
                              )
                              body:setBytes(content)
                              handle:headers():remove("content-length")
                              handle:headers():remove("etag")
                            end
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
      clusters:
        - name: portal
          type: STATIC
          connect_timeout: 2s
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_requests: 32
          load_assignment:
            cluster_name: portal
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8080
        - name: rustfs
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 2s
          load_assignment:
            cluster_name: rustfs
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: rustfs-svc.rustfs.svc.cluster.local
                          port_value: 9000
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 19000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
  namespace: portal
---
# Read-only view of exactly the platform surfaces the console renders:
# ArgoCD Applications, CNPG database Clusters, Knative Services, pods and
# namespaces. Deliberately NOT read-all (contrast with the Backstage demo).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal-read
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [serving.knative.dev]
    resources: [services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, events]
    verbs: [get, list, watch]
  # Workload readiness for the /components status page and /workshop checklist.
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal-read
subjects:
  - kind: ServiceAccount
    name: portal
    namespace: portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      serviceAccountName: portal
      automountServiceAccountToken: false
      volumes:
        - name: portal-kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        - name: workspace-app-adapter-config
          configMap:
            name: portal-workspace-app-adapter
        - name: workspace-app-adapter-tmp
          emptyDir:
            sizeLimit: 16Mi
      containers:
        - name: portal
          # Built by CI from apps/portal (multi-arch). Must be in the
          # pre-pull list (scripts/images.txt).
          image: ghcr.io/randax/cloudbox-portal@sha256:f460aaf70c4c69c28ca0bd1c958f2fd77ceefb0a6acd7362615545ba7a232e73
          env:
            # The uploader is a cluster-local Knative Service in the
            # pipeline namespace — this is its ksvc cluster-local URL
            # (Knative answers on the service's root domain, no port).
            - name: UPLOADER_URL
              value: http://uploader.pipeline.svc.cluster.local
            # WORKSHOP-GRADE CREDENTIALS, committed on purpose (ephemeral
            # lab sandbox) — must match the rustfs component.
            - name: S3_ENDPOINT
              value: http://rustfs-svc.rustfs.svc.cluster.local:9000
            - name: S3_ACCESS_KEY
              value: cloudbox
            - name: S3_SECRET_KEY
              value: cloudbox123
            # Created by the picture-pipeline component's setup Job — the
            # gallery is empty (but the page loads) until that is enabled.
            - name: S3_BUCKET
              value: images
            # Cloudbox signs with the stable guest-local RustFS authority.
            # The sidecar rewrites rendered URLs to a route-local /__intar-s3/
            # path, then restores this authority before RustFS verifies SigV4.
            - name: S3_PUBLIC_ENDPOINT
              value: localhost:30900
            # Stable marker for observability deep-links. The sidecar
            # replaces it with guidance to open the separately authorized
            # Grafana route under Workspace applications in the Intar room.
            - name: GRAFANA_URL
              value: http://localhost:30030
            # Gitea credentials for the scaffold bridge (PRD-0012): the console
            # calls Gitea's generate API to create a tenant repo from a template.
            # The lab's fixed gitea_admin (versions.env) — committed on purpose,
            # like the S3 creds above (ephemeral lab sandbox). When GITEA_USER is
            # unset the "start from a template" option is simply not offered.
            - name: GITEA_USER
              value: gitea_admin
            - name: GITEA_PASSWORD
              value: cloudbox123
          ports:
            - containerPort: 8080
              name: portal-http
          readinessProbe:
            httpGet:
              path: /healthz
              port: portal-http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: portal-http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: portal-kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: workspace-app-adapter
          image: docker.io/envoyproxy/envoy@sha256:c5e8a68e52f4d4697a9adb280dbe415d77fedf1257e183dcb86205bd438f18bd
          command: ["/usr/local/bin/envoy"]
          args:
            - --disable-hot-restart
            - --concurrency
            - "1"
            - -c
            - /etc/intar-workspace-app/envoy.yaml
            - --log-level
            - warn
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 18080
              name: gateway
          readinessProbe:
            httpGet:
              path: /healthz
              port: gateway
              httpHeaders:
                - name: Host
                  value: localhost:30600
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
              httpHeaders:
                - name: Host
                  value: localhost:30600
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
          volumeMounts:
            - name: workspace-app-adapter-config
              mountPath: /etc/intar-workspace-app/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: workspace-app-adapter-tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: portal
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: gateway
      nodePort: 30600
  selector:
    app: portal
