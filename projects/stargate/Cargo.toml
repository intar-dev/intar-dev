[workspace]
members = [
    "crates/stargate-core",
    "crates/stargate-store-sqlite",
    "crates/stargate-gateway",
    "crates/stargate-app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.96"

[workspace.dependencies]
anyhow = "=1.0.102"
axum = { version = "=0.8.9", features = ["http1", "json", "macros", "tokio", "ws"] }
base64 = "=0.22.1"
bytes = "=1.12.0"
clap = { version = "=4.6.1", features = ["derive", "env"] }
dashmap = "=6.2.1"
futures-util = "=0.3.32"
http = "=1.4.2"
jsonwebtoken = { version = "=10.4.0", features = ["rust_crypto"] }
portable-pty = "=0.9.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
russh = "=0.61.2"
sd-notify = "=0.5.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "time", "tls-rustls", "uuid"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
time = { version = "=0.3.51", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "=1.52.3", features = ["full"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
tokio-util = "=0.7.18"
toml = "=1.1.2"
tower = "=0.5.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.23.3", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
