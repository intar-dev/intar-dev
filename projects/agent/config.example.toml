[server]
bind = "127.0.0.1:8080"

[cloud_hypervisor]
binary = "cloud-hypervisor"
spawn_timeout_seconds = 10

[bridge]
enabled = false
base_url = "https://intar.dev"
host_id = "my-dedicated-host-1"
bootstrap_token = ""
heartbeat_interval_seconds = 30

[ssh_access]
enabled = true
public_port_start = 22000
public_port_end = 22999
# Optional public hostname advertised to the control plane and used for SSH route targets.
advertised_host = "host1.intar.app"

[tools]
qemu_img = "qemu-img"

[vm_defaults]
# UEFI firmware reference.
# Can be either:
# - a local path (example: "/usr/share/cloud-hypervisor/hypervisor-fw")
# - a key in the `[firmwares]` registry below (example: "cloudhv")
# Leave empty to use direct (kernel+initramfs) boot via `[vm_defaults.boot]`.
firmware = "cloudhv"
tap = "tap"

# Where the agent writes per-VM artifacts (root disks, runtime disks, logs, and recordings).
work_dir = "/var/cache/intar-agent"

[vm_defaults.boot]
# Direct boot (no UEFI): host kernel + initramfs + cmdline.
# Keep this configured as a fallback if `vm_defaults.firmware` is empty.
kernel = "/var/cache/intar-agent/boot/vmlinux"
initramfs = "/var/cache/intar-agent/boot/initrd.img"
cmdline = "console=ttyAMA0 root=/dev/vda1 rw"

[vm_defaults.resources]
vcpus = 1
memory_mib = 512

[vm_defaults.network]
bridge = "br0"
guest_cidr = "10.200.0.0/24"
gateway = "10.200.0.1"
dns = ["1.1.1.1", "8.8.8.8"]

[image_registry]
# The agent expects images like:
# - <url>/ubuntu_lts_arm64.qcow2
# - <url>/ubuntu_lts_arm64.qcow2.sha256
url = "https://u559333.your-storagebox.de"
refresh_interval_minutes = 15
# Optional HTTP basic auth used for the index, qcow2 image downloads, and sha256 sidecars.
username = "u559333"
password = ""

[firmwares.cloudhv]
url = "https://github.com/cloud-hypervisor/edk2/releases/download/ch-a54f262b09/CLOUDHV.fd"
sha256 = "0624c06c5d07cb8efe38806890ce7076c41c0902f2fcd5b2376f107033e3222b"
