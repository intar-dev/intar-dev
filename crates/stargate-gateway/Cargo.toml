[package]
name = "stargate-gateway"
version = "0.5.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
intar-observability = { path = "../intar-observability" }
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "macros", "query", "tokio", "ws"] }
base64.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["env"] }
dashmap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
russh.workspace = true
# The share ingest socket's TLS needs a process-wide crypto provider (see
# `mirror.rs`); aws-lc-rs is already linked through reqwest.
rustls = { workspace = true, features = ["aws-lc-rs", "std"] }
sd-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
stargate-core = { path = "../stargate-core" }
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing-subscriber.workspace = true
# Paused time, so a test can wait out the writer's send timeout at once.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }

[lints]
workspace = true
