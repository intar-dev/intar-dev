[package]
name = "intar-image-cli"
version = "0.14.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
intar-contracts = { path = "../intar-contracts" }
# `build`: the bake the builder runs, and its checks of the result.
intar-image-build = { path = "../intar-image-build" }
intar-image-scenario = { path = "../intar-image-scenario" }
reqwest = { workspace = true, features = ["blocking", "multipart", "rustls"] }
serde_json.workspace = true
tempfile.workspace = true
# `build` boots what it built once, with the engine the desktop app runs labs with.
zpm = { path = "../zpm" }

[dev-dependencies]
flate2.workspace = true

[lints]
workspace = true
