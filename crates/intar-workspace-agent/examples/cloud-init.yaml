#cloud-config
# Rendered by Intar. This file intentionally contains no cloud-provider credential.
# Set-ID packages required by the harness must be installed before the
# restricted workspace-agent service starts.
packages:
  - ca-certificates
  - curl
  - openssh-server
  - procps
  - sudo
  - util-linux

users:
  - name: intar
    gecos: Intar Stargate
    shell: /bin/bash
    lock_passwd: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __INTAR_SSH_PUBLIC_KEY__

write_files:
  - path: /etc/intar/workspace-agent.toml
    owner: root:root
    permissions: "0600"
    content: |
      identity = { execution_id = "__EXECUTION_ID__", workspace_id = "__WORKSPACE_ID__", generation = __GENERATION__ }
      control_plane_endpoint = "https://intar.dev/api/runtime/workspace-agent/"
      bootstrap_capability_path = "/run/intar-workspace-agent/bootstrap"
      state_path = "/var/lib/intar-workspace-agent/state.json"
      checkpoint_tmpfs_dir = "/run/intar-workspace-agent/checkpoints"
      checkpoint_signing_keys = { "workshop-runtime-v1" = "__RUNTIME_SIGNING_PUBLIC_KEY_BASE64__" }
      reconstruction_user = "intar"
      reconstruction_home = "/home/intar"
      kino_url = "http://127.0.0.1:18081/probes"
      max_checkpoint_bytes = 536870912
      max_artifact_bytes = 134217728
      recording_dir = "/var/lib/kino-recordings"
      recording_upload_staging_dir = "/var/lib/intar-workspace-agent/recording-upload-staging"
      recording_drain_program = "/usr/libexec/intar-workspace-recording-drain"
      require_checkpoint_tmpfs = true
      run_cli_enabled = true

  - path: /run/intar-workspace-agent/bootstrap
    owner: root:root
    permissions: "0600"
    encoding: b64
    content: __ONE_USE_BOOTSTRAP_CAPABILITY_BASE64__

  - path: /run/intar-workspace-agent/agent.sha256
    owner: root:root
    permissions: "0600"
    content: "__AGENT_BINARY_SHA256__  /usr/local/sbin/intar-workspace-agent.new\n"

  - path: /run/intar-workspace-agent/kino.sha256
    owner: root:root
    permissions: "0600"
    content: "__KINO_BINARY_SHA256__  /usr/local/sbin/kino.new\n"

  # Kino's learner CLI reads this routing hint. The workspace-agent report
  # credential stays root-only; the broker validates the connecting learner.
  - path: /run/intar/run-cli-broker
    owner: root:root
    permissions: "0644"
    content: |
      unix:///run/intar-workspace-agent/run-cli.sock

  - path: /etc/kino/kino.hcl
    owner: root:root
    permissions: "0644"
    content: |
      server {
        bind = "tcp://127.0.0.1:18081"
      }
      defaults {
        every_seconds = 5
        timeout_seconds = 120
      }
      probe "__MODULE_00_PROBE_ID__" {
        kind = "command_json_path"
        argv = ["/usr/libexec/intar-workshop-run-probe", "/var/lib/intar-workshop-probes/00.sh"]
        json_path = "$.passed"
        expected = true
        intar_alias = "check-1"
        intar_label = "Check 1"
        intar_phase = "workshop"
        intar_module = "00"
      }

  - path: /etc/kino/recording.hcl
    owner: root:root
    permissions: "0644"
    content: |
      server {
        bind = "tcp://127.0.0.1:0"
      }
      recording {
        output_dir = "/var/lib/kino-recordings"
        real_shell = "/bin/bash"
      }

  - path: /usr/share/intar/completions/intar.bash
    owner: root:root
    permissions: "0644"
    content: |
      # Bash completion for the learner-facing Kino multicall CLI. This is
      # self-contained so workshop images do not need bash-completion.
      _intar_complete() {
        local cur="${COMP_WORDS[COMP_CWORD]}"
        local command="${COMP_WORDS[1]:-}"
        local candidates candidate
        COMPREPLY=()

        if [ "${COMP_CWORD}" -eq 1 ]; then
          COMPREPLY=( $(compgen -W 'status check hints hint solution help' -- "${cur}") )
          return 0
        fi

        case "${command}:${COMP_CWORD}" in
          solution:2)
            COMPREPLY=( $(compgen -W 'reveal' -- "${cur}") )
            ;;
          hint:2)
            candidates="$(/usr/bin/timeout --signal=KILL 0.25s /usr/local/bin/intar __complete "${COMP_CWORD}" "${COMP_WORDS[@]}" 2>/dev/null)" || return 0
            while IFS= read -r candidate; do
              [[ "${candidate}" =~ ^[a-z0-9][a-z0-9-]*$ ]] || continue
              [[ "${candidate}" == "${cur}"* ]] || continue
              COMPREPLY+=("${candidate}")
            done <<< "${candidates}"
            ;;
        esac
      }
      complete -F _intar_complete intar

  - path: /etc/bash.bashrc
    owner: root:root
    permissions: "0644"
    append: true
    content: |
      # Intar CLI completion. Kino starts SSH shells with bash -i, which reads
      # this system-wide Bash startup file.
      if [ -n "${BASH_VERSION:-}" ] && [[ $- == *i* ]] && [ -r /usr/share/intar/completions/intar.bash ]; then
        . /usr/share/intar/completions/intar.bash
      fi

  - path: /etc/ssh/sshd_config.d/90-intar-workshop.conf
    owner: root:root
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      AllowUsers intar
      AllowTcpForwarding yes
      GatewayPorts no
      X11Forwarding no
      PermitTunnel no
      AllowAgentForwarding no

  - path: /usr/libexec/intar-workshop-run-probe
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -u
      verifier="${1:?missing verifier}"
      set +e
      /usr/bin/env -i \
        HOME=/home/intar \
        USER=intar \
        LOGNAME=intar \
        SHELL=/bin/bash \
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
        LANG=C.UTF-8 \
        LC_ALL=C.UTF-8 \
        /bin/bash --noprofile --norc -c \
          'umask 0022; exec /bin/bash -- "$1"' \
          intar-probe \
          "${verifier}" </dev/null >/dev/null 2>&1
      status="$?"
      set -e
      if [ "${status}" -eq 0 ]; then
        printf '{"passed":true}\n'
      else
        printf '{"passed":false}\n'
        exit "${status}"
      fi

  - path: /usr/libexec/intar-workspace-wait-checkpoint
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      state=/var/lib/intar-workspace-agent/state.json
      until /usr/bin/grep -Fq '"checkpoint_applied":true' "${state}" 2>/dev/null; do
        /usr/bin/sleep 1
      done

  - path: /usr/local/sbin/intar-kino-shell
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      config=/etc/kino/recording.hcl
      if [ -n "${SSH_ORIGINAL_COMMAND:-}" ]; then
        if [ -t 0 ] && [ -t 1 ]; then
          exec /usr/local/sbin/kino record-ssh --config "${config}" --shell-startup interactive --command "${SSH_ORIGINAL_COMMAND}"
        fi
        exec /usr/local/sbin/kino record-command --config "${config}" --command "${SSH_ORIGINAL_COMMAND}"
      fi
      if [ "${1:-}" = -c ]; then
        if [ -t 0 ] && [ -t 1 ]; then
          exec /usr/local/sbin/kino record-ssh --config "${config}" --shell-startup interactive --command "${2:-}"
        fi
        exec /usr/local/sbin/kino record-command --config "${config}" --command "${2:-}"
      fi
      exec /usr/local/sbin/kino record-ssh --config "${config}" --shell-startup interactive

  - path: /usr/libexec/intar-workspace-recording-drain
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      systemctl stop ssh.service
      systemctl stop kino.service
      pkill -HUP -u intar -x kino 2>/dev/null || true
      remaining=300
      while pgrep -u intar -x kino >/dev/null 2>&1; do
        [ "${remaining}" -gt 0 ] || exit 1
        sleep 0.1
        remaining="$((remaining - 1))"
      done

  - path: /etc/systemd/system/kino.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Intar Kino workshop probe service
      Wants=network-online.target
      After=network-online.target
      ConditionPathExists=/etc/kino/kino.hcl

      [Service]
      Type=simple
      User=intar
      Group=intar
      UMask=0077
      Environment=KINO_CONTROL_SOCKET=/run/intar/kino-control.sock
      ExecStartPre=+/usr/libexec/intar-workspace-wait-checkpoint
      ExecStart=/usr/local/sbin/kino --config /etc/kino/kino.hcl
      Restart=on-failure
      RestartSec=2s
      TimeoutStartSec=100min
      TimeoutStopSec=5s
      KillMode=control-group
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectControlGroups=true
      RestrictSUIDSGID=true
      LockPersonality=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/intar-workspace-agent.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Intar Workshop learner workspace agent
      Wants=network-online.target ssh.service
      After=network-online.target ssh.service
      ConditionPathExists=/etc/intar/workspace-agent.toml
      StartLimitIntervalSec=300
      StartLimitBurst=10

      [Service]
      Type=simple
      User=root
      Group=root
      UMask=0077
      Environment=RUST_LOG=intar_workspace_agent=info
      ExecStart=/usr/local/sbin/intar-workspace-agent --config /etc/intar/workspace-agent.toml
      Restart=on-failure
      RestartSec=5s
      TimeoutStopSec=30s
      PrivateTmp=true
      ProtectHome=read-only
      ReadWritePaths=/home/intar
      ProtectControlGroups=true
      RestrictSUIDSGID=true
      LockPersonality=true

      [Install]
      WantedBy=multi-user.target

bootcmd:
  - [mkdir, -p, /run/intar, /run/intar-workspace-agent/checkpoints, /var/lib/intar-workspace-agent, /var/lib/kino-recordings, /etc/kino, /usr/share/intar/completions]
  - [chown, "intar:intar", /run/intar]
  - [chmod, "0755", /run/intar]
  # The agent owns a root:intar 0660 run-CLI socket in this directory. The
  # learner may traverse the directory, but cannot list or write it.
  - [chown, "root:intar", /run/intar-workspace-agent]
  - [chmod, "0750", /run/intar-workspace-agent]
  - [chmod, "0700", /run/intar-workspace-agent/checkpoints, /var/lib/intar-workspace-agent]

runcmd:
  # The binary URL and digest refer to an Intar CI release artifact. Checkpoint
  # reconstruction is separate and starts only after bootstrap succeeds.
  - [curl, --fail, --silent, --show-error, --location, __AGENT_BINARY_URL__, --output, /usr/local/sbin/intar-workspace-agent.new]
  - [curl, --fail, --silent, --show-error, --location, __KINO_BINARY_URL__, --output, /usr/local/sbin/kino.new]
  - [sha256sum, --check, --status, /run/intar-workspace-agent/agent.sha256]
  - [sha256sum, --check, --status, /run/intar-workspace-agent/kino.sha256]
  - [install, --owner=root, --group=root, --mode=0755, /usr/local/sbin/intar-workspace-agent.new, /usr/local/sbin/intar-workspace-agent]
  - [install, --owner=root, --group=root, --mode=0755, /usr/local/sbin/kino.new, /usr/local/sbin/kino]
  - [ln, --symbolic, --force, /usr/local/sbin/kino, /usr/local/bin/intar]
  - [rm, --force, /usr/local/sbin/intar-workspace-agent.new]
  - [rm, --force, /usr/local/sbin/kino.new]
  - [chown, "intar:intar", /var/lib/kino-recordings]
  - [chmod, "0700", /var/lib/kino-recordings]
  - [sh, -c, "grep -qxF /usr/local/sbin/intar-kino-shell /etc/shells || printf '%s\\n' /usr/local/sbin/intar-kino-shell >> /etc/shells"]
  - [usermod, --shell, /usr/local/sbin/intar-kino-shell, intar]
  - [sshd, -t]
  - [systemctl, restart, ssh.service]
  - [systemctl, daemon-reload]
  - [systemctl, enable, kino.service, intar-workspace-agent.service]
  - [systemctl, start, --no-block, kino.service, intar-workspace-agent.service]
