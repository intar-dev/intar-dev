execution_mode = "direct_provider_only"

[registry]
base_url = "https://intar.dev"
host_id = "builder-01"
bootstrap_token = "replace-with-a-builder-bootstrap-token"
http_timeout_seconds = 120

[worker]
work_root = "/var/lib/intar-workshop-builder/bundles"
poll_interval_seconds = 5
error_retry_seconds = 15
max_compressed_bundle_bytes = 67108864
max_expanded_bundle_bytes = 536870912
max_bundle_entries = 4096

# Required in direct_provider_only mode. The file contains either the raw
# 32-byte Ed25519 seed or its standard-base64 encoding. Production uses
# root:intar-builder ownership with mode 0640 so the unprivileged service can
# read but never replace it. Alternatively set
# `private_key_env = "INTAR_WORKSHOP_RUNTIME_SIGNING_KEY_B64"`; never put key
# material in this TOML file.
[worker.runtime_bundle_signing]
key_id = "workshop-runtime-v1"
private_key_file = "/etc/intar/workshop-runtime-ed25519"
compression = "zstd"
