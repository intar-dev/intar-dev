[server]
bind = "127.0.0.1:8080"

# intar-agent never spawns Cloud Hypervisor directly. Configure the pinned
# runtime only in the root-owned /etc/intar-jailerd/config.toml.
[jailer]
socket = "/run/intar-jailerd/control.sock"
request_timeout_seconds = 10

[bridge]
enabled = false
base_url = "https://intar.dev"
host_id = "my-dedicated-host-1"
bootstrap_token = ""
heartbeat_interval_seconds = 30

[vm_defaults]
# Naming and topology inputs for jailerd; the agent performs no privileged
# networking operations.
tap = "tap"
work_dir = "/var/cache/intar-agent"

[vm_defaults.resources]
# Fallback only. Scheduled scenarios use catalog V3 cpu_millis/vcpu_count.
vcpus = 1
memory_mib = 512

[vm_defaults.network]
guest_cidr = "10.77.0.0/16"
dns = ["1.1.1.1", "8.8.8.8"]

[image_registry]
url = "https://intar.dev/agent/registry/images"
refresh_interval_minutes = 15
