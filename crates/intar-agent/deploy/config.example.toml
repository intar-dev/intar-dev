[server]
bind = "127.0.0.1:8080"

[cloud_hypervisor]
binary = "cloud-hypervisor"
spawn_timeout_seconds = 10

[bridge]
enabled = false
base_url = "https://intar.dev"
host_id = "my-dedicated-host-1"
bootstrap_token = ""
heartbeat_interval_seconds = 30

[ssh_access]
enabled = true
public_port_start = 22000
public_port_end = 22999
# Optional public hostname advertised to the control plane and used for SSH route targets.
advertised_host = "host1.intar.app"

[vm_defaults]
tap = "tap"

# Where the agent writes per-VM artifacts (root disks, runtime disks, logs, and recordings).
work_dir = "/var/cache/intar-agent"

[vm_defaults.resources]
vcpus = 1
memory_mib = 512

[vm_defaults.network]
guest_cidr = "10.77.0.0/16"
dns = ["1.1.1.1", "8.8.8.8"]

[image_registry]
# The Worker index includes image_key, image_sha256, image_format, image_virtual_size_bytes,
# boot artifact metadata, and download_url entries.
url = "https://intar.dev/agent/registry/images"
refresh_interval_minutes = 15
# Optional HTTP basic auth used for local/dev registries. Production agents use bridge JWT auth.
# username = ""
# password = ""

[image_cache]
# Optional maximum bytes for raw image and direct-boot artifact cache. Omit for unbounded.
# max_bytes = 53687091200
