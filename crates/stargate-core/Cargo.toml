[package]
name = "stargate-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
intar-contracts = { path = "../intar-contracts" }
# tungstenite logs raw credentials and frame payloads at debug/trace. Compile
# these dependency logs out even when a caller enables runtime trace logging.
log = { workspace = true, features = ["max_level_info", "release_max_level_info"] }
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
url.workspace = true
uuid.workspace = true

[lints]
workspace = true
