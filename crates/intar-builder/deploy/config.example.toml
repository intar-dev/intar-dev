[bridge]
enabled = true
base_url = "https://intar.dev"
host_id = ""
bootstrap_token = ""
heartbeat_interval_seconds = 20

[builder]
work_root = "/var/lib/intar-builder/work"
cache_root = "/var/cache/intar-builder"
state_db = "/var/lib/intar-builder/state.sqlite3"

[qemu]
qemu_binary = "qemu-system-x86_64"
mke2fs_binary = "mke2fs"
e2fsck_binary = "e2fsck"
resize2fs_binary = "resize2fs"
provision_timeout_seconds = 2400
qemu_exit_timeout_seconds = 300
accelerator = "kvm"
build_cpus = 4
build_memory_mb = 4096

[qemu.layered]
qemu_img_binary = "qemu-img"
buildctl_binary = "buildctl"
umoci_binary = "umoci"
debian_image = "docker.io/library/debian@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392"
# The same Debian for arm64 images. They are built too, by emulation, when
# qemu-system-aarch64 is installed beside qemu_binary and the kernel runs
# arm64 programs (qemu-user-static); `intar-builder doctor` says which.
debian_image_arm64 = "docker.io/library/debian@sha256:24a01011d10eba3a023bc8585b9650b8b29021240d4217c05b905e09ef4a5232"
oci_cache_root = "/var/cache/intar-builder/oci"
checkpoint_cache_root = "/var/cache/intar-builder/checkpoints"
use_cache = true
oci_cache_bytes = 8589934592
checkpoint_cache_bytes = 42949672960
minimum_free_bytes = 21474836480

[jobs]
max_concurrent_builds = 2
