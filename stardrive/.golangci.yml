version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - misspell
    - nilerr
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (net.Listener).Close
        - (*compress/gzip.Reader).Close
        - (*github.com/intar-dev/stardrive/internal/talos.Client).Close
        - os.Remove
        - os.RemoveAll
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - unparam
