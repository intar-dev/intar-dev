[package]
name = "jumper"
version = "0.5.0"
edition.workspace = true
# src/ui/theme.rs and src/ui/text_input.rs are Apache-2.0 (LICENSE-APACHE).
license = "MIT AND Apache-2.0"
publish.workspace = true
rust-version.workspace = true
description = "The intar desktop app: run labs on your own computer."

[dependencies]
anyhow.workspace = true
# Terminal emulation for the run's terminal; the app draws the grid itself.
alacritty_terminal.workspace = true
# Reads a run's recorded sessions and renders their replays.
dhd = { path = "../../crates/dhd" }
dirs.workspace = true
futures-util.workspace = true
gpui.workspace = true
intar-contracts = { path = "../../crates/intar-contracts" }
# The sign-in is kept in the OS keychain, never on disk.
keyring-core.workspace = true
# The terminal's SSH connection to the guest.
russh.workspace = true
# Course markdown (bodies, theory, hints, solutions).
pulldown-cmark.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }
serde_json.workspace = true
# Downloads are checked against their digests; disk chunks are zstd.
sha2.workspace = true
subspace = { path = "../../crates/subspace" }
tokio.workspace = true
# Grapheme-aware cursor movement in the text input.
unicode-segmentation.workspace = true
url.workspace = true
uuid.workspace = true
zpm = { path = "../../crates/zpm" }
zstd.workspace = true

[dev-dependencies]
# Window tests: TestAppContext and simulated input.
gpui = { workspace = true, features = ["test-support"] }
fatfs.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# runtime_shaders: builds without the Metal compiler that only full Xcode ships.
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
apple-native-keyring-store = { workspace = true, features = ["protected"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform.workspace = true
windows-native-keyring-store.workspace = true

[lints]
workspace = true
