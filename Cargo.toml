[workspace]
members = [
    "crates/cloud-hypervisor-client",
    "crates/intar-agent",
    "crates/intar-builder",
    "crates/intar-contracts",
    "crates/intar-contracts-typegen",
    "crates/intar-image-build",
    "crates/intar-image-cli",
    "crates/intar-image-scenario",
    "crates/intar-image-upload",
    "crates/intar-jailer",
    "crates/intar-jailer-protocol",
    "crates/intar-jailerd",
    "crates/intar-kino-proto",
    "crates/intar-observability",
    "crates/kino",
    "crates/stargate-core",
    "crates/stargate-gateway",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.dependencies]
anyhow = "=1.0.104"
avt = "=0.18.0"
axum = { version = "=0.8.9", default-features = false }
blake3 = "=1.8.7"
base16ct = { version = "=1.0.0", features = ["alloc"] }
base64 = "=0.23.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
dashmap = "=6.2.1"
dirs = "=7.0.0"
ed25519-dalek = "=3.0.0"
fatfs = "=0.3.6"
flate2 = "=1.1.10"
fs2 = "=0.4.3"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
hcl-rs = "=0.19.9"
http = "=1.5.0"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
jsonpath-rust = "=1.0.12"
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_35"] }
kube = { version = "=4.2.0", default-features = false, features = ["client", "config", "rustls-tls"] }
log = "=0.4.34"
nix = "=0.31.3"
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.3.0"
pty-process = "=0.5.4"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false }
ring = "=0.17.14"
rustix = { version = "=1.1.5", features = ["event", "fs", "mount", "net", "pipe", "process", "system", "thread"] }
reflink-copy = "=0.1.30"
rustls = { version = "=0.23.46", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
russh = "=0.64.1"
schemars = { version = "=1.2.3", features = ["derive"] }
sd-notify = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.1"
signal-hook = "=0.4.5"
tempfile = "=3.27.0"
tar = "=0.4.46"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false }
tokio-util = "=0.7.20"
tokio-vsock = { version = "=0.7.2", features = ["axum08"] }
toml = "=1.1.8"
tower = "=0.5.3"
tracing = "=0.1.44"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.28.0", features = ["serde", "v4"] }
xattr = "=1.6.1"
zstd = "=0.14.3"
zbus = { version = "=6.0.0", default-features = false, features = ["default-rt", "proxy"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_attributes = "deny"
unused_lifetimes = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

# Line tables keep backtraces' file and line but drop the variable info that
# made test binaries several times larger, so CI links less and its cache
# volumes hold less. CARGO_PROFILE_DEV_DEBUG=full brings it back for a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.guest]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
