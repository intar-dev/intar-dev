[workspace]
members = [
    "crates/cloud-hypervisor-client",
    "crates/intar-agent",
    "crates/intar-builder",
    "crates/intar-contracts",
    "crates/intar-contracts-typegen",
    "crates/intar-image-build",
    "crates/intar-image-cli",
    "crates/intar-image-scenario",
    "crates/intar-image-upload",
    "crates/intar-jailer",
    "crates/intar-jailer-protocol",
    "crates/intar-jailerd",
    "crates/intar-kino-proto",
    "crates/intar-workshop-cli",
    "crates/intar-workshop-builder",
    "crates/intar-workshop-manifest",
    "crates/intar-workspace-agent",
    "crates/kino",
    "crates/stargate-core",
    "crates/stargate-gateway",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97"

[workspace.dependencies]
anyhow = "=1.0.103"
avt = "=0.18.0"
axum = { version = "=0.8.9", default-features = false }
base16ct = { version = "=1.0.0", features = ["alloc"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.1", features = ["derive"] }
crossterm = "=0.29.0"
dashmap = "=6.2.1"
dirs = "=6.0.0"
ed25519-dalek = "=2.2.0"
fatfs = "=0.3.6"
flate2 = "=1.1.9"
fs2 = "=0.4.3"
futures-util = "=0.3.32"
getrandom = "=0.4.3"
hcl-rs = "=0.19.7"
http = "=1.4.2"
hyper = { version = "=1.10.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
jsonpath-rust = "=1.0.4"
jsonwebtoken = { version = "=10.4.0", features = ["rust_crypto"] }
k8s-openapi = { version = "=0.28.0", features = ["v1_35"] }
kube = { version = "=4.0.0", default-features = false, features = ["client", "config", "rustls-tls"] }
nix = "=0.31.3"
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
pty-process = "=0.5.3"
regex = "=1.13.0"
reqwest = { version = "=0.13.4", default-features = false }
rustix = { version = "=1.1.4", features = ["event", "fs", "mount", "net", "pipe", "process", "system", "thread"] }
reflink-copy = "=0.1.30"
rustls = { version = "=0.23.41", default-features = false }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
russh = "=0.62.2"
schemars = { version = "=1.2.1", features = ["derive"] }
sd-notify = "=0.5.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde-saphyr = { version = "=1.2.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.0"
signal-hook = "=0.4.4"
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite", "time", "tls-rustls", "uuid"] }
tempfile = "=3.27.0"
tar = "=0.4.46"
thiserror = "=2.0.18"
time = { version = "=0.3.53", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false }
tokio-util = "=0.7.18"
tokio-vsock = { version = "=0.7.2", features = ["axum08"] }
toml = "=1.1.2"
tower = "=0.5.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.23.4", features = ["serde", "v4"] }
wasm-bindgen = "=0.2.126"
xattr = "=1.6.1"
zstd = "=0.13.3"
zbus = "=5.17.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_attributes = "deny"
unused_lifetimes = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.guest]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
