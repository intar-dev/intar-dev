# Action pins are the supply-chain boundary for CI. Dependabot proposes the
# next pinned revision, and a human reviews the version comment with it.
# `directory: "/"` scans only .github/workflows and a root action.yml, so the
# composite actions under .github/actions are listed as well.
# The intar-*.yml workflows are generated by cuenv, which hardcodes their
# checkout, and `cuenv task sync-check` rejects any hand edit. Excluding them
# keeps the grouped proposal mergeable.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    exclude-paths:
      - ".github/workflows/intar-*.yml"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
