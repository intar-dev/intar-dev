# Action pins are the supply-chain boundary for CI. Dependabot proposes the
# next pinned revision, and a human reviews the version comment with it.
# `directory: "/"` scans only .github/workflows and a root action.yml, so the
# composite actions under .github/actions are listed as well.
# Every workflow except scenario-publish.yml is rendered by cuenv, and
# `cuenv task sync-check` rejects a hand edit, so Dependabot skips them to keep
# the grouped proposal mergeable; sync-check also requires each rendered file
# below. Their pins are also listed in a scanned file, which the workflow
# policy enforces (see .github/actions/workflow-pins). When Dependabot bumps
# one, replace its SHA and tag in ci/gha/pins.cue in the same pull request,
# then run `cuenv sync codegen`.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    exclude-paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/website.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/image-ops.yml"
      - ".github/workflows/stargate-deploy.yml"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
