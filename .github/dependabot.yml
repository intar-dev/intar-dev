# Action pins are the supply-chain boundary for CI. Dependabot proposes the
# next pinned revision, and a human reviews the version comment with it.
# The intar-*.yml workflows are generated by cuenv, which hardcodes their
# checkout. Close proposals that touch them: `cuenv task sync-check` rejects
# any hand edit, and pins for their setup live in .github/actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
