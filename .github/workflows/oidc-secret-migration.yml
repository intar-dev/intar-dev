name: OIDC secret migration
run-name: "OIDC secret migration ${{ inputs.operation }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Migration operation
        required: true
        type: choice
        options:
          - plan
          - backfill
      confirmation:
        description: Type the exact confirmation for the selected operation
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when no independent reviewer exists
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oidc-secret-migration-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Run protected OIDC ${{ inputs.operation }}
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      OPERATION: ${{ inputs.operation }}
      OIDC_MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify protected operation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REPOSITORY}" = "intar-dev/intar-dev"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${RUN_ATTEMPT}" = "1"
          case "${OPERATION}" in
            plan)
              test "${OIDC_MIGRATION_CONFIRMATION}" = "PLAN OIDC SECRET MIGRATION"
              ;;
            backfill)
              test "${OIDC_MIGRATION_CONFIRMATION}" = "BACKFILL OIDC SECRET MIGRATION"
              ;;
            *)
              exit 1
              ;;
          esac
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1}"

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Read the configured production D1 identity
        run: |
          set -euo pipefail
          # D1's immutable production ID is intentionally explicit here. Keep
          # this protected workflow coupled to the checked-in Worker binding.
          database_id="c53ff120-c555-4702-b3a1-eaab44fd76f6"
          grep -F '"database_id": "'"${database_id}"'"' \
            apps/web/wrangler.jsonc >/dev/null
          [[ "${database_id}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          printf 'CLOUDFLARE_DATABASE_ID=%s\n' "${database_id}" >> "${GITHUB_ENV}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install the locked workspace tools
        run: bun install --frozen-lockfile

      - name: Run counts-only migration operation
        id: migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
        run: |
          set -euo pipefail
          counts_file="${RUNNER_TEMP}/oidc-secret-migration-counts.json"
          test ! -e "${counts_file}"
          bun tools/database/oidc-secret-migration.ts \
            --operation "${OPERATION}" \
            --counts-output "${counts_file}"
          printf 'OIDC_MIGRATION_COUNTS_FILE=%s\n' "${counts_file}" >> "${GITHUB_ENV}"

      - name: Validate counts-only evidence
        if: ${{ always() && steps.migration.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          counts_file="${RUNNER_TEMP}/oidc-secret-migration-counts.json"
          jq -e --arg operation "${OPERATION}" '
            .version == 1 and
            .operation == $operation and
            (.status | if $operation == "plan" then . == "ready" else . == "completed" end) and
            (.counts | type == "object") and
            (.counts | keys) == [
              "casConflicts",
              "ciphertextInvalid",
              "ciphertextOnly",
              "ciphertextPresent",
              "ciphertextValid",
              "configInvalid",
              "dualWritten",
              "missingSecretMaterial",
              "plaintextOnly",
              "plaintextPresent",
              "scanned",
              "secretMismatch",
              "writesApplied"
            ] and
            (.counts | all(.[]; type == "number" and . >= 0 and floor == .))
          ' "${counts_file}" >/dev/null
          {
            printf 'oidc_secret_migration_operation=%s\n' "${OPERATION}"
            jq -r '.counts | to_entries[] | "oidc_secret_migration_\(.key)=\(.value)"' \
              "${counts_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain counts-only migration evidence
        if: ${{ always() && steps.migration.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oidc-secret-migration-counts-${{ inputs.operation }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/oidc-secret-migration-counts.json
          if-no-files-found: error
          retention-days: 90
