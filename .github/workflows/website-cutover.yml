name: Website cutover

run-name: "Website cutover @ ${{ github.sha }}"

# The ABI 2 terminal-ready release has no compatibility path, so the production
# deploy is never automatic. This lane proves the release and hands a verified
# static pin to the deploy workflow.
#
# What this lane proves before the candidate deploy: the fleet-wide runtime
# cutover gate is drained with zero active desired VMs, the release objects
# match the pinned ABI 2 manifest, and the deploy workflow proves the live
# control plane answers 503 with code maintenance plus an empty run drain
# audit.
#
# What stays operator-attested, because a web deploy can not read it: the
# gateway route drain (zero terminal, workspace app, and browser sessions), the
# scenario host package and host disable switch, the image readiness, and the
# runtime version on every host.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: cutover closes the control plane and deploys the candidate; reopen returns the same release to service with the fleet still drained
        required: true
        default: cutover
        type: choice
        options:
          - cutover
          - reopen
      tools_run_id:
        description: Successful "Guest tools deployment" run ID for this exact revision
        required: true
        type: string
      cutover_sha:
        description: Exact 40-hex commit SHA of the cutover revision; must equal the dispatch revision and the live deployed tag
        required: true
        type: string
      confirmation:
        description: Type the confirmation for the selected operation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify ABI 2 release pin
    runs-on: namespace-profile-intar-dev
    environment:
      name: production
    timeout-minutes: 30
    outputs:
      static_pin_json: ${{ steps.pin.outputs.static_pin_json }}
      website_dist_run_id: ${{ steps.website-artifact.outputs.website_dist_run_id }}
      maintenance: ${{ steps.cutover-inputs.outputs.maintenance }}
    env:
      BUCKET: intar-dev-vm-image-registry-20260709
    steps:
      - name: Validate cutover inputs
        id: cutover-inputs
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          [[ "${TOOLS_RUN_ID}" =~ ^[0-9]{1,20}$ ]]
          # The operator names the cutover revision, and it must be the
          # revision this dispatch runs on. A reopen therefore returns the
          # exact release that was cut over: a later main can not be reopened
          # under the earlier release name.
          # An explicit conditional, not a bare [[ ]] test: a bare test relies
          # on the shell exiting from a failed conditional under set -e, and
          # that behavior differs between shell versions.
          if ! [[ "${CUTOVER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cutover_sha must be a 40-hex commit SHA." >&2
            echo "cutover_sha=${CUTOVER_SHA}" >&2
            exit 1
          fi
          if [ "${CUTOVER_SHA}" != "${GITHUB_SHA}" ]; then
            echo "cutover_sha does not match the dispatch revision." >&2
            echo "cutover_sha=${CUTOVER_SHA}" >&2
            echo "dispatch=${GITHUB_SHA}" >&2
            exit 1
          fi
          case "${OPERATION}" in
            cutover)
              test "${CONFIRMATION}" = 'CUTOVER WEB RELEASE'
              printf 'maintenance=on\n' >> "${GITHUB_OUTPUT}"
              ;;
            reopen)
              test "${CONFIRMATION}" = 'REOPEN WEB RELEASE'
              printf 'maintenance=off\n' >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo 'operation must be cutover or reopen' >&2
              exit 1
              ;;
          esac
        env:
          OPERATION: ${{ inputs.operation }}
          TOOLS_RUN_ID: ${{ inputs.tools_run_id }}
          CUTOVER_SHA: ${{ inputs.cutover_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}

      - name: Verify the runtime cutover gate is drained
        if: inputs.operation == 'cutover'
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # This lane is the only orchestrator for a web cutover, so it refuses
          # to deploy a candidate while the runtime still holds work. The check
          # is read-only and runs before anything is downloaded. It proves the
          # fleet-wide runtime gate; the gateway route drain, the scenario host
          # package, and the image readiness stay operator-attested, because a
          # web deploy can not read them.
          gate="${RUNNER_TEMP}/cutover-gate.json"
          status="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${INTAR_IMAGE_PUBLISH_TOKEN}" \
            --output "${gate}" --write-out '%{http_code}' \
            https://intar.dev/registry/v1/cutover/gate)"
          if [ "${status}" != 200 ]; then
            echo "The runtime cutover gate is unreadable (HTTP ${status})." >&2
            echo "While maintenance is on the registry sits behind the fence," >&2
            echo "so the gate can only be read and set before the plane closes." >&2
            echo "Drain the fleet gate first, then dispatch this operation." >&2
            exit 1
          fi
          jq -e '.state == "drained" and .active_desired_vms == 0' "${gate}" >/dev/null
          jq -c '{state: .state, active_desired_vms: .active_desired_vms}' "${gate}"

      - name: Verify the control plane is closed for the reopen
        if: inputs.operation == 'reopen'
        run: |
          set -euo pipefail
          # Every /api and /agent route, and the registry that fronts the
          # cutover gate, sits behind this fence while maintenance is on, so a
          # reopen cannot read the gate. This step proves the fence: the live
          # worker must still be closed. The release binding is enforced
          # separately and does not rely on this probe: validate cutover inputs
          # requires cutover_sha to equal the dispatch revision, and the live
          # deployment tag check requires that revision to be the one serving.
          # The operator still attests the fleet stays drained, because that
          # state is not readable from here. Nothing in this lane opens the
          # fleet gate or enables a host.
          probe="${RUNNER_TEMP}/reopen-maintenance.json"
          probe_status="$(curl --silent --show-error --max-time 30 \
            --header 'Accept: application/json' --output "${probe}" \
            --write-out '%{http_code}' \
            https://intar.dev/api/control-plane-maintenance-probe)"
          test "${probe_status}" = 503
          test "$(jq -er '.code' "${probe}")" = maintenance
          jq -c '{maintenance: .code}' "${probe}"

      - name: Checkout cutover revision
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Verify the guest tools release run
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_RUN_ID: ${{ inputs.tools_run_id }}
        run: |
          set -euo pipefail
          run_json="${RUNNER_TEMP}/guest-tools-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TOOLS_RUN_ID}" > "${run_json}"
          jq -e --arg sha "${GITHUB_SHA}" --arg repository "${GITHUB_REPOSITORY}" '
            .repository.full_name == $repository and
            .head_sha == $sha and
            .head_branch == "main" and
            .event == "workflow_dispatch" and
            .conclusion == "success" and
            (.path | endswith("guest-tools-deploy.yml"))
          ' "${run_json}" >/dev/null

      - name: Download the release evidence by artifact ID and digest
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_RUN_ID: ${{ inputs.tools_run_id }}
        run: |
          set -euo pipefail
          artifact_name="guest-tools-deployment-${TOOLS_RUN_ID}"
          artifacts_json="${RUNNER_TEMP}/guest-tools-artifacts.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${TOOLS_RUN_ID}/artifacts" \
            > "${artifacts_json}"
          jq -e --arg name "${artifact_name}" '
            [.artifacts[] | select(.name == $name and .expired == false)] |
            if length == 1 then
              .[0] as $artifact |
              ($artifact.id | type == "number") and
              ($artifact.digest |
                type == "string" and test("^sha256:[0-9a-f]{64}$"))
            else false end
          ' "${artifacts_json}" >/dev/null
          artifact_id="$(jq -er --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name)] | .[0].id' "${artifacts_json}")"
          expected_digest="$(jq -er --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name)] | .[0].digest' \
            "${artifacts_json}" | cut -d: -f2)"
          artifact_zip="${RUNNER_TEMP}/guest-tools-release.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${artifact_zip}"
          test "$(sha256sum "${artifact_zip}" | cut -d ' ' -f 1)" = "${expected_digest}"
          release_dir="${RUNNER_TEMP}/guest-tools-release"
          mkdir -p "${release_dir}"
          python3 - "${artifact_zip}" "${release_dir}" <<'PY'
          import sys, zipfile
          archive_path, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              for name in archive.namelist():
                  if name.startswith("/") or ".." in name.split("/"):
                      sys.exit("unsafe artifact member: " + name)
              archive.extractall(destination)
          PY
          test -f "${release_dir}/candidate.json"
          jq -e '.schema_version == 1 and .bootstrap_abi == 2' \
            "${release_dir}/candidate.json" >/dev/null
          printf 'RELEASE_DIR=%s\n' "${release_dir}" >> "${GITHUB_ENV}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install pinned Wrangler
        run: bun install --frozen-lockfile

      - name: Verify the live deployment is the cutover revision
        if: inputs.operation == 'reopen'
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUTOVER_SHA: ${{ inputs.cutover_sha }}
        run: |
          set -euo pipefail
          # The named SHA must be the SHA that is actually serving. The
          # deploy tags every version web-<sha12>-<label>, and wrangler
          # returns that tag as annotations['workers/tag'], so this is live
          # deployment evidence and not a claim by the caller.
          deployment="${RUNNER_TEMP}/reopen-deployment.json"
          version="${RUNNER_TEMP}/reopen-version.json"
          bunx wrangler deployments status --name intar-dev --json \
            > "${deployment}"
          active_version_id="$(jq -er '
            [.versions[] | select(.percentage == 100)] |
            select(length == 1) | .[0].version_id
          ' "${deployment}")"
          bunx wrangler versions view "${active_version_id}" \
            --name intar-dev --json > "${version}"
          # An untagged version must reach the refusal below, not a jq error.
          tag="$(jq -r '.annotations["workers/tag"] // ""' "${version}")"
          expected_prefix="web-${CUTOVER_SHA:0:12}-"
          case "${tag}" in
            "${expected_prefix}"*) ;;
            *)
              echo "The active Worker version is not the cutover revision." >&2
              echo "cutover_sha=${CUTOVER_SHA}" >&2
              echo "active_version=${active_version_id}" >&2
              echo "active_tag=${tag}" >&2
              echo "expected_tag_prefix=${expected_prefix}" >&2
              exit 1
              ;;
          esac
          printf 'active_version=%s\nactive_tag=%s\n' \
            "${active_version_id}" "${tag}"
          {
            printf 'cutover_sha=%s\n' "${CUTOVER_SHA}"
            printf 'active_version_id=%s\n' "${active_version_id}"
            printf 'active_tag=%s\n' "${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify the release verification tools
        run: |
          set -euo pipefail
          # The verifier decompresses the release object and extracts the
          # embedded files from the raw ext4 image. The runner profile that
          # builds the guest tools already provides zstd and e2fsprogs, so this
          # read-only check fails closed before anything is downloaded.
          for tool in zstd debugfs; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              echo "missing required release verification tool: ${tool}" >&2
              echo 'The cutover runner must provide zstd and e2fsprogs' >&2
              echo '(debugfs) as image dependencies.' >&2
              exit 1
            fi
            printf '%s: %s\n' "${tool}" "$(command -v "${tool}")"
          done
          zstd --version
          debugfs -V 2>&1 | head -n 1

      - name: Download the published release objects from R2
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          disk="$(jq -er .tools_disk_sha256 "${RELEASE_DIR}/candidate.json")"
          kino="$(jq -er .kino_sha256 "${RELEASE_DIR}/candidate.json")"
          bunx wrangler r2 object get \
            "${BUCKET}/guest-tools/scenario/disks/${disk}.ext4.zst" \
            --remote --jurisdiction eu --file "${RELEASE_DIR}/tools.ext4.zst"
          bunx wrangler r2 object get \
            "${BUCKET}/guest-tools/scenario/kino/${kino}/kino" \
            --remote --jurisdiction eu --file "${RELEASE_DIR}/kino"

      - name: Verify the release objects and build the static pin
        id: pin
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pin_file="${RUNNER_TEMP}/release-static-pin.json"
          evidence_file="${RUNNER_TEMP}/release-static-pin-evidence.json"
          bun tools/deploy/guest-tools-pin.ts release \
            --manifest "${RELEASE_DIR}/candidate.json" \
            --disk "${RELEASE_DIR}/tools.ext4.zst" \
            --kino "${RELEASE_DIR}/kino" \
            --out "${pin_file}" > "${evidence_file}"
          jq -e '.status == "verified"' "${evidence_file}" >/dev/null
          bun tools/deploy/guest-tools-pin.ts check --pin "${pin_file}" >/dev/null
          {
            printf 'static_pin_json=%s\n' "$(jq -c . "${pin_file}")"
          } >> "${GITHUB_OUTPUT}"
          jq -c '{
            static_pin_sha256,
            compressed_disk_sha256,
            tools_disk_sha256,
            kino_sha256,
            embedded_kino_sha256
          }' "${evidence_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Resolve the tested website artifact run
        id: website-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="website-dist-${GITHUB_SHA}"
          artifacts_json="${RUNNER_TEMP}/website-artifacts.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}" \
            > "${artifacts_json}"
          jq -e --arg name "${artifact_name}" '
            [.artifacts[] | select(.name == $name and .expired == false)] |
            if length == 1 then
              .[0] as $artifact |
              ($artifact.workflow_run.id | type == "number") and
              ($artifact.digest |
                type == "string" and test("^sha256:[0-9a-f]{64}$"))
            else false end
          ' "${artifacts_json}" >/dev/null
          run_id="$(jq -er --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name)] |
             .[0].workflow_run.id' "${artifacts_json}")"
          {
            printf 'website_dist_run_id=%s\n' "${run_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Retain cutover evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-cutover-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cutover-gate.json
            ${{ runner.temp }}/guest-tools-run.json
            ${{ runner.temp }}/guest-tools-artifacts.json
            ${{ runner.temp }}/release-static-pin.json
            ${{ runner.temp }}/release-static-pin-evidence.json
            ${{ runner.temp }}/website-artifacts.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy production
    needs:
      - verify-release
    uses: ./.github/workflows/website-deploy.yml
    with:
      guest_tools_static_pin_json: ${{ needs.verify-release.outputs.static_pin_json }}
      # cutover holds the plane closed; reopen returns the same release to
      # service with the fleet gate still drained.
      maintenance: ${{ needs.verify-release.outputs.maintenance }}
      website_dist_run_id: ${{ needs.verify-release.outputs.website_dist_run_id }}
    secrets: inherit
