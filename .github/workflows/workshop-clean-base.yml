name: Workshop clean Debian base
run-name: "Workshop clean base for production ${{ inputs.production_run_id }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: Successful automatic Website or Guest tools run from this exact main SHA
        required: true
        type: string
      confirmation:
        description: Type BUILD WORKSHOP CLEAN BASE
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CLEAN BASE only when no independent reviewer exists
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: workshop-clean-base-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and cold-boot clean Debian 13
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify protected production dispatch and source run
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${RUN_ATTEMPT}" = 1
          test "${CONFIRMATION}" = "BUILD WORKSHOP CLEAN BASE"
          [[ "${PRODUCTION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CLEAN BASE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_RUN_ID}")"
          jq -e \
            --arg id "${PRODUCTION_RUN_ID}" \
            --arg sha "${GITHUB_SHA}" '
              (.id | tostring) == $id and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "main" and
              .head_sha == $sha and
              .run_attempt == 1 and
              (
                .path == ".github/workflows/website.yml" or
                .path == ".github/workflows/guest-tools.yml"
              )
            ' <<<"${run_json}" >/dev/null

          artifact_name="production-workshop-clean-base-${GITHUB_SHA}"
          existing="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
              --jq '.total_count'
          )"
          test "${existing}" = 0

      - name: Install non-container image-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debian-archive-keyring=2023.4ubuntu1 e2fsprogs=1.47.0-2.4~exp1ubuntu4.1 mmdebstrap=1.4.3-6 qemu-system-x86=1:8.2.2+ds-0ubuntu1.18 zstd=1.5.5+dfsg2-2build1.1
          sudo test -s /usr/share/keyrings/debian-archive-keyring.gpg
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo test -r /dev/kvm
          sudo test -w /dev/kvm

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workshop-clean-base-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build clean-base CLI
        run: cargo build --locked --release -p intar-image-cli

      - name: Build and cold-boot the clean base
        run: |
          set -euo pipefail
          clean_root="${RUNNER_TEMP}/intar-clean-base"
          output="${clean_root}/production-workshop-clean-base-${GITHUB_SHA}"
          mkdir -p "${clean_root}"
          config="${clean_root}/builder.hcl"
          cat >"${config}" <<EOF_CONFIG
          qemu {
            target_arch = "amd64"
            qemu_binary = "/usr/bin/qemu-system-x86_64"
            mmdebstrap_binary = "/usr/bin/mmdebstrap"
            mke2fs_binary = "/usr/sbin/mke2fs"
            e2fsck_binary = "/usr/sbin/e2fsck"
            resize2fs_binary = "/usr/sbin/resize2fs"
            accelerator = "kvm"
            qemuargs = []
            build_cpus = 2
            build_memory_mb = 2048
            ssh_wait_timeout_seconds = 1200
            qemu_exit_timeout_seconds = 300
            work_root = "${clean_root}/unused-work"
            output_root = "${clean_root}/unused-output"
          }
          EOF_CONFIG
          sudo target/release/intar-image-cli build-base \
            --base-images "${GITHUB_WORKSPACE}/content/scenarios/base-images.hcl" \
            --base trixie \
            --config "${config}" \
            --output "${output}" \
            --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${GITHUB_SHA}" \
            --production-run-id "${PRODUCTION_RUN_ID}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
          echo "path=${output}" >>"${GITHUB_OUTPUT}"
        id: clean_base

      - name: Verify immutable artifact and proof
        env:
          CLEAN_BASE_PATH: ${{ steps.clean_base.outputs.path }}
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find "${CLEAN_BASE_PATH}" -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' | LC_ALL=C sort
          )
          expected=(
            SHA256SUMS
            clean-debian13-initrd.img
            clean-debian13-vmlinuz
            clean-debian13.raw.zst
            package-inventory.txt
            proof.json
          )
          test "${files[*]}" = "${expected[*]}"
          (
            cd "${CLEAN_BASE_PATH}"
            sha256sum --check --strict SHA256SUMS
          )
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg production_run_id "${PRODUCTION_RUN_ID}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" '
              .schema_version == 1 and
              .repository == $repository and
              .source_sha == $source_sha and
              (.production_run_id | tostring) == $production_run_id and
              (.workflow_run_id | tostring) == $workflow_run_id and
              .workflow_run_attempt == 1 and
              .system_image == "debian-13" and
              .architecture == "x86_64" and
              .fresh_seed == true and
              .kvm == true and
              .qmp_shutdown_acknowledged == true and
              .pristine_filesystem_verified == true and
              .disposable_filesystem_verified == true and
              .pristine_source_unchanged == true and
              .guest.debian_13 == true and
              .guest.x86_64 == true and
              .guest.dpkg_amd64 == true and
              .guest.ssh_ready == true and
              .guest.forbidden_packages_absent == true and
              .guest.forbidden_commands_absent == true and
              .guest.forbidden_paths_absent == true
            ' "${CLEAN_BASE_PATH}/proof.json" >/dev/null

      - name: Upload clean-base evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-workshop-clean-base-${{ github.sha }}
          path: ${{ steps.clean_base.outputs.path }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
