name: Intar scenario publish

# Reusable workflow for push-mode scenario source repositories. Callers pin it
# by a protected scenario-publish-vN tag or by that tag's commit, and must
# grant `permissions: { contents: read, id-token: write }`.
#
# Version 2. It validates the commit, uploads the compiled bundle, and, for a
# source whose images its own pipeline builds, builds each image Intar still
# lacks, boots it once, and pushes it. For a source whose images Intar's
# builder builds it does what version 1 did: validate and upload.
#
# The CLI argv used here is frozen for every release the compiler descriptor
# can name, from 0.15.0 on. CLI exits: 0 done, 3 superseded,
# 4 compiler_outdated, 75 transient.
#
# What a caller should know:
# - Image builds were measured on Linux amd64 with KVM, 16 threads and 32 GiB;
#   GitHub's own runner is not measured. The image jobs
#   need Docker and root. A build for the runner's own architecture gets
#   `cpus` processors, an emulated one two at most.
# - A runner that is not GitHub's own (`runner`, and `light-runner` if set)
#   publishes only for a source that allows self-hosted runners.
# - With `cache: namespace` the image job keeps its caches on a Namespace
#   cache volume. No job a pull request can trigger may mount that volume:
#   the build restores what it finds there as root. `cpus` must then be set:
#   a checkpoint is found again only by a build with the same number.
# - Runs of one branch queue behind each other, so a text-only push waits for
#   a running image build of the push before it.
# - Each image Intar lacks is a job an architecture, and they run one at a
#   time: every amd64 image first, then every arm64 image. One image's
#   failure leaves the others to build and push, and "Re-run failed jobs"
#   builds only what failed: a job that runs again after it pushed its image
#   ends at once. A publish that lacks more than 256 images cannot
#   start its image jobs. Without a cache every job starts cold: nothing one
#   image built is there for the next.
# - An image's amd64 build is pushed when it is done, whatever its arm64 build
#   comes to. Its arm64 job starts only when its amd64 job of the same run
#   built and pushed; when that one failed, the arm64 job fails without
#   building, so that "Re-run failed jobs" runs both.
# - When Intar takes no more images of a commit, because a newer one is the
#   head, each remaining amd64 job still builds its image before it learns
#   so; the arm64 job of an image whose amd64 job learned so builds nothing.

on:
  workflow_call:
    inputs:
      runner:
        description: The label of the runner the images are built on.
        type: string
        default: ubuntu-latest
      light-runner:
        description: The label of the runner that validates and uploads.
        type: string
        default: ubuntu-latest
      cpus:
        description: Processors each build gets. 0 lets the job choose; with a cache it must be set.
        type: number
        default: 0
      cache:
        description: Where the image job keeps its caches between runs, `none` or `namespace`.
        type: string
        default: none
      build-only:
        description: >-
          A SCENARIO/MACHINE to build and boot for amd64 and then, when that
          passed, for arm64, without uploading or pushing anything, to check a
          runner. Only for a manual
          run (workflow_dispatch); it uses no cache.
        type: string
        default: ""

permissions:
  contents: read

# PR runs cancel only their own PR; a publish is never cancelled by a PR, and a
# dispatch on another branch never replaces a pending default-branch publish.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('intar-pr-{0}', github.event.pull_request.number)
        || format('intar-publish-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INTAR_ORIGIN: https://intar.dev
  # The runner's system gitconfig enables LFS smudging, so without this
  # `git archive` downloads LFS objects (or fails on a private repo) instead of
  # emitting the pointers that the compiler rejects as lfs_unsupported.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  validate:
    name: Validate
    runs-on: ${{ inputs.light-runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the commit with the descriptor-pinned CLI
        run: |
          set -euo pipefail
          # The descriptor answers 503 during an Intar deploy; wait it out.
          descriptor="$(curl --fail --silent --show-error --retry 20 --retry-delay 60 \
            "${INTAR_ORIGIN}/registry/v1/sources/compiler")"
          cli_version="$(jq -r '.cli_version' <<<"${descriptor}")"
          cli_sha256="$(jq -r '.sha256.linux_amd64' <<<"${descriptor}")"
          if ! [[ "${cli_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${cli_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The compiler descriptor is malformed: ${descriptor}" >&2
            exit 1
          fi
          archive="${RUNNER_TEMP}/intar-image-cli_${cli_version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/intar-dev/intar-dev/releases/download/image-cli%2Fv${cli_version}/${archive##*/}"
          echo "${cli_sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/cli" "${RUNNER_TEMP}/source"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/cli"
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C "${RUNNER_TEMP}/source"
          cd "${RUNNER_TEMP}/source"
          "${RUNNER_TEMP}/cli/intar-image-cli" validate

  publish:
    name: Publish
    needs: validate
    if: >-
      !(inputs.build-only != '' && github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ inputs.light-runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      rev: ${{ steps.upload.outputs.rev }}
      producer: ${{ steps.upload.outputs.producer }}
      amd64: ${{ steps.upload.outputs.amd64 }}
      arm64: ${{ steps.upload.outputs.arm64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Upload the compiled bundle to Intar
        id: upload
        run: |
          set -euo pipefail
          # Reads the descriptor, then downloads and verifies the CLI it names.
          install_cli() {
            local descriptor archive
            descriptor="$(curl --fail --silent --show-error --retry 20 --retry-delay 60 \
              "${INTAR_ORIGIN}/registry/v1/sources/compiler")"
            cli_version="$(jq -r '.cli_version' <<<"${descriptor}")"
            cli_sha256="$(jq -r '.sha256.linux_amd64' <<<"${descriptor}")"
            digest="$(jq -r '.digest' <<<"${descriptor}")"
            if ! [[ "${cli_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${cli_sha256}" =~ ^[0-9a-f]{64}$ && "${digest}" =~ ^p[0-9a-f]{8}$ ]]; then
              echo "The compiler descriptor is malformed: ${descriptor}" >&2
              exit 1
            fi
            # `plan` came with 0.15.0. Intar names an older one only after a
            # step back; an upload without a plan would build nothing.
            if [ "$(printf '%s\n' 0.15.0 "${cli_version}" | sort -V | head -n 1)" != 0.15.0 ]; then
              echo "Intar names intar-image-cli ${cli_version}; this workflow needs 0.15.0 or newer. Use scenario-publish-v1 until Intar names a newer one." >&2
              exit 1
            fi
            archive="${RUNNER_TEMP}/intar-image-cli_${cli_version}_linux_amd64.tar.gz"
            curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
              "https://github.com/intar-dev/intar-dev/releases/download/image-cli%2Fv${cli_version}/${archive##*/}"
            echo "${cli_sha256}  ${archive}" | sha256sum --check --strict
            rm -rf "${RUNNER_TEMP}/cli"
            mkdir -p "${RUNNER_TEMP}/cli"
            tar -xzf "${archive}" -C "${RUNNER_TEMP}/cli"
          }

          install_cli
          mkdir -p "${RUNNER_TEMP}/source"
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C "${RUNNER_TEMP}/source"
          cd "${RUNNER_TEMP}/source"
          outdated=0
          transient=0
          while :; do
            rev="git-${GITHUB_REPOSITORY_ID}-${GITHUB_SHA}-${digest}"
            # A fresh token per attempt; the default audience fails Intar's check.
            token="$(curl --fail --silent --show-error --retry 3 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${INTAR_ORIGIN}" | jq -er '.value')"
            echo "::add-mask::${token}"
            status=0
            # On success `plan` writes rev and producer as this step's
            # outputs; the image lists below are made of its answer.
            "${RUNNER_TEMP}/cli/intar-image-cli" plan \
              --url "${INTAR_ORIGIN}/registry/v1/sources/bundles" \
              --token "${token}" \
              --rev "${rev}" \
              --output "${RUNNER_TEMP}/bundle.tar.gz" \
              --github-output "${GITHUB_OUTPUT}" > "${RUNNER_TEMP}/plan.json" || status=$?
            case "${status}" in
              0)
                images="$(jq -r '.images | length' "${RUNNER_TEMP}/plan.json")"
                # One list an architecture. `n` names an image in both, and
                # `after_amd64` says its amd64 build is this run's too.
                {
                  echo "amd64=$(jq -c '[.images | to_entries[] | select(.value.archs | index("amd64"))
                    | {target: .value.target, build_key: .value.build_key, n: .key}]' "${RUNNER_TEMP}/plan.json")"
                  echo "arm64=$(jq -c '[.images | to_entries[] | select(.value.archs | index("arm64"))
                    | {target: .value.target, build_key: .value.build_key, n: .key,
                       after_amd64: (.value.archs | index("amd64") != null)}]' "${RUNNER_TEMP}/plan.json")"
                } >> "${GITHUB_OUTPUT}"
                if [ "$(jq -r '.producer' "${RUNNER_TEMP}/plan.json")" = pipeline ] && [ "${images}" != 0 ]; then
                  result="Accepted. This run builds ${images} image(s) next; Intar reports deploy progress on the commit's checks."
                else
                  result="Accepted. Intar reports deploy progress on the commit's checks."
                fi
                break
                ;;
              3)
                result="Superseded: the default branch's head is now another commit, so this one was skipped. Follow that commit's run and checks."
                # Nothing to build: the image jobs read these.
                { echo "rev=${rev}"; echo "producer="; echo "amd64=[]"; echo "arm64=[]"; } >> "${GITHUB_OUTPUT}"
                break
                ;;
              4)
                outdated=$((outdated + 1))
                if [ "${outdated}" -gt 3 ]; then
                  echo "Intar still refuses the compiler after 3 descriptor re-reads." >&2
                  exit 1
                fi
                install_cli
                ;;
              75)
                transient=$((transient + 1))
                if [ "${transient}" -gt 20 ]; then
                  echo "Intar stayed unavailable for 20 minutes." >&2
                  exit 1
                fi
                sleep 60
                ;;
              *)
                exit "${status}"
                ;;
            esac
          done
          {
            echo "### Intar scenario publish"
            echo
            echo "- Revision: \`${rev}\`"
            echo "- Result: ${result}"
            echo "- Checks: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}/checks"
          } >> "${GITHUB_STEP_SUMMARY}"

  images:
    name: Build ${{ matrix.spec.target || inputs.build-only }} amd64
    needs: [validate, publish]
    # After a publish that has amd64 images to build for this source's own
    # pipeline, or, with `build-only`, for a manual run that publishes
    # nothing. Never for a pull request.
    if: >-
      !cancelled() && needs.validate.result == 'success' && (
        (needs.publish.result == 'success' &&
         needs.publish.outputs.producer == 'pipeline' &&
         needs.publish.outputs.amd64 != '' &&
         needs.publish.outputs.amd64 != '[]') ||
        (inputs.build-only != '' && github.event_name == 'workflow_dispatch')
      )
    # One job an image and architecture, one at a time: a build fills a
    # runner, and the jobs of a run mount the same cache volume one after the
    # other. A manual build-only run has the one image it names.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Not `image`: the workflow policy reads that key as a container image.
        spec: >-
          ${{ fromJSON(
            (inputs.build-only != '' && github.event_name == 'workflow_dispatch')
            && '[{"build_key":"","n":0}]'
            || needs.publish.outputs.amd64
          ) }}
    runs-on: ${{ inputs.runner }}
    # An image is 3 to 7 minutes cold on the measured runner for its own
    # architecture, and several times that emulated.
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      ARCH: amd64
    steps: &image_steps
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # What this image's jobs of this run came to so far, in any attempt.
      - name: Read what this image's jobs came to
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: intar-done-*-${{ matrix.spec.n }}
          path: ${{ runner.temp }}/intar-done

      - name: Mount the cache volume
        if: inputs.cache == 'namespace' && !(inputs.build-only != '' && github.event_name == 'workflow_dispatch')
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /home/runner/intar-cache

      - name: Build, boot and push the image
        id: build
        env:
          IMAGE: ${{ toJSON(matrix.spec) }}
          REV: ${{ needs.publish.outputs.rev }}
          # Only a manual run builds without publishing.
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build-only || '' }}
          CPUS: ${{ inputs.cpus }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/intar"
          mkdir -p "${work}/logs" "${work}/source" "${work}/cli"
          summary() { printf '%s\n' "$*" >> "${GITHUB_STEP_SUMMARY}"; }

          target="$(jq -r '.target // empty' <<<"${IMAGE}")"
          key="$(jq -r '.build_key' <<<"${IMAGE}")"
          if [ -n "${BUILD_ONLY}" ]; then
            # The matrix cannot carry the input into its one entry.
            target="${BUILD_ONLY}"
            CACHE=none
          fi
          summary "### \`${target}\` ${ARCH}"
          summary ""

          # What a job of this image came to: its outcome, when it was of
          # this very image. A re-run of all jobs numbers the images anew.
          done_of() { # arch
            local file
            file="${RUNNER_TEMP}/intar-done/intar-done-$1-$(jq -r '.n' <<<"${IMAGE}")/result"
            if [ -f "${file}" ] && [ "$(sed -n 2p "${file}")" = "${key}" ]; then
              sed -n 1p "${file}"
            fi
          }
          # A re-run of failed jobs runs this one again when another image's
          # amd64 job failed.
          if [ "$(done_of "${ARCH}")" = pushed ]; then
            summary "Already pushed by an earlier attempt of this run."
            echo "An earlier attempt of this run pushed this image."
            exit 0
          fi
          # An image's arm64 build follows its amd64 build of this run.
          if [ "${ARCH}" != amd64 ] && [ "$(jq -r '.after_amd64 // false' <<<"${IMAGE}")" = true ]; then
            case "$(done_of amd64)" in
              pushed | built) ;;
              superseded)
                summary "Not built: Intar takes no more images of this commit."
                echo "Intar takes no more images of this commit, as this image's amd64 job learned."
                exit 0
                ;;
              *)
                summary "Not built: this image's amd64 build did not pass in this run."
                echo "The amd64 build of ${target} did not pass in this run, so its ${ARCH} build does not start. \"Re-run failed jobs\" runs both." >&2
                exit 1
                ;;
            esac
          fi

          # The CLI and the Kino Intar names now.
          curl --fail --silent --show-error --retry 20 --retry-delay 60 \
            --output "${work}/descriptor.json" "${INTAR_ORIGIN}/registry/v1/sources/compiler"
          cli_version="$(jq -r '.cli_version' "${work}/descriptor.json")"
          cli_sha256="$(jq -r '.sha256.linux_amd64' "${work}/descriptor.json")"
          digest="$(jq -r '.digest' "${work}/descriptor.json")"
          if ! [[ "${cli_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${cli_sha256}" =~ ^[0-9a-f]{64}$ && "${digest}" =~ ^p[0-9a-f]{8}$ ]]; then
            echo "The compiler descriptor is malformed: $(cat "${work}/descriptor.json")" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' 0.15.0 "${cli_version}" | sort -V | head -n 1)" != 0.15.0 ]; then
            echo "Intar names intar-image-cli ${cli_version}; this workflow needs 0.15.0 or newer." >&2
            exit 1
          fi
          # The image is of the bundle the upload compiled. A compiler that
          # changed since gives other build keys, refused only after the bake.
          if [ -z "${BUILD_ONLY}" ] && [[ "${REV}" != *"-${digest}" ]]; then
            echo "Intar's compiler changed since this commit was uploaded. Re-run all jobs." >&2
            exit 1
          fi
          archive="${work}/intar-image-cli_${cli_version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/intar-dev/intar-dev/releases/download/image-cli%2Fv${cli_version}/${archive##*/}"
          echo "${cli_sha256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${work}/cli"
          cli="${work}/cli/intar-image-cli"

          # The tree the upload compiled, not the checkout: the archive leaves
          # out what the repository marks export-ignore.
          git archive --format=tar "${GITHUB_SHA}" | tar -x -C "${work}/source"

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-system-arm qemu-utils e2fsprogs zstd

          threads="$(nproc)"
          memory_mib="$(awk '/^MemTotal:/ {print int($2 / 1024)}' /proc/meminfo)"
          # shellcheck disable=SC2153 # CPUS is this step's input, cpus what the build gets
          if ! [[ "${CPUS}" =~ ^[0-9]+$ ]]; then
            echo "cpus is a whole number, not \`${CPUS}\`." >&2
            exit 1
          fi
          cpus="${CPUS}"
          if [ "${cpus}" = 0 ]; then
            if [ "${CACHE}" != none ]; then
              echo "Set \`cpus\` with a cache: a checkpoint is found again only by a build with the same number, and a runner label does not always give the same machine." >&2
              exit 1
            fi
            cpus="$(( threads > 2 ? threads - 2 : threads ))"
          fi
          if [ "${cpus}" -gt "${threads}" ]; then
            cpus="${threads}"
          fi
          # An emulated machine gets two processors whatever `cpus` says.
          case "$(uname -m)" in
            x86_64) native=amd64 ;;
            aarch64) native=arm64 ;;
            *) native="" ;;
          esac
          how=native
          if [ "${ARCH}" != "${native}" ]; then
            how=emulated
            if [ "${cpus}" -gt 2 ]; then
              cpus=2
            fi
          fi

          case "${CACHE}" in
            none) cache="${work}/cache" ;;
            namespace) cache=/home/runner/intar-cache ;;
            *) echo "cache is \`none\` or \`namespace\`, not \`${CACHE}\`." >&2; exit 1 ;;
          esac

          sudo "${cli}" setup --dir "${work}/tools" --descriptor "${work}/descriptor.json" \
            --cache "${cache}" --github-output "${work}/setup.env"
          config="$(sed -n 's/^config=//p' "${work}/setup.env")"
          socket="$(sed -n 's/^buildkit_socket=//p' "${work}/setup.env")"
          buildkit_run="$(sed -n 's/^buildkit_run=//p' "${work}/setup.env")"
          # shellcheck disable=SC2086 # the image and its arguments, as `setup` printed them
          sudo docker run --detach --privileged --name intar-buildkitd \
            --volume "${cache}:${cache}" ${buildkit_run} > /dev/null
          ready=0
          for _ in $(seq 1 60); do
            if sudo "${work}/tools/bin/buildctl" --addr "unix://${socket}" debug workers > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "${ready}" != 1 ]; then
            echo "The BuildKit daemon did not come up:" >&2
            sudo docker logs intar-buildkitd 2>&1 | tail -n 30 >&2
            exit 1
          fi

          summary "- Runner: ${threads} threads, ${memory_mib} MiB; ${how} on ${cpus} processors; cache \`${CACHE}\`."

          # Bake, check, boot. The output goes to the log directory.
          out="${work}/out/${ARCH}"
          built=0
          # shellcheck disable=SC2024 # the logs are this job's user's, the build is root's
          sudo "${cli}" build "${target}" --arch "${ARCH}" --out "${out}" --root "${work}/source" \
            --config "${config}" --kino "${work}/tools/kino/${ARCH}/kino" --cpus "${cpus}" \
            < /dev/null > "${work}/logs/${ARCH}.out" 2> "${work}/logs/${ARCH}.err" || built=$?
          grep -a '^base_s=\|^boot_s=' "${work}/logs/${ARCH}.out" || true
          if [ "${built}" != 0 ]; then
            summary "- Built and booted: failed."
            echo "The ${ARCH} build of ${target} failed:" >&2
            tail -n 40 "${work}/logs/${ARCH}.err" | cut -c1-300 >&2
            exit 1
          fi
          summary "- Built and booted: passed."

          outcome=built
          if [ -n "${BUILD_ONLY}" ]; then
            summary "- Not pushed: build-only."
          else
            # `build` ran as root; `push` runs as this job's user, which is
            # the one the runner gives a token to.
            sudo chown -R "$(id -u):$(id -g)" "${out}"
            is="$(jq -r '.build_key' "${out}/image.json")"
            if [ "${is}" != "${key}" ]; then
              summary "- Not pushed: built as another key than Intar asked for."
              echo "${target} built as ${is}, not the ${key} Intar asked for." >&2
              exit 1
            fi
            tries=0
            while :; do
              status=0
              "${cli}" push --image "${out}" --url "${INTAR_ORIGIN}" --rev "${REV}" \
                < /dev/null > "${work}/logs/${ARCH}.push" 2> "${work}/logs/${ARCH}.push.err" || status=$?
              tries=$((tries + 1))
              # `push` waits out a busy registry for about twenty minutes by
              # itself; twice more is enough.
              if [ "${status}" != 75 ] || [ "${tries}" -ge 3 ]; then
                break
              fi
              sleep 60
            done
            case "${status}" in
              0)
                outcome=pushed
                summary "- Pushed: $(sed -n 's/.* recorded=//p' "${work}/logs/${ARCH}.push")."
                ;;
              3)
                # Intar takes no more images for this commit: its head moved,
                # or its revisions ended. Intar's own words say which.
                outcome=superseded
                why="$(tail -n 1 "${work}/logs/${ARCH}.push.err" | cut -c1-240)"
                summary "- Not taken: Intar takes no more images of this commit: ${why}"
                echo "Intar takes no more images of this commit: ${why}"
                ;;
              *)
                summary "- Push failed (${status})."
                echo "The push of the ${ARCH} image of ${target} failed:" >&2
                tail -n 20 "${work}/logs/${ARCH}.push.err" | cut -c1-300 >&2
                exit 1
                ;;
            esac
          fi

          # What this image's later jobs and attempts read before they start.
          mkdir -p "${work}/done"
          printf '%s\n%s\n' "${outcome}" "${key}" > "${work}/done/result"
          echo "done=${outcome}" >> "${GITHUB_OUTPUT}"

      # Kept as long as a run can be re-run.
      - name: Record what this job came to
        if: success() && steps.build.outputs.done != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: intar-done-${{ env.ARCH }}-${{ matrix.spec.n }}
          path: ${{ runner.temp }}/intar/done/result
          retention-days: 30
          overwrite: true

      - name: Collect the build logs
        if: failure()
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/intar"
          mkdir -p "${work}/logs"
          # The bake's own logs and the serial consoles lie in root's work
          # directories.
          sudo find "${work}/tools/work" -maxdepth 2 -type f \( -name '*.log' -o -name '*.serial.log' \) \
            -exec cp --parents -t "${work}/logs" {} + 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "${work}/logs"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: intar-image-build-logs-${{ env.ARCH }}-${{ matrix.spec.n }}
          path: ${{ runner.temp }}/intar/logs
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

      - name: Stop the BuildKit daemon
        if: always()
        run: |
          sudo docker rm --force intar-buildkitd > /dev/null 2>&1 || true
          # A runner that is kept keeps a build VM this job was cancelled in.
          # The bracket keeps the pattern from matching this very command.
          sudo pkill -KILL -f -- "${RUNNER_TEMP}/intar/tools/[w]ork/" > /dev/null 2>&1 || true
          # And what root wrote, which the runner cannot remove by itself.
          sudo rm -rf -- "${RUNNER_TEMP}/intar" "${RUNNER_TEMP}/intar-done"

  # Every arm64 image after every amd64 image, and each after its own.
  images-arm64:
    name: Build ${{ matrix.spec.target || inputs.build-only }} arm64
    needs: [validate, publish, images]
    if: >-
      !cancelled() && needs.validate.result == 'success' && (
        (needs.publish.result == 'success' &&
         needs.publish.outputs.producer == 'pipeline' &&
         needs.publish.outputs.arm64 != '' &&
         needs.publish.outputs.arm64 != '[]') ||
        (inputs.build-only != '' && github.event_name == 'workflow_dispatch')
      )
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        spec: >-
          ${{ fromJSON(
            (inputs.build-only != '' && github.event_name == 'workflow_dispatch')
            && '[{"build_key":"","n":0,"after_amd64":true}]'
            || needs.publish.outputs.arm64
          ) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      ARCH: arm64
    steps: *image_steps
