name: Website
run-name: "${{ github.event_name == 'pull_request' && format('Website validate PR #{0}', github.event.pull_request.number) || format('Website validate {0}', github.ref_name) }}"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/website-deploy.yml"
      - ".github/workflows/website.yml"
      - ".github/workflows/control-plane-rollout.yml"
      - ".github/workflows/workshop-multicloud-flag.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "packages/provider-contracts/**"
      - "packages/workshop-contracts/**"
      - "tools/check-import-boundaries.ts"
      - "tools/deploy/**"
      - "tools/flagship/**"
      - "tools/providers/**"
      - "content/scenarios/build-tools.hcl"
      - "crates/intar-image-scenario/**"
      - "crates/intar-image-scenario-wasm/**"
      - "crates/intar-kino-proto/**"
      - "crates/intar-workspace-agent/**"
      - "crates/kino/**"
      - "apps/web/**"
      - "!apps/web/workers/providers/**"

permissions:
  contents: read

concurrency:
  group: "website-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  workspace-agent:
    name: Build learner guest tools
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          rustup component add --toolchain 1.97.0 clippy

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-zigbuild@0.23.0
          fallback: none

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Test and build guest tools
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked -p intar-workspace-agent -p kino
          cargo clippy --locked -p intar-workspace-agent -p kino \
            --all-targets -- -D warnings
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/intar-workspace-agent \
            | grep -E 'x86-64.*(static|statically linked)'
          file target/x86_64-unknown-linux-musl/release/kino \
            | grep -E 'x86-64.*(static|statically linked)'

  scenario-wasm:
    name: Build scenario Wasm
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add --toolchain 1.97.0 wasm32-unknown-unknown
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Install pinned Wasm tools
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: just@1.58.0,wasm-pack@0.15.0
          fallback: none

      - name: Build browser scenario validator
        working-directory: ${{ github.workspace }}
        run: just generate-scenario-wasm

      - name: Upload browser scenario validator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # run_id is stable across reruns; overwrite supports rerunning all jobs.
          name: scenario-wasm-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/src/generated/scenario-wasm
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Test and build
    runs-on: namespace-profile-intar-dev
    needs: scenario-wasm

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9

      - name: Download browser scenario validator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scenario-wasm-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/src/generated/scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Check monorepo import and provider contracts
        working-directory: ${{ github.workspace }}
        run: |
          bun run check:flagship
          bun run check:imports
          bun run check:providers
          bun run check:deploy
          bun run check:database-migrations

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  ui:
    name: UI visual, accessibility, and smoke
    runs-on: namespace-profile-intar-dev
    needs: scenario-wasm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download browser scenario validator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scenario-wasm-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/src/generated/scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install --yes --no-install-recommends unzip=6.0-28ubuntu4.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browsers
        run: bun run ui:install

      - name: Run UI release gate
        env:
          CI: "true"
          HOME: /root
        run: bun run test:ui

      - name: Upload Playwright report and diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-ui-report-${{ github.run_attempt }}
          path: |
            .tmp/website-playwright/playwright-report
            .tmp/website-playwright/test-results
          if-no-files-found: warn
          retention-days: 14
