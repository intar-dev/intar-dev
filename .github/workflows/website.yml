name: Website
run-name: "${{ github.event_name == 'pull_request' && format('Website validate PR #{0}', github.event.pull_request.number) || format('Website validate {0}', github.ref_name) }}"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/website-deploy.yml"
      - ".github/workflows/website.yml"
      - ".github/workflows/control-plane-rollout.yml"
      - ".github/workflows/clean-d1-cutover.yml"
      - ".github/workflows/workshop-multicloud-flag.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "packages/provider-contracts/**"
      - "packages/workshop-contracts/**"
      - "tools/check-import-boundaries.ts"
      - "tools/bootstrap/**"
      - "tools/cutover/**"
      - "tools/flagship/**"
      - "tools/providers/**"
      - "content/scenarios/build-tools.hcl"
      - "crates/intar-image-scenario/**"
      - "crates/intar-image-scenario-wasm/**"
      - "crates/intar-kino-proto/**"
      - "crates/intar-workspace-agent/**"
      - "crates/kino/**"
      - "apps/web/**"
      - "!apps/web/workers/providers/**"

permissions:
  contents: read

concurrency:
  group: "website-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  workspace-agent:
    name: Build learner guest tools
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add x86_64-unknown-linux-musl
          rustup component add clippy

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
          fallback: none

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Test and build guest tools
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked -p intar-workspace-agent -p kino
          cargo clippy --locked -p intar-workspace-agent -p kino \
            --all-targets -- -D warnings
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/intar-workspace-agent \
            | grep -E 'x86-64.*(static|statically linked)'
          file target/x86_64-unknown-linux-musl/release/kino \
            | grep -E 'x86-64.*(static|statically linked)'

  scenario-wasm:
    name: Build scenario Wasm
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install pinned Wasm tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack@0.15.0
          fallback: none

      - name: Build browser scenario validator
        working-directory: ${{ github.workspace }}
        run: just generate-scenario-wasm

      - name: Upload browser scenario validator
        uses: actions/upload-artifact@v7
        with:
          # run_id is stable across reruns; overwrite supports rerunning all jobs.
          name: scenario-wasm-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/src/generated/scenario-wasm
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  validate:
    name: Test and build
    runs-on: namespace-profile-intar-dev
    needs: scenario-wasm

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Download browser scenario validator
        uses: actions/download-artifact@v8
        with:
          name: scenario-wasm-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/src/generated/scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Check monorepo import and provider contracts
        working-directory: ${{ github.workspace }}
        run: |
          bun run check:bootstrap
          bun run check:flagship
          bun run check:imports
          bun run check:providers

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  ui:
    name: UI visual, accessibility, and smoke
    runs-on: namespace-profile-intar-dev
    needs: scenario-wasm
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download browser scenario validator
        uses: actions/download-artifact@v8
        with:
          name: scenario-wasm-${{ github.sha }}-${{ github.run_id }}
          path: apps/web/src/generated/scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install --yes --no-install-recommends unzip

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browsers
        run: bun run ui:install

      - name: Run UI release gate
        env:
          CI: "true"
          HOME: /root
        run: bun run test:ui

      - name: Upload Playwright report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-ui-report-${{ github.run_attempt }}
          path: |
            .tmp/website-playwright/playwright-report
            .tmp/website-playwright/test-results
          if-no-files-found: warn
          retention-days: 14
