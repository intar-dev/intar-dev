name: Website
run-name: "Website validate PR #${{ github.event.pull_request.number }}"

on:
  pull_request:
    paths:
      - ".github/workflows/website-deploy.yml"
      - ".github/workflows/website.yml"
      - "website/**"

permissions:
  contents: read

concurrency:
  group: website-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  validate:
    name: Test and build
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  ui:
    name: UI visual, accessibility, and smoke
    runs-on: namespace-profile-intar-dev
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version

      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install --yes --no-install-recommends unzip

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browsers
        run: bun run ui:install

      - name: Run UI release gate
        env:
          CI: "true"
          HOME: /root
        run: bun run test:ui

      - name: Upload Playwright report and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: website-ui-report-${{ github.run_attempt }}
          path: |
            .tmp/website-playwright/playwright-report
            .tmp/website-playwright/test-results
          if-no-files-found: warn
          retention-days: 14
