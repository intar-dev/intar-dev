name: Website
run-name: "${{ github.event_name == 'pull_request' && format('Website validate PR #{0}', github.event.pull_request.number) || format('Website deploy main @ {0}', github.sha) }}"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/website-deploy.yml"
      - ".github/workflows/website.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "tools/check-import-boundaries.ts"
      - "tools/database/**"
      - "tools/deploy/**"
      - "tools/flagship/**"
      - "crates/intar-image-scenario/**"
      - "apps/web/**"
  pull_request:
    paths:
      - ".github/workflows/website-deploy.yml"
      - ".github/workflows/website.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "tools/check-import-boundaries.ts"
      - "tools/database/**"
      - "tools/deploy/**"
      - "tools/flagship/**"
      - "crates/intar-image-scenario/**"
      - "apps/web/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: "website-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/web

jobs:
  validate:
    name: Test and build
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Bun cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Check web contracts
        working-directory: ${{ github.workspace }}
        run: |
          bun run check:imports
          bun run check:deploy
          bun run check:database-migrations

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload tested deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-dist-${{ github.sha }}
          path: apps/web/dist
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  ui:
    name: Chromium smoke
    runs-on: namespace-profile-intar-dev
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install --yes --no-install-recommends unzip=6.0-28ubuntu4.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Run Chromium smoke
        env:
          CI: "true"
          HOME: /root
        run: bunx playwright test tests/ui/smoke.spec.ts --project=chromium-smoke

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-smoke-${{ github.run_attempt }}
          path: |
            .tmp/website-playwright/playwright-report
            .tmp/website-playwright/test-results
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.event_name == 'push'
    needs:
      - validate
      - ui
    uses: ./.github/workflows/website-deploy.yml
    secrets: inherit
