name: Stargate deployment validation

on:
  pull_request:
    paths:
      - ".github/workflows/stargate-deploy.yml"
      - ".github/workflows/stargate-deploy-validate.yml"
      - "deploy/stargate/**"
      - "docs/src/content/docs/operations/workshops-rollout.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stargate-deploy.yml"
      - ".github/workflows/stargate-deploy-validate.yml"
      - "deploy/stargate/**"
      - "docs/src/content/docs/operations/workshops-rollout.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate host deployment scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Bash syntax
        run: |
          test -x deploy/stargate/scripts/intar-deploy-stargate
          test -x deploy/stargate/scripts/bootstrap-deploy-user
          bash -n deploy/stargate/scripts/intar-deploy-stargate
          bash -n deploy/stargate/scripts/bootstrap-deploy-user

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck=0.9.0-1

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning deploy/stargate/scripts/intar-deploy-stargate
          shellcheck --severity=warning deploy/stargate/scripts/bootstrap-deploy-user

      - name: Set up Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10

      - name: Validate workflow semantics
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/stargate-deploy.yml \
            .github/workflows/stargate-deploy-validate.yml

      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- \
            .github/workflows/stargate-deploy.yml \
            .github/workflows/stargate-deploy-validate.yml \
            deploy/stargate/scripts/intar-deploy-stargate \
            deploy/stargate/scripts/bootstrap-deploy-user \
            docs/src/content/docs/operations/workshops-rollout.md; then
            exit 1
          fi
