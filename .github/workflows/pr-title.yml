# Generated from ci/workflows/pr-title.cue by cuenv; do not edit manually.
# Regenerate with: cuenv sync codegen
name: PR title
"on":
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
concurrency:
  group: pr-title-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: cuenv task pr-title
permissions: {}
