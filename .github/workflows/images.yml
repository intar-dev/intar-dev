name: Images
run-name: "${{ github.event_name == 'pull_request' && format('Image validate PR #{0}', github.event.pull_request.number) || format('Image validate {0}', github.ref_name) }}"

on:
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/kino/**"
      - "crates/intar-kino-proto/**"
      - "crates/intar-builder/**"
      - "crates/intar-contracts/**"
      - "crates/intar-contracts-typegen/**"
      - "crates/intar-image-*/**"
      - "base-images.hcl"
      - "build-tools.hcl"
      - "builder.*.hcl"
      - "scenarios/**"
      - "website/drizzle/**"
      - "website/src/control-plane/auth.ts"
      - "website/src/control-plane/bridge-v5.ts"
      - "website/src/control-plane/host-runtime-do.ts"
      - "website/src/control-plane/image-registry.ts"
      - "website/src/generated/**"
      - "website/src/lib/build-scheduler*.ts"
      - "website/src/lib/desired-state*.ts"
      - "website/src/lib/host-runtime-wake.ts"
      - "website/src/lib/scenario-hosts.ts"
      - "website/src/db/schema.ts"
      - "website/src/pages/api/agent/hosts.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/kino/**"
      - "crates/intar-kino-proto/**"
      - "crates/intar-builder/**"
      - "crates/intar-contracts/**"
      - "crates/intar-contracts-typegen/**"
      - "crates/intar-image-*/**"
      - "base-images.hcl"
      - "build-tools.hcl"
      - "builder.*.hcl"
      - "scenarios/**"
      - "website/drizzle/**"
      - "website/src/control-plane/auth.ts"
      - "website/src/control-plane/bridge-v5.ts"
      - "website/src/control-plane/host-runtime-do.ts"
      - "website/src/control-plane/image-registry.ts"
      - "website/src/generated/**"
      - "website/src/lib/build-scheduler*.ts"
      - "website/src/lib/desired-state*.ts"
      - "website/src/lib/host-runtime-wake.ts"
      - "website/src/lib/scenario-hosts.ts"
      - "website/src/db/schema.ts"
      - "website/src/pages/api/agent/hosts.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Validate and queue images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install just and cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-zigbuild

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Build kino guest
        run: just build-kino-guest

      - name: Validate scenario definitions
        run: just validate-images

      - name: Render image build inputs
        run: just render-images "" builder.sample.amd64.hcl

      - name: Verify bundle upload token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          if [ -z "${INTAR_IMAGE_PUBLISH_TOKEN:-}" ]; then
            echo "INTAR_IMAGE_PUBLISH_TOKEN secret is required to upload scenario bundles." >&2
            exit 1
          fi

      - name: Upload scenario source bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: just bundle-images "" builder.sample.amd64.hcl "${GITHUB_SHA::12}" false "https://intar.dev/registry/v1/bundles"
