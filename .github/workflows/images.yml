name: Images
run-name: "${{ github.event_name == 'pull_request' && format('Image validate PR #{0}', github.event.pull_request.number) || format('Image publish main @ {0}', github.sha) }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/intar-builder/**"
      - "crates/intar-contracts/**"
      - "crates/intar-contracts-typegen/**"
      - "crates/intar-image-*/**"
      - "content/scenarios/base-images.hcl"
      - "builder.*.hcl"
      - "content/courses/**"
      - "apps/web/migrations/**"
      - "apps/web/src/control-plane/auth.ts"
      - "apps/web/src/control-plane/bridge-v7.ts"
      - "apps/web/src/control-plane/host-runtime-do.ts"
      - "apps/web/src/control-plane/image-registry.ts"
      - "apps/web/src/generated/**"
      - "apps/web/src/lib/build-scheduler*.ts"
      - "apps/web/src/lib/desired-state*.ts"
      - "apps/web/src/lib/host-runtime-wake.ts"
      - "apps/web/src/lib/scenario-hosts.ts"
      - "apps/web/src/db/schema.ts"
      - "apps/web/src/pages/api/agent/hosts.ts"
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/intar-builder/**"
      - "crates/intar-contracts/**"
      - "crates/intar-contracts-typegen/**"
      - "crates/intar-image-*/**"
      - "content/scenarios/base-images.hcl"
      - "builder.*.hcl"
      - "content/courses/**"
      - "apps/web/migrations/**"
      - "apps/web/src/control-plane/auth.ts"
      - "apps/web/src/control-plane/bridge-v7.ts"
      - "apps/web/src/control-plane/host-runtime-do.ts"
      - "apps/web/src/control-plane/image-registry.ts"
      - "apps/web/src/generated/**"
      - "apps/web/src/lib/build-scheduler*.ts"
      - "apps/web/src/lib/desired-state*.ts"
      - "apps/web/src/lib/host-runtime-wake.ts"
      - "apps/web/src/lib/scenario-hosts.ts"
      - "apps/web/src/db/schema.ts"
      - "apps/web/src/pages/api/agent/hosts.ts"
permissions:
  contents: read

concurrency:
  group: "images-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Validate images
    runs-on: namespace-profile-intar-dev
    env:
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked out revision
        run: |
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full lowercase commit SHA, got '${SOURCE_SHA}'." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Install just and cargo-zigbuild
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: just@1.58.0,cargo-zigbuild@0.23.0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Verify public curriculum source
        run: |
          test -f content/courses/linux-operations/course.md
          test -f content/courses/linux-operations/00-operating-model/lecture.md
          test -f content/courses/linux-operations/01-broken-nginx/lecture.md
          test -f content/courses/linux-operations/01-broken-nginx/scenario.hcl
          scenario_count="$(find content/courses -type f -name scenario.hcl -print | wc -l | tr -d ' ')"
          test "${scenario_count}" -gt 0
          echo "Found ${scenario_count} course scenarios."

      - name: Validate scenario definitions
        run: just validate-images

      - name: Render public image build input
        run: just render-images

      - name: Publish exact scenario source bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${INTAR_IMAGE_PUBLISH_TOKEN}"
          revision="${GITHUB_SHA:0:12}"
          started_at="$(date +%s)"
          just bundle-images \
            "" \
            builder.sample.amd64.hcl \
            "${revision}" \
            false \
            "https://intar.dev/registry/v1/bundles"

          warm_started_at=""
          status_file="${RUNNER_TEMP}/image-build-status.json"
          for _ in $(seq 1 420); do
            curl --fail --silent --show-error --retry 2 \
              --header "Authorization: Bearer ${INTAR_IMAGE_PUBLISH_TOKEN}" \
              "https://intar.dev/registry/v1/builds/revisions/${revision}?tools=candidate" \
              > "${status_file}"
            state="$(jq -er '.state' "${status_file}")"
            jq -c '{revision, state, builds: [.builds[] | {scenario_id, status, phase}], hosts: [.hosts[] | {host_id, ready}]}' \
              "${status_file}"
            if [ "${state}" = failed ]; then
              jq -c '.builds[] | select(.status == "failed" or .status == "stale")' \
                "${status_file}" >&2
              exit 1
            fi
            if [ "${state}" = warming ] && [ -z "${warm_started_at}" ]; then
              warm_started_at="$(date +%s)"
            fi
            if [ "${state}" = ready ]; then
              completed_at="$(date +%s)"
              test "$((completed_at - started_at))" -lt 1500
              if [ -n "${warm_started_at}" ]; then
                test "$((completed_at - warm_started_at))" -lt 60
              fi
              exit 0
            fi
            sleep 5
          done
          echo "Remote image build or exact host cache state did not become ready." >&2
          exit 1
