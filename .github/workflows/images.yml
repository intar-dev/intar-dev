name: Images
run-name: "Image validate PR #${{ github.event.pull_request.number }}"

on:
  pull_request:
    paths:
      - ".github/workflows/images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "crates/kino/**"
      - "crates/intar-kino-proto/**"
      - "crates/intar-builder/**"
      - "crates/intar-contracts/**"
      - "crates/intar-contracts-typegen/**"
      - "crates/intar-image-*/**"
      - "content/scenarios/base-images.hcl"
      - "content/scenarios/build-tools.hcl"
      - "builder.*.hcl"
      - "content/courses.hcl"
      - "content/scenarios/**"
      - "apps/web/migrations/**"
      - "apps/web/src/control-plane/auth.ts"
      - "apps/web/src/control-plane/bridge-v6.ts"
      - "apps/web/src/control-plane/host-runtime-do.ts"
      - "apps/web/src/control-plane/image-registry.ts"
      - "apps/web/src/generated/**"
      - "apps/web/src/lib/build-scheduler*.ts"
      - "apps/web/src/lib/desired-state*.ts"
      - "apps/web/src/lib/host-runtime-wake.ts"
      - "apps/web/src/lib/scenario-hosts.ts"
      - "apps/web/src/db/schema.ts"
      - "apps/web/src/pages/api/agent/hosts.ts"
permissions:
  contents: read

concurrency:
  group: images-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  images:
    name: Validate images
    runs-on: namespace-profile-intar-dev
    env:
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked out revision
        run: |
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full lowercase commit SHA, got '${SOURCE_SHA}'." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install just and cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-zigbuild

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Build kino guest
        run: just build-kino-guest

      - name: Verify public scenario allowlist
        run: |
          test "$(find content/scenarios -mindepth 2 -maxdepth 2 -type f -name scenario.hcl -print | LC_ALL=C sort)" = \
            "content/scenarios/broken-nginx/scenario.hcl"

      - name: Validate scenario definitions
        run: just validate-images

      - name: Render public image build input
        run: just render-images broken-nginx builder.sample.amd64.hcl
