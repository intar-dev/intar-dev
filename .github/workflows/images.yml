name: Images
run-name: "${{ github.event_name == 'pull_request' && format('Validate images for PR #{0}', github.event.pull_request.number) || format('Validate images on main @ {0}', github.sha) }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: &image_paths
      - ".github/workflows/images.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "tools/image-build/**"
      - "crates/intar-builder/**"
      - "crates/intar-contracts/**"
      - "crates/intar-contracts-typegen/**"
      - "crates/intar-image-*/**"
      - "content/scenarios/base-images.hcl"
      - "builder.*.hcl"
      - "content/courses/**"
      - "apps/web/migrations/**"
      - "apps/web/src/control-plane/auth.ts"
      - "apps/web/src/control-plane/bridge-v8.ts"
      - "apps/web/src/control-plane/host-runtime-do.ts"
      - "apps/web/src/control-plane/image-registry.ts"
      - "apps/web/src/generated/**"
      - "apps/web/src/lib/build-scheduler*.ts"
      - "apps/web/src/lib/desired-state*.ts"
      - "apps/web/src/lib/host-runtime-wake.ts"
      - "apps/web/src/lib/scenario-hosts.ts"
      - "apps/web/src/db/schema.ts"
      - "apps/web/src/pages/api/agent/hosts.ts"
  pull_request:
    paths: *image_paths
permissions:
  contents: read

concurrency:
  group: "images-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: Validate images
    runs-on: namespace-profile-intar-dev
    env:
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked out revision
        run: |
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full lowercase commit SHA, got '${SOURCE_SHA}'." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: rust

      - name: Install just and cargo-zigbuild
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: just@1.58.0,cargo-zigbuild@0.23.0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Validate curriculum source
        run: just validate-images

      - name: Render image build input
        run: just render-images
