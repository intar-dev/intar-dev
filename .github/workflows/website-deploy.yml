name: Website production
run-name: "Website deploy ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY WORKSHOP CONTROL PLANE
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when no independent reviewer exists
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  preflight:
    name: Validate protected runtime configuration
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify protected production dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              test "${RUN_ATTEMPT}" = 1
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Stargate egress and runtime signing keys
        working-directory: ${{ github.workspace }}
        env:
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID }}
        run: |
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID}"
          node - <<'NODE'
          const cidrs = (process.env.STARGATE_EGRESS_IPV4_CIDRS ?? "")
            .split(",").map((value) => value.trim()).filter(Boolean);
          const validCidrs = cidrs.length > 0 && cidrs.every((cidr) => {
            const match = /^(\d{1,3}(?:\.\d{1,3}){3})\/(\d|[12]\d|3[0-2])$/.exec(cidr);
            return match && match[1].split(".").every((octet) => Number(octet) <= 255);
          });
          if (!validCidrs) throw new Error("STARGATE_EGRESS_IPV4_CIDRS is invalid");

          const keyId = process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID ?? "";
          if (!/^[A-Za-z0-9._-]{1,128}$/.test(keyId)) {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID is invalid");
          }
          let keys;
          try {
            keys = JSON.parse(process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON ?? "");
          } catch {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON is not valid JSON");
          }
          if (!keys || Array.isArray(keys) || typeof keys !== "object") {
            throw new Error("runtime signing keys must be a JSON object");
          }
          const entries = Object.entries(keys);
          if (entries.length < 1 || entries.length > 16) {
            throw new Error("runtime signing keys must contain between 1 and 16 keys");
          }
          for (const [id, value] of entries) {
            if (!/^[A-Za-z0-9._-]{1,128}$/.test(id)) {
              throw new Error(`runtime signing key ID is invalid: ${id}`);
            }
            if (typeof value !== "string" || !/^[A-Za-z0-9+/]{43}=$/.test(value)) {
              throw new Error(`runtime signing public key is invalid: ${id}`);
            }
            const decoded = Buffer.from(value, "base64");
            if (decoded.length !== 32 || decoded.toString("base64") !== value) {
              throw new Error(`runtime signing public key is not a canonical Ed25519 key: ${id}`);
            }
          }
          if (!Object.hasOwn(keys, keyId)) {
            throw new Error("runtime signing key map does not contain the builder key ID");
          }
          NODE

  provider:
    name: Deploy provider prerequisite
    needs: preflight
    uses: ./.github/workflows/hcloud-provider.yml
    with:
      deploy: true
      confirmation: ${{ inputs.confirmation }}
      single_operator_confirmation: ${{ inputs.single_operator_confirmation }}
    secrets: inherit

  deploy:
    name: Deploy production
    needs: provider
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify deployment revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install pinned build tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack@0.15.0,cargo-zigbuild
          fallback: none

      - name: Build browser scenario validator
        working-directory: ${{ github.workspace }}
        run: just generate-scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build pinned learner guest tools
        id: workspace-agent
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          agent_path="target/x86_64-unknown-linux-musl/release/intar-workspace-agent"
          kino_path="target/x86_64-unknown-linux-musl/release/kino"
          file "${agent_path}" | grep -E 'x86-64.*(static|statically linked)'
          file "${kino_path}" | grep -E 'x86-64.*(static|statically linked)'
          agent_sha="$(sha256sum "${agent_path}" | cut -d ' ' -f 1)"
          agent_size="$(stat --format='%s' "${agent_path}")"
          kino_sha="$(sha256sum "${kino_path}" | cut -d ' ' -f 1)"
          kino_size="$(stat --format='%s' "${kino_path}")"
          test "${#agent_sha}" -eq 64
          test "${agent_size}" -gt 0
          test "${#kino_sha}" -eq 64
          test "${kino_size}" -gt 0
          echo "sha256=${agent_sha}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${agent_size}" >> "${GITHUB_OUTPUT}"
          echo "kino_sha256=${kino_sha}" >> "${GITHUB_OUTPUT}"
          echo "kino_size_bytes=${kino_size}" >> "${GITHUB_OUTPUT}"

      - name: Build deployment artifact
        run: bun run build:deploy

      - name: Pin protected runtime signing keys in deployment artifact
        env:
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
        run: |
          config="dist/server/wrangler.json"
          patched="${RUNNER_TEMP}/website-wrangler.json"
          jq --arg keys "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}" \
            '.vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON = $keys' \
            "${config}" > "${patched}"
          mv "${patched}" "${config}"

      - name: Recheck sole-operator window immediately before mutation
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              test "${RUN_ATTEMPT}" = 1
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Publish content-addressed learner workspace agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          jq -n \
            --arg sha256 "${AGENT_SHA256}" \
            --argjson size_bytes "${AGENT_SIZE_BYTES}" \
            --arg kino_sha256 "${KINO_SHA256}" \
            --argjson kino_size_bytes "${KINO_SIZE_BYTES}" \
            '{schema_version: 2, sha256: $sha256, size_bytes: $size_bytes, kino_sha256: $kino_sha256, kino_size_bytes: $kino_size_bytes}' \
            > "${RUNNER_TEMP}/workspace-agent-current.json"
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/releases/${AGENT_SHA256}/intar-workspace-agent" \
            --file "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-musl/release/intar-workspace-agent" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/kino/releases/${KINO_SHA256}/kino" \
            --file "${GITHUB_WORKSPACE}/target/x86_64-unknown-linux-musl/release/kino" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/releases/current.json" \
            --file "${RUNNER_TEMP}/workspace-agent-current.json" \
            --content-type "application/json" \
            --jurisdiction eu \
            --remote

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run db:migrate:production

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
        run: |
          secrets_file="${RUNNER_TEMP}/website-runtime-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          jq -n '{STARGATE_EGRESS_IPV4_CIDRS: env.STARGATE_EGRESS_IPV4_CIDRS}' \
            > "${secrets_file}"
          chmod 600 "${secrets_file}"
          bunx wrangler deploy --config dist/server/wrangler.json \
            --secrets-file "${secrets_file}"
