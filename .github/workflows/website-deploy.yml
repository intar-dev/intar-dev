name: Website production
run-name: "Website deploy ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      confirmation:
        description: Exact protected web deployment confirmation
        required: true
        type: string
      single_operator_confirmation:
        description: Sole-operator confirmation when that production mode is active
        required: false
        default: ""
        type: string
      provenance_workflow_path:
        description: Exact top-level workflow path recorded in retained artifacts
        required: false
        default: .github/workflows/website-deploy.yml
        type: string
      parent_holds_control_plane_lock:
        description: True only when the protected multicloud wrapper owns serialization
        required: false
        default: false
        type: boolean
      clean_d1_cutover_run_id:
        description: Successful clean-D1 apply run required only while the maintenance fence is active
        required: false
        default: ""
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_WEB_ROLLBACK_API_TOKEN:
        required: true
      CLOUDFLARE_PROVIDER_PROBE_API_TOKEN:
        required: true
      STARGATE_DEPLOY_SSH_PRIVATE_KEY:
        required: true
      STARGATE_DEPLOY_KNOWN_HOSTS:
        required: true
      STARGATE_EGRESS_IPV4_CIDRS:
        required: true
      INTAR_IMAGE_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY WORKSHOP CONTROL PLANE
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when no independent reviewer exists
        required: false
        type: string
      clean_d1_cutover_run_id:
        description: Successful clean-D1 apply run required only for the first clean-D1 web switch
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.parent_holds_control_plane_lock && format('website-reusable-{0}', github.run_id) || 'intar-control-plane-production' }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    working-directory: apps/web

jobs:
  preflight:
    name: Validate protected runtime configuration
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      PROVENANCE_WORKFLOW_PATH: ${{ inputs.provenance_workflow_path || '.github/workflows/website-deploy.yml' }}
      CLEAN_D1_CUTOVER_RUN_ID: ${{ inputs.clean_d1_cutover_run_id || '' }}
      PARENT_HOLDS_CONTROL_PLANE_LOCK: ${{ inputs.parent_holds_control_plane_lock || false }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify protected production dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_call|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"
          test "${RUN_ATTEMPT}" = 1
          if [ -n "${CLEAN_D1_CUTOVER_RUN_ID}" ]; then
            [[ "${CLEAN_D1_CUTOVER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          fi
          case "${PROVENANCE_WORKFLOW_PATH}" in
            .github/workflows/website-deploy.yml|.github/workflows/control-plane-rollout.yml) ;;
            *) exit 1 ;;
          esac
          if [ "${PARENT_HOLDS_CONTROL_PLANE_LOCK}" = true ]; then
            test "${PROVENANCE_WORKFLOW_PATH}" = ".github/workflows/control-plane-rollout.yml"
          else
            test "${PROVENANCE_WORKFLOW_PATH}" = ".github/workflows/website-deploy.yml"
          fi

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Stargate egress and runtime signing keys
        working-directory: ${{ github.workspace }}
        env:
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID }}
          CLEAN_D1_DATABASE_ID: ${{ vars.CLEAN_D1_DATABASE_ID }}
          CLEAN_D1_DATABASE_NAME: ${{ vars.CLEAN_D1_DATABASE_NAME }}
        run: |
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID}"
          [[ "${CLEAN_D1_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          test "${CLEAN_D1_DATABASE_ID}" != "00000000-0000-0000-0000-000000000003"
          test "${CLEAN_D1_DATABASE_NAME}" = "intar-dev-control-plane-v2-20260803-r3"
          node - <<'NODE'
          const cidrs = (process.env.STARGATE_EGRESS_IPV4_CIDRS ?? "")
            .split(",").map((value) => value.trim()).filter(Boolean);
          const validCidrs = cidrs.length > 0 && cidrs.every((cidr) => {
            const match = /^(\d{1,3}(?:\.\d{1,3}){3})\/(\d|[12]\d|3[0-2])$/.exec(cidr);
            return match && match[1].split(".").every((octet) => Number(octet) <= 255);
          });
          if (!validCidrs) throw new Error("STARGATE_EGRESS_IPV4_CIDRS is invalid");

          const keyId = process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID ?? "";
          if (!/^[A-Za-z0-9._-]{1,128}$/.test(keyId)) {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID is invalid");
          }
          let keys;
          try {
            keys = JSON.parse(process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON ?? "");
          } catch {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON is not valid JSON");
          }
          if (!keys || Array.isArray(keys) || typeof keys !== "object") {
            throw new Error("runtime signing keys must be a JSON object");
          }
          const entries = Object.entries(keys);
          if (entries.length < 1 || entries.length > 16) {
            throw new Error("runtime signing keys must contain between 1 and 16 keys");
          }
          for (const [id, value] of entries) {
            if (!/^[A-Za-z0-9._-]{1,128}$/.test(id)) {
              throw new Error(`runtime signing key ID is invalid: ${id}`);
            }
            if (typeof value !== "string" || !/^[A-Za-z0-9+/]{43}=$/.test(value)) {
              throw new Error(`runtime signing public key is invalid: ${id}`);
            }
            const decoded = Buffer.from(value, "base64");
            if (decoded.length !== 32 || decoded.toString("base64") !== value) {
              throw new Error(`runtime signing public key is not a canonical Ed25519 key: ${id}`);
            }
          }
          if (!Object.hasOwn(keys, keyId)) {
            throw new Error("runtime signing key map does not contain the builder key ID");
          }
          NODE

  provider-capabilities:
    name: Validate provider capability contract
    needs: preflight
    runs-on: namespace-profile-intar-dev
    environment: production
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore shared Bun cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install the root workspace
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Reject service-binding or capability drift
        working-directory: ${{ github.workspace }}
        run: bun run check:providers

      - name: Call both deployed services through a temporary remote binding
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
        run: >-
          bun tools/providers/probe-live-capabilities.ts
          "${RUNNER_TEMP}/provider-capabilities.json"

      - name: Retain pre-web capability evidence
        uses: actions/upload-artifact@v7
        with:
          name: pre-web-provider-capabilities-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-capabilities.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    needs: provider-capabilities
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 60
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      PROVENANCE_WORKFLOW_PATH: ${{ inputs.provenance_workflow_path || '.github/workflows/website-deploy.yml' }}
      CLEAN_D1_CUTOVER_RUN_ID: ${{ inputs.clean_d1_cutover_run_id || '' }}
      STARGATE_DEPLOY_HOST: ${{ vars.STARGATE_DEPLOY_HOST }}
      STARGATE_DEPLOY_PORT: ${{ vars.STARGATE_DEPLOY_PORT }}
      STARGATE_DEPLOY_USER: ${{ vars.STARGATE_DEPLOY_USER }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify deployment revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install pinned build tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack@0.15.0,cargo-zigbuild
          fallback: none

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Build browser scenario validator
        working-directory: ${{ github.workspace }}
        run: just generate-scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install root workspace dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Build pinned learner guest tools
        id: workspace-agent
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          mkdir -p "${guest_tools_dir}"
          cp \
            "target/x86_64-unknown-linux-musl/release/intar-workspace-agent" \
            "${guest_tools_dir}/intar-workspace-agent"
          cp \
            "target/x86_64-unknown-linux-musl/release/kino" \
            "${guest_tools_dir}/kino"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino"
          agent_path="${guest_tools_dir}/intar-workspace-agent"
          kino_path="${guest_tools_dir}/kino"
          file "${agent_path}" | grep -E 'x86-64.*(static|statically linked)'
          file "${kino_path}" | grep -E 'x86-64.*(static|statically linked)'
          agent_sha="$(sha256sum "${agent_path}" | cut -d ' ' -f 1)"
          agent_size="$(stat --format='%s' "${agent_path}")"
          kino_sha="$(sha256sum "${kino_path}" | cut -d ' ' -f 1)"
          kino_size="$(stat --format='%s' "${kino_path}")"
          test "${#agent_sha}" -eq 64
          test "${agent_size}" -gt 0
          test "${#kino_sha}" -eq 64
          test "${kino_size}" -gt 0
          echo "sha256=${agent_sha}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${agent_size}" >> "${GITHUB_OUTPUT}"
          echo "kino_sha256=${kino_sha}" >> "${GITHUB_OUTPUT}"
          echo "kino_size_bytes=${kino_size}" >> "${GITHUB_OUTPUT}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg workflow_path "${PROVENANCE_WORKFLOW_PATH}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg agent_sha256 "${agent_sha}" \
            --argjson agent_size_bytes "${agent_size}" \
            --arg agent_object_key \
              "workspace-agent/releases/${agent_sha}/intar-workspace-agent" \
            --arg kino_sha256 "${kino_sha}" \
            --argjson kino_size_bytes "${kino_size}" \
            --arg kino_object_key \
              "workspace-agent/kino/releases/${kino_sha}/kino" \
            '{
              schema_version: 1,
              repository: $repository,
              source_sha: $source_sha,
              workflow_path: $workflow_path,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              event: $event,
              ref: $ref,
              architecture: "x86_64",
              target: "x86_64-unknown-linux-musl",
              tools: {
                "intar-workspace-agent": {
                  sha256: $agent_sha256,
                  size_bytes: $agent_size_bytes,
                  r2_object_key: $agent_object_key
                },
                kino: {
                  sha256: $kino_sha256,
                  size_bytes: $kino_size_bytes,
                  r2_object_key: $kino_object_key
                }
              }
            }' > "${guest_tools_dir}/manifest.json"
          (
            cd "${guest_tools_dir}"
            sha256sum intar-workspace-agent kino > SHA256SUMS
          )

      - name: Build deployment artifact
        run: bun run build:deploy

      - name: Pin protected runtime bindings in deployment artifact
        env:
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          CLEAN_D1_DATABASE_ID: ${{ vars.CLEAN_D1_DATABASE_ID }}
          CLEAN_D1_DATABASE_NAME: ${{ vars.CLEAN_D1_DATABASE_NAME }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
        run: |
          config="dist/server/wrangler.json"
          patched="${RUNNER_TEMP}/website-wrangler.json"
          jq \
            --arg keys "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}" \
            --arg database_id "${CLEAN_D1_DATABASE_ID}" \
            --arg database_name "${CLEAN_D1_DATABASE_NAME}" '
              .vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON = $keys |
              ([.d1_databases[] | select(.binding == "DB")] | length) as $db_count |
              if $db_count != 1 then error("expected exactly one DB binding") else . end |
              (.d1_databases[] | select(.binding == "DB")).database_id = $database_id |
              (.d1_databases[] | select(.binding == "DB")).database_name = $database_name
            ' \
            "${config}" > "${patched}"
          mv "${patched}" "${config}"
          jq -e \
            --arg database_id "${CLEAN_D1_DATABASE_ID}" \
            --arg database_name "${CLEAN_D1_DATABASE_NAME}" \
            --arg session_namespace_id "${SESSION_KV_NAMESPACE_ID}" '
              ([.d1_databases[] | select(.binding == "DB")]) as $databases |
              ([.kv_namespaces[] | select(.binding == "SESSION")]) as $sessions |
              ($databases | length) == 1 and
              $databases[0].database_id == $database_id and
              $databases[0].database_name == $database_name and
              ($sessions | length) == 1 and
              $sessions[0].id == $session_namespace_id
            ' "${config}" >/dev/null

      - name: Recheck sole-operator window immediately before mutation
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_call|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"
          test "${RUN_ATTEMPT}" = 1

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Publish content-addressed learner workspace agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            sha256sum "${guest_tools_dir}/intar-workspace-agent" | cut -d ' ' -f 1
          )" = "${AGENT_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/intar-workspace-agent"
          )" = "${AGENT_SIZE_BYTES}"
          test "$(
            sha256sum "${guest_tools_dir}/kino" | cut -d ' ' -f 1
          )" = "${KINO_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/kino"
          )" = "${KINO_SIZE_BYTES}"
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/releases/${AGENT_SHA256}/intar-workspace-agent" \
            --file "${RUNNER_TEMP}/production-workshop-guest-tools/intar-workspace-agent" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/kino/releases/${KINO_SHA256}/kino" \
            --file "${RUNNER_TEMP}/production-workshop-guest-tools/kino" \
            --jurisdiction eu \
            --remote

      - name: Verify the clean D1 baseline is already active
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/clean-d1-verification.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config dist/server/wrangler.json \
            --command "SELECT COUNT(*) AS required_tables FROM sqlite_master WHERE type = 'table' AND name IN ('runtime_provider_allocations', 'runtime_provider_resources', 'provider_price_observations', 'workshop_session_cost_forecasts')" \
            --json > "${result}"
          jq -e \
            'length == 1 and .[0].success == true and .[0].results[0].required_tables == 4' \
            "${result}" >/dev/null

      - name: Apply compatible clean D1 schema patches
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="${RUNNER_TEMP}/workshop-republication-index-before.json"
          apply="${RUNNER_TEMP}/workshop-republication-index-apply.json"
          after="${RUNNER_TEMP}/workshop-republication-index-after.json"
          jq -n '[{success: false, state: "not_started"}]' > "${before}"
          jq -n '[{success: false, state: "not_started"}]' > "${apply}"
          jq -n '[{success: false, state: "not_started"}]' > "${after}"
          index_query="SELECT indexes.name, indexes.\"unique\" AS is_unique, indexes.partial, count(columns.name) AS column_count, max(CASE WHEN columns.seqno = 0 THEN columns.name END) AS column_0, max(CASE WHEN columns.seqno = 1 THEN columns.name END) AS column_1 FROM pragma_index_list('workshop_template_revisions') AS indexes JOIN pragma_index_info(indexes.name) AS columns GROUP BY indexes.name, indexes.\"unique\", indexes.partial ORDER BY indexes.name"

          bunx wrangler d1 execute DB \
            --remote \
            --config dist/server/wrangler.json \
            --command "${index_query}" \
            --json > "${before}"
          jq -e '
            length == 1 and .[0].success == true and
            ((.[0].results | map(select(
                .column_count == 2 and
                .column_0 == "template_id" and
                .column_1 == "content_hash"
              ))) as $content_indexes |
              ($content_indexes == [{
                name: "workshop_template_revisions_content_uidx",
                is_unique: 1,
                partial: 0,
                column_count: 2,
                column_0: "template_id",
                column_1: "content_hash"
              }] or $content_indexes == [{
                name: "workshop_template_revisions_content_idx",
                is_unique: 0,
                partial: 0,
                column_count: 2,
                column_0: "template_id",
                column_1: "content_hash"
              }]))
          ' "${before}" >/dev/null

          if jq -e '
            (.[0].results | map(select(
              .column_count == 2 and
              .column_0 == "template_id" and
              .column_1 == "content_hash"
            ))) == [{
              name: "workshop_template_revisions_content_uidx",
              is_unique: 1,
              partial: 0,
              column_count: 2,
              column_0: "template_id",
              column_1: "content_hash"
            }]
          ' "${before}" >/dev/null; then
            patch_sql="$(< "${GITHUB_WORKSPACE}/ops/cloudflare/allow-failed-workshop-republication.sql")"
            bunx wrangler d1 execute DB \
              --remote \
              --config dist/server/wrangler.json \
              --command "${patch_sql}" \
              --json > "${apply}"
            jq -e 'length > 0 and all(.[]; .success == true)' "${apply}" >/dev/null
          else
            jq -n '[{success: true, already_applied: true}]' > "${apply}"
          fi

          bunx wrangler d1 execute DB \
            --remote \
            --config dist/server/wrangler.json \
            --command "${index_query}" \
            --json > "${after}"
          jq -e '
            length == 1 and .[0].success == true and
            (.[0].results | map(select(
              .column_count == 2 and
              .column_0 == "template_id" and
              .column_1 == "content_hash"
            ))) == [{
              name: "workshop_template_revisions_content_idx",
              is_unique: 0,
              partial: 0,
              column_count: 2,
              column_0: "template_id",
              column_1: "content_hash"
            }]
          ' "${after}" >/dev/null
          sha256sum \
            "${GITHUB_WORKSPACE}/ops/cloudflare/allow-failed-workshop-republication.sql" \
            > "${RUNNER_TEMP}/workshop-republication-index-patch.sha256"

      - name: Retain clean D1 schema-patch evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-schema-patches-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workshop-republication-index-before.json
            ${{ runner.temp }}/workshop-republication-index-apply.json
            ${{ runner.temp }}/workshop-republication-index-after.json
            ${{ runner.temp }}/workshop-republication-index-patch.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Configure the pinned, restricted Stargate drain probe
        if: ${{ inputs.clean_d1_cutover_run_id != '' }}
        working-directory: ${{ github.workspace }}
        env:
          STARGATE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.STARGATE_DEPLOY_SSH_PRIVATE_KEY }}
          STARGATE_DEPLOY_KNOWN_HOSTS: ${{ secrets.STARGATE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          config="$(tools/cutover/configure-stargate-ssh.sh "${RUNNER_TEMP}/intar-stargate-ssh")"
          test "${config}" = "${RUNNER_TEMP}/intar-stargate-ssh/config"
          printf 'STARGATE_SSH_CONFIG=%s\n' "${config}" >> "${GITHUB_ENV}"

      - name: Reprove the fenced legacy drain immediately before the first binding switch
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_VERSION_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
          CLOUDFLARE_PROVIDER_PROBE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
          CLEAN_D1_DATABASE_ID: ${{ vars.CLEAN_D1_DATABASE_ID }}
          CLEAN_D1_DATABASE_NAME: ${{ vars.CLEAN_D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg apply_run_id "${CLEAN_D1_CUTOVER_RUN_ID}" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: 1, operation: "pre-web-switch-attempt", state: "started", source_sha: $source_sha, run_id: $run_id, apply_run_id: (if $apply_run_id == "" then null else $apply_run_id end), started_at: $started_at}' \
            > "${RUNNER_TEMP}/clean-d1-pre-switch-attempt.json"
          deployment="${RUNNER_TEMP}/pre-switch-deployment.json"
          version="${RUNNER_TEMP}/pre-switch-version.json"
          bunx wrangler deployments status --name intar-dev --json > "${deployment}"
          active_deployment_id="$(jq -er '.id | select(type == "string" and test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"))' "${deployment}")"
          active_version_id="$(jq -er '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' "${deployment}")"
          bunx wrangler versions view "${active_version_id}" \
            --name intar-dev --json > "${version}"
          active_database_id="$(jq -er '
            [.resources.bindings[] | select(.type == "d1" and .name == "DB")] |
            select(length == 1) | .[0].id
          ' "${version}")"

          if [ "${active_database_id}" = "${CLEAN_D1_DATABASE_ID}" ]; then
            bun tools/cutover/worker-version.ts active-binding \
              "${deployment}" "${version}" "${CLEAN_D1_DATABASE_ID}" \
              "${active_version_id}" >/dev/null
            jq -n \
              --arg source_sha "${GITHUB_SHA}" \
              --arg version_id "${active_version_id}" \
              --arg database_id "${CLEAN_D1_DATABASE_ID}" \
              '{schema_version: 1, operation: "pre-web-switch", mode: "already-clean", source_sha: $source_sha, version_id: $version_id, database_id: $database_id}' \
              > "${RUNNER_TEMP}/clean-d1-pre-web-switch.json"
            exit 0
          fi

          [[ "${CLEAN_D1_CUTOVER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test -f "${STARGATE_SSH_CONFIG}"
          apply_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CLEAN_D1_CUTOVER_RUN_ID}")"
          workflow_id="$(jq -er '.workflow_id' <<<"${apply_run}")"
          workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}")"
          jq -e '
            .path == ".github/workflows/clean-d1-cutover.yml" and
            .state == "active"
          ' <<<"${workflow}" >/dev/null
          jq -e \
            --argjson run_id "${CLEAN_D1_CUTOVER_RUN_ID}" \
            --arg sha "${GITHUB_SHA}" \
            --arg actor_id "${ACTOR_ID}" '
              .id == $run_id and
              .repository.full_name == "intar-dev/intar-dev" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $sha and
              .run_attempt == 1 and
              .status == "completed" and
              .conclusion == "success" and
              ((.actor.id | tostring) == $actor_id) and
              ((.triggering_actor.id | tostring) == $actor_id)
            ' <<<"${apply_run}" >/dev/null

          artifact_name="clean-d1-apply-${GITHUB_SHA}-${CLEAN_D1_CUTOVER_RUN_ID}"
          artifacts="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CLEAN_D1_CUTOVER_RUN_ID}/artifacts" \
            -f name="${artifact_name}" -f per_page=100)"
          jq -e --arg name "${artifact_name}" '
            .total_count == 1 and
            (.artifacts | length) == 1 and
            .artifacts[0].name == $name and
            .artifacts[0].expired == false and
            (.artifacts[0].digest | test("^sha256:[0-9a-f]{64}$"))
          ' <<<"${artifacts}" >/dev/null
          evidence_dir="${RUNNER_TEMP}/clean-d1-cutover-evidence"
          mkdir -p "${evidence_dir}"
          gh run download "${CLEAN_D1_CUTOVER_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir "${evidence_dir}"
          evidence="${evidence_dir}/clean-d1-apply.json"
          test -f "${evidence}"
          jq -e \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${CLEAN_D1_CUTOVER_RUN_ID}" \
            --arg clean_database_name "${CLEAN_D1_DATABASE_NAME}" \
            --arg clean_database_id "${CLEAN_D1_DATABASE_ID}" \
            '
              .schema_version == 4 and
              .operation == "apply" and
              .source_sha == $source_sha and
              .apply_run_id == $run_id and
              .apply_run_attempt == 1 and
              .database_name == $clean_database_name and
              .database_id == $clean_database_id and
              .previous_database_id != $clean_database_id and
              .maintenance_web_version_id == .maintenance_fence.maintenance_version_id and
              .pre_drain_recovery.schema_version == 1 and
              .pre_drain_recovery.operation == "resume-maintenance-fence" and
              .pre_drain_recovery.source_sha == .source_sha and
              .pre_drain_recovery.run_id == .apply_run_id and
              .pre_drain_recovery.run_attempt == 1 and
              .pre_drain_recovery.database_name == .previous_database_name and
              .pre_drain_recovery.database_id == .previous_database_id and
              .pre_drain_recovery.expected_previous_version_id == .previous_web_version_id and
              .pre_drain_recovery.after_active_version_id == .previous_web_version_id and
              (.pre_drain_recovery.before_deployment_id | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              (.pre_drain_recovery.restore_deployment_id | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              .pre_drain_recovery.active_traffic_percentage == 100 and
              .pre_drain_recovery.before_active_binding_proven == true and
              .pre_drain_recovery.previous_version_binding_proven == true and
              .pre_drain_recovery.after_active_binding_proven == true and
              .pre_drain_recovery.database_mutated == false and
              .pre_drain_recovery.routes_mutated == false and
              .pre_drain_recovery.crons_mutated == false and
              .pre_drain_recovery.restore_propagation.max_attempts == 12 and
              .pre_drain_recovery.restore_propagation.interval_seconds == 5 and
              .pre_drain_recovery.restore_propagation.request_timeout_seconds == 5 and
              (
                (.pre_drain_recovery.restored == false and .pre_drain_recovery.fence_detected == false and .pre_drain_recovery.before_deployment_id == .pre_drain_recovery.restore_deployment_id and .pre_drain_recovery.origin_run_id == null and .pre_drain_recovery.origin_run_conclusion == null and .pre_drain_recovery.active_fence_tag == null and .pre_drain_recovery.active_fence_tag_proven == false and .pre_drain_recovery.wrangler_version_deploy_ndjson == "" and .pre_drain_recovery.restore_propagation.required == false and .pre_drain_recovery.restore_propagation.attempts == 0 and .pre_drain_recovery.restore_propagation.marker_clear_attempt == null and .pre_drain_recovery.restore_propagation.root_healthy_attempt == null and .pre_drain_recovery.restore_propagation.final_marker_http_status == null and .pre_drain_recovery.restore_propagation.final_root_http_status == null and .pre_drain_recovery.restore_propagation.proven == false and .pre_drain_recovery.restore_propagation.attempts_ndjson == "") or
                (.pre_drain_recovery.restored == true and .pre_drain_recovery.fence_detected == true and .pre_drain_recovery.before_deployment_id != .pre_drain_recovery.restore_deployment_id and (.pre_drain_recovery.marker_sha256 | test("^[0-9a-f]{64}$")) and (.pre_drain_recovery.origin_run_id | test("^[1-9][0-9]*$")) and (.pre_drain_recovery.origin_run_conclusion | IN("failure", "cancelled", "timed_out", "action_required", "stale", "startup_failure")) and .pre_drain_recovery.active_fence_tag == ("clean-d1-fence-" + .pre_drain_recovery.origin_run_id) and .pre_drain_recovery.active_fence_tag_proven == true and (.pre_drain_recovery.wrangler_version_deploy_ndjson | contains("\"type\":\"version-deploy\"")) and .pre_drain_recovery.restore_propagation.required == true and .pre_drain_recovery.restore_propagation.attempts >= 1 and .pre_drain_recovery.restore_propagation.attempts <= .pre_drain_recovery.restore_propagation.max_attempts and .pre_drain_recovery.restore_propagation.marker_clear_attempt >= 1 and .pre_drain_recovery.restore_propagation.marker_clear_attempt <= .pre_drain_recovery.restore_propagation.attempts and .pre_drain_recovery.restore_propagation.root_healthy_attempt >= 1 and .pre_drain_recovery.restore_propagation.root_healthy_attempt <= .pre_drain_recovery.restore_propagation.attempts and (.pre_drain_recovery.restore_propagation.final_marker_http_status | test("^[234][0-9]{2}$")) and .pre_drain_recovery.restore_propagation.final_root_http_status == "200" and .pre_drain_recovery.restore_propagation.proven == true and (.pre_drain_recovery.restore_propagation.attempts_ndjson | contains("\"root_healthy\":true")) and (.pre_drain_recovery.restore_propagation.attempts_ndjson | contains("\"marker_clear\":true")))
              ) and
              .maintenance_fence.schema_version == 2 and
              .maintenance_fence.operation == "activate-maintenance-fence" and
              .maintenance_fence.source_sha == .source_sha and
              .maintenance_fence.run_id == .apply_run_id and
              .maintenance_fence.run_attempt == 1 and
              .maintenance_fence.database_name == .previous_database_name and
              .maintenance_fence.state == "active" and
              .maintenance_fence.database_id == .previous_database_id and
              .maintenance_fence.previous_version_id == .previous_web_version_id and
              (.maintenance_fence.maintenance_deployment_id | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              .maintenance_fence.marker_probe_attempts >= 1 and
              .maintenance_fence.marker_probe_attempts <= .maintenance_fence.propagation_max_attempts and
              .maintenance_fence.workshop_503_probe_attempts >= 1 and
              .maintenance_fence.workshop_503_probe_attempts <= .maintenance_fence.marker_probe_attempts and
              .maintenance_fence.propagation_max_attempts == 12 and
              .maintenance_fence.propagation_retry_seconds == 2 and
              .maintenance_fence.previous_version_binding_proven == true and
              .maintenance_fence.maintenance_version_binding_proven == true and
              (
                (.maintenance_fence.reused == true and .maintenance_fence.upload_did_not_activate == false and .maintenance_fence.exact_version_deployed == false and .maintenance_fence.wrangler_version_upload_ndjson == "" and .maintenance_fence.wrangler_version_deploy_ndjson == "") or
                (.maintenance_fence.reused == false and .maintenance_fence.upload_did_not_activate == true and .maintenance_fence.exact_version_deployed == true and (.maintenance_fence.wrangler_version_upload_ndjson | contains("\"type\":\"version-upload\"")) and (.maintenance_fence.wrangler_version_deploy_ndjson | contains("\"type\":\"version-deploy\"")))
              ) and
              .legacy_drain.schema_version == 4 and
              .legacy_drain.stargate_probe_succeeded == true and
              .legacy_drain.drained == true and
              .legacy_drain.provider_inventory.provenEmpty == true and
              .legacy_drain.stargate.healthy == true and
              .legacy_drain.stargate.drained == true
            ' "${evidence}" >/dev/null
          previous_database_name="$(jq -r '.previous_database_name' "${evidence}")"
          previous_database_id="$(jq -r '.previous_database_id' "${evidence}")"
          previous_version_id="$(jq -er '.previous_web_version_id' "${evidence}")"
          maintenance_version_id="$(jq -er '.maintenance_fence.maintenance_version_id' "${evidence}")"
          marker_sha256="$(jq -er '.maintenance_fence.marker_sha256' "${evidence}")"
          case "${active_version_id}" in
            "${previous_version_id}"|"${maintenance_version_id}") ;;
            *) echo "active version is not a resumable cutover version" >&2; exit 1 ;;
          esac
          bun tools/cutover/worker-version.ts active-binding \
            "${deployment}" "${version}" "${previous_database_id}" \
            "${active_version_id}" >/dev/null

          refence_required=true
          restore_maintenance_on_exit() {
            exit_status="$?"
            trap - EXIT INT TERM
            if [ "${refence_required}" = true ]; then
              if ! CLOUDFLARE_API_TOKEN="${CLOUDFLARE_VERSION_API_TOKEN}" \
                tools/cutover/reactivate-maintenance-fence.sh \
                  "${previous_database_name}" \
                  "${previous_database_id}" \
                  "${previous_version_id}" \
                  "${maintenance_version_id}" \
                  "${CLEAN_D1_CUTOVER_RUN_ID}" \
                  "${marker_sha256}" \
                  recovery \
                  "${RUNNER_TEMP}/clean-d1-pre-switch-maintenance-recovery.json"; then
                exit 1
              fi
            fi
            exit "${exit_status}"
          }
          trap restore_maintenance_on_exit EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_VERSION_API_TOKEN}" \
            tools/cutover/restore-successful-maintenance-fence.sh \
              "${previous_database_name}" \
              "${previous_database_id}" \
              "${previous_version_id}" \
              "${maintenance_version_id}" \
              "${CLEAN_D1_CUTOVER_RUN_ID}" \
              "${RUNNER_TEMP}/clean-d1-pre-switch-restore.json"

          resumed_strict_drain=false
          for attempt in 1 2 3 4 5 6 7 8 9; do
            attempt_evidence="${RUNNER_TEMP}/clean-d1-pre-switch-resumed-attempt-${attempt}.json"
            if tools/cutover/prove-legacy-drain.sh \
              "${previous_database_name}" \
              "${previous_database_id}" \
              "resume-${attempt}" \
              "${attempt_evidence}"; then
              cp "${attempt_evidence}" \
                "${RUNNER_TEMP}/clean-d1-pre-switch-resumed.json"
              resumed_strict_drain=true
              break
            fi
            jq -e '
              .schema_version == 4 and
              .query_succeeded == true and
              .provider_probe_succeeded == true and
              .stargate_probe_succeeded == true and
              .drained == false and
              .provider_inventory.connectionCount > 0 and
              .provider_inventory.provenEmpty == true and
              .stargate.healthy == true and
              .stargate.drained == true and
              .counts.untrustworthy_enabled_host_reports > 0 and
              (.counts | to_entries | all(
                if .key == "untrustworthy_enabled_host_reports"
                then .value > 0
                else .value == 0
                end
              ))
            ' "${attempt_evidence}" >/dev/null
            test "${attempt}" -lt 9
            sleep 15
          done
          test "${resumed_strict_drain}" = true

          CLOUDFLARE_API_TOKEN="${CLOUDFLARE_VERSION_API_TOKEN}" \
            tools/cutover/reactivate-maintenance-fence.sh \
              "${previous_database_name}" \
              "${previous_database_id}" \
              "${previous_version_id}" \
              "${maintenance_version_id}" \
              "${CLEAN_D1_CUTOVER_RUN_ID}" \
              "${marker_sha256}" \
              normal \
              "${RUNNER_TEMP}/clean-d1-pre-switch-maintenance-reactivation.json"
          active_version_id="${maintenance_version_id}"
          refence_required=false
          trap - EXIT INT TERM

          for pass in 1 2; do
            sleep 15
            tools/cutover/prove-legacy-drain.sh \
              "${previous_database_name}" \
              "${previous_database_id}" \
              "pre-switch-${pass}" \
              "${RUNNER_TEMP}/clean-d1-pre-switch-drain-${pass}.json"
            if [ "${pass}" = 1 ]; then sleep 5; fi
          done
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg version_id "${active_version_id}" \
            --arg previous_database_id "${previous_database_id}" \
            --arg clean_database_id "${CLEAN_D1_DATABASE_ID}" \
            --slurpfile restore "${RUNNER_TEMP}/clean-d1-pre-switch-restore.json" \
            --slurpfile resumed "${RUNNER_TEMP}/clean-d1-pre-switch-resumed.json" \
            --slurpfile maintenance "${RUNNER_TEMP}/clean-d1-pre-switch-maintenance-reactivation.json" \
            --slurpfile drain "${RUNNER_TEMP}/clean-d1-pre-switch-drain-2.json" \
            '{schema_version: 1, operation: "pre-web-switch", mode: "restored-strict-drain-refenced-cutover", source_sha: $source_sha, maintenance_version_id: $version_id, previous_database_id: $previous_database_id, clean_database_id: $clean_database_id, exact_restore: $restore[0], resumed_strict_drain: $resumed[0], maintenance_fence: $maintenance[0], final_drain: $drain[0]}' \
            > "${RUNNER_TEMP}/clean-d1-pre-web-switch.json"

      - name: Retain partial clean-D1 pre-switch evidence
        if: ${{ always() && inputs.clean_d1_cutover_run_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-pre-switch-attempt-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clean-d1-pre-switch-attempt.json
            ${{ runner.temp }}/pre-switch-deployment.json
            ${{ runner.temp }}/pre-switch-version.json
            ${{ runner.temp }}/clean-d1-cutover-evidence/
            ${{ runner.temp }}/clean-d1-pre-switch-restore.json
            ${{ runner.temp }}/intar-clean-d1-pre-switch-restore-${{ github.run_id }}/
            ${{ runner.temp }}/clean-d1-pre-switch-resumed-attempt-*.json
            ${{ runner.temp }}/clean-d1-pre-switch-resumed.json
            ${{ runner.temp }}/clean-d1-pre-switch-maintenance-reactivation.json
            ${{ runner.temp }}/clean-d1-pre-switch-maintenance-recovery.json
            ${{ runner.temp }}/intar-clean-d1-pre-switch-reactivate-${{ github.run_id }}-*/
            ${{ runner.temp }}/clean-d1-pre-switch-drain-1.json
            ${{ runner.temp }}/clean-d1-pre-switch-drain-2.json
            ${{ runner.temp }}/clean-d1-pre-web-switch.json
          if-no-files-found: error
          retention-days: 90

      - name: Activate exact immutable web version
        id: exact_web_activation
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
          CLEAN_D1_DATABASE_ID: ${{ vars.CLEAN_D1_DATABASE_ID }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          secrets_file="${RUNNER_TEMP}/website-runtime-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          jq -n '{STARGATE_EGRESS_IPV4_CIDRS: env.STARGATE_EGRESS_IPV4_CIDRS}' \
            > "${secrets_file}"
          chmod 600 "${secrets_file}"
          tools/cutover/activate-web-version.sh \
            apps/web/dist/server/wrangler.json \
            "${CLEAN_D1_DATABASE_ID}" \
            "${SESSION_KV_NAMESPACE_ID}" \
            "${secrets_file}" \
            "${RUNNER_TEMP}/exact-web-version-activation.json"

      - name: Retain exact web-version activation attempt
        if: ${{ always() && steps.exact_web_activation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: exact-web-version-attempt-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-web-version-activation.json
            ${{ runner.temp }}/intar-web-version-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90

      - name: Retain clean-D1 web-switch evidence
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-web-switch-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clean-d1-pre-web-switch.json
            ${{ runner.temp }}/clean-d1-pre-switch-restore.json
            ${{ runner.temp }}/clean-d1-pre-switch-resumed.json
            ${{ runner.temp }}/clean-d1-pre-switch-maintenance-reactivation.json
            ${{ runner.temp }}/clean-d1-pre-switch-drain-1.json
            ${{ runner.temp }}/clean-d1-pre-switch-drain-2.json
            ${{ runner.temp }}/exact-web-version-activation.json
            ${{ runner.temp }}/intar-web-version-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 90

      - name: Queue the exact scenario source bundle
        working-directory: ${{ github.workspace }}
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${INTAR_IMAGE_PUBLISH_TOKEN}"
          revision="${GITHUB_SHA:0:12}"
          just bundle-images \
            broken-nginx \
            builder.sample.amd64.hcl \
            "${revision}" \
            false \
            "https://intar.dev/registry/v1/bundles"

      - name: Recheck production guest tools before retention
        env:
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            sha256sum "${guest_tools_dir}/intar-workspace-agent" | cut -d ' ' -f 1
          )" = "${AGENT_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/intar-workspace-agent"
          )" = "${AGENT_SIZE_BYTES}"
          test "$(
            sha256sum "${guest_tools_dir}/kino" | cut -d ' ' -f 1
          )" = "${KINO_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/kino"
          )" = "${KINO_SIZE_BYTES}"
          chmod 0444 \
            "${guest_tools_dir}/SHA256SUMS" \
            "${guest_tools_dir}/manifest.json"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino" \
            "${guest_tools_dir}"

      - name: Preserve production guest tools for the workshop builder
        id: production_guest_tools
        uses: actions/upload-artifact@v7
        with:
          name: production-workshop-guest-tools-${{ github.sha }}
          path: ${{ runner.temp }}/production-workshop-guest-tools/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      # Keep this the final fallible step. The immutable binaries, D1
      # migrations, Worker, and retained provenance must all succeed before
      # production allocation can discover the new guest tools.
      - name: Publish current learner guest-tool manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          object_path="intar-dev-vm-image-registry-20260709/workspace-agent/releases/current.json"
          desired="${RUNNER_TEMP}/workspace-agent-current.json"
          observed="${RUNNER_TEMP}/workspace-agent-current-observed.json"
          jq -n \
            --arg sha256 "${AGENT_SHA256}" \
            --argjson size_bytes "${AGENT_SIZE_BYTES}" \
            --arg kino_sha256 "${KINO_SHA256}" \
            --argjson kino_size_bytes "${KINO_SIZE_BYTES}" \
            '{schema_version: 2, sha256: $sha256, size_bytes: $size_bytes, kino_sha256: $kino_sha256, kino_size_bytes: $kino_size_bytes}' \
            > "${desired}"

          pointer_verified=false
          for attempt in 1 2 3; do
            rm -f "${observed}"
            bunx wrangler r2 object put "${object_path}" \
              --file "${desired}" \
              --content-type "application/json" \
              --jurisdiction eu \
              --remote || true
            if bunx wrangler r2 object get "${object_path}" \
              --file "${observed}" \
              --jurisdiction eu \
              --remote &&
              cmp --silent "${desired}" "${observed}"; then
              pointer_verified=true
              break
            fi
            sleep "${attempt}"
          done
          if [ "${pointer_verified}" != true ]; then
            echo "Failed to publish and read back the exact learner guest-tool pointer." >&2
            exit 1
          fi
