name: Website production
run-name: "Website deploy ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      confirmation:
        description: Exact protected web deployment confirmation
        required: true
        type: string
      single_operator_confirmation:
        description: Sole-operator confirmation when that production mode is active
        required: false
        default: ""
        type: string
      provenance_workflow_path:
        description: Exact top-level workflow path recorded in retained artifacts
        required: false
        default: .github/workflows/website-deploy.yml
        type: string
      parent_holds_control_plane_lock:
        description: True only when the protected multicloud wrapper owns serialization
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_PROVIDER_PROBE_API_TOKEN:
        required: true
      CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET:
        required: true
      STARGATE_EGRESS_IPV4_CIDRS:
        required: true
      OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1:
        required: true
      INTAR_IMAGE_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY WORKSHOP CONTROL PLANE
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when no independent reviewer exists
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.parent_holds_control_plane_lock && format('website-reusable-{0}', github.run_id) || 'intar-control-plane-production' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/web

jobs:
  preflight:
    name: Validate protected runtime configuration
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      PROVENANCE_WORKFLOW_PATH: ${{ inputs.provenance_workflow_path || '.github/workflows/website-deploy.yml' }}
      PARENT_HOLDS_CONTROL_PLANE_LOCK: ${{ inputs.parent_holds_control_plane_lock || false }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Verify protected production dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_call|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"
          test "${RUN_ATTEMPT}" = 1
          case "${PROVENANCE_WORKFLOW_PATH}" in
            .github/workflows/website-deploy.yml|.github/workflows/control-plane-rollout.yml) ;;
            *) exit 1 ;;
          esac
          if [ "${PARENT_HOLDS_CONTROL_PLANE_LOCK}" = true ]; then
            test "${PROVENANCE_WORKFLOW_PATH}" = ".github/workflows/control-plane-rollout.yml"
          else
            test "${PROVENANCE_WORKFLOW_PATH}" = ".github/workflows/website-deploy.yml"
          fi

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Validate Stargate egress and runtime signing keys
        working-directory: ${{ github.workspace }}
        env:
          CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET: ${{ secrets.CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID }}
        run: |
          test "${#CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET}" -ge 43
          test -n "${OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1}"
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID}"
          node - <<'NODE'
          const cidrs = (process.env.STARGATE_EGRESS_IPV4_CIDRS ?? "")
            .split(",").map((value) => value.trim()).filter(Boolean);
          const validCidrs = cidrs.length > 0 && cidrs.every((cidr) => {
            const match = /^(\d{1,3}(?:\.\d{1,3}){3})\/(\d|[12]\d|3[0-2])$/.exec(cidr);
            return match && match[1].split(".").every((octet) => Number(octet) <= 255);
          });
          if (!validCidrs) throw new Error("STARGATE_EGRESS_IPV4_CIDRS is invalid");

          const keyId = process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID ?? "";
          if (!/^[A-Za-z0-9._-]{1,128}$/.test(keyId)) {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID is invalid");
          }
          let keys;
          try {
            keys = JSON.parse(process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON ?? "");
          } catch {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON is not valid JSON");
          }
          if (!keys || Array.isArray(keys) || typeof keys !== "object") {
            throw new Error("runtime signing keys must be a JSON object");
          }
          const entries = Object.entries(keys);
          if (entries.length < 1 || entries.length > 16) {
            throw new Error("runtime signing keys must contain between 1 and 16 keys");
          }
          for (const [id, value] of entries) {
            if (!/^[A-Za-z0-9._-]{1,128}$/.test(id)) {
              throw new Error(`runtime signing key ID is invalid: ${id}`);
            }
            if (typeof value !== "string" || !/^[A-Za-z0-9+/]{43}=$/.test(value)) {
              throw new Error(`runtime signing public key is invalid: ${id}`);
            }
            const decoded = Buffer.from(value, "base64");
            if (decoded.length !== 32 || decoded.toString("base64") !== value) {
              throw new Error(`runtime signing public key is not a canonical Ed25519 key: ${id}`);
            }
          }
          if (!Object.hasOwn(keys, keyId)) {
            throw new Error("runtime signing key map does not contain the builder key ID");
          }
          NODE

  provider-capabilities:
    name: Validate provider capability contract
    needs: preflight
    runs-on: namespace-profile-intar-dev
    environment: production
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore shared Bun cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Install the root workspace
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Reject service-binding or capability drift
        working-directory: ${{ github.workspace }}
        run: bun run check:providers

      - name: Call both deployed services through a temporary remote binding
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
        run: >-
          bun tools/providers/probe-live-capabilities.ts
          "${RUNNER_TEMP}/provider-capabilities.json"

      - name: Retain pre-web capability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pre-web-provider-capabilities-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-capabilities.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    needs: provider-capabilities
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 60
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      PROVENANCE_WORKFLOW_PATH: ${{ inputs.provenance_workflow_path || '.github/workflows/website-deploy.yml' }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Verify deployment revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add --toolchain 1.97.0 wasm32-unknown-unknown x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Install pinned build tools
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: just@1.58.0,wasm-pack@0.15.0,cargo-zigbuild@0.23.0
          fallback: none

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build browser scenario validator
        working-directory: ${{ github.workspace }}
        run: just generate-scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Install root workspace dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Build pinned learner guest tools
        id: workspace-agent
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          mkdir -p "${guest_tools_dir}"
          cp \
            "target/x86_64-unknown-linux-musl/release/intar-workspace-agent" \
            "${guest_tools_dir}/intar-workspace-agent"
          cp \
            "target/x86_64-unknown-linux-musl/release/kino" \
            "${guest_tools_dir}/kino"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino"
          agent_path="${guest_tools_dir}/intar-workspace-agent"
          kino_path="${guest_tools_dir}/kino"
          file "${agent_path}" | grep -E 'x86-64.*(static|statically linked)'
          file "${kino_path}" | grep -E 'x86-64.*(static|statically linked)'
          agent_sha="$(sha256sum "${agent_path}" | cut -d ' ' -f 1)"
          agent_size="$(stat --format='%s' "${agent_path}")"
          kino_sha="$(sha256sum "${kino_path}" | cut -d ' ' -f 1)"
          kino_size="$(stat --format='%s' "${kino_path}")"
          test "${#agent_sha}" -eq 64
          test "${agent_size}" -gt 0
          test "${#kino_sha}" -eq 64
          test "${kino_size}" -gt 0
          {
            echo "sha256=${agent_sha}"
            echo "size_bytes=${agent_size}"
            echo "kino_sha256=${kino_sha}"
            echo "kino_size_bytes=${kino_size}"
          } >> "${GITHUB_OUTPUT}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg workflow_path "${PROVENANCE_WORKFLOW_PATH}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg agent_sha256 "${agent_sha}" \
            --argjson agent_size_bytes "${agent_size}" \
            --arg agent_object_key \
              "workspace-agent/releases/${agent_sha}/intar-workspace-agent" \
            --arg kino_sha256 "${kino_sha}" \
            --argjson kino_size_bytes "${kino_size}" \
            --arg kino_object_key \
              "workspace-agent/kino/releases/${kino_sha}/kino" \
            '{
              schema_version: 1,
              repository: $repository,
              source_sha: $source_sha,
              workflow_path: $workflow_path,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              event: $event,
              ref: $ref,
              architecture: "x86_64",
              target: "x86_64-unknown-linux-musl",
              tools: {
                "intar-workspace-agent": {
                  sha256: $agent_sha256,
                  size_bytes: $agent_size_bytes,
                  r2_object_key: $agent_object_key
                },
                kino: {
                  sha256: $kino_sha256,
                  size_bytes: $kino_size_bytes,
                  r2_object_key: $kino_object_key
                }
              }
            }' > "${guest_tools_dir}/manifest.json"
          (
            cd "${guest_tools_dir}"
            sha256sum intar-workspace-agent kino > SHA256SUMS
          )

      - name: Build deployment artifact
        run: bun run build:deploy

      - name: Pin protected runtime configuration in deployment artifact
        env:
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/apps/web/dist/server/wrangler.json"
          patched="${RUNNER_TEMP}/website-wrangler.json"
          jq \
            --arg keys "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}" \
            '.vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON = $keys' \
            "${config}" > "${patched}"
          mv "${patched}" "${config}"

          database_id="$(jq -er '
            [.d1_databases[] | select(.binding == "DB")] |
            select(length == 1) | .[0].database_id
          ' "${config}")"
          database_name="$(jq -er '
            [.d1_databases[] | select(.binding == "DB")] |
            select(length == 1) | .[0].database_name
          ' "${config}")"
          [[ "${database_id}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          [[ "${database_name}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$ ]]
          test "$(jq -er '.vars.CONTROL_PLANE_MAINTENANCE // "off"' "${config}")" = off

          jq -e \
            --arg database_id "${database_id}" \
            --arg database_name "${database_name}" \
            --arg session_namespace_id "${SESSION_KV_NAMESPACE_ID}" '
              ([.d1_databases[] | select(.binding == "DB")]) as $databases |
              ([.kv_namespaces[] | select(.binding == "SESSION")]) as $sessions |
              ($databases | length) == 1 and
              $databases[0].database_id == $database_id and
              $databases[0].database_name == $database_name and
              ($sessions | length) == 1 and
              $sessions[0].id == $session_namespace_id
            ' "${config}" >/dev/null

          {
            printf 'DATABASE_ID=%s\n' "${database_id}"
            printf 'DATABASE_NAME=%s\n' "${database_name}"
            printf 'DEPLOYMENT_CONFIG=%s\n' "${config}"
          } >> "${GITHUB_ENV}"

      - name: Recheck sole-operator window immediately before mutation
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_call|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"
          test "${RUN_ATTEMPT}" = 1

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Publish content-addressed learner workspace agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            sha256sum "${guest_tools_dir}/intar-workspace-agent" | cut -d ' ' -f 1
          )" = "${AGENT_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/intar-workspace-agent"
          )" = "${AGENT_SIZE_BYTES}"
          test "$(
            sha256sum "${guest_tools_dir}/kino" | cut -d ' ' -f 1
          )" = "${KINO_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/kino"
          )" = "${KINO_SIZE_BYTES}"
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/releases/${AGENT_SHA256}/intar-workspace-agent" \
            --file "${RUNNER_TEMP}/production-workshop-guest-tools/intar-workspace-agent" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/kino/releases/${KINO_SHA256}/kino" \
            --file "${RUNNER_TEMP}/production-workshop-guest-tools/kino" \
            --jurisdiction eu \
            --remote

      - name: Prove the production D1 is already Drizzle-managed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/production-d1-pre-migration-marker.json"
          expected="${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.json"
          observed="${RUNNER_TEMP}/production-d1-pre-migration-ledger.json"
          expected_manifest="${RUNNER_TEMP}/production-d1-pre-migration-expected-manifest.json"
          observed_manifest="${RUNNER_TEMP}/production-d1-pre-migration-manifest.json"
          foreign_keys="${RUNNER_TEMP}/production-d1-pre-migration-foreign-keys.json"
          generated_schema="${RUNNER_TEMP}/production-d1-pre-migration-generated-schema.json"

          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${DATABASE_ID}" \
            --expect observed-ledger-prefix \
            --evidence "${generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "observed-ledger-prefix" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount > 0 and
              .appliedMigrationCount <= .committedMigrationCount and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${generated_schema}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'table' AND name = '__drizzle_migrations') AS drizzle_ledgers, (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'table' AND name = 'd1_migrations') AS wrangler_ledgers, (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'trigger') AS triggers, (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'view') AS views" \
            --json > "${marker}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == [{
              drizzle_ledgers: 1,
              wrangler_ledgers: 0,
              triggers: 0,
              views: 0
            }]
          ' "${marker}" >/dev/null

          : > "${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.ndjson"
          while IFS=$'\t' read -r tag created_at; do
            test -n "${tag}"
            test -f "migrations/${tag}.sql"
            hash="$(sha256sum "migrations/${tag}.sql" | cut -d ' ' -f 1)"
            jq -cn \
              --arg hash "${hash}" \
              --argjson created_at "${created_at}" \
              '{hash: $hash, created_at: $created_at}' \
              >> "${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.ndjson"
          done < <(jq -r '.entries[] | [.tag, (.when | tostring)] | @tsv' \
            migrations/meta/_journal.json)
          jq -s 'sort_by(.created_at)' \
            "${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.ndjson" \
            > "${expected}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${observed}"
          jq -e --slurpfile expected "${expected}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | length) > 0 and
            (.[0].results | length) <= ($expected[0] | length) and
            .[0].results == $expected[0][0:(.[0].results | length)]
          ' "${observed}" >/dev/null

          applied_migration_count="$(jq -er '.[0].results | length' "${observed}")"
          pre_migration_snapshot_index="$(jq -er \
            --argjson entry "$((applied_migration_count - 1))" \
            '.entries[$entry].idx' migrations/meta/_journal.json)"
          printf -v pre_migration_snapshot_path \
            'migrations/meta/%04d_snapshot.json' \
            "${pre_migration_snapshot_index}"
          test -f "${pre_migration_snapshot_path}"
          jq '
            [
              (.tables | to_entries[] | {
                type: "table", name: .key, table_name: .key
              }),
              (.tables | to_entries[] | . as $table |
                (($table.value.indexes // {}) | keys[]) | {
                  type: "index", name: ., table_name: $table.key
                })
            ] + [{
              type: "table",
              name: "__drizzle_migrations",
              table_name: "__drizzle_migrations"
            }] | sort_by(.type, .name, .table_name)
          ' "${pre_migration_snapshot_path}" > "${expected_manifest}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${observed_manifest}"
          jq -e --slurpfile expected "${expected_manifest}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0] and
            ([.[0].results[] | select(.type == "trigger" or .type == "view")] | length) == 0 and
            ([.[0].results[] | select(.name == "d1_migrations")] | length) == 0
          ' "${observed_manifest}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "PRAGMA foreign_key_check" \
            --json > "${foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${foreign_keys}" >/dev/null

      - name: Apply the generated Drizzle migration stream to production D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIZZLE_D1_HTTP: "1"
        run: |
          set -euo pipefail
          export CLOUDFLARE_DATABASE_ID="${DATABASE_ID}"
          bunx drizzle-kit migrate --config drizzle.config.ts 2>&1 |
            tee "${RUNNER_TEMP}/production-d1-drizzle-migrate.log"

      - name: Verify the exact Drizzle schema and migration ledger
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          generated_schema="${RUNNER_TEMP}/production-d1-generated-schema.json"
          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${DATABASE_ID}" \
            --expect full \
            --evidence "${generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "full" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount == .committedMigrationCount and
              .appliedMigrationCount > 0 and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${generated_schema}" >/dev/null
          expected_ledger="${RUNNER_TEMP}/production-d1-expected-ledger.json"
          ledger="${RUNNER_TEMP}/production-d1-ledger.json"
          expected_manifest="${RUNNER_TEMP}/production-d1-expected-manifest.json"
          manifest="${RUNNER_TEMP}/production-d1-manifest.json"
          foreign_keys="${RUNNER_TEMP}/production-d1-foreign-keys.json"

          : > "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson"
          while IFS=$'\t' read -r tag created_at; do
            test -n "${tag}"
            test -f "migrations/${tag}.sql"
            hash="$(sha256sum "migrations/${tag}.sql" | cut -d ' ' -f 1)"
            jq -cn \
              --arg hash "${hash}" \
              --argjson created_at "${created_at}" \
              '{hash: $hash, created_at: $created_at}' \
              >> "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson"
          done < <(jq -r '.entries[] | [.tag, (.when | tostring)] | @tsv' \
            migrations/meta/_journal.json)
          jq -s 'sort_by(.created_at)' \
            "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson" \
            > "${expected_ledger}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${ledger}"
          jq -e --slurpfile expected "${expected_ledger}" '
            length == 1 and
            .[0].success == true and
            .[0].results == $expected[0] and
            (.[0].results | length) > 0
          ' "${ledger}" >/dev/null

          final_snapshot_index="$(jq -er '.entries[-1].idx' \
            migrations/meta/_journal.json)"
          printf -v final_snapshot_path \
            'migrations/meta/%04d_snapshot.json' "${final_snapshot_index}"
          test -f "${final_snapshot_path}"
          jq '
            [
              (.tables | to_entries[] | {
                type: "table", name: .key, table_name: .key
              }),
              (.tables | to_entries[] | . as $table |
                (($table.value.indexes // {}) | keys[]) | {
                  type: "index", name: ., table_name: $table.key
                })
            ] + [{
              type: "table",
              name: "__drizzle_migrations",
              table_name: "__drizzle_migrations"
            }] | sort_by(.type, .name, .table_name)
          ' "${final_snapshot_path}" > "${expected_manifest}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${manifest}"
          jq -e --slurpfile expected "${expected_manifest}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0] and
            ([.[0].results[] | select(.type == "trigger" or .type == "view")] | length) == 0 and
            ([.[0].results[] | select(.name == "d1_migrations")] | length) == 0
          ' "${manifest}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${DEPLOYMENT_CONFIG}" \
            --command "PRAGMA foreign_key_check" \
            --json > "${foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${foreign_keys}" >/dev/null

      - name: Backfill OIDC ciphertext before encrypted Worker activation
        id: oidc_backfill
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
        run: |
          set -euo pipefail
          test -n "${OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1}"
          export CLOUDFLARE_DATABASE_ID="${DATABASE_ID}"
          export OIDC_MIGRATION_CONFIRMATION="BACKFILL OIDC SECRET MIGRATION"
          counts_file="${RUNNER_TEMP}/oidc-secret-backfill-counts.json"
          test ! -e "${counts_file}"
          bun tools/database/oidc-secret-migration.ts \
            --operation backfill \
            --counts-output "${counts_file}"

      - name: Verify complete OIDC ciphertext backfill
        if: ${{ always() && steps.oidc_backfill.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          jq -e '
            .version == 1 and
            .operation == "backfill" and
            .status == "completed" and
            (.counts | type == "object") and
            (.counts | keys) == [
              "casConflicts",
              "ciphertextInvalid",
              "ciphertextOnly",
              "ciphertextPresent",
              "ciphertextValid",
              "configInvalid",
              "dualWritten",
              "missingSecretMaterial",
              "plaintextOnly",
              "plaintextPresent",
              "scanned",
              "secretMismatch",
              "writesApplied"
            ] and
            (.counts | all(.[]; type == "number" and . >= 0 and floor == .)) and
            .counts.plaintextOnly == 0 and
            .counts.ciphertextInvalid == 0 and
            .counts.configInvalid == 0 and
            .counts.missingSecretMaterial == 0 and
            .counts.secretMismatch == 0 and
            .counts.ciphertextPresent == .counts.scanned and
            .counts.ciphertextValid == .counts.scanned and
            (.counts.dualWritten + .counts.ciphertextOnly) == .counts.scanned
          ' "${RUNNER_TEMP}/oidc-secret-backfill-counts.json" >/dev/null

      - name: Retain counts-only OIDC backfill evidence
        if: ${{ always() && steps.oidc_backfill.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oidc-secret-backfill-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/oidc-secret-backfill-counts.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain production D1 migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-d1-drizzle-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-d1-pre-migration-*.json
            ${{ runner.temp }}/production-d1-drizzle-migrate.log
            ${{ runner.temp }}/production-d1-expected-ledger.json
            ${{ runner.temp }}/production-d1-ledger.json
            ${{ runner.temp }}/production-d1-expected-manifest.json
            ${{ runner.temp }}/production-d1-manifest.json
            ${{ runner.temp }}/production-d1-foreign-keys.json
            ${{ runner.temp }}/production-d1-generated-schema.json
          if-no-files-found: error
          retention-days: 90

      - name: Prepare ephemeral Worker activation secrets
        id: activation_secrets
        working-directory: ${{ github.workspace }}
        env:
          CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET: ${{ secrets.CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
        run: |
          set -euo pipefail
          test "${#CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET}" -ge 43
          test -n "${OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1}"
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          secrets_file="${RUNNER_TEMP}/website-runtime-secrets.json"
          jq -n '{
            CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET: env.CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET,
            OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: env.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1,
            STARGATE_EGRESS_IPV4_CIDRS: env.STARGATE_EGRESS_IPV4_CIDRS
          }' \
            > "${secrets_file}"
          chmod 600 "${secrets_file}"
          printf 'ACTIVATION_SECRETS_FILE=%s\n' "${secrets_file}" \
            >> "${GITHUB_ENV}"

      - name: Activate the exact immutable web version
        id: exact_web_activation
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
          WEB_ACTIVATION_LABEL: standard
        run: |
          set -euo pipefail
          tools/deploy/activate-web-version.sh \
            "${DEPLOYMENT_CONFIG}" \
            "${DATABASE_ID}" \
            "${DATABASE_ID}" \
            "${SESSION_KV_NAMESPACE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/exact-web-version-activation-standard.json" \
            open

      - name: Remove ephemeral Worker activation secrets
        if: ${{ always() && steps.activation_secrets.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        run: rm -f "${RUNNER_TEMP}/website-runtime-secrets.json"

      - name: Remove plaintext after encrypted OIDC activation
        id: oidc_cleanup
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
        run: |
          set -euo pipefail
          test -n "${OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1}"
          export CLOUDFLARE_DATABASE_ID="${DATABASE_ID}"
          export OIDC_MIGRATION_CONFIRMATION="CLEANUP OIDC SECRET MIGRATION"
          counts_file="${RUNNER_TEMP}/oidc-secret-cleanup-counts.json"
          test ! -e "${counts_file}"
          bun tools/database/oidc-secret-migration.ts \
            --operation cleanup \
            --counts-output "${counts_file}"

      - name: Verify OIDC plaintext cleanup
        if: ${{ always() && steps.oidc_cleanup.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          jq -e '
            .version == 1 and
            .operation == "cleanup" and
            .status == "completed" and
            (.counts | type == "object") and
            (.counts | keys) == [
              "casConflicts",
              "ciphertextInvalid",
              "ciphertextOnly",
              "ciphertextPresent",
              "ciphertextValid",
              "configInvalid",
              "dualWritten",
              "missingSecretMaterial",
              "plaintextOnly",
              "plaintextPresent",
              "scanned",
              "secretMismatch",
              "writesApplied"
            ] and
            (.counts | all(.[]; type == "number" and . >= 0 and floor == .)) and
            .counts.plaintextPresent == 0 and
            .counts.plaintextOnly == 0 and
            .counts.dualWritten == 0 and
            .counts.ciphertextInvalid == 0 and
            .counts.configInvalid == 0 and
            .counts.missingSecretMaterial == 0 and
            .counts.secretMismatch == 0 and
            .counts.ciphertextOnly == .counts.scanned and
            .counts.ciphertextValid == .counts.scanned
          ' "${RUNNER_TEMP}/oidc-secret-cleanup-counts.json" >/dev/null

      - name: Retain counts-only OIDC cleanup evidence
        if: ${{ always() && steps.oidc_cleanup.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oidc-secret-cleanup-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/oidc-secret-cleanup-counts.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain exact web-version activation attempt
        if: ${{ always() && steps.activation_secrets.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-web-version-attempt-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/exact-web-version-activation-standard.json
            ${{ runner.temp }}/intar-web-deploy-${{ github.run_id }}-standard/
          if-no-files-found: error
          retention-days: 90

      - name: Queue the exact scenario source bundle
        working-directory: ${{ github.workspace }}
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          control_plane_maintenance="$(
            jq -er '.vars.CONTROL_PLANE_MAINTENANCE // "off"' \
              apps/web/dist/server/wrangler.json
          )"
          case "${control_plane_maintenance}" in
            on)
              printf 'Skipping scenario source bundle while control-plane maintenance is on.\n'
              exit 0
              ;;
            off) ;;
            *)
              printf 'Invalid CONTROL_PLANE_MAINTENANCE value: %s\n' \
                "${control_plane_maintenance}" >&2
              exit 1
              ;;
          esac
          test -n "${INTAR_IMAGE_PUBLISH_TOKEN}"
          revision="${GITHUB_SHA:0:12}"
          just bundle-images \
            broken-nginx \
            builder.sample.amd64.hcl \
            "${revision}" \
            false \
            "https://intar.dev/registry/v1/bundles"

      - name: Recheck production guest tools before retention
        env:
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            sha256sum "${guest_tools_dir}/intar-workspace-agent" | cut -d ' ' -f 1
          )" = "${AGENT_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/intar-workspace-agent"
          )" = "${AGENT_SIZE_BYTES}"
          test "$(
            sha256sum "${guest_tools_dir}/kino" | cut -d ' ' -f 1
          )" = "${KINO_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/kino"
          )" = "${KINO_SIZE_BYTES}"
          chmod 0444 \
            "${guest_tools_dir}/SHA256SUMS" \
            "${guest_tools_dir}/manifest.json"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino" \
            "${guest_tools_dir}"

      - name: Preserve production guest tools for the workshop builder
        id: production_guest_tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-workshop-guest-tools-${{ github.sha }}
          path: ${{ runner.temp }}/production-workshop-guest-tools/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      # Keep this the final fallible step. The immutable binaries, D1
      # migrations, Worker, and retained provenance must all succeed before
      # production allocation can discover the new guest tools.
      - name: Publish current learner guest-tool manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          object_path="intar-dev-vm-image-registry-20260709/workspace-agent/releases/current.json"
          desired="${RUNNER_TEMP}/workspace-agent-current.json"
          observed="${RUNNER_TEMP}/workspace-agent-current-observed.json"
          jq -n \
            --arg sha256 "${AGENT_SHA256}" \
            --argjson size_bytes "${AGENT_SIZE_BYTES}" \
            --arg kino_sha256 "${KINO_SHA256}" \
            --argjson kino_size_bytes "${KINO_SIZE_BYTES}" \
            '{schema_version: 2, sha256: $sha256, size_bytes: $size_bytes, kino_sha256: $kino_sha256, kino_size_bytes: $kino_size_bytes}' \
            > "${desired}"

          pointer_verified=false
          for attempt in 1 2 3; do
            rm -f "${observed}"
            bunx wrangler r2 object put "${object_path}" \
              --file "${desired}" \
              --content-type "application/json" \
              --jurisdiction eu \
              --remote || true
            if bunx wrangler r2 object get "${object_path}" \
              --file "${observed}" \
              --jurisdiction eu \
              --remote &&
              cmp --silent "${desired}" "${observed}"; then
              pointer_verified=true
              break
            fi
            sleep "${attempt}"
          done
          if [ "${pointer_verified}" != true ]; then
            echo "Failed to publish and read back the exact learner guest-tool pointer." >&2
            exit 1
          fi
