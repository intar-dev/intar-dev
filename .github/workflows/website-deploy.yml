name: Website production
run-name: "Website deploy ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  workflow_call:
    inputs:
      confirmation:
        description: Exact protected web deployment confirmation
        required: true
        type: string
      single_operator_confirmation:
        description: Sole-operator confirmation when that production mode is active
        required: false
        default: ""
        type: string
      provenance_workflow_path:
        description: Exact top-level workflow path recorded in retained artifacts
        required: false
        default: .github/workflows/website-deploy.yml
        type: string
      parent_holds_control_plane_lock:
        description: True only when the protected multicloud wrapper owns serialization
        required: false
        default: false
        type: boolean
      fresh_d1_cutover:
        description: Perform the one-run old-D1 to fresh Drizzle-managed D1 cutover
        required: false
        default: false
        type: boolean
      fresh_d1_cutover_confirmation:
        description: Exact additional confirmation for a fresh D1 cutover
        required: false
        default: ""
        type: string
      source_snapshot_reset_confirmation:
        description: Acknowledge that the retained source is an archive, not a lossless live handoff
        required: false
        default: ""
        type: string
      source_database_id:
        description: D1 UUID currently bound to the active Worker during cutover
        required: false
        default: ""
        type: string
      source_database_name:
        description: D1 name currently bound to the active Worker during cutover
        required: false
        default: ""
        type: string
      target_database_id:
        description: Fresh D1 UUID committed in wrangler.jsonc for cutover
        required: false
        default: ""
        type: string
      target_database_name:
        description: Fresh D1 name committed in wrangler.jsonc for cutover
        required: false
        default: ""
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_PROVIDER_PROBE_API_TOKEN:
        required: true
      STARGATE_EGRESS_IPV4_CIDRS:
        required: true
      INTAR_IMAGE_PUBLISH_TOKEN:
        required: true
      BETA_MAINTENANCE_BYPASS_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY WORKSHOP CONTROL PLANE
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when no independent reviewer exists
        required: false
        type: string
      fresh_d1_cutover:
        description: Fence the old D1, copy into a fresh Drizzle D1, and cut over
        required: true
        default: false
        type: boolean
      fresh_d1_cutover_confirmation:
        description: Type CUT OVER FRESH DRIZZLE D1 when fresh_d1_cutover is true
        required: false
        default: ""
        type: string
      source_snapshot_reset_confirmation:
        description: Type ARCHIVE SOURCE SNAPSHOT AND RESET CONTROL PLANE when fresh_d1_cutover is true
        required: false
        default: ""
        type: string
      source_database_id:
        description: UUID currently bound to the active production Worker
        required: false
        default: ""
        type: string
      source_database_name:
        description: Name currently paired with source_database_id
        required: false
        default: ""
        type: string
      target_database_id:
        description: UUID of the fresh D1 committed in apps/web/wrangler.jsonc
        required: false
        default: ""
        type: string
      target_database_name:
        description: Name paired with target_database_id in apps/web/wrangler.jsonc
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.parent_holds_control_plane_lock && format('website-reusable-{0}', github.run_id) || 'intar-control-plane-production' }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    working-directory: apps/web

jobs:
  preflight:
    name: Validate protected runtime configuration
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      PROVENANCE_WORKFLOW_PATH: ${{ inputs.provenance_workflow_path || '.github/workflows/website-deploy.yml' }}
      PARENT_HOLDS_CONTROL_PLANE_LOCK: ${{ inputs.parent_holds_control_plane_lock || false }}
      FRESH_D1_CUTOVER: ${{ inputs.fresh_d1_cutover || false }}
      FRESH_D1_CUTOVER_CONFIRMATION: ${{ inputs.fresh_d1_cutover_confirmation }}
      SOURCE_SNAPSHOT_RESET_CONFIRMATION: ${{ inputs.source_snapshot_reset_confirmation }}
      SOURCE_DATABASE_ID: ${{ inputs.source_database_id }}
      SOURCE_DATABASE_NAME: ${{ inputs.source_database_name }}
      TARGET_DATABASE_ID: ${{ inputs.target_database_id }}
      TARGET_DATABASE_NAME: ${{ inputs.target_database_name }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify protected production dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_call|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"
          test "${RUN_ATTEMPT}" = 1
          case "${FRESH_D1_CUTOVER}" in
            false)
              test -z "${FRESH_D1_CUTOVER_CONFIRMATION}"
              test -z "${SOURCE_DATABASE_ID}"
              test -z "${SOURCE_DATABASE_NAME}"
              test -z "${TARGET_DATABASE_ID}"
              test -z "${TARGET_DATABASE_NAME}"
              ;;
            true)
              test "${FRESH_D1_CUTOVER_CONFIRMATION}" = \
                "CUT OVER FRESH DRIZZLE D1"
              [[ "${SOURCE_DATABASE_ID}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
              [[ "${TARGET_DATABASE_ID}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
              test "${SOURCE_DATABASE_ID}" != "${TARGET_DATABASE_ID}"
              [[ "${SOURCE_DATABASE_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$ ]]
              [[ "${TARGET_DATABASE_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$ ]]
              test "${SOURCE_DATABASE_NAME}" != "${TARGET_DATABASE_NAME}"
              ;;
            *) exit 1 ;;
          esac
          case "${PROVENANCE_WORKFLOW_PATH}" in
            .github/workflows/website-deploy.yml|.github/workflows/control-plane-rollout.yml) ;;
            *) exit 1 ;;
          esac
          if [ "${PARENT_HOLDS_CONTROL_PLANE_LOCK}" = true ]; then
            test "${PROVENANCE_WORKFLOW_PATH}" = ".github/workflows/control-plane-rollout.yml"
          else
            test "${PROVENANCE_WORKFLOW_PATH}" = ".github/workflows/website-deploy.yml"
          fi

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate Stargate egress and runtime signing keys
        working-directory: ${{ github.workspace }}
        env:
          BETA_MAINTENANCE_BYPASS_SECRET: ${{ secrets.BETA_MAINTENANCE_BYPASS_SECRET }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID }}
        run: |
          test "${#BETA_MAINTENANCE_BYPASS_SECRET}" -ge 43
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}"
          test -n "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID}"
          node - <<'NODE'
          const cidrs = (process.env.STARGATE_EGRESS_IPV4_CIDRS ?? "")
            .split(",").map((value) => value.trim()).filter(Boolean);
          const validCidrs = cidrs.length > 0 && cidrs.every((cidr) => {
            const match = /^(\d{1,3}(?:\.\d{1,3}){3})\/(\d|[12]\d|3[0-2])$/.exec(cidr);
            return match && match[1].split(".").every((octet) => Number(octet) <= 255);
          });
          if (!validCidrs) throw new Error("STARGATE_EGRESS_IPV4_CIDRS is invalid");

          const keyId = process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID ?? "";
          if (!/^[A-Za-z0-9._-]{1,128}$/.test(keyId)) {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEY_ID is invalid");
          }
          let keys;
          try {
            keys = JSON.parse(process.env.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON ?? "");
          } catch {
            throw new Error("WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON is not valid JSON");
          }
          if (!keys || Array.isArray(keys) || typeof keys !== "object") {
            throw new Error("runtime signing keys must be a JSON object");
          }
          const entries = Object.entries(keys);
          if (entries.length < 1 || entries.length > 16) {
            throw new Error("runtime signing keys must contain between 1 and 16 keys");
          }
          for (const [id, value] of entries) {
            if (!/^[A-Za-z0-9._-]{1,128}$/.test(id)) {
              throw new Error(`runtime signing key ID is invalid: ${id}`);
            }
            if (typeof value !== "string" || !/^[A-Za-z0-9+/]{43}=$/.test(value)) {
              throw new Error(`runtime signing public key is invalid: ${id}`);
            }
            const decoded = Buffer.from(value, "base64");
            if (decoded.length !== 32 || decoded.toString("base64") !== value) {
              throw new Error(`runtime signing public key is not a canonical Ed25519 key: ${id}`);
            }
          }
          if (!Object.hasOwn(keys, keyId)) {
            throw new Error("runtime signing key map does not contain the builder key ID");
          }
          NODE

  provider-capabilities:
    name: Validate provider capability contract
    needs: preflight
    runs-on: namespace-profile-intar-dev
    environment: production
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore shared Bun cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install the root workspace
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Reject service-binding or capability drift
        working-directory: ${{ github.workspace }}
        run: bun run check:providers

      - name: Call both deployed services through a temporary remote binding
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
        run: >-
          bun tools/providers/probe-live-capabilities.ts
          "${RUNNER_TEMP}/provider-capabilities.json"

      - name: Retain pre-web capability evidence
        uses: actions/upload-artifact@v7
        with:
          name: pre-web-provider-capabilities-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-capabilities.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy production
    needs: provider-capabilities
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 60
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      PROVENANCE_WORKFLOW_PATH: ${{ inputs.provenance_workflow_path || '.github/workflows/website-deploy.yml' }}
      FRESH_D1_CUTOVER: ${{ inputs.fresh_d1_cutover || false }}
      FRESH_D1_CUTOVER_CONFIRMATION: ${{ inputs.fresh_d1_cutover_confirmation }}
      SOURCE_SNAPSHOT_RESET_CONFIRMATION: ${{ inputs.source_snapshot_reset_confirmation }}
      SOURCE_DATABASE_ID_INPUT: ${{ inputs.source_database_id }}
      SOURCE_DATABASE_NAME_INPUT: ${{ inputs.source_database_name }}
      TARGET_DATABASE_ID_INPUT: ${{ inputs.target_database_id }}
      TARGET_DATABASE_NAME_INPUT: ${{ inputs.target_database_name }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify deployment revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install pinned build tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-pack@0.15.0,cargo-zigbuild
          fallback: none

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Build browser scenario validator
        working-directory: ${{ github.workspace }}
        run: just generate-scenario-wasm

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install root workspace dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Build pinned learner guest tools
        id: workspace-agent
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          mkdir -p "${guest_tools_dir}"
          cp \
            "target/x86_64-unknown-linux-musl/release/intar-workspace-agent" \
            "${guest_tools_dir}/intar-workspace-agent"
          cp \
            "target/x86_64-unknown-linux-musl/release/kino" \
            "${guest_tools_dir}/kino"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino"
          agent_path="${guest_tools_dir}/intar-workspace-agent"
          kino_path="${guest_tools_dir}/kino"
          file "${agent_path}" | grep -E 'x86-64.*(static|statically linked)'
          file "${kino_path}" | grep -E 'x86-64.*(static|statically linked)'
          agent_sha="$(sha256sum "${agent_path}" | cut -d ' ' -f 1)"
          agent_size="$(stat --format='%s' "${agent_path}")"
          kino_sha="$(sha256sum "${kino_path}" | cut -d ' ' -f 1)"
          kino_size="$(stat --format='%s' "${kino_path}")"
          test "${#agent_sha}" -eq 64
          test "${agent_size}" -gt 0
          test "${#kino_sha}" -eq 64
          test "${kino_size}" -gt 0
          echo "sha256=${agent_sha}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${agent_size}" >> "${GITHUB_OUTPUT}"
          echo "kino_sha256=${kino_sha}" >> "${GITHUB_OUTPUT}"
          echo "kino_size_bytes=${kino_size}" >> "${GITHUB_OUTPUT}"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg workflow_path "${PROVENANCE_WORKFLOW_PATH}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg agent_sha256 "${agent_sha}" \
            --argjson agent_size_bytes "${agent_size}" \
            --arg agent_object_key \
              "workspace-agent/releases/${agent_sha}/intar-workspace-agent" \
            --arg kino_sha256 "${kino_sha}" \
            --argjson kino_size_bytes "${kino_size}" \
            --arg kino_object_key \
              "workspace-agent/kino/releases/${kino_sha}/kino" \
            '{
              schema_version: 1,
              repository: $repository,
              source_sha: $source_sha,
              workflow_path: $workflow_path,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              event: $event,
              ref: $ref,
              architecture: "x86_64",
              target: "x86_64-unknown-linux-musl",
              tools: {
                "intar-workspace-agent": {
                  sha256: $agent_sha256,
                  size_bytes: $agent_size_bytes,
                  r2_object_key: $agent_object_key
                },
                kino: {
                  sha256: $kino_sha256,
                  size_bytes: $kino_size_bytes,
                  r2_object_key: $kino_object_key
                }
              }
            }' > "${guest_tools_dir}/manifest.json"
          (
            cd "${guest_tools_dir}"
            sha256sum intar-workspace-agent kino > SHA256SUMS
          )

      - name: Build deployment artifact
        run: bun run build:deploy

      - name: Pin protected runtime configuration in deployment artifact
        env:
          WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON: ${{ vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
        run: |
          set -euo pipefail
          config="dist/server/wrangler.json"
          patched="${RUNNER_TEMP}/website-wrangler.json"
          jq \
            --arg keys "${WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON}" \
            '.vars.WORKSHOP_RUNTIME_BUNDLE_SIGNING_KEYS_JSON = $keys' \
            "${config}" > "${patched}"
          mv "${patched}" "${config}"

          committed_database_id="$(jq -er '
            [.d1_databases[] | select(.binding == "DB")] |
            select(length == 1) | .[0].database_id
          ' "${config}")"
          committed_database_name="$(jq -er '
            [.d1_databases[] | select(.binding == "DB")] |
            select(length == 1) | .[0].database_name
          ' "${config}")"

          source_database_id="${committed_database_id}"
          source_database_name="${committed_database_name}"
          target_database_id="${committed_database_id}"
          target_database_name="${committed_database_name}"

          if [ "${FRESH_D1_CUTOVER}" = true ]; then
            test "${FRESH_D1_CUTOVER_CONFIRMATION}" = \
              "CUT OVER FRESH DRIZZLE D1"
            test "${SOURCE_SNAPSHOT_RESET_CONFIRMATION}" = \
              "ARCHIVE SOURCE SNAPSHOT AND RESET CONTROL PLANE"
            source_database_id="${SOURCE_DATABASE_ID_INPUT}"
            source_database_name="${SOURCE_DATABASE_NAME_INPUT}"
            target_database_id="${TARGET_DATABASE_ID_INPUT}"
            target_database_name="${TARGET_DATABASE_NAME_INPUT}"
            test "${committed_database_id}" = "${target_database_id}"
            test "${committed_database_name}" = "${target_database_name}"
            test "${source_database_id}" != "${target_database_id}"
            test "${source_database_name}" != "${target_database_name}"
          else
            test -z "${FRESH_D1_CUTOVER_CONFIRMATION}"
            test -z "${SOURCE_SNAPSHOT_RESET_CONFIRMATION}"
            test -z "${SOURCE_DATABASE_ID_INPUT}"
            test -z "${SOURCE_DATABASE_NAME_INPUT}"
            test -z "${TARGET_DATABASE_ID_INPUT}"
            test -z "${TARGET_DATABASE_NAME_INPUT}"
          fi

          [[ "${source_database_id}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          [[ "${target_database_id}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          test "$(jq -er '.vars.BETA_ACCESS_MAINTENANCE // "off"' "${config}")" = off

          source_maintenance_config="dist/server/wrangler-source-maintenance.json"
          target_maintenance_config="dist/server/wrangler-target-maintenance.json"
          target_open_config="dist/server/wrangler-target-open.json"
          jq \
            --arg database_id "${source_database_id}" \
            --arg database_name "${source_database_name}" '
              .d1_databases |= map(
                if .binding == "DB" then
                  .database_id = $database_id | .database_name = $database_name
                else . end
              ) |
              .vars.BETA_ACCESS_MAINTENANCE = "on"
            ' "${config}" > "${source_maintenance_config}"
          jq '.vars.BETA_ACCESS_MAINTENANCE = "on"' \
            "${config}" > "${target_maintenance_config}"
          cp "${config}" "${target_open_config}"

          jq -e \
            --arg database_id "${target_database_id}" \
            --arg database_name "${target_database_name}" \
            --arg session_namespace_id "${SESSION_KV_NAMESPACE_ID}" '
              ([.d1_databases[] | select(.binding == "DB")]) as $databases |
              ([.kv_namespaces[] | select(.binding == "SESSION")]) as $sessions |
              ($databases | length) == 1 and
              $databases[0].database_id == $database_id and
              $databases[0].database_name == $database_name and
              ($sessions | length) == 1 and
              $sessions[0].id == $session_namespace_id
            ' "${config}" >/dev/null

          {
            printf 'SOURCE_DATABASE_ID=%s\n' "${source_database_id}"
            printf 'SOURCE_DATABASE_NAME=%s\n' "${source_database_name}"
            printf 'TARGET_DATABASE_ID=%s\n' "${target_database_id}"
            printf 'TARGET_DATABASE_NAME=%s\n' "${target_database_name}"
            printf 'SOURCE_MAINTENANCE_CONFIG=%s\n' "${source_maintenance_config}"
            printf 'TARGET_MAINTENANCE_CONFIG=%s\n' "${target_maintenance_config}"
            printf 'TARGET_OPEN_CONFIG=%s\n' "${target_open_config}"
          } >> "${GITHUB_ENV}"

          jq -n \
            --arg source_database_id "${source_database_id}" \
            --arg source_database_name "${source_database_name}" \
            --arg target_database_id "${target_database_id}" \
            --arg target_database_name "${target_database_name}" \
            --argjson fresh_d1_cutover "${FRESH_D1_CUTOVER}" \
            --argjson source_snapshot_reset_acknowledged "${FRESH_D1_CUTOVER}" \
            --arg source_sha "${GITHUB_SHA}" '
              {
                schema_version: 1,
                operation: "prepare-web-d1-deployment",
                source_sha: $source_sha,
                fresh_d1_cutover: $fresh_d1_cutover,
                source_snapshot_reset_acknowledged: $source_snapshot_reset_acknowledged,
                source_database_id: $source_database_id,
                source_database_name: $source_database_name,
                target_database_id: $target_database_id,
                target_database_name: $target_database_name,
                source_database_retained: true
              }
            ' > "${RUNNER_TEMP}/fresh-d1-cutover-attempt.json"

      - name: Recheck sole-operator window immediately before mutation
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_call|workflow_dispatch) ;;
            *) exit 1 ;;
          esac
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"
          test "${RUN_ATTEMPT}" = 1

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Publish content-addressed learner workspace agent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            sha256sum "${guest_tools_dir}/intar-workspace-agent" | cut -d ' ' -f 1
          )" = "${AGENT_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/intar-workspace-agent"
          )" = "${AGENT_SIZE_BYTES}"
          test "$(
            sha256sum "${guest_tools_dir}/kino" | cut -d ' ' -f 1
          )" = "${KINO_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/kino"
          )" = "${KINO_SIZE_BYTES}"
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/releases/${AGENT_SHA256}/intar-workspace-agent" \
            --file "${RUNNER_TEMP}/production-workshop-guest-tools/intar-workspace-agent" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/kino/releases/${KINO_SHA256}/kino" \
            --file "${RUNNER_TEMP}/production-workshop-guest-tools/kino" \
            --jurisdiction eu \
            --remote

      - name: Prove the cutover source and target identities
        if: ${{ inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/fresh-d1-target-before.json"
          bunx wrangler d1 list --json > "${result}"
          jq -e \
            --arg source_id "${SOURCE_DATABASE_ID}" \
            --arg source_name "${SOURCE_DATABASE_NAME}" \
            --arg id "${TARGET_DATABASE_ID}" \
            --arg name "${TARGET_DATABASE_NAME}" '
              type == "array" and
              ([.[] | select(
                .uuid == $source_id and
                .name == $source_name
              )] | length) == 1 and
              ([.[] | select(
                .uuid == $id and
                .name == $name and
                .jurisdiction == "eu"
              )] | length) == 1
          ' "${result}" >/dev/null

      - name: Prove the standard target is already Drizzle-managed
        if: ${{ !inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/production-d1-pre-migration-marker.json"
          expected="${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.json"
          observed="${RUNNER_TEMP}/production-d1-pre-migration-ledger.json"
          expected_manifest="${RUNNER_TEMP}/production-d1-pre-migration-expected-manifest.json"
          observed_manifest="${RUNNER_TEMP}/production-d1-pre-migration-manifest.json"
          foreign_keys="${RUNNER_TEMP}/production-d1-pre-migration-foreign-keys.json"
          generated_schema="${RUNNER_TEMP}/production-d1-pre-migration-generated-schema.json"

          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${TARGET_DATABASE_ID}" \
            --expect observed-ledger-prefix \
            --evidence "${generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "observed-ledger-prefix" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount > 0 and
              .appliedMigrationCount <= .committedMigrationCount and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${generated_schema}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'table' AND name = '__drizzle_migrations') AS drizzle_ledgers, (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'table' AND name = 'd1_migrations') AS wrangler_ledgers, (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'trigger') AS triggers, (SELECT COUNT(*) FROM sqlite_schema WHERE type = 'view') AS views" \
            --json > "${marker}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == [{
              drizzle_ledgers: 1,
              wrangler_ledgers: 0,
              triggers: 0,
              views: 0
            }]
          ' "${marker}" >/dev/null

          : > "${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.ndjson"
          while IFS=$'\t' read -r tag created_at; do
            test -n "${tag}"
            test -f "migrations/${tag}.sql"
            hash="$(sha256sum "migrations/${tag}.sql" | cut -d ' ' -f 1)"
            jq -cn \
              --arg hash "${hash}" \
              --argjson created_at "${created_at}" \
              '{hash: $hash, created_at: $created_at}' \
              >> "${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.ndjson"
          done < <(jq -r '.entries[] | [.tag, (.when | tostring)] | @tsv' \
            migrations/meta/_journal.json)
          jq -s 'sort_by(.created_at)' \
            "${RUNNER_TEMP}/production-d1-pre-migration-expected-ledger.ndjson" \
            > "${expected}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${observed}"
          jq -e --slurpfile expected "${expected}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | length) > 0 and
            (.[0].results | length) <= ($expected[0] | length) and
            .[0].results == $expected[0][0:(.[0].results | length)]
          ' "${observed}" >/dev/null

          applied_migration_count="$(jq -er '.[0].results | length' "${observed}")"
          pre_migration_snapshot_index="$(jq -er \
            --argjson entry "$((applied_migration_count - 1))" \
            '.entries[$entry].idx' migrations/meta/_journal.json)"
          printf -v pre_migration_snapshot_path \
            'migrations/meta/%04d_snapshot.json' \
            "${pre_migration_snapshot_index}"
          test -f "${pre_migration_snapshot_path}"
          jq '
            [
              (.tables | to_entries[] | {
                type: "table", name: .key, table_name: .key
              }),
              (.tables | to_entries[] | . as $table |
                (($table.value.indexes // {}) | keys[]) | {
                  type: "index", name: ., table_name: $table.key
                })
            ] + [{
              type: "table",
              name: "__drizzle_migrations",
              table_name: "__drizzle_migrations"
            }] | sort_by(.type, .name, .table_name)
          ' "${pre_migration_snapshot_path}" > "${expected_manifest}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${observed_manifest}"
          jq -e --slurpfile expected "${expected_manifest}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0] and
            ([.[0].results[] | select(.type == "trigger" or .type == "view")] | length) == 0 and
            ([.[0].results[] | select(.name == "d1_migrations")] | length) == 0
          ' "${observed_manifest}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "PRAGMA foreign_key_check" \
            --json > "${foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${foreign_keys}" >/dev/null

      - name: Apply the generated Drizzle migration stream to the target D1
        if: ${{ !inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIZZLE_D1_HTTP: "1"
        run: |
          set -euo pipefail
          export CLOUDFLARE_DATABASE_ID="${TARGET_DATABASE_ID}"
          bunx drizzle-kit migrate --config drizzle.config.ts 2>&1 |
            tee "${RUNNER_TEMP}/production-d1-drizzle-migrate.log"

      - name: Verify the exact Drizzle schema and migration ledger
        if: ${{ !inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          generated_schema="${RUNNER_TEMP}/production-d1-generated-schema.json"
          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${TARGET_DATABASE_ID}" \
            --expect full \
            --evidence "${generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "full" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount == .committedMigrationCount and
              .appliedMigrationCount > 0 and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${generated_schema}" >/dev/null
          expected_ledger="${RUNNER_TEMP}/production-d1-expected-ledger.json"
          ledger="${RUNNER_TEMP}/production-d1-ledger.json"
          expected_manifest="${RUNNER_TEMP}/production-d1-expected-manifest.json"
          manifest="${RUNNER_TEMP}/production-d1-manifest.json"
          foreign_keys="${RUNNER_TEMP}/production-d1-foreign-keys.json"

          : > "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson"
          while IFS=$'\t' read -r tag created_at; do
            test -n "${tag}"
            test -f "migrations/${tag}.sql"
            hash="$(sha256sum "migrations/${tag}.sql" | cut -d ' ' -f 1)"
            jq -cn \
              --arg hash "${hash}" \
              --argjson created_at "${created_at}" \
              '{hash: $hash, created_at: $created_at}' \
              >> "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson"
          done < <(jq -r '.entries[] | [.tag, (.when | tostring)] | @tsv' \
            migrations/meta/_journal.json)
          jq -s 'sort_by(.created_at)' \
            "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson" \
            > "${expected_ledger}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${ledger}"
          jq -e --slurpfile expected "${expected_ledger}" '
            length == 1 and
            .[0].success == true and
            .[0].results == $expected[0] and
            (.[0].results | length) > 0
          ' "${ledger}" >/dev/null

          final_snapshot_index="$(jq -er '.entries[-1].idx' \
            migrations/meta/_journal.json)"
          printf -v final_snapshot_path \
            'migrations/meta/%04d_snapshot.json' "${final_snapshot_index}"
          test -f "${final_snapshot_path}"
          jq '
            [
              (.tables | to_entries[] | {
                type: "table", name: .key, table_name: .key
              }),
              (.tables | to_entries[] | . as $table |
                (($table.value.indexes // {}) | keys[]) | {
                  type: "index", name: ., table_name: $table.key
                })
            ] + [{
              type: "table",
              name: "__drizzle_migrations",
              table_name: "__drizzle_migrations"
            }] | sort_by(.type, .name, .table_name)
          ' "${final_snapshot_path}" > "${expected_manifest}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${manifest}"
          jq -e --slurpfile expected "${expected_manifest}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0] and
            ([.[0].results[] | select(.type == "trigger" or .type == "view")] | length) == 0 and
            ([.[0].results[] | select(.name == "d1_migrations")] | length) == 0
          ' "${manifest}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "PRAGMA foreign_key_check" \
            --json > "${foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${foreign_keys}" >/dev/null

      - name: Verify the prepared cutover target Drizzle state
        if: ${{ inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          generated_schema="${RUNNER_TEMP}/production-d1-generated-schema.json"
          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${TARGET_DATABASE_ID}" \
            --expect full \
            --evidence "${generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "full" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount == .committedMigrationCount and
              .appliedMigrationCount > 0 and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${generated_schema}" >/dev/null
          expected_ledger="${RUNNER_TEMP}/production-d1-expected-ledger.json"
          ledger="${RUNNER_TEMP}/production-d1-ledger.json"
          expected_manifest="${RUNNER_TEMP}/production-d1-expected-manifest.json"
          manifest="${RUNNER_TEMP}/production-d1-manifest.json"
          foreign_keys="${RUNNER_TEMP}/production-d1-foreign-keys.json"

          : > "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson"
          while IFS=$'\t' read -r tag created_at; do
            test -n "${tag}"
            test -f "migrations/${tag}.sql"
            hash="$(sha256sum "migrations/${tag}.sql" | cut -d ' ' -f 1)"
            jq -cn \
              --arg hash "${hash}" \
              --argjson created_at "${created_at}" \
              '{hash: $hash, created_at: $created_at}' \
              >> "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson"
          done < <(jq -r '.entries[] | [.tag, (.when | tostring)] | @tsv' \
            migrations/meta/_journal.json)
          jq -s 'sort_by(.created_at)' \
            "${RUNNER_TEMP}/production-d1-expected-ledger.ndjson" \
            > "${expected_ledger}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${ledger}"
          jq -e --slurpfile expected "${expected_ledger}" '
            length == 1 and
            .[0].success == true and
            .[0].results == $expected[0] and
            (.[0].results | length) > 0
          ' "${ledger}" >/dev/null

          final_snapshot_index="$(jq -er '.entries[-1].idx' \
            migrations/meta/_journal.json)"
          printf -v final_snapshot_path \
            'migrations/meta/%04d_snapshot.json' "${final_snapshot_index}"
          test -f "${final_snapshot_path}"
          jq '
            [
              (.tables | to_entries[] | {
                type: "table", name: .key, table_name: .key
              }),
              (.tables | to_entries[] | . as $table |
                (($table.value.indexes // {}) | keys[]) | {
                  type: "index", name: ., table_name: $table.key
                })
            ] + [{
              type: "table",
              name: "__drizzle_migrations",
              table_name: "__drizzle_migrations"
            }] | sort_by(.type, .name, .table_name)
          ' "${final_snapshot_path}" > "${expected_manifest}"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${manifest}"
          jq -e --slurpfile expected "${expected_manifest}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0] and
            ([.[0].results[] | select(.type == "trigger" or .type == "view")] | length) == 0 and
            ([.[0].results[] | select(.name == "d1_migrations")] | length) == 0
          ' "${manifest}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_OPEN_CONFIG}" \
            --command "PRAGMA foreign_key_check" \
            --json > "${foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${foreign_keys}" >/dev/null

      - name: Preflight source capability quiescence
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/production-d1-source-quiescence-dry-run.json"
          bun tools/database/quiesce-production-d1-source.ts \
            --source-database-id "${SOURCE_DATABASE_ID}" \
            --confirm-source-database-id "${SOURCE_DATABASE_ID}" \
            --confirmation 'QUIESCE SOURCE CAPABILITIES' \
            --dry-run \
            --evidence "${evidence}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg source_database_id "${SOURCE_DATABASE_ID}" '
              .version == 1 and
              .mode == "dry-run" and
              .status == "quiescence_preflight_passed" and
              .accountId == $account_id and
              .sourceDatabaseId == $source_database_id and
              (.before | type) == "array" and
              all(.before[]; .quiesceable == true or .count == 0) and
              .after == null and
              .changes == {
                agentBootstrapTokensRevoked: 0,
                workshopRegistryTokensRevoked: 0,
                hostActualStateDeleted: 0
              }
            ' \
            "${evidence}" >/dev/null

      - name: Retain production D1 migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-d1-drizzle-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-d1-cutover-attempt.json
            ${{ runner.temp }}/fresh-d1-target-before.json
            ${{ runner.temp }}/production-d1-pre-migration-*.json
            ${{ runner.temp }}/production-d1-drizzle-migrate.log
            ${{ runner.temp }}/production-d1-expected-ledger.json
            ${{ runner.temp }}/production-d1-ledger.json
            ${{ runner.temp }}/production-d1-expected-manifest.json
            ${{ runner.temp }}/production-d1-manifest.json
            ${{ runner.temp }}/production-d1-foreign-keys.json
            ${{ runner.temp }}/production-d1-generated-schema.json
            ${{ runner.temp }}/production-d1-source-quiescence*.json
            ${{ runner.temp }}/production-d1-copy-dry-run.json
          if-no-files-found: error
          retention-days: 90

      - name: Prepare ephemeral Worker activation secrets
        id: activation_secrets
        working-directory: ${{ github.workspace }}
        env:
          BETA_MAINTENANCE_BYPASS_SECRET: ${{ secrets.BETA_MAINTENANCE_BYPASS_SECRET }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
        run: |
          set -euo pipefail
          test "${#BETA_MAINTENANCE_BYPASS_SECRET}" -ge 43
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          secrets_file="${RUNNER_TEMP}/website-runtime-secrets.json"
          jq -n '{
            BETA_MAINTENANCE_BYPASS_SECRET: env.BETA_MAINTENANCE_BYPASS_SECRET,
            STARGATE_EGRESS_IPV4_CIDRS: env.STARGATE_EGRESS_IPV4_CIDRS
          }' \
            > "${secrets_file}"
          chmod 600 "${secrets_file}"
          printf 'ACTIVATION_SECRETS_FILE=%s\n' "${secrets_file}" \
            >> "${GITHUB_ENV}"

      - name: Capture the source D1 Time Travel bookmark
        if: ${{ inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/source-d1-time-travel-raw.json"
          evidence="${RUNNER_TEMP}/source-d1-time-travel.json"
          bunx wrangler d1 time-travel info DB \
            --config "${SOURCE_MAINTENANCE_CONFIG}" \
            --json > "${raw}"
          jq -e '
            type == "object" and
            (.bookmark | type) == "string" and
            (.bookmark | length) > 0
          ' "${raw}" >/dev/null
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg source_database_name "${SOURCE_DATABASE_NAME}" \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile observed "${raw}" '
              {
                schema_version: 1,
                operation: "capture-source-d1-time-travel-bookmark",
                source_sha: $source_sha,
                source_database_id: $source_database_id,
                source_database_name: $source_database_name,
                captured_at: $captured_at,
                bookmark: $observed[0].bookmark,
                read_only: true,
                restore_attempted: false,
                source_database_deleted: false
              }
            ' > "${evidence}"
          jq -e \
            --arg source_database_id "${SOURCE_DATABASE_ID}" '
              .operation == "capture-source-d1-time-travel-bookmark" and
              .source_database_id == $source_database_id and
              (.bookmark | type) == "string" and
              (.bookmark | length) > 0 and
              .read_only == true and
              .restore_attempted == false and
              .source_database_deleted == false
            ' "${evidence}" >/dev/null

      - name: Activate the standard exact immutable web version
        id: exact_web_activation
        if: ${{ !inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
          WEB_ACTIVATION_LABEL: standard
        run: |
          set -euo pipefail
          tools/deploy/activate-web-version.sh \
            "${TARGET_OPEN_CONFIG}" \
            "${SOURCE_DATABASE_ID}" \
            "${TARGET_DATABASE_ID}" \
            "${SESSION_KV_NAMESPACE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/exact-web-version-activation-standard.json" \
            open

      - name: Phase A - fence the source D1 behind maintenance
        id: fence_source_d1
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
          WEB_ACTIVATION_LABEL: source-maintenance
        run: |
          set -euo pipefail
          tools/deploy/activate-web-version.sh \
            "${SOURCE_MAINTENANCE_CONFIG}" \
            "${SOURCE_DATABASE_ID}" \
            "${SOURCE_DATABASE_ID}" \
            "${SESSION_KV_NAMESPACE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/exact-web-version-activation-source-maintenance.json" \
            open

      - name: Retire source capabilities under maintenance
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/production-d1-source-quiescence.json"
          bun tools/database/quiesce-production-d1-source.ts \
            --source-database-id "${SOURCE_DATABASE_ID}" \
            --confirm-source-database-id "${SOURCE_DATABASE_ID}" \
            --confirmation 'QUIESCE SOURCE CAPABILITIES' \
            --apply \
            --evidence "${evidence}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg source_database_id "${SOURCE_DATABASE_ID}" '
              .version == 1 and
              .mode == "apply" and
              .status == "source_quiesced" and
              .accountId == $account_id and
              .sourceDatabaseId == $source_database_id and
              (.before | type) == "array" and
              all(.before[]; .quiesceable == true or .count == 0) and
              (.after | type) == "array" and
              all(.after[]; .count == 0) and
              .changes.agentBootstrapTokensRevoked >= 0 and
              .changes.workshopRegistryTokensRevoked >= 0 and
              .changes.hostActualStateDeleted >= 0
            ' "${evidence}" >/dev/null

      - name: Capture the post-quiescence source bookmark
        if: ${{ inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          raw="${RUNNER_TEMP}/source-d1-time-travel-post-quiescence-raw.json"
          evidence="${RUNNER_TEMP}/source-d1-time-travel-post-quiescence.json"
          bunx wrangler d1 time-travel info DB \
            --config "${SOURCE_MAINTENANCE_CONFIG}" \
            --json > "${raw}"
          jq -e '
            type == "object" and
            (.bookmark | type) == "string" and
            (.bookmark | length) > 0
          ' "${raw}" >/dev/null
          jq -n \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg source_database_name "${SOURCE_DATABASE_NAME}" \
            --arg captured_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile observed "${raw}" '
              {
                schema_version: 1,
                operation: "capture-post-quiescence-source-bookmark",
                source_database_id: $source_database_id,
                source_database_name: $source_database_name,
                captured_at: $captured_at,
                bookmark: $observed[0].bookmark,
                source_capabilities_quiesced: true,
                read_only: true,
                restore_attempted: false,
                source_database_deleted: false
              }
            ' > "${evidence}"
          jq -e \
            --arg source_database_id "${SOURCE_DATABASE_ID}" '
              .operation == "capture-post-quiescence-source-bookmark" and
              .source_database_id == $source_database_id and
              (.bookmark | type) == "string" and
              (.bookmark | length) > 0 and
              .source_capabilities_quiesced == true and
              .read_only == true and
              .restore_attempted == false and
              .source_database_deleted == false
            ' "${evidence}" >/dev/null

      - name: Dry-run the allowlisted production D1 copy
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bun tools/database/copy-production-d1.ts \
            --source-database-id "${SOURCE_DATABASE_ID}" \
            --target-database-id "${TARGET_DATABASE_ID}" \
            --dry-run \
            --evidence "${RUNNER_TEMP}/production-d1-copy-dry-run.json"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg target_database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .mode == "dry-run" and
              .status == "preflight_passed" and
              .accountId == $account_id and
              .sourceDatabaseId == $source_database_id and
              .targetDatabaseId == $target_database_id and
              .sourceDatabaseId != .targetDatabaseId and
              .schema.foreignKeyViolations == 0 and
              .schema.triggers == 0 and
              .schema.views == 0 and
              all(.sourceGates[]; .count == 0) and
              (.sourceBefore | type) == "object" and
              (.sourceAllBefore | type) == "object" and
              .sourceAllAfter == null and
              .sourceAfter == null and
              .targetAfter == null
            ' \
            "${RUNNER_TEMP}/production-d1-copy-dry-run.json" >/dev/null

      - name: Copy the allowlisted durable production data
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bun tools/database/copy-production-d1.ts \
            --source-database-id "${SOURCE_DATABASE_ID}" \
            --target-database-id "${TARGET_DATABASE_ID}" \
            --apply \
            --evidence "${RUNNER_TEMP}/production-d1-copy.json"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg target_database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .mode == "apply" and
              .status == "copy_verified" and
              .accountId == $account_id and
              .sourceDatabaseId == $source_database_id and
              .targetDatabaseId == $target_database_id and
              .sourceDatabaseId != .targetDatabaseId and
              .schema.foreignKeyViolations == 0 and
              .schema.triggers == 0 and
              .schema.views == 0 and
              all(.sourceGates[]; .count == 0) and
              (.sourceBefore | type) == "object" and
              (.sourceAllBefore | type) == "object" and
              .sourceAllAfter == .sourceAllBefore and
              .sourceAfter == .sourceBefore and
              .targetAfter == .sourceBefore and
              (.copiedRows | type) == "number" and
              .copiedRows >= 0
            ' \
            "${RUNNER_TEMP}/production-d1-copy.json" >/dev/null

      - name: Phase B - switch to the target D1 under maintenance
        id: activate_target_maintenance
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
          WEB_ACTIVATION_LABEL: target-maintenance
        run: |
          set -euo pipefail
          tools/deploy/activate-web-version.sh \
            "${TARGET_MAINTENANCE_CONFIG}" \
            "${SOURCE_DATABASE_ID}" \
            "${TARGET_DATABASE_ID}" \
            "${SESSION_KV_NAMESPACE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/exact-web-version-activation-target-maintenance.json" \
            maintenance

      - name: Verify the copied target while traffic remains fenced
        if: ${{ inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          copied_generated_schema="${RUNNER_TEMP}/production-d1-copied-generated-schema.json"
          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${TARGET_DATABASE_ID}" \
            --expect full \
            --evidence "${copied_generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "full" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount == .committedMigrationCount and
              .appliedMigrationCount > 0 and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${copied_generated_schema}" >/dev/null
          copied_manifest="${RUNNER_TEMP}/production-d1-copied-manifest.json"
          copied_foreign_keys="${RUNNER_TEMP}/production-d1-copied-foreign-keys.json"
          copied_ledger="${RUNNER_TEMP}/production-d1-copied-ledger.json"

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_MAINTENANCE_CONFIG}" \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${copied_manifest}"
          jq -e \
            --slurpfile expected "${RUNNER_TEMP}/production-d1-expected-manifest.json" '
              length == 1 and
              .[0].success == true and
              (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0]
            ' "${copied_manifest}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_MAINTENANCE_CONFIG}" \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${copied_ledger}"
          jq -e \
            --slurpfile expected "${RUNNER_TEMP}/production-d1-expected-ledger.json" '
              length == 1 and
              .[0].success == true and
              .[0].results == $expected[0]
            ' "${copied_ledger}" >/dev/null

          bunx wrangler d1 execute DB \
            --remote \
            --config "${TARGET_MAINTENANCE_CONFIG}" \
            --command "PRAGMA foreign_key_check" \
            --json > "${copied_foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${copied_foreign_keys}" >/dev/null

      - name: Prove the source stayed unchanged after Phase B
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/production-d1-source-after-phase-b.json"
          bun tools/database/copy-production-d1.ts \
            --verify-source-unchanged \
            --source-database-id "${SOURCE_DATABASE_ID}" \
            --target-database-id "${TARGET_DATABASE_ID}" \
            --copy-evidence "${RUNNER_TEMP}/production-d1-copy.json" \
            --evidence "${evidence}"
          jq -e \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg target_database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "source_unchanged_after_target_activation" and
              .sourceDatabaseId == $source_database_id and
              .targetDatabaseId == $target_database_id and
              .sourceDatabaseId != .targetDatabaseId and
              (.sourceAllExpected | type) == "object" and
              .sourceAllObserved == .sourceAllExpected
            ' "${evidence}" >/dev/null

      - name: Reconfirm the source Time Travel bookmark before Phase C
        if: ${{ inputs.fresh_d1_cutover }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="${RUNNER_TEMP}/source-d1-time-travel-post-quiescence-raw.json"
          after="${RUNNER_TEMP}/source-d1-time-travel-after-phase-b-raw.json"
          evidence="${RUNNER_TEMP}/source-d1-time-travel-after-phase-b.json"
          bunx wrangler d1 time-travel info DB \
            --config "${SOURCE_MAINTENANCE_CONFIG}" \
            --json > "${after}"
          jq -e \
            --arg bookmark "$(jq -er '.bookmark' "${before}")" '
              type == "object" and
              .bookmark == $bookmark and
              (.bookmark | length) > 0
            ' "${after}" >/dev/null
          jq -n \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg source_database_name "${SOURCE_DATABASE_NAME}" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile before "${before}" \
            --slurpfile after "${after}" '
              {
                schema_version: 1,
                operation: "verify-source-time-travel-bookmark-stable",
                source_database_id: $source_database_id,
                source_database_name: $source_database_name,
                verified_at: $verified_at,
                before_bookmark: $before[0].bookmark,
                after_bookmark: $after[0].bookmark,
                unchanged: ($before[0].bookmark == $after[0].bookmark),
                read_only: true,
                restore_attempted: false,
                source_database_deleted: false
              }
            ' > "${evidence}"
          jq -e '
            .operation == "verify-source-time-travel-bookmark-stable" and
            .before_bookmark == .after_bookmark and
            .unchanged == true and
            .read_only == true and
            .restore_attempted == false and
            .source_database_deleted == false
          ' "${evidence}" >/dev/null

      - name: Phase C - open the verified target D1
        id: open_target_d1
        if: ${{ inputs.fresh_d1_cutover }}
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_KV_NAMESPACE_ID: 87ad9df7e37e4ced900553aa1a7775a1
          WEB_ACTIVATION_LABEL: target-open
        run: |
          set -euo pipefail
          tools/deploy/activate-web-version.sh \
            "${TARGET_OPEN_CONFIG}" \
            "${TARGET_DATABASE_ID}" \
            "${TARGET_DATABASE_ID}" \
            "${SESSION_KV_NAMESPACE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/exact-web-version-activation-target-open.json" \
            maintenance

          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg source_database_name "${SOURCE_DATABASE_NAME}" \
            --arg target_database_id "${TARGET_DATABASE_ID}" \
            --arg target_database_name "${TARGET_DATABASE_NAME}" \
            --slurpfile source_maintenance \
              "${RUNNER_TEMP}/exact-web-version-activation-source-maintenance.json" \
            --slurpfile copy "${RUNNER_TEMP}/production-d1-copy.json" \
            --slurpfile target_maintenance \
              "${RUNNER_TEMP}/exact-web-version-activation-target-maintenance.json" \
            --slurpfile target_open \
              "${RUNNER_TEMP}/exact-web-version-activation-target-open.json" \
            --slurpfile source_time_travel \
              "${RUNNER_TEMP}/source-d1-time-travel.json" \
            --slurpfile source_quiescence \
              "${RUNNER_TEMP}/production-d1-source-quiescence.json" \
            --slurpfile source_stability_baseline \
              "${RUNNER_TEMP}/source-d1-time-travel-post-quiescence.json" \
            --slurpfile source_after_phase_b \
              "${RUNNER_TEMP}/production-d1-source-after-phase-b.json" \
            --slurpfile source_time_travel_after_phase_b \
              "${RUNNER_TEMP}/source-d1-time-travel-after-phase-b.json" '
              {
                schema_version: 1,
                operation: "fresh-drizzle-d1-cutover",
                source_sha: $source_sha,
                source_database_id: $source_database_id,
                source_database_name: $source_database_name,
                target_database_id: $target_database_id,
                target_database_name: $target_database_name,
                source_snapshot_reset_acknowledged: true,
                source_database_retained: true,
                source_database_deleted: false,
                source_time_travel: $source_time_travel[0],
                source_quiescence: $source_quiescence[0],
                source_stability_baseline: $source_stability_baseline[0],
                source_after_phase_b: $source_after_phase_b[0],
                source_time_travel_after_phase_b: $source_time_travel_after_phase_b[0],
                phase_a_source_maintenance: $source_maintenance[0],
                durable_data_copy: $copy[0],
                phase_b_target_maintenance: $target_maintenance[0],
                phase_c_target_open: $target_open[0]
              }
            ' > "${RUNNER_TEMP}/fresh-d1-cutover.json"

          jq -e \
            --arg source_database_id "${SOURCE_DATABASE_ID}" \
            --arg target_database_id "${TARGET_DATABASE_ID}" '
              .operation == "fresh-drizzle-d1-cutover" and
              .source_database_id == $source_database_id and
              .target_database_id == $target_database_id and
              .source_database_id != .target_database_id and
              .source_snapshot_reset_acknowledged == true and
              .source_database_retained == true and
              .source_database_deleted == false and
              .source_time_travel.source_database_id == $source_database_id and
              .source_time_travel.read_only == true and
              .source_time_travel.restore_attempted == false and
              .source_quiescence.status == "source_quiesced" and
              .source_quiescence.sourceDatabaseId == $source_database_id and
              all(.source_quiescence.after[]; .count == 0) and
              .source_stability_baseline.operation == "capture-post-quiescence-source-bookmark" and
              .source_stability_baseline.source_database_id == $source_database_id and
              .source_stability_baseline.source_capabilities_quiesced == true and
              .source_after_phase_b.status == "source_unchanged_after_target_activation" and
              .source_after_phase_b.sourceDatabaseId == $source_database_id and
              .source_after_phase_b.targetDatabaseId == $target_database_id and
              .source_after_phase_b.sourceAllObserved == .source_after_phase_b.sourceAllExpected and
              .source_time_travel_after_phase_b.unchanged == true and
              .source_time_travel_after_phase_b.before_bookmark == .source_stability_baseline.bookmark and
              .source_time_travel_after_phase_b.before_bookmark == .source_time_travel_after_phase_b.after_bookmark and
              .phase_a_source_maintenance.after_health_proven == true and
              .durable_data_copy.version == 1 and
              .durable_data_copy.mode == "apply" and
              .durable_data_copy.status == "copy_verified" and
              .durable_data_copy.sourceDatabaseId == $source_database_id and
              .durable_data_copy.targetDatabaseId == $target_database_id and
              .durable_data_copy.sourceAllAfter == .durable_data_copy.sourceAllBefore and
              .durable_data_copy.sourceAfter == .durable_data_copy.sourceBefore and
              .durable_data_copy.targetAfter == .durable_data_copy.sourceBefore and
              .phase_b_target_maintenance.after_health_proven == true and
              .phase_c_target_open.after_health_proven == true
            ' "${RUNNER_TEMP}/fresh-d1-cutover.json" >/dev/null

      - name: Remove ephemeral Worker activation secrets
        if: ${{ always() && steps.activation_secrets.outcome != 'skipped' }}
        working-directory: ${{ github.workspace }}
        run: rm -f "${RUNNER_TEMP}/website-runtime-secrets.json"

      - name: Retain exact web-version activation attempt
        if: ${{ always() && steps.activation_secrets.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: exact-web-version-attempt-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-d1-cutover-attempt.json
            ${{ runner.temp }}/fresh-d1-cutover.json
            ${{ runner.temp }}/production-d1-copy*.json
            ${{ runner.temp }}/production-d1-source-quiescence*.json
            ${{ runner.temp }}/production-d1-copied-*.json
            ${{ runner.temp }}/production-d1-source-after-phase-b.json
            ${{ runner.temp }}/source-d1-time-travel*.json
            ${{ runner.temp }}/exact-web-version-activation-*.json
            ${{ runner.temp }}/intar-web-deploy-${{ github.run_id }}-*/
          if-no-files-found: error
          retention-days: 90

      - name: Queue the exact scenario source bundle
        working-directory: ${{ github.workspace }}
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          beta_maintenance="$(
            jq -er '.vars.BETA_ACCESS_MAINTENANCE // "off"' \
              apps/web/dist/server/wrangler.json
          )"
          case "${beta_maintenance}" in
            on)
              printf 'Skipping scenario source bundle while beta access maintenance is on.\n'
              exit 0
              ;;
            off) ;;
            *)
              printf 'Invalid BETA_ACCESS_MAINTENANCE value: %s\n' \
                "${beta_maintenance}" >&2
              exit 1
              ;;
          esac
          test -n "${INTAR_IMAGE_PUBLISH_TOKEN}"
          revision="${GITHUB_SHA:0:12}"
          just bundle-images \
            broken-nginx \
            builder.sample.amd64.hcl \
            "${revision}" \
            false \
            "https://intar.dev/registry/v1/bundles"

      - name: Recheck production guest tools before retention
        env:
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          test "$(
            sha256sum "${guest_tools_dir}/intar-workspace-agent" | cut -d ' ' -f 1
          )" = "${AGENT_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/intar-workspace-agent"
          )" = "${AGENT_SIZE_BYTES}"
          test "$(
            sha256sum "${guest_tools_dir}/kino" | cut -d ' ' -f 1
          )" = "${KINO_SHA256}"
          test "$(
            stat --format='%s' "${guest_tools_dir}/kino"
          )" = "${KINO_SIZE_BYTES}"
          chmod 0444 \
            "${guest_tools_dir}/SHA256SUMS" \
            "${guest_tools_dir}/manifest.json"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino" \
            "${guest_tools_dir}"

      - name: Preserve production guest tools for the workshop builder
        id: production_guest_tools
        uses: actions/upload-artifact@v7
        with:
          name: production-workshop-guest-tools-${{ github.sha }}
          path: ${{ runner.temp }}/production-workshop-guest-tools/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      # Keep this the final fallible step. The immutable binaries, D1
      # migrations, Worker, and retained provenance must all succeed before
      # production allocation can discover the new guest tools.
      - name: Publish current learner guest-tool manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AGENT_SHA256: ${{ steps.workspace-agent.outputs.sha256 }}
          AGENT_SIZE_BYTES: ${{ steps.workspace-agent.outputs.size_bytes }}
          KINO_SHA256: ${{ steps.workspace-agent.outputs.kino_sha256 }}
          KINO_SIZE_BYTES: ${{ steps.workspace-agent.outputs.kino_size_bytes }}
        run: |
          set -euo pipefail
          object_path="intar-dev-vm-image-registry-20260709/workspace-agent/releases/current.json"
          desired="${RUNNER_TEMP}/workspace-agent-current.json"
          observed="${RUNNER_TEMP}/workspace-agent-current-observed.json"
          jq -n \
            --arg sha256 "${AGENT_SHA256}" \
            --argjson size_bytes "${AGENT_SIZE_BYTES}" \
            --arg kino_sha256 "${KINO_SHA256}" \
            --argjson kino_size_bytes "${KINO_SIZE_BYTES}" \
            '{schema_version: 2, sha256: $sha256, size_bytes: $size_bytes, kino_sha256: $kino_sha256, kino_size_bytes: $kino_size_bytes}' \
            > "${desired}"

          pointer_verified=false
          for attempt in 1 2 3; do
            rm -f "${observed}"
            bunx wrangler r2 object put "${object_path}" \
              --file "${desired}" \
              --content-type "application/json" \
              --jurisdiction eu \
              --remote || true
            if bunx wrangler r2 object get "${object_path}" \
              --file "${observed}" \
              --jurisdiction eu \
              --remote &&
              cmp --silent "${desired}" "${observed}"; then
              pointer_verified=true
              break
            fi
            sleep "${attempt}"
          done
          if [ "${pointer_verified}" != true ]; then
            echo "Failed to publish and read back the exact learner guest-tool pointer." >&2
            exit 1
          fi
