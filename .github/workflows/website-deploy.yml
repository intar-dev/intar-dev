name: Website Validate and Deploy
run-name: "${{ github.event_name == 'pull_request' && format('Website validate PR #{0}', github.event.pull_request.number) || format('Website deploy {0}', github.ref_name) }}"

on:
  pull_request:
    paths:
      - ".github/workflows/website-deploy.yml"
      - "website/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/website-deploy.yml"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WEBSITE_DIR: website

jobs:
  build-deploy:
    name: Build and deploy website
    runs-on: namespace-profile-intar-dev
    defaults:
      run:
        working-directory: ${{ env.WEBSITE_DIR }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy --config dist/server/wrangler.json
