name: Website production

on:
  workflow_call:
    inputs:
      guest_tools_static_pin_json:
        description: Verified ABI 2 guest-tools pin for this release
        required: true
        type: string
      maintenance:
        description: Hold control-plane maintenance for the cutover window (on), return the release to service (off), or follow pending migrations (auto)
        required: false
        default: auto
        type: string
      website_dist_run_id:
        description: Run ID of the successful Website validate run that produced website-dist-<sha>
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  deploy:
    name: Deploy production
    runs-on: namespace-profile-intar-dev
    environment:
      name: production
      url: https://intar.dev
    timeout-minutes: 30

    steps:
      - name: Checkout exact main revision
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Verify exact-main deployment revision
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          # Only the coordinated cutover lane may deploy. The automatic
          # website lane validates and uploads a tested artifact, and it must
          # never deploy: a push deploy would bypass the cutover gates.
          case "${GITHUB_WORKFLOW_REF}" in
            intar-dev/intar-dev/.github/workflows/website-cutover.yml@refs/heads/main)
              test "${GITHUB_EVENT_NAME}" = workflow_dispatch
              ;;
            *)
              echo "unexpected calling workflow: ${GITHUB_WORKFLOW_REF}" >&2
              exit 1
              ;;
          esac

      - name: Download tested deployment artifact
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_DIST_RUN_ID: ${{ inputs.website_dist_run_id }}
        run: |
          set -euo pipefail
          [[ "${WEBSITE_DIST_RUN_ID}" =~ ^[0-9]{1,20}$ ]]
          artifact_name="website-dist-${GITHUB_SHA}"
          run_json="${RUNNER_TEMP}/website-dist-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WEBSITE_DIST_RUN_ID}" \
            > "${run_json}"
          # A trusted automatic push or a manual dispatch of the same
          # workflow may produce the artifact. Both must be the same main
          # revision, which the exact-SHA check below requires; a manual run
          # exists because the release workflow pushes with GITHUB_TOKEN and
          # GitHub suppresses workflow triggers for that token.
          jq -e --arg sha "${GITHUB_SHA}" --arg repository "${GITHUB_REPOSITORY}" '
            .repository.full_name == $repository and
            .head_sha == $sha and
            .head_branch == "main" and
            (.event == "push" or .event == "workflow_dispatch") and
            .conclusion == "success" and
            (.path | endswith("website.yml"))
          ' "${run_json}" >/dev/null
          artifacts_json="${RUNNER_TEMP}/website-dist-artifacts.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${WEBSITE_DIST_RUN_ID}/artifacts" \
            > "${artifacts_json}"
          jq -e --arg name "${artifact_name}" '
            [.artifacts[] | select(.name == $name and .expired == false)] |
            if length == 1 then
              .[0] as $artifact |
              ($artifact.id | type == "number") and
              ($artifact.digest |
                type == "string" and test("^sha256:[0-9a-f]{64}$"))
            else false end
          ' "${artifacts_json}" >/dev/null
          artifact_id="$(jq -er --arg name "${artifact_name}" '[.artifacts[] | select(.name == $name)] | .[0].id' "${artifacts_json}")"
          expected_digest="$(jq -er --arg name "${artifact_name}" '[.artifacts[] | select(.name == $name)] | .[0].digest' "${artifacts_json}" | cut -d: -f2)"
          artifact_zip="${RUNNER_TEMP}/website-dist.zip"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${artifact_zip}"
          measured_digest="$(sha256sum "${artifact_zip}" | cut -d ' ' -f 1)"
          test "${measured_digest}" = "${expected_digest}"
          mkdir -p apps/web/dist
          python3 - "${artifact_zip}" "${GITHUB_WORKSPACE}/apps/web/dist" <<'PY'
          import sys, zipfile
          archive_path, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              for name in archive.namelist():
                  if name.startswith("/") or ".." in name.split("/"):
                      sys.exit("unsafe artifact member: " + name)
              archive.extractall(destination)
          PY
          test -f "${GITHUB_WORKSPACE}/apps/web/dist/server/wrangler.json"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Bun cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Install deployment dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Pin and verify production configuration
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/apps/web/dist/server/wrangler.json"
          test -f "${config}"
          database_id="$(jq -er '
            [.d1_databases[] | select(.binding == "DB")] |
            select(length == 1) | .[0].database_id
          ' "${config}")"
          [[ "${database_id}" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          jq -e \
            --arg database_id "${database_id}" '
              ([.d1_databases[] | select(.binding == "DB")]) as $databases |
              .name == "intar-dev" and
              .vars.CONTROL_PLANE_MAINTENANCE == "off" and
              ($databases | length) == 1 and
              $databases[0].database_id == $database_id and
              ([.kv_namespaces[]? | select(.binding == "SESSION")] | length) == 0 and
              .assets.directory == "../client" and
              .assets.run_worker_first == ["/api/*"]
            ' "${config}" >/dev/null
          test -f "${GITHUB_WORKSPACE}/apps/web/dist/client/favicon.svg"
          test -f "${GITHUB_WORKSPACE}/apps/web/dist/client/_headers"
          {
            printf 'DATABASE_ID=%s\n' "${database_id}"
            printf 'DEPLOYMENT_CONFIG=%s\n' "${config}"
          } >> "${GITHUB_ENV}"

      - name: Inject the verified ABI 2 guest-tools pin
        working-directory: ${{ github.workspace }}
        env:
          GUEST_TOOLS_PIN_JSON: ${{ inputs.guest_tools_static_pin_json }}
          MAINTENANCE_MODE: ${{ inputs.maintenance }}
        run: |
          set -euo pipefail
          case "${MAINTENANCE_MODE}" in
            auto|on|off) ;;
            *) echo "maintenance input must be auto, on, or off" >&2; exit 1 ;;
          esac
          if [ -z "${GUEST_TOOLS_PIN_JSON}" ]; then
            echo 'SCENARIO_GUEST_TOOLS_STATIC_PIN_JSON is not set.' >&2
            echo 'The ABI 2 release has no dynamic channel fallback, so the' >&2
            echo 'verified release pin must come from the release bundle.' >&2
            exit 1
          fi
          pin_file="${RUNNER_TEMP}/release-static-pin.json"
          pin_check="${RUNNER_TEMP}/release-static-pin-check.json"
          printf '%s' "${GUEST_TOOLS_PIN_JSON}" > "${pin_file}"
          bun tools/deploy/guest-tools-pin.ts check --pin "${pin_file}" > "${pin_check}"
          jq -e '.status == "valid"' "${pin_check}" >/dev/null
          jq --slurpfile pin "${pin_file}" \
            '.vars.SCENARIO_GUEST_TOOLS_STATIC_PIN_JSON = $pin[0]' \
            "${DEPLOYMENT_CONFIG}" > "${DEPLOYMENT_CONFIG}.pinned"
          mv "${DEPLOYMENT_CONFIG}.pinned" "${DEPLOYMENT_CONFIG}"
          jq -e --slurpfile pin "${pin_file}" \
            '.vars.SCENARIO_GUEST_TOOLS_STATIC_PIN_JSON == $pin[0]' \
            "${DEPLOYMENT_CONFIG}" >/dev/null
          printf 'deployment pin sha256: %s\n' \
            "$(jq -er '.static_pin_sha256' "${pin_check}")"
          {
            printf 'MAINTENANCE_MODE=%s\n' "${MAINTENANCE_MODE}"
          } >> "${GITHUB_ENV}"

      - name: Prepare runtime secrets
        id: runtime-secrets
        working-directory: ${{ github.workspace }}
        env:
          ACCESS_INVITE_TOKEN_ENCRYPTION_KEY_V1: ${{ secrets.ACCESS_INVITE_TOKEN_ENCRYPTION_KEY_V1 }}
          CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET: ${{ secrets.CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET }}
          OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: ${{ secrets.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1 }}
          STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
        run: |
          set -euo pipefail
          [[ "${ACCESS_INVITE_TOKEN_ENCRYPTION_KEY_V1}" =~ ^[A-Za-z0-9_-]{43}$ ]]
          bun -e 'const value = process.env.ACCESS_INVITE_TOKEN_ENCRYPTION_KEY_V1 ?? ""; const decoded = Buffer.from(value, "base64url"); if (decoded.byteLength !== 32 || decoded.toString("base64url") !== value) process.exit(1)'
          test "${#CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET}" -ge 43
          test -n "${OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1}"
          test -n "${STARGATE_EGRESS_IPV4_CIDRS}"
          secrets_file="${RUNNER_TEMP}/website-runtime-secrets.json"
          jq -n '{
            ACCESS_INVITE_TOKEN_ENCRYPTION_KEY_V1: env.ACCESS_INVITE_TOKEN_ENCRYPTION_KEY_V1,
            CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET: env.CONTROL_PLANE_MAINTENANCE_BYPASS_SECRET,
            OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1: env.OIDC_SSO_CONFIG_ENCRYPTION_KEY_V1,
            STARGATE_EGRESS_IPV4_CIDRS: env.STARGATE_EGRESS_IPV4_CIDRS
          }' > "${secrets_file}"
          chmod 600 "${secrets_file}"
          printf 'ACTIVATION_SECRETS_FILE=%s\n' "${secrets_file}" \
            >> "${GITHUB_ENV}"

      - name: Plan production D1 migrations
        id: migrations
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/production-d1-plan.json"
          bun tools/database/verify-generated-d1-schema.ts \
            --database-id "${DATABASE_ID}" \
            --expect observed-ledger-prefix \
            --evidence "${evidence}"
          applied="$(jq -er '.appliedMigrationCount' "${evidence}")"
          committed="$(jq -er '.committedMigrationCount' "${evidence}")"
          [[ "${applied}" =~ ^[1-9][0-9]*$ ]]
          [[ "${committed}" =~ ^[1-9][0-9]*$ ]]
          test "${applied}" -le "${committed}"
          if [ "${applied}" -lt "${committed}" ]; then
            pending=true
          else
            pending=false
          fi
          {
            printf 'pending=%s\n' "${pending}"
            printf 'applied=%s\n' "${applied}"
            printf 'committed=%s\n' "${committed}"
          } >> "${GITHUB_OUTPUT}"
          printf 'd1_applied=%s d1_committed=%s d1_pending=%s\n' \
            "${applied}" "${committed}" "${pending}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Rehearse pending migrations on disposable D1
        if: steps.migrations.outputs.pending == 'true'
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Step outputs travel through the environment, never interpolated
          # into the command line.
          APPLIED_MIGRATION_COUNT: ${{ steps.migrations.outputs.applied }}
        run: |
          bun tools/database/rehearse-removal-migration.ts \
            --applied "$APPLIED_MIGRATION_COUNT" \
            --evidence "${RUNNER_TEMP}/d1-removal-rehearsal.json"

      - name: Capture pre-migration D1 evidence
        if: steps.migrations.outputs.pending == 'true' || inputs.maintenance != 'auto'
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Both cutover operations, the pin deploy and the return to service,
          # require the drained gate and a whole-fleet zero state. The normal
          # migration path keeps only its original run and artifact checks.
          REQUIRE_DRAINED_GATE: ${{ inputs.maintenance != 'auto' }}
        run: |
          set -euo pipefail
          d1_info="${RUNNER_TEMP}/production-d1-info.json"
          bookmark="${RUNNER_TEMP}/production-d1-bookmark.json"
          run_drain_audit="${RUNNER_TEMP}/pre-migration-run-drain-audit.json"
          assignment_counts="${RUNNER_TEMP}/pre-migration-assignment-counts.json"
          enabled_scenarios="${RUNNER_TEMP}/pre-migration-enabled-scenarios.json"
          query_request="${RUNNER_TEMP}/pre-migration-d1-query-request.json"

          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}" \
            > "${d1_info}"
          jq -e --arg database_id "${DATABASE_ID}" '
            .success == true and
            .result.uuid == $database_id and
            (.result.name | type == "string" and length > 0) and
            .result.version == "production"
          ' "${d1_info}" >/dev/null

          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/time_travel/bookmark" \
            > "${bookmark}"
          jq -e '
            .success == true and
            (.result.bookmark | type == "string" and
            test("^[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}$")
            )
          ' "${bookmark}" >/dev/null

          d1_readonly_query() {
            local sql="$1"
            local evidence="$2"
            jq -cn --arg sql "${sql}" '{sql: $sql, params: []}' \
              > "${query_request}"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary "@${query_request}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query" \
              > "${evidence}"
            jq -e '
              .success == true and
              (.result | type == "array" and length == 1) and
              .result[0].success == true and
              (.result[0].results | type == "array")
            ' "${evidence}" >/dev/null
          }

          run_drain_sql="SELECT
              -- Evidence only for the enabled-host count: the cutover keeps the
              -- host enabled while the fleet gate is drained, so an admin proof
              -- run can be placed. The gate state and the two zero counts are
              -- the enforced conditions.
              (SELECT COUNT(*) FROM scenario_runs
                WHERE hidden_at IS NULL AND
                  (active_key IS NOT NULL OR state NOT IN ('completed', 'failed')))
                AS active_scenario_run_count,
              (SELECT COUNT(*) FROM scenario_run_artifacts
                WHERE upload_status <> 'uploaded')
                AS non_uploaded_run_artifact_count,
              (SELECT COUNT(*) FROM agent_hosts
                WHERE role = 'agent' AND disabled = 0)
                AS enabled_agent_host_count,
              (SELECT state FROM runtime_operation_gates
                WHERE key = 'image_cutover')
                AS cutover_gate_state;"
          d1_readonly_query "${run_drain_sql}" "${run_drain_audit}"
          jq -e --argjson require_drained "${REQUIRE_DRAINED_GATE}" '
            (.result[0].results | length == 1) and
            .result[0].results[0].active_scenario_run_count == 0 and
            .result[0].results[0].non_uploaded_run_artifact_count == 0 and
            (if $require_drained then
              .result[0].results[0].cutover_gate_state == "drained"
            else true end)
          ' "${run_drain_audit}" >/dev/null

          assignment_counts_sql='SELECT organization_id, scenario_id,
              COUNT(*) AS assignment_count
            FROM scenario_assignments
            GROUP BY organization_id, scenario_id
            ORDER BY organization_id, scenario_id;'
          d1_readonly_query "${assignment_counts_sql}" "${assignment_counts}"

          enabled_scenarios_sql="SELECT scenario_id,
              CASE
                WHEN organization_id IS NULL THEN 'public'
                ELSE 'organization:' || organization_id
              END AS scope_key
            FROM vm_scenarios
            WHERE enabled = 1
            ORDER BY scope_key, scenario_id;"
          d1_readonly_query "${enabled_scenarios_sql}" "${enabled_scenarios}"

      - name: Prepare maintenance configuration
        if: steps.migrations.outputs.pending == 'true' || inputs.maintenance == 'on'
        run: |
          set -euo pipefail
          config_dir="$(cd "$(dirname "${DEPLOYMENT_CONFIG}")" && pwd)"
          maintenance_config="${config_dir}/wrangler-maintenance.json"
          test ! -e "${maintenance_config}"
          jq '.vars.CONTROL_PLANE_MAINTENANCE = "on"' \
            "${DEPLOYMENT_CONFIG}" > "${maintenance_config}"
          jq -e '.vars.CONTROL_PLANE_MAINTENANCE == "on"' \
            "${maintenance_config}" >/dev/null
          printf 'MAINTENANCE_DEPLOYMENT_CONFIG=%s\n' "${maintenance_config}" \
            >> "${GITHUB_ENV}"
          if [ "${MAINTENANCE_MODE}" = on ]; then
            # The cutover holds the control plane closed for the whole window.
            # The candidate deploy must not reopen it: the runtime gates reopen
            # in order, and only then does a maintenance-off deploy run.
            printf 'DEPLOYMENT_CONFIG=%s\n' "${maintenance_config}" \
              >> "${GITHUB_ENV}"
          fi

      - name: Enable maintenance for pending migrations
        if: steps.migrations.outputs.pending == 'true' || inputs.maintenance == 'on'
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_DEPLOY_LABEL: maintenance
        run: |
          tools/deploy/deploy-web.sh \
            "${MAINTENANCE_DEPLOYMENT_CONFIG}" \
            "${DATABASE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/web-maintenance.json"

      - name: Drain and recheck maintenance
        if: steps.migrations.outputs.pending == 'true' || inputs.maintenance == 'on'
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          sleep 30
          expected_version_id="$(jq -er '.deployed_version_id' \
            "${RUNNER_TEMP}/web-maintenance.json")"
          deployment="${RUNNER_TEMP}/maintenance-after-drain-deployment.json"
          bunx wrangler deployments status --name intar-dev --json \
            > "${deployment}"
          jq -e --arg expected_version_id "${expected_version_id}" '
            .versions | length == 1 and
            .[0].version_id == $expected_version_id and
            .[0].percentage == 100
          ' "${deployment}" >/dev/null
          root_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' https://intar.dev/)"
          probe="${RUNNER_TEMP}/maintenance-after-drain.json"
          probe_status="$(curl --silent --show-error \
            --header 'Accept: application/json' --output "${probe}" \
            --write-out '%{http_code}' \
            https://intar.dev/api/control-plane-maintenance-probe)"
          test "${root_status}" = 503
          test "${probe_status}" = 503
          test "$(jq -er '.code' "${probe}")" = maintenance

      - name: Apply pending D1 migrations
        if: steps.migrations.outputs.pending == 'true'
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DATABASE_ID: ${{ env.DATABASE_ID }}
          MIGRATION_APPLY_EVIDENCE: ${{ runner.temp }}/production-d1-migrate.json
        run: |
          set -euo pipefail
          bun tools/database/apply-generated-migrations.ts 2>&1 | \
            tee "${RUNNER_TEMP}/production-d1-migrate.log"

      - name: Verify production D1 schema
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/production-d1-verified.json"
          bun tools/database/verify-generated-d1-schema.ts \
            --database-id "${DATABASE_ID}" \
            --expect full \
            --evidence "${evidence}"
          jq -e '
            .status == "exact_generated_schema_verified" and
            .expectation == "full" and
            .appliedMigrationCount == .committedMigrationCount and
            .foreignKeyViolations == 0 and
            .triggers == 0 and
            .views == 0
          ' "${evidence}" >/dev/null

      - name: Deploy production at 100 percent
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WEB_DEPLOY_LABEL: standard
        run: |
          tools/deploy/deploy-web.sh \
            "${DEPLOYMENT_CONFIG}" \
            "${DATABASE_ID}" \
            "${ACTIVATION_SECRETS_FILE}" \
            "${RUNNER_TEMP}/web-production.json"

      - name: Remove runtime secret file
        if: always() && steps.runtime-secrets.outcome != 'skipped'
        working-directory: ${{ github.workspace }}
        run: rm -f "${RUNNER_TEMP}/website-runtime-secrets.json"

      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-production-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-d1-plan.json
            ${{ runner.temp }}/d1-removal-rehearsal.json
            ${{ runner.temp }}/production-d1-info.json
            ${{ runner.temp }}/production-d1-bookmark.json
            ${{ runner.temp }}/pre-migration-run-drain-audit.json
            ${{ runner.temp }}/pre-migration-assignment-counts.json
            ${{ runner.temp }}/pre-migration-enabled-scenarios.json
            ${{ runner.temp }}/production-d1-migrate.log
            ${{ runner.temp }}/production-d1-migrate.json
            ${{ runner.temp }}/production-d1-verified.json
            ${{ runner.temp }}/maintenance-after-drain-deployment.json
            ${{ runner.temp }}/maintenance-after-drain.json
            ${{ runner.temp }}/web-maintenance.json
            ${{ runner.temp }}/web-production.json
            ${{ runner.temp }}/intar-web-deploy-${{ github.run_id }}-maintenance/
            ${{ runner.temp }}/intar-web-deploy-${{ github.run_id }}-standard/
          if-no-files-found: warn
          retention-days: 14
