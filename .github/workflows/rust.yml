name: Rust
run-name: "${{ github.event_name == 'pull_request' && format('Rust validate PR #{0}', github.event.pull_request.number) || format('Rust validate {0}', github.ref_name) }}"

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "base-images.hcl"
      - "build-tools.hcl"
      - "crates/**"
      - "scripts/import-platform-engineering-workshop.ts"
      - "scripts/check-platform-engineering-workshop-import.ts"
      - "scripts/check-platform-workshop-app-routing.ts"
      - "workshops/**"
      - "website/src/generated/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "base-images.hcl"
      - "build-tools.hcl"
      - "crates/**"
      - "scripts/import-platform-engineering-workshop.ts"
      - "scripts/check-platform-engineering-workshop-import.ts"
      - "scripts/check-platform-workshop-app-routing.ts"
      - "workshops/**"
      - "website/src/generated/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Workspace checks
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Install Bun for pinned workshop import checks
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Run workspace checks
        run: just verify

      - name: Validate and bundle reference workshop
        env:
          PINNED_REVISION: 1b6fad43551a720b143d7a52799f81c4c89455cb
        run: |
          set -euo pipefail
          bundle_root="$(mktemp -d)"
          cleanup_bundle() {
            rm -rf "${bundle_root}"
          }
          trap cleanup_bundle EXIT

          upstream_root="${bundle_root}/upstream"
          regeneration_root="${bundle_root}/regeneration"
          git init --quiet "${upstream_root}"
          git -C "${upstream_root}" remote add origin \
            https://github.com/randax/Platform-Engineering-Workshop.git
          git -C "${upstream_root}" fetch --depth=1 origin "${PINNED_REVISION}"
          git -C "${upstream_root}" checkout --quiet --detach FETCH_HEAD
          mkdir -p "${regeneration_root}"
          (
            cd "${regeneration_root}"
            bun "${GITHUB_WORKSPACE}/scripts/import-platform-engineering-workshop.ts" \
              "${upstream_root}"
          )
          bun scripts/check-platform-engineering-workshop-import.ts \
            "${regeneration_root}/workshops/platform-engineering" \
            workshops/platform-engineering
          bun scripts/check-platform-workshop-app-routing.ts \
            workshops/platform-engineering

          cargo run --locked -p intar-workshop-cli -- \
            validate workshops/platform-engineering
          cargo run --locked -p intar-workshop-cli -- \
            bundle workshops/platform-engineering \
            --output "${bundle_root}/first.tar.gz"
          cargo run --locked -p intar-workshop-cli -- \
            bundle workshops/platform-engineering \
            --output "${bundle_root}/second.tar.gz"
          cmp "${bundle_root}/first.tar.gz" "${bundle_root}/second.tar.gz"

      - name: Check generated contracts
        run: just check-generated-contracts

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

      - name: Install Zig and cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Compile kino guest
        run: just build-kino-guest

  kino-smoke:
    name: Kino Docker smoke
    runs-on: namespace-profile-intar-dev
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy

      - name: Set up Namespace caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            rust
            apt

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run smoke tests
        run: just docker-smoke
