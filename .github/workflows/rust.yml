name: Rust
run-name: "${{ github.event_name == 'pull_request' && format('Rust validate PR #{0}', github.event.pull_request.number) || format('Rust validate {0}', github.ref_name) }}"

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "content/scenarios/base-images.hcl"
      - "crates/**"
      - "apps/web/src/generated/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "content/scenarios/base-images.hcl"
      - "crates/**"
      - "apps/web/src/generated/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Workspace checks
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add --toolchain 1.97.0 rustfmt clippy
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: just@1.58.0,cargo-nextest@0.9.143

      - name: Run workspace checks
        run: just verify

      - name: Check generated contracts
        run: just check-generated-contracts

      - name: Install cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies
        run: cargo audit --deny warnings

      - name: Install Zig and cargo-zigbuild
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Compile kino guest
        run: just build-kino-guest
