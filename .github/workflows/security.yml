name: Supply-chain security
run-name: "Supply-chain security ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".cargo/audit.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "**/package.json"
      - "bun.lock"
      - "tools/ci/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".cargo/audit.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "**/package.json"
      - "bun.lock"
      - "tools/ci/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Verify dependencies and workflow policy
    runs-on: namespace-profile-intar-dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Test and enforce workflow security policy
        run: |
          bun test tools/ci/check-workflow-security.test.ts
          bun tools/ci/check-workflow-security.ts

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

      - name: Set up Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
