name: Supply-chain security
run-name: "Supply-chain security ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  pull_request:
    paths: &security_paths
      - ".github/**"
      - ".cargo/audit.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "bun.lock"
      - "**/package.json"
      - "apps/web/.node-version"
      - "apps/web/public/_headers"
      - "apps/web/vitest.workers.config.ts"
      - "apps/web/wrangler.jsonc"
      - "apps/web/wrangler.local.jsonc"
      - "deploy/stargate/**"
      - "docs/public/_headers"
      - "docs/wrangler.jsonc"
      # The Rust audit moved here from rust.yml, so this lane must still run for a
      # Rust source change: it is the only audit that sees a newly published advisory.
      - "crates/**"
      - "tools/ci/**"
      - "tools/deploy/configure-stargate-ssh.sh"
      - "tools/deploy/configure-stargate-ssh.test.ts"
      - "tools/image-build/**"
  push:
    branches:
      - main
    paths: *security_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Verify dependencies and workflow policy
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Script lint runs before the audits: a dependency audit must not stop the
      # shell correctness check of the host deployment scripts.
      - name: Validate host deployment scripts
        run: |
          set -euo pipefail
          for script in \
            deploy/stargate/scripts/intar-deploy-stargate \
            deploy/stargate/scripts/bootstrap-deploy-user \
            tools/deploy/configure-stargate-ssh.sh; do
            test -x "${script}"
            bash -n "${script}"
            shellcheck --severity=warning "${script}"
          done

      - name: Check workflow and script whitespace
        run: |
          set -euo pipefail
          if git grep -nI -E '[[:blank:]]+$' -- \
            '.github/workflows/*.yml' \
            'deploy/stargate/scripts/*' \
            'tools/deploy/configure-stargate-ssh.sh'; then
            echo 'Trailing whitespace found in a workflow or a host script.' >&2
            exit 1
          fi

      - name: Set up the CI runtime
        uses: ./.github/actions/setup-runtime

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Test and enforce workflow security policy
        run: |
          bun test tools/ci/check-workflow-security.test.ts
          bun tools/ci/check-workflow-security.ts

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=moderate

      - name: Install cargo-audit
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit Rust dependencies
        run: tools/image-build/with-libnbd-env.sh --rust-only -- cargo audit --deny warnings

      - name: Set up Go for actionlint
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Run actionlint with shellcheck
        run: |
          set -euo pipefail
          # actionlint runs shellcheck on every run block when shellcheck is on
          # PATH, and silently skips it when it is not. The shell parse is what
          # caught the quoting defect in the deploy workflow, so require the
          # binary and fail instead of quietly losing that coverage.
          command -v shellcheck >/dev/null 2>&1 || {
            echo 'shellcheck is required for the workflow lint.' >&2
            exit 1
          }
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
