name: Prepare fresh production D1
run-name: "Prepare fresh D1 ${{ inputs.target_database_name }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PREPARE FRESH DRIZZLE D1
        required: true
        type: string
      target_database_name:
        description: New unique production D1 name; its UUID will be retained as evidence
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when no independent reviewer exists
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: intar-control-plane-production
  cancel-in-progress: false
  queue: max

defaults:
  run:
    working-directory: apps/web

jobs:
  prepare:
    name: Create and verify a fresh Drizzle-managed EU D1
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 20
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_DATABASE_NAME: ${{ inputs.target_database_name }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Verify protected exact-main preparation dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "PREPARE FRESH DRIZZLE D1"
          test "${RUN_ATTEMPT}" = 1
          [[ "${TARGET_DATABASE_NAME}" =~ ^intar-dev-control-plane-v[0-9]+-[0-9]{8}(-[a-z0-9]+)?$ ]]

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install the exact workspace
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Recheck sole-operator window immediately before creation
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "PREPARE FRESH DRIZZLE D1"
          test "${RUN_ATTEMPT}" = 1

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              ;;
            *) exit 1 ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

      - name: Create one uniquely named EU D1
        id: create_target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="${RUNNER_TEMP}/fresh-d1-list-before.json"
          after="${RUNNER_TEMP}/fresh-d1-list-after.json"
          created="${RUNNER_TEMP}/fresh-d1-created.json"

          bunx wrangler d1 list --json > "${before}"
          jq -e --arg name "${TARGET_DATABASE_NAME}" '
            type == "array" and
            ([.[] | select(.name == $name)] | length) == 0
          ' "${before}" >/dev/null

          bunx wrangler d1 create "${TARGET_DATABASE_NAME}" \
            --jurisdiction eu \
            --no-update-config \
            > "${RUNNER_TEMP}/fresh-d1-create.log" 2>&1

          git diff --exit-code -- wrangler.jsonc

          bunx wrangler d1 list --json > "${after}"
          jq -e \
            --arg name "${TARGET_DATABASE_NAME}" \
            --slurpfile before "${before}" '
              [.[] | select(.name == $name)] as $created |
              ($created | length) == 1 and
              ($created[0].uuid | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              $created[0].jurisdiction == "eu" and
              all($before[0][]; .uuid != $created[0].uuid)
            ' "${after}" >/dev/null
          jq \
            --arg name "${TARGET_DATABASE_NAME}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" '
              [.[] | select(.name == $name)][0] as $database |
              {
                schema_version: 1,
                operation: "create-fresh-production-d1",
                source_sha: $source_sha,
                run_id: $run_id,
                database: $database,
                target_database_id: $database.uuid,
                target_database_name: $database.name,
                jurisdiction: $database.jurisdiction,
                worker_binding_mutated: false,
                source_database_mutated: false,
                source_database_deleted: false,
                target_database_deleted: false
              }
            ' "${after}" > "${created}"
          target_database_id="$(jq -er '.target_database_id' "${created}")"
          printf 'TARGET_DATABASE_ID=%s\n' "${target_database_id}" \
            >> "${GITHUB_ENV}"

      - name: Prove the new D1 is empty before Drizzle migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/fresh-d1-before-migration.json"
          bunx wrangler d1 execute "${TARGET_DATABASE_ID}" \
            --remote \
            --command "SELECT type, name FROM sqlite_schema WHERE name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY type, name" \
            --json > "${result}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${result}" >/dev/null

      - name: Apply the generated Drizzle migration stream
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DRIZZLE_D1_HTTP: "1"
        run: |
          set -euo pipefail
          export CLOUDFLARE_DATABASE_ID="${TARGET_DATABASE_ID}"
          bunx drizzle-kit migrate --config drizzle.config.ts 2>&1 |
            tee "${RUNNER_TEMP}/fresh-d1-drizzle-migrate.log"

      - name: Empirically prove remote D1 REST batch rollback
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/fresh-d1-batch-rollback.json"
          bun tools/deploy/probe-d1-batch-rollback.ts \
            "${TARGET_DATABASE_ID}" \
            "${evidence}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "rollback_proven" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .probeTable == "user" and
              .batchRequestRejected == true and
              .probeRowsAfterFailure == 0 and
              .applicationRowsBefore == 0 and
              .applicationRowsAfter == 0 and
              .applicationTableCount > 0
            ' "${evidence}" >/dev/null

      - name: Verify exact Drizzle ledger, manifest, and foreign keys
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          generated_schema="${RUNNER_TEMP}/fresh-d1-generated-schema.json"
          bun "${GITHUB_WORKSPACE}/tools/database/verify-generated-d1-schema.ts" \
            --database-id "${TARGET_DATABASE_ID}" \
            --expect full \
            --evidence "${generated_schema}"
          jq -e \
            --arg account_id "${CLOUDFLARE_ACCOUNT_ID}" \
            --arg database_id "${TARGET_DATABASE_ID}" '
              .version == 1 and
              .status == "exact_generated_schema_verified" and
              .expectation == "full" and
              .accountId == $account_id and
              .databaseId == $database_id and
              .appliedMigrationCount == .committedMigrationCount and
              .appliedMigrationCount > 0 and
              (.schemaSha256 | test("^[0-9a-f]{64}$")) and
              (.objects | length) > 0 and
              all(.objects[]; .type == "table" or .type == "index") and
              .foreignKeyViolations == 0 and
              .triggers == 0 and
              .views == 0
            ' "${generated_schema}" >/dev/null
          expected_ledger="${RUNNER_TEMP}/fresh-d1-expected-ledger.json"
          ledger="${RUNNER_TEMP}/fresh-d1-ledger.json"
          expected_manifest="${RUNNER_TEMP}/fresh-d1-expected-manifest.json"
          manifest="${RUNNER_TEMP}/fresh-d1-manifest.json"
          foreign_keys="${RUNNER_TEMP}/fresh-d1-foreign-keys.json"

          : > "${RUNNER_TEMP}/fresh-d1-expected-ledger.ndjson"
          while IFS=$'\t' read -r tag created_at; do
            test -n "${tag}"
            test -f "migrations/${tag}.sql"
            hash="$(sha256sum "migrations/${tag}.sql" | cut -d ' ' -f 1)"
            jq -cn \
              --arg hash "${hash}" \
              --argjson created_at "${created_at}" \
              '{hash: $hash, created_at: $created_at}' \
              >> "${RUNNER_TEMP}/fresh-d1-expected-ledger.ndjson"
          done < <(jq -r '.entries[] | [.tag, (.when | tostring)] | @tsv' \
            migrations/meta/_journal.json)
          jq -s 'sort_by(.created_at)' \
            "${RUNNER_TEMP}/fresh-d1-expected-ledger.ndjson" \
            > "${expected_ledger}"

          bunx wrangler d1 execute "${TARGET_DATABASE_ID}" \
            --remote \
            --command "SELECT hash, created_at FROM __drizzle_migrations ORDER BY created_at" \
            --json > "${ledger}"
          jq -e --slurpfile expected "${expected_ledger}" '
            length == 1 and
            .[0].success == true and
            .[0].results == $expected[0] and
            (.[0].results | length) > 0
          ' "${ledger}" >/dev/null

          final_snapshot_index="$(jq -er '.entries[-1].idx' \
            migrations/meta/_journal.json)"
          printf -v final_snapshot_path \
            'migrations/meta/%04d_snapshot.json' "${final_snapshot_index}"
          test -f "${final_snapshot_path}"
          jq '
            [
              (.tables | to_entries[] | {
                type: "table", name: .key, table_name: .key
              }),
              (.tables | to_entries[] | . as $table |
                (($table.value.indexes // {}) | keys[]) | {
                  type: "index", name: ., table_name: $table.key
                })
            ] + [{
              type: "table",
              name: "__drizzle_migrations",
              table_name: "__drizzle_migrations"
            }] | sort_by(.type, .name, .table_name)
          ' "${final_snapshot_path}" > "${expected_manifest}"

          bunx wrangler d1 execute "${TARGET_DATABASE_ID}" \
            --remote \
            --command "SELECT type, name, tbl_name AS table_name FROM sqlite_schema WHERE type IN ('table', 'index', 'view', 'trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND sql IS NOT NULL ORDER BY type, name, tbl_name" \
            --json > "${manifest}"
          jq -e --slurpfile expected "${expected_manifest}" '
            length == 1 and
            .[0].success == true and
            (.[0].results | sort_by(.type, .name, .table_name)) == $expected[0] and
            ([.[0].results[] | select(.type == "trigger" or .type == "view")] | length) == 0 and
            ([.[0].results[] | select(.name == "d1_migrations")] | length) == 0
          ' "${manifest}" >/dev/null

          bunx wrangler d1 execute "${TARGET_DATABASE_ID}" \
            --remote \
            --command "PRAGMA foreign_key_check" \
            --json > "${foreign_keys}"
          jq -e '
            length == 1 and
            .[0].success == true and
            .[0].results == []
          ' "${foreign_keys}" >/dev/null

          jq \
            --slurpfile ledger "${ledger}" \
            --slurpfile manifest "${manifest}" \
            --slurpfile foreign_keys "${foreign_keys}" \
            --slurpfile batch_rollback \
              "${RUNNER_TEMP}/fresh-d1-batch-rollback.json" '
              . + {
                state: "verified",
                drizzle_migration_ledger: $ledger[0][0].results,
                schema_manifest: $manifest[0][0].results,
                foreign_key_violations: $foreign_keys[0][0].results,
                d1_rest_batch_rollback: $batch_rollback[0],
                exact_drizzle_ledger_proven: true,
                exact_schema_manifest_proven: true,
                custom_schema_objects_absent: true,
                foreign_keys_valid: true,
                application_tables_empty: true
              }
            ' "${RUNNER_TEMP}/fresh-d1-created.json" \
            > "${RUNNER_TEMP}/fresh-d1-prepared.json"

      - name: Retain target UUID and complete preparation evidence
        if: ${{ always() && steps.create_target.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: fresh-production-d1-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-d1-list-before.json
            ${{ runner.temp }}/fresh-d1-list-after.json
            ${{ runner.temp }}/fresh-d1-create.log
            ${{ runner.temp }}/fresh-d1-created.json
            ${{ runner.temp }}/fresh-d1-before-migration.json
            ${{ runner.temp }}/fresh-d1-drizzle-migrate.log
            ${{ runner.temp }}/fresh-d1-batch-rollback.json
            ${{ runner.temp }}/fresh-d1-expected-ledger.json
            ${{ runner.temp }}/fresh-d1-ledger.json
            ${{ runner.temp }}/fresh-d1-expected-manifest.json
            ${{ runner.temp }}/fresh-d1-manifest.json
            ${{ runner.temp }}/fresh-d1-foreign-keys.json
            ${{ runner.temp }}/fresh-d1-generated-schema.json
            ${{ runner.temp }}/fresh-d1-prepared.json
          if-no-files-found: error
          retention-days: 90
