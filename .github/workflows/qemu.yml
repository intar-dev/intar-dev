# Generated from ci/workflows/qemu.cue by cuenv; do not edit manually.
# Regenerate with: cuenv sync codegen
name: App QEMU
run-name: App QEMU @ ${{ github.sha }}
"on":
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - tools/workflows/qemu/**
      - .github/workflows/qemu.yml
      - crates/intar-image-build/src/kernel.rs
  schedule:
    - cron: 23 4 * * 1
concurrency:
  group: intar-qemu-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    name: Check for a newer QEMU
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      set: ${{ steps.check.outputs.set }}
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
      pin: ${{ steps.check.outputs.pin }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Decide what this run does
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: cuenv task -p ci --package ci qemu-check
      - name: Keep the sources list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qemu-sources
          path: tools/workflows/qemu/sources.txt
          if-no-files-found: error
          retention-days: 7
  build:
    name: Build ${{ matrix.target }}
    needs:
      - check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: macos-arm64
            runner: namespace-profile-macos-arm64-smol
      fail-fast: false
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Take the sources list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qemu-sources
          path: tools/workflows/qemu/
      - name: Build QEMU
        run: cuenv task -p ci --package ci qemu-build
      - name: Boot a guest
        run: cuenv task -p ci --package ci qemu-smoke
      - name: Keep the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qemu-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    name: Publish ${{ needs.check.outputs.tag }}
    needs:
      - check
      - build
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Download the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: qemu-*-*
          path: dist/
          merge-multiple: true
      - name: Write the checksums
        run: cuenv task -p ci --package ci qemu-checksums
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/intar-qemu_checksums.txt
      - name: Publish the QEMU release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: cuenv task -p ci --package ci qemu-publish
  pin:
    name: Open the pull request that pins ${{ needs.check.outputs.tag }}
    needs:
      - check
      - build
      - publish
    if: ${{ !cancelled() && needs.check.outputs.pin == 'true' && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: release-pr
    timeout-minutes: 10
    steps:
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Take the sources list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qemu-sources
          path: tools/workflows/qemu/
      - name: Pin the published QEMU and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ needs.check.outputs.tag }}
          QEMU_VERSION: ${{ needs.check.outputs.version }}
        run: cuenv task -p ci --package ci qemu-pin-pr
