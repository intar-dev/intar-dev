name: Workshop multicloud organization flag
run-name: "Workshop multicloud flag ${{ inputs.operation }} for ${{ inputs.organization_id }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, target one organization, or remove that exact targeting
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - remove
      organization_id:
        description: Exact 24-character Intar organization ID
        required: true
        type: string
      expected_current_sha256:
        description: Exact observed SHA-256 from the retained plan artifact; required for apply/remove
        required: false
        default: ""
        type: string
      confirmation:
        description: Type PLAN, TARGET, or REMOVE WORKSHOP MULTICLOUD FLAG as appropriate
        required: true
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when that production mode is active
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: intar-control-plane-production
  cancel-in-progress: false

jobs:
  targeting:
    name: ${{ inputs.operation }} exact Workshop multicloud targeting
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
      ORGANIZATION_ID: ${{ inputs.organization_id }}
      EXPECTED_CURRENT_SHA256: ${{ inputs.expected_current_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      FLAGSHIP_APP_ID: 12f35c20-55f4-47ee-8b31-b3ad202d1f04
      FLAG_KEY: workshop_multicloud_runtime_enabled
      WRANGLER_LOG: none
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout exact main revision
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Validate protected request
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = 1
          [[ "${ORGANIZATION_ID}" =~ ^[a-z0-9]{24}$ ]]

          case "${OPERATION}" in
            plan)
              test "${CONFIRMATION}" = "PLAN WORKSHOP MULTICLOUD FLAG"
              test -z "${EXPECTED_CURRENT_SHA256}"
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              ;;
            apply)
              test "${CONFIRMATION}" = "TARGET WORKSHOP MULTICLOUD FLAG"
              [[ "${EXPECTED_CURRENT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              ;;
            remove)
              test "${CONFIRMATION}" = "REMOVE WORKSHOP MULTICLOUD FLAG"
              [[ "${EXPECTED_CURRENT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac

          if [ "${OPERATION}" != plan ]; then
            environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
            case "${APPROVAL_MODE}" in
              reviewed)
                test -z "${SINGLE_OPERATOR_CONFIRMATION}"
                jq -e '
                  .can_admins_bypass == false and
                  any(
                    .protection_rules[]?;
                      .type == "required_reviewers" and
                      .prevent_self_review == true and
                      ((.reviewers // []) | length) > 0
                  )
                ' <<<"${environment_json}" >/dev/null
                ;;
              single-operator)
                test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                  "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
                test -n "${SINGLE_OPERATOR_LOGIN}"
                [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
                [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
                [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
                [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
                [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
                [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
                test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
                test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
                test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
                triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
                jq -e \
                  --arg login "${SINGLE_OPERATOR_LOGIN}" \
                  --arg id "${SINGLE_OPERATOR_ID}" '
                    .type == "User" and
                    .login == $login and
                    ((.id | tostring) == $id)
                  ' <<<"${triggering_actor_json}" >/dev/null
                jq -e '
                  ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
                ' <<<"${environment_json}" >/dev/null
                now_epoch="$(date -u +%s)"
                expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
                attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
                remaining_seconds="$((expires_epoch - now_epoch))"
                attestation_age="$((now_epoch - attested_epoch))"
                test "${remaining_seconds}" -gt 0
                test "${remaining_seconds}" -le 604800
                test "${attestation_age}" -ge 0
                test "${attestation_age}" -le 900
                ;;
              *)
                printf 'Unsupported production approval mode: %s\n' \
                  "${APPROVAL_MODE:-<unset>}" >&2
                exit 1
                ;;
            esac

            branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
            jq -e '
              (.branch_policies // .) as $policies |
              ($policies | length) == 1 and
              $policies[0].type == "branch" and
              $policies[0].name == "main"
            ' <<<"${branch_policies}" >/dev/null
          fi

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore shared Bun cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Install the root workspace
        run: bun install --frozen-lockfile

      - name: Test targeting drift fences
        run: bun run check:flagship

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/flagship-targeting-${GITHUB_RUN_ID}"
          install -d -m 0700 "${evidence_dir}"
          printf 'EVIDENCE_DIR=%s\n' "${evidence_dir}" >> "${GITHUB_ENV}"
          control_organization_id=000000000000000000000000
          if [ "${ORGANIZATION_ID}" = "${control_organization_id}" ]; then
            control_organization_id=111111111111111111111111
          fi
          printf 'CONTROL_ORGANIZATION_ID=%s\n' \
            "${control_organization_id}" >> "${GITHUB_ENV}"

      - name: Capture and validate current Flagship state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Existing account token; its established deployment permissions are preserved and
          # Flagship Read, Flagship Evaluate, and Flagship Write are added explicitly.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          bunx wrangler flagship flags get \
            "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
            --json \
            > "${EVIDENCE_DIR}/before.json"
          bun tools/flagship/workshop-multicloud-targeting.ts plan \
            "${OPERATION}" "${ORGANIZATION_ID}" \
            "${EVIDENCE_DIR}/before.json" \
            "${EVIDENCE_DIR}/plan.json"
          observed_sha256="$(jq -er '.observedSha256' "${EVIDENCE_DIR}/plan.json")"
          if [ "${OPERATION}" = plan ]; then
            test -z "${EXPECTED_CURRENT_SHA256}"
          else
            test "${observed_sha256}" = "${EXPECTED_CURRENT_SHA256}"
          fi
          printf 'observed_sha256=%s\n' "${observed_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'action=%s\n' \
            "$(jq -er '.action' "${EVIDENCE_DIR}/plan.json")" >> "${GITHUB_OUTPUT}"
        id: current

      - name: Verify current target and non-target evaluations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          bunx wrangler flagship flags evaluate \
            "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
            --context "organizationId=${ORGANIZATION_ID}" \
            --targeting-key "${ORGANIZATION_ID}" \
            --json \
            > "${EVIDENCE_DIR}/before-target-evaluation.json"
          bunx wrangler flagship flags evaluate \
            "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
            --context "organizationId=${CONTROL_ORGANIZATION_ID}" \
            --targeting-key "${CONTROL_ORGANIZATION_ID}" \
            --json \
            > "${EVIDENCE_DIR}/before-control-evaluation.json"
          bun tools/flagship/workshop-multicloud-targeting.ts verify-current \
            "${EVIDENCE_DIR}/plan.json" \
            "${EVIDENCE_DIR}/before-target-evaluation.json" \
            "${EVIDENCE_DIR}/before-control-evaluation.json" \
            "${EVIDENCE_DIR}/before-verification.json"

      - name: Reauthorize immediately before Flagship mutation
        if: ${{ inputs.operation != 'plan' }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = 1

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

      - name: Recheck drift and apply exact mutation
        if: ${{ inputs.operation != 'plan' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          bunx wrangler flagship flags get \
            "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
            --json \
            > "${EVIDENCE_DIR}/recheck.json"
          bun tools/flagship/workshop-multicloud-targeting.ts plan \
            "${OPERATION}" "${ORGANIZATION_ID}" \
            "${EVIDENCE_DIR}/recheck.json" \
            "${EVIDENCE_DIR}/recheck-plan.json"
          rechecked_sha256="$(jq -er '.observedSha256' "${EVIDENCE_DIR}/recheck-plan.json")"
          test "${rechecked_sha256}" = "${EXPECTED_CURRENT_SHA256}"
          test "${rechecked_sha256}" = "${{ steps.current.outputs.observed_sha256 }}"

          action="$(jq -er '.action' "${EVIDENCE_DIR}/recheck-plan.json")"
          printf 'FLAGSHIP_RECONCILIATION_REQUIRED=true\n' >> "${GITHUB_ENV}"
          mutation_attempted=false
          mutation_exit_status=0
          mutation_response="${EVIDENCE_DIR}/mutation-response.tmp"
          run_flagship_mutation() {
            mutation_attempted=true
            set +e
            bunx wrangler "$@" --json > "${mutation_response}"
            mutation_exit_status=$?
            set -e
          }

          case "${OPERATION}:${action}" in
            apply:none|remove:none)
              ;;
            apply:enable|apply:add_rule|apply:enable_and_add_rule)
              rule_json="$(jq -ce '.desiredRule' "${EVIDENCE_DIR}/recheck-plan.json")"
              true_variation="$(jq -er '.trueVariation' "${EVIDENCE_DIR}/recheck-plan.json")"
              false_variation="$(jq -er '.falseVariation' "${EVIDENCE_DIR}/recheck-plan.json")"
              run_flagship_mutation flagship flags update \
                "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" --enable \
                --default-variation "${false_variation}" \
                --type boolean \
                --set-variation "${true_variation}=true" \
                --set-variation "${false_variation}=false" \
                --rule-json "${rule_json}"
              ;;
            remove:remove_rule)
              true_variation="$(jq -er '.trueVariation' "${EVIDENCE_DIR}/recheck-plan.json")"
              false_variation="$(jq -er '.falseVariation' "${EVIDENCE_DIR}/recheck-plan.json")"
              run_flagship_mutation flagship flags update \
                "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
                --default-variation "${false_variation}" \
                --type boolean \
                --set-variation "${true_variation}=true" \
                --set-variation "${false_variation}=false" \
                --clear-rules
              ;;
            *)
              printf 'Unsupported targeting transition: %s:%s\n' \
                "${OPERATION}" "${action}" >&2
              exit 1
              ;;
          esac

          if [ -s "${mutation_response}" ] && \
            jq -e . "${mutation_response}" >/dev/null 2>&1; then
            mv "${mutation_response}" "${EVIDENCE_DIR}/mutation-response.json"
          else
            rm -f "${mutation_response}"
          fi
          jq -n \
            --arg operation "${OPERATION}" \
            --arg action "${action}" \
            --arg attempted "${mutation_attempted}" \
            --arg exit_status "${mutation_exit_status}" '
              {
                operation: $operation,
                action: $action,
                attempted: ($attempted == "true"),
                exitStatus: ($exit_status | tonumber)
              }
            ' > "${EVIDENCE_DIR}/mutation.json"
          {
            printf 'FLAGSHIP_MUTATION_ATTEMPTED=%s\n' "${mutation_attempted}"
            printf 'FLAGSHIP_MUTATION_EXIT_STATUS=%s\n' "${mutation_exit_status}"
          } >> "${GITHUB_ENV}"

      - name: Capture and verify final state
        if: ${{ inputs.operation != 'plan' && always() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          final_outcome=not_attempted
          if [ "${FLAGSHIP_RECONCILIATION_REQUIRED:-false}" != true ]; then
            jq -n \
              '{outcome: "not_attempted", reason: "authorization_or_prewrite_failure"}' \
              > "${EVIDENCE_DIR}/final-outcome.json"
            printf 'FLAGSHIP_FINAL_OUTCOME=%s\n' "${final_outcome}" >> "${GITHUB_ENV}"
            exit 0
          fi

          verified=false
          for attempt in $(seq 1 12); do
            if bunx wrangler flagship flags get \
              "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
              --json \
              > "${EVIDENCE_DIR}/after.json" && \
              bunx wrangler flagship flags evaluate \
              "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
              --context "organizationId=${ORGANIZATION_ID}" \
              --targeting-key "${ORGANIZATION_ID}" \
              --json \
              > "${EVIDENCE_DIR}/after-target-evaluation.json" && \
              bunx wrangler flagship flags evaluate \
              "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
              --context "organizationId=${CONTROL_ORGANIZATION_ID}" \
              --targeting-key "${CONTROL_ORGANIZATION_ID}" \
              --json \
              > "${EVIDENCE_DIR}/after-control-evaluation.json" && \
              bun tools/flagship/workshop-multicloud-targeting.ts verify-final \
              "${OPERATION}" "${ORGANIZATION_ID}" \
              "${EVIDENCE_DIR}/after.json" \
              "${EVIDENCE_DIR}/after-target-evaluation.json" \
              "${EVIDENCE_DIR}/after-control-evaluation.json" \
              "${EVIDENCE_DIR}/after-verification.json"; then
              verified=true
              break
            fi
            if [ "${attempt}" -lt 12 ]; then sleep 5; fi
          done

          if [ "${verified}" = true ]; then
            final_outcome=desired
          else
            true_variation="$(jq -er '.trueVariation' "${EVIDENCE_DIR}/recheck-plan.json")"
            false_variation="$(jq -er '.falseVariation' "${EVIDENCE_DIR}/recheck-plan.json")"
            recovery_response="${EVIDENCE_DIR}/recovery-response.tmp"
            set +e
            bunx wrangler flagship flags update \
              "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" --disable \
              --default-variation "${false_variation}" \
              --type boolean \
              --set-variation "${true_variation}=true" \
              --set-variation "${false_variation}=false" \
              --clear-rules \
              --json \
              > "${recovery_response}"
            recovery_exit_status=$?
            set -e
            if [ -s "${recovery_response}" ] && \
              jq -e . "${recovery_response}" >/dev/null 2>&1; then
              mv "${recovery_response}" "${EVIDENCE_DIR}/recovery-response.json"
            else
              rm -f "${recovery_response}"
            fi
            jq -n \
              --arg exit_status "${recovery_exit_status}" \
              '{attempted: true, exitStatus: ($exit_status | tonumber)}' \
              > "${EVIDENCE_DIR}/recovery.json"

            recovered=false
            for attempt in $(seq 1 12); do
              if bunx wrangler flagship flags get \
                "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
                --json \
                > "${EVIDENCE_DIR}/recovered.json" && \
                bunx wrangler flagship flags evaluate \
                "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
                --context "organizationId=${ORGANIZATION_ID}" \
                --targeting-key "${ORGANIZATION_ID}" \
                --json \
                > "${EVIDENCE_DIR}/recovered-target-evaluation.json" && \
                bunx wrangler flagship flags evaluate \
                "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" \
                --context "organizationId=${CONTROL_ORGANIZATION_ID}" \
                --targeting-key "${CONTROL_ORGANIZATION_ID}" \
                --json \
                > "${EVIDENCE_DIR}/recovered-control-evaluation.json" && \
                bun tools/flagship/workshop-multicloud-targeting.ts verify-final \
                remove "${ORGANIZATION_ID}" \
                "${EVIDENCE_DIR}/recovered.json" \
                "${EVIDENCE_DIR}/recovered-target-evaluation.json" \
                "${EVIDENCE_DIR}/recovered-control-evaluation.json" \
                "${EVIDENCE_DIR}/recovery-verification.json"; then
                recovered=true
                break
              fi
              if [ "${attempt}" -lt 12 ]; then sleep 5; fi
            done
            if [ "${recovered}" = true ]; then
              final_outcome=recovered_fail_closed
            else
              final_outcome=unrecovered
            fi
          fi

          changelog_response="${EVIDENCE_DIR}/changelog.tmp"
          set +e
          bunx wrangler flagship flags changelog \
            "${FLAGSHIP_APP_ID}" "${FLAG_KEY}" --limit 20 \
            --json \
            > "${changelog_response}"
          changelog_exit_status=$?
          set -e
          if [ -s "${changelog_response}" ] && \
            jq -e . "${changelog_response}" >/dev/null 2>&1; then
            mv "${changelog_response}" "${EVIDENCE_DIR}/changelog.json"
          else
            rm -f "${changelog_response}"
          fi
          jq -n \
            --arg outcome "${final_outcome}" \
            --arg mutation_exit_status "${FLAGSHIP_MUTATION_EXIT_STATUS:-not-recorded}" \
            --arg changelog_exit_status "${changelog_exit_status}" '
              {
                outcome: $outcome,
                mutationExitStatus: (
                  $mutation_exit_status |
                  if test("^[0-9]+$") then tonumber else null end
                ),
                changelogExitStatus: ($changelog_exit_status | tonumber)
              }
            ' > "${EVIDENCE_DIR}/final-outcome.json"
          printf 'FLAGSHIP_FINAL_OUTCOME=%s\n' "${final_outcome}" >> "${GITHUB_ENV}"

      - name: Seal retained evidence
        if: ${{ always() && env.EVIDENCE_DIR != '' }}
        run: |
          set -euo pipefail
          umask 077
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg actor_id "${ACTOR_ID}" \
            --arg operation "${OPERATION}" \
            --arg organization_id "${ORGANIZATION_ID}" \
            --arg app_id "${FLAGSHIP_APP_ID}" \
            --arg flag_key "${FLAG_KEY}" \
            --arg expected_current_sha256 "${EXPECTED_CURRENT_SHA256}" \
            --arg observed_sha256 "${{ steps.current.outputs.observed_sha256 }}" \
            --arg action "${{ steps.current.outputs.action }}" '
              {
                schemaVersion: 1,
                sourceSha: $source_sha,
                runId: $run_id,
                runAttempt: ($run_attempt | tonumber),
                actor: $actor,
                actorId: $actor_id,
                operation: $operation,
                organizationId: $organization_id,
                appId: $app_id,
                flagKey: $flag_key,
                expectedCurrentSha256: $expected_current_sha256,
                observedSha256: $observed_sha256,
                action: $action
              }
            ' > "${EVIDENCE_DIR}/run.json"
          (
            cd "${EVIDENCE_DIR}"
            sha256sum -- *.json > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          {
            printf '### Workshop multicloud Flagship %s\n\n' "${OPERATION}"
            printf -- '- Organization: `%s`\n' "${ORGANIZATION_ID}"
            printf -- '- Flag: `%s`\n' "${FLAG_KEY}"
            printf -- '- Observed SHA-256: `%s`\n' \
              "${{ steps.current.outputs.observed_sha256 }}"
            printf -- '- Planned action: `%s`\n' \
              "${{ steps.current.outputs.action }}"
            printf -- '- Evidence artifact: `%s`\n' \
              "flagship-workshop-multicloud-${OPERATION}-${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact Flagship evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flagship-workshop-multicloud-${{ inputs.operation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/flagship-targeting-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce exact final Flagship outcome
        if: ${{ inputs.operation != 'plan' && always() }}
        run: |
          set -euo pipefail
          test "${FLAGSHIP_FINAL_OUTCOME:-not-recorded}" = desired
