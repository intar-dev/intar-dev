name: Guest tools
run-name: "${{ github.event_name == 'pull_request' && format('Guest tools validate PR #{0}', github.event.pull_request.number) || format('Guest tools publish main @ {0}', github.sha) }}"

on:
  workflow_dispatch:
    inputs:
      promote_stable:
        description: Promote the verified candidate to the stable scenario pin
        required: true
        default: false
        type: boolean
      stable_confirmation:
        description: Type PROMOTE SCENARIO GUEST TOOLS when promote_stable is true
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/guest-tools.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/intar-kino-proto/**"
      - "crates/intar-workspace-agent/**"
      - "crates/kino/**"
  pull_request:
    paths:
      - ".github/workflows/guest-tools.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/intar-kino-proto/**"
      - "crates/intar-workspace-agent/**"
      - "crates/kino/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: "guest-tools-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate guest tools
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add --toolchain 1.97.0 clippy

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Test and lint guest tools
        run: |
          set -euo pipefail
          cargo test --locked -p intar-workspace-agent -p kino -p intar-kino-proto
          cargo clippy --locked -p intar-workspace-agent -p kino -p intar-kino-proto \
            --all-targets -- -D warnings

  release-build:
    name: Build guest-tool release
    runs-on: namespace-profile-intar-dev

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl
          rustup component add --toolchain 1.97.0 clippy

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-zigbuild@0.23.0
          fallback: none

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Build guest tools and disk builder
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo zigbuild --locked --release -p intar-workspace-agent -p kino \
            --target x86_64-unknown-linux-musl
          cargo build --locked --release -p intar-image-cli

      - name: Prepare guest-tool artifact
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          mkdir -p "${guest_tools_dir}"
          cp \
            "target/x86_64-unknown-linux-musl/release/intar-workspace-agent" \
            "${guest_tools_dir}/intar-workspace-agent"
          cp \
            "target/x86_64-unknown-linux-musl/release/kino" \
            "${guest_tools_dir}/kino"
          chmod 0555 \
            "${guest_tools_dir}/intar-workspace-agent" \
            "${guest_tools_dir}/kino"
          target/release/intar-image-cli build-guest-tools \
            --kino-binary "${guest_tools_dir}/kino" \
            --output-root "${guest_tools_dir}/scenario-tools-build" \
            > "${guest_tools_dir}/scenario-tools.json"
          target/release/intar-image-cli build-guest-tools \
            --kino-binary "${guest_tools_dir}/kino" \
            --output-root "${guest_tools_dir}/scenario-tools-rebuild" \
            > "${guest_tools_dir}/scenario-tools-rebuild.json"
          test "$(jq -er '.tools_disk_sha256' "${guest_tools_dir}/scenario-tools.json")" = \
            "$(jq -er '.tools_disk_sha256' "${guest_tools_dir}/scenario-tools-rebuild.json")"
          test "$(jq -er '.compressed_disk_sha256' "${guest_tools_dir}/scenario-tools.json")" = \
            "$(jq -er '.compressed_disk_sha256' "${guest_tools_dir}/scenario-tools-rebuild.json")"
          scenario_tools_path="$(jq -er '.compressed_disk_path' \
            "${guest_tools_dir}/scenario-tools.json")"
          cp "${scenario_tools_path}" "${guest_tools_dir}/scenario-tools.ext4.zst"
          rm -rf \
            "${guest_tools_dir}/scenario-tools-build" \
            "${guest_tools_dir}/scenario-tools-rebuild"
          rm -f "${guest_tools_dir}/scenario-tools-rebuild.json"
          agent_path="${guest_tools_dir}/intar-workspace-agent"
          kino_path="${guest_tools_dir}/kino"
          file "${agent_path}" | grep -E 'x86-64.*(static|statically linked)'
          file "${kino_path}" | grep -E 'x86-64.*(static|statically linked)'
          agent_sha="$(sha256sum "${agent_path}" | cut -d ' ' -f 1)"
          agent_size="$(stat --format='%s' "${agent_path}")"
          kino_sha="$(sha256sum "${kino_path}" | cut -d ' ' -f 1)"
          kino_size="$(stat --format='%s' "${kino_path}")"
          tools_disk_sha="$(jq -er '.tools_disk_sha256' \
            "${guest_tools_dir}/scenario-tools.json")"
          tools_disk_size="$(jq -er '.tools_disk_size_bytes' \
            "${guest_tools_dir}/scenario-tools.json")"
          compressed_disk_sha="$(jq -er '.compressed_disk_sha256' \
            "${guest_tools_dir}/scenario-tools.json")"
          compressed_disk_size="$(jq -er '.compressed_disk_size_bytes' \
            "${guest_tools_dir}/scenario-tools.json")"
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg workflow_path ".github/workflows/guest-tools.yml" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" \
            --arg agent_sha256 "${agent_sha}" \
            --argjson agent_size_bytes "${agent_size}" \
            --arg agent_object_key \
              "workspace-agent/releases/${agent_sha}/intar-workspace-agent" \
            --arg kino_sha256 "${kino_sha}" \
            --argjson kino_size_bytes "${kino_size}" \
            --arg kino_object_key \
              "workspace-agent/kino/releases/${kino_sha}/kino" \
            --arg tools_disk_sha256 "${tools_disk_sha}" \
            --argjson tools_disk_size_bytes "${tools_disk_size}" \
            --arg compressed_disk_sha256 "${compressed_disk_sha}" \
            --argjson compressed_disk_size_bytes "${compressed_disk_size}" '
              {
                schema_version: 1,
                repository: $repository,
                source_sha: $source_sha,
                workflow_path: $workflow_path,
                workflow_run_id: $workflow_run_id,
                workflow_run_attempt: $workflow_run_attempt,
                event: $event,
                ref: $ref,
                architecture: "x86_64",
                target: "x86_64-unknown-linux-musl",
                scenario_tools: {
                  bootstrap_abi: 1,
                  tools_disk_sha256: $tools_disk_sha256,
                  tools_disk_size_bytes: $tools_disk_size_bytes,
                  compressed_disk_sha256: $compressed_disk_sha256,
                  compressed_disk_size_bytes: $compressed_disk_size_bytes
                },
                tools: {
                  "intar-workspace-agent": {
                    sha256: $agent_sha256,
                    size_bytes: $agent_size_bytes,
                    r2_object_key: $agent_object_key
                  },
                  kino: {
                    sha256: $kino_sha256,
                    size_bytes: $kino_size_bytes,
                    r2_object_key: $kino_object_key
                  }
                }
              }
            ' > "${guest_tools_dir}/manifest.json"
          (
            cd "${guest_tools_dir}"
            sha256sum intar-workspace-agent kino scenario-tools.ext4.zst scenario-tools.json > SHA256SUMS
          )
          chmod 0444 \
            "${guest_tools_dir}/SHA256SUMS" \
            "${guest_tools_dir}/manifest.json"

      - name: Upload guest-tool artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-workshop-guest-tools-${{ github.sha }}
          path: ${{ runner.temp }}/production-workshop-guest-tools/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish:
    name: Publish guest tools
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, release-build]
    runs-on: namespace-profile-intar-dev
    environment: production

    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Download guest-tool artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-workshop-guest-tools-${{ github.sha }}
          path: ${{ runner.temp }}/production-workshop-guest-tools

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify guest-tool provenance
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          (
            cd "${guest_tools_dir}"
            sha256sum --check --strict SHA256SUMS
          )
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            --arg ref "${GITHUB_REF}" '
              .schema_version == 1 and
              .repository == $repository and
              .source_sha == $source_sha and
              .workflow_path == ".github/workflows/guest-tools.yml" and
              .workflow_run_id == env.GITHUB_RUN_ID and
              .workflow_run_attempt == env.GITHUB_RUN_ATTEMPT and
              .event == $event and
              .ref == $ref and
              .architecture == "x86_64" and
              .target == "x86_64-unknown-linux-musl"
            ' "${guest_tools_dir}/manifest.json" >/dev/null

      - name: Publish content-addressed guest tools
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          agent_sha="$(jq -er '.tools["intar-workspace-agent"].sha256' \
            "${guest_tools_dir}/manifest.json")"
          kino_sha="$(jq -er '.tools.kino.sha256' \
            "${guest_tools_dir}/manifest.json")"
          tools_disk_sha="$(jq -er '.scenario_tools.tools_disk_sha256' \
            "${guest_tools_dir}/manifest.json")"
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/releases/${agent_sha}/intar-workspace-agent" \
            --file "${guest_tools_dir}/intar-workspace-agent" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/workspace-agent/kino/releases/${kino_sha}/kino" \
            --file "${guest_tools_dir}/kino" \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/guest-tools/scenario/disks/${tools_disk_sha}.ext4.zst" \
            --file "${guest_tools_dir}/scenario-tools.ext4.zst" \
            --content-type application/zstd \
            --jurisdiction eu \
            --remote
          bunx wrangler r2 object put \
            "intar-dev-vm-image-registry-20260709/guest-tools/scenario/kino/${kino_sha}/kino" \
            --file "${guest_tools_dir}/kino" \
            --content-type application/octet-stream \
            --jurisdiction eu \
            --remote

      - name: Publish current guest-tool manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          object_path="intar-dev-vm-image-registry-20260709/workspace-agent/releases/current.json"
          desired="${RUNNER_TEMP}/workspace-agent-current.json"
          observed="${RUNNER_TEMP}/workspace-agent-current-observed.json"
          jq '{
            schema_version: 2,
            sha256: .tools["intar-workspace-agent"].sha256,
            size_bytes: .tools["intar-workspace-agent"].size_bytes,
            kino_sha256: .tools.kino.sha256,
            kino_size_bytes: .tools.kino.size_bytes
          }' "${guest_tools_dir}/manifest.json" > "${desired}"

          pointer_verified=false
          for attempt in 1 2 3; do
            rm -f "${observed}"
            bunx wrangler r2 object put "${object_path}" \
              --file "${desired}" \
              --content-type application/json \
              --jurisdiction eu \
              --remote || true
            if bunx wrangler r2 object get "${object_path}" \
              --file "${observed}" \
              --jurisdiction eu \
              --remote && cmp --silent "${desired}" "${observed}"; then
              pointer_verified=true
              break
            fi
            sleep "${attempt}"
          done
          test "${pointer_verified}" = true

      - name: Publish candidate scenario guest-tool pin
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          guest_tools_dir="${RUNNER_TEMP}/production-workshop-guest-tools"
          desired="${RUNNER_TEMP}/scenario-guest-tools-pin.json"
          observed="${RUNNER_TEMP}/scenario-guest-tools-observed.json"
          jq '{
            schema_version: 1,
            bootstrap_abi: .scenario_tools.bootstrap_abi,
            tools_disk_sha256: .scenario_tools.tools_disk_sha256,
            tools_disk_size_bytes: .scenario_tools.tools_disk_size_bytes,
            compressed_disk_sha256: .scenario_tools.compressed_disk_sha256,
            compressed_disk_size_bytes: .scenario_tools.compressed_disk_size_bytes,
            kino_sha256: .tools.kino.sha256,
            kino_size_bytes: .tools.kino.size_bytes
          }' "${guest_tools_dir}/manifest.json" > "${desired}"
          object_path="intar-dev-vm-image-registry-20260709/guest-tools/scenario/candidate.json"
          pin_verified=false
          for attempt in 1 2 3; do
            rm -f "${observed}"
            bunx wrangler r2 object put "${object_path}" \
              --file "${desired}" \
              --content-type application/json \
              --jurisdiction eu \
              --remote
            if bunx wrangler r2 object get "${object_path}" \
              --file "${observed}" \
              --jurisdiction eu \
              --remote && cmp --silent "${desired}" "${observed}"; then
              pin_verified=true
              break
            fi
            sleep "${attempt}"
          done
          test "${pin_verified}" = true

      - name: Event-warm candidate scenario guest tools
        env:
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/scenario-guest-tools-warm.json"
          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${INTAR_IMAGE_PUBLISH_TOKEN}" \
            "https://intar.dev/registry/v1/guest-tools/warm" > "${response}"
          jq -e '.ok == true and (.warmed_host_ids | type == "array")' \
            "${response}" >/dev/null

      - name: Promote candidate to stable scenario guest-tool pin
        if: github.event_name == 'workflow_dispatch' && inputs.promote_stable
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
          STABLE_CONFIRMATION: ${{ inputs.stable_confirmation }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${STABLE_CONFIRMATION}" = "PROMOTE SCENARIO GUEST TOOLS"
          candidate="${RUNNER_TEMP}/scenario-guest-tools-candidate.json"
          promotion="${RUNNER_TEMP}/scenario-guest-tools-promotion.json"
          candidate_path="intar-dev-vm-image-registry-20260709/guest-tools/scenario/candidate.json"
          bunx wrangler r2 object get "${candidate_path}" \
            --file "${candidate}" \
            --jurisdiction eu \
            --remote
          cmp --silent "${RUNNER_TEMP}/scenario-guest-tools-pin.json" "${candidate}"
          curl --fail --silent --show-error --retry 3 \
            --request POST \
            --header "Authorization: Bearer ${INTAR_IMAGE_PUBLISH_TOKEN}" \
            "https://intar.dev/registry/v1/guest-tools/promote" > "${promotion}"
          jq -e --slurpfile candidate "${candidate}" '
            .ok == true and
            .stable.tools_disk_sha256 == $candidate[0].tools_disk_sha256 and
            .stable.tools_disk_size_bytes == $candidate[0].tools_disk_size_bytes and
            .stable.kino_sha256 == $candidate[0].kino_sha256 and
            .stable.bootstrap_abi == $candidate[0].bootstrap_abi
          ' "${promotion}" >/dev/null
