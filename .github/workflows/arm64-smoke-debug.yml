# Scratch branch only: find why the arm64 kernel smoke boot hangs on the
# Namespace arm64 profile right after the kernel build. Never merged.
name: arm64 smoke debug
"on":
  push:
    branches: [claude/arm64-smoke-debug]
permissions:
  contents: read
jobs:
  build-then-boot:
    name: build then boot ${{ matrix.name }}
    runs-on: namespace-profile-linux-arm64-macos
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: as-is}
          - {name: dropcaches, drop: "1"}
          - {name: report-errors, drive: ",werror=report,rerror=report"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          namespace-cache: "false"
      - name: Build the kernel
        env:
          KERNEL_ARCH: arm64
        run: bash tools/workflows/kernel/build.sh
      - name: State before the boot
        run: |
          df -h; free -m; cat /proc/pressure/io /proc/pressure/memory || true
          grep -E "Dirty|Writeback:" /proc/meminfo
          docker system df || true
          if [ -n "${{ matrix.drop }}" ]; then sync; echo 3 | sudo tee /proc/sys/vm/drop_caches; free -m; fi
      - name: Boot
        env:
          KERNEL_ARCH: arm64
          SMOKE_IMAGE: docker.io/library/debian@sha256:24a01011d10eba3a023bc8585b9650b8b29021240d4217c05b905e09ef4a5232
          SMOKE_DRIVE_OPTS: ${{ matrix.drive }}
          SMOKE_TIMEOUT: "180"
        run: |
          set +e
          ( for i in 1 2 3 4 5 6; do sleep 30; echo "t=$((i*30))s"; grep -E "Dirty|Writeback:" /proc/meminfo; cat /proc/pressure/io; top -bn1 | head -12; done ) &
          bash tools/workflows/kernel/smoke.sh; rc=$?
          kill %1 2>/dev/null
          echo "--- serial (last 25) ---"; tail -n 25 "${RUNNER_TEMP}/kernel-smoke/serial.log"
          df -h "${RUNNER_TEMP}"
          exit $rc
