# Generated from ci/workflows/kernel.cue by cuenv; do not edit manually.
# Regenerate with: cuenv sync codegen
name: Guest kernel
run-name: Guest kernel @ ${{ github.sha }}
"on":
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - tools/workflows/kernel/**
      - .github/workflows/kernel.yml
      - crates/intar-image-build/src/kernel.rs
      - crates/intar-image-build/kernel/**
  schedule:
    - cron: 41 4 * * 1
concurrency:
  group: intar-kernel-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    name: Check for a newer kernel
    runs-on: ubuntu-24.04
    outputs:
      set: ${{ steps.check.outputs.set }}
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
      pin: ${{ steps.check.outputs.pin }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          namespace-cache: "false"
      - name: Decide what this run does
        id: check
        run: cuenv task -p ci --package ci kernel-check
      - name: Keep the decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kernel-bump
          path: ${{ runner.temp }}/kernel-bump/latest.json
          if-no-files-found: error
          retention-days: 7
  build:
    name: Build ${{ matrix.arch }}
    needs:
      - check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-linux-amd64-chonky
          - arch: arm64
            runner: namespace-profile-linux-arm64-macos
      fail-fast: false
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          namespace-cache: "false"
      - name: Take the decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-bump
          path: ${{ runner.temp }}/kernel-bump
      - name: Take the kernel source this run builds
        run: cuenv task -p ci --package ci kernel-apply-bump
      - name: Build the kernel
        id: build
        env:
          KERNEL_ARCH: ${{ matrix.arch }}
        run: cuenv task -p ci --package ci kernel-build
      - name: Keep the kernel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kernel-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  boot:
    name: Boot ${{ matrix.arch }}
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: namespace-profile-linux-amd64-chonky
          - arch: arm64
            runner: namespace-profile-linux-arm64-macos
      fail-fast: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          namespace-cache: "false"
      - name: Take the decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-bump
          path: ${{ runner.temp }}/kernel-bump
      - name: Take the kernel source this run builds
        run: cuenv task -p ci --package ci kernel-apply-bump
      - name: Take the kernel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-${{ matrix.arch }}
          path: dist/
      - name: Boot the kernel
        env:
          KERNEL_ARCH: ${{ matrix.arch }}
        run: cuenv task -p ci --package ci kernel-smoke
  publish:
    name: Publish ${{ needs.check.outputs.tag }}
    needs:
      - check
      - build
      - boot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Download the kernels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kernel-a*
          path: dist/
          merge-multiple: true
      - name: Write the checksums
        run: cuenv task -p ci --package ci kernel-checksums
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/intar-kernel_checksums.txt
      - name: Publish the kernel release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: cuenv task -p ci --package ci kernel-publish
  pin:
    name: Open the pull request that pins ${{ needs.check.outputs.tag }}
    needs:
      - check
      - publish
    if: needs.check.outputs.pin == 'true'
    runs-on: ubuntu-24.04
    environment: release-pr
    timeout-minutes: 30
    steps:
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          namespace-cache: "false"
      - name: Take the decision
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kernel-bump
          path: ${{ runner.temp }}/kernel-bump
      - name: Take the kernel source this run builds
        run: cuenv task -p ci --package ci kernel-apply-bump
      - name: Pin the published kernels and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ needs.check.outputs.tag }}
          KERNEL_RELEASE: ${{ needs.check.outputs.release }}
        run: cuenv task -p ci --package ci kernel-pin-pr
