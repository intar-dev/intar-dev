name: Hetzner provider Worker
run-name: "Hetzner provider @ ${{ github.ref_name }}"

on:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the validated Worker to production
        required: false
        default: false
        type: boolean
      confirmation:
        description: Exact control-plane deployment confirmation
        required: false
        default: ""
        type: string
      single_operator_confirmation:
        description: Exact sole-operator commissioning confirmation
        required: false
        default: ""
        type: string
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_HCLOUD_PROVIDER_API_TOKEN:
        required: false
      PROVIDER_CREDENTIAL_KEK_V1:
        required: false
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/hcloud-provider.yml"
      - "hcloud-provider-worker/**"
      - "website/src/lib/hcloud-provider-service.ts"
      - "website/wrangler.jsonc"

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: namespace-profile-intar-dev
    defaults:
      run:
        working-directory: hcloud-provider-worker
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated Cloudflare types
        run: bun run types:cf:check

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build deploy artifact
        run: bun run build

  deploy:
    name: Deploy production
    if: inputs.deploy == true
    needs: validate
    runs-on: namespace-profile-intar-dev
    environment: production
    concurrency:
      group: hcloud-provider-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: hcloud-provider-worker
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      ACTOR_ID: ${{ github.actor_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Require reviewed main revision
        run: test "${GITHUB_REF}" = "refs/heads/main"

      - name: Verify deployment revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Namespace cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate protected credentials
        env:
          PROVIDER_CREDENTIAL_KEK_V1: ${{ secrets.PROVIDER_CREDENTIAL_KEK_V1 }}
        run: |
          test -n "${PROVIDER_CREDENTIAL_KEK_V1}"
          node -e 'const value = Buffer.from(process.env.PROVIDER_CREDENTIAL_KEK_V1 ?? "", "base64"); if (value.length !== 32) process.exit(1)'

      - name: Verify protected production dispatch immediately before mutation
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = intar-dev/intar-dev
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${CONFIRMATION}" = "DEPLOY WORKSHOP CONTROL PLANE"

          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test -n "${SINGLE_OPERATOR_LOGIN}"
              [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
              [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
              [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
              [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              test "${RUN_ATTEMPT}" = 1
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              printf 'single_operator_expires_at=%s remaining_seconds=%s admin_attestation_age=%s\n' \
                "${SINGLE_OPERATOR_EXPIRES_AT}" "${remaining_seconds}" \
                "${attestation_age}"
              ;;
            *)
              printf 'Unsupported production approval mode: %s\n' \
                "${APPROVAL_MODE:-<unset>}" >&2
              exit 1
              ;;
          esac

          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

          printf 'approval_mode=%s actor=%s\n' "${APPROVAL_MODE}" "${GITHUB_ACTOR}" |
            tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Deploy route-less provider Worker with credential KEK
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HCLOUD_PROVIDER_API_TOKEN }}
          PROVIDER_CREDENTIAL_KEK_V1: ${{ secrets.PROVIDER_CREDENTIAL_KEK_V1 }}
        run: |
          secrets_file="${RUNNER_TEMP}/hcloud-provider-secrets.json"
          trap 'rm -f "${secrets_file}"' EXIT
          jq -n '{PROVIDER_CREDENTIAL_KEK_V1: env.PROVIDER_CREDENTIAL_KEK_V1}' \
            > "${secrets_file}"
          chmod 600 "${secrets_file}"
          bunx wrangler deploy --config wrangler.jsonc --secrets-file "${secrets_file}"
