# Generated from ci/workflows/docs.cue by cuenv; do not edit manually.
# Regenerate with: cuenv sync codegen
name: Docs
run-name: '${{ github.event_name == ''pull_request'' && format(''Docs validate PR #{0}'', github.event.pull_request.number) || github.ref != ''refs/heads/main'' && format(''Docs validate {0} @ {1}'', github.ref_name, github.sha) || format(''Docs deploy main @ {0}'', github.sha) }}'
"on":
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - .github/actions/setup-runtime/**
      - apps/web/.node-version
      - docs/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - .github/actions/setup-runtime/**
      - apps/web/.node-version
      - docs/**
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: docs
jobs:
  build:
    name: Test and build
    runs-on: namespace-profile-intar-dev
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up the CI runtime
        uses: ./.github/actions/setup-runtime
      - name: Install docs dependencies
        run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run build
      - name: Validate Cloudflare deployment
        run: bunx --no-install wrangler deploy --dry-run
      - name: Upload tested docs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-dist-${{ github.sha }}
          path: docs/dist
          overwrite: true
          if-no-files-found: error
          retention-days: 1
  deploy:
    name: Deploy production
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: namespace-profile-intar-dev
    environment:
      name: production
      url: https://docs.intar.dev
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download tested docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-dist-${{ github.sha }}
          path: docs/dist
      - name: Set up the CI runtime
        uses: ./.github/actions/setup-runtime
      - name: Install docs deployment dependencies
        run: bun install --frozen-lockfile
      - name: Deploy docs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx --no-install wrangler deploy
