name: Clean D1 cutover
run-name: "Clean D1 ${{ inputs.operation }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Review, apply, or roll back the clean-slate cutover
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - bootstrap-owner
          - rollback
      database_name:
        description: Explicit name of the new clean production database
        required: true
        default: intar-dev-control-plane-v2-20260801
        type: string
      expected_database_id:
        description: Optional expected new D1 UUID; required when the database already exists
        required: false
        default: ""
        type: string
      previous_database_id:
        description: Old production D1 UUID required for the apply drain gate and rollback
        required: false
        default: 6e715506-88ce-4565-85bc-66a9cf2a3c5e
        type: string
      previous_web_version_id:
        description: Exact previous intar-dev Worker version for rollback
        required: false
        default: ""
        type: string
      issuance_disabled:
        description: Confirm new Workshop issuance is disabled before rollback
        required: false
        default: false
        type: boolean
      bootstrap_owner_github_login:
        description: Exact GitHub login of the sole clean-database owner
        required: false
        default: ""
        type: string
      bootstrap_owner_github_id:
        description: Exact numeric GitHub user ID of the sole clean-database owner
        required: false
        default: ""
        type: string
      apply_run_id:
        description: Successful first-attempt apply workflow run ID; required only for bootstrap-owner
        required: false
        default: ""
        type: string
      single_operator_confirmation:
        description: Type SINGLE OPERATOR WORKSHOP CONTROL PLANE only when that protected mode is active
        required: false
        default: ""
        type: string
      confirmation:
        description: Type PLAN CLEAN D1, APPLY CLEAN D1, BOOTSTRAP CLEAN D1 OWNER, or ROLLBACK CLEAN D1
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.operation == 'plan' && format('clean-d1-plan-{0}', github.run_id) || 'intar-control-plane-production' }}
  cancel-in-progress: false
  queue: max

jobs:
  cutover:
    name: ${{ inputs.operation }} clean production D1
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATION: ${{ inputs.operation }}
      DATABASE_NAME: ${{ inputs.database_name }}
      EXPECTED_DATABASE_ID: ${{ inputs.expected_database_id }}
      PREVIOUS_DATABASE_ID: ${{ inputs.previous_database_id }}
      PREVIOUS_WEB_VERSION_ID: ${{ inputs.previous_web_version_id }}
      ISSUANCE_DISABLED: ${{ inputs.issuance_disabled }}
      BOOTSTRAP_OWNER_GITHUB_LOGIN: ${{ inputs.bootstrap_owner_github_login }}
      BOOTSTRAP_OWNER_GITHUB_ID: ${{ inputs.bootstrap_owner_github_id }}
      APPLY_RUN_ID: ${{ inputs.apply_run_id }}
      APPROVAL_MODE: ${{ vars.STARGATE_DEPLOY_APPROVAL_MODE }}
      SINGLE_OPERATOR_LOGIN: ${{ vars.STARGATE_SINGLE_OPERATOR_LOGIN }}
      SINGLE_OPERATOR_ID: ${{ vars.STARGATE_SINGLE_OPERATOR_ID }}
      SINGLE_OPERATOR_EXPIRES_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_EXPIRES_AT }}
      SINGLE_OPERATOR_ADMIN_ATTESTED_AT: ${{ vars.STARGATE_SINGLE_OPERATOR_ADMIN_ATTESTED_AT }}
      SINGLE_OPERATOR_CONFIRMATION: ${{ inputs.single_operator_confirmation }}
      ACTOR_ID: ${{ github.actor_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      STARGATE_DEPLOY_HOST: ${{ vars.STARGATE_DEPLOY_HOST }}
      STARGATE_DEPLOY_PORT: ${{ vars.STARGATE_DEPLOY_PORT }}
      STARGATE_DEPLOY_USER: ${{ vars.STARGATE_DEPLOY_USER }}
    steps:
      - name: Checkout exact main revision
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate protected request
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "intar-dev/intar-dev"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          [[ "${DATABASE_NAME}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          case "${OPERATION}" in
            plan)
              test "${CONFIRMATION}" = "PLAN CLEAN D1"
              test -z "${APPLY_RUN_ID}"
              ;;
            apply)
              test "${CONFIRMATION}" = "APPLY CLEAN D1"
              [[ "${PREVIOUS_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              test -z "${APPLY_RUN_ID}"
              ;;
            bootstrap-owner)
              test "${CONFIRMATION}" = "BOOTSTRAP CLEAN D1 OWNER"
              [[ "${EXPECTED_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              [[ "${APPLY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
              test "${APPLY_RUN_ID}" != "${GITHUB_RUN_ID}"
              ;;
            rollback)
              test "${CONFIRMATION}" = "ROLLBACK CLEAN D1"
              test "${ISSUANCE_DISABLED}" = true
              [[ "${PREVIOUS_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              [[ "${PREVIOUS_WEB_VERSION_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              test -z "${APPLY_RUN_ID}"
              ;;
            *) exit 1 ;;
          esac

          if [ "${OPERATION}" != plan ]; then
            environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
            case "${APPROVAL_MODE}" in
              reviewed)
                test -z "${SINGLE_OPERATOR_CONFIRMATION}"
                jq -e '
                  .can_admins_bypass == false and
                  any(
                    .protection_rules[]?;
                      .type == "required_reviewers" and
                      .prevent_self_review == true and
                      ((.reviewers // []) | length) > 0
                  )
                ' <<<"${environment_json}" >/dev/null
                ;;
              single-operator)
                test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                  "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
                test -n "${SINGLE_OPERATOR_LOGIN}"
                [[ "${SINGLE_OPERATOR_LOGIN}" =~ ^[A-Za-z0-9-]{1,39}$ ]]
                [[ "${SINGLE_OPERATOR_LOGIN}" != -* ]]
                [[ "${SINGLE_OPERATOR_LOGIN}" != *- ]]
                [[ "${SINGLE_OPERATOR_ID}" =~ ^[0-9]+$ ]]
                [[ "${SINGLE_OPERATOR_EXPIRES_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
                [[ "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
                test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
                test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
                test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
                triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
                jq -e \
                  --arg login "${SINGLE_OPERATOR_LOGIN}" \
                  --arg id "${SINGLE_OPERATOR_ID}" '
                    .type == "User" and
                    .login == $login and
                    ((.id | tostring) == $id)
                  ' <<<"${triggering_actor_json}" >/dev/null
                jq -e '
                  ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
                ' <<<"${environment_json}" >/dev/null
                now_epoch="$(date -u +%s)"
                expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
                attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
                remaining_seconds="$((expires_epoch - now_epoch))"
                attestation_age="$((now_epoch - attested_epoch))"
                test "${remaining_seconds}" -gt 0
                test "${remaining_seconds}" -le 604800
                test "${attestation_age}" -ge 0
                test "${attestation_age}" -le 900
                ;;
              *)
                printf 'Unsupported production approval mode: %s\n' \
                  "${APPROVAL_MODE:-<unset>}" >&2
                exit 1
                ;;
            esac

            branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
            jq -e '
              (.branch_policies // .) as $policies |
              ($policies | length) == 1 and
              $policies[0].type == "branch" and
              $policies[0].name == "main"
            ' <<<"${branch_policies}" >/dev/null
          else
            test -z "${SINGLE_OPERATOR_CONFIRMATION}"
          fi

          if [ "${OPERATION}" = apply ] || [ "${OPERATION}" = bootstrap-owner ]; then
            identity="$(
              bun tools/bootstrap/clean-owner-bootstrap.ts identity \
                "${BOOTSTRAP_OWNER_GITHUB_LOGIN}" \
                "${BOOTSTRAP_OWNER_GITHUB_ID}"
            )"
            canonical_login="$(jq -r '.githubLogin' <<<"${identity}")"
            canonical_id="$(jq -r '.githubId' <<<"${identity}")"
            test "${canonical_login}" = "${GITHUB_ACTOR,,}"
            test "${canonical_id}" = "${ACTOR_ID}"
            actor_json="$(gh api "users/${BOOTSTRAP_OWNER_GITHUB_LOGIN}")"
            jq -e \
              --arg login "${canonical_login}" \
              --arg id "${canonical_id}" '
                .type == "User" and
                ((.login | ascii_downcase) == $login) and
                ((.id | tostring) == $id)
              ' <<<"${actor_json}" >/dev/null
          else
            test -z "${BOOTSTRAP_OWNER_GITHUB_LOGIN}"
            test -z "${BOOTSTRAP_OWNER_GITHUB_ID}"
          fi

      - name: Restore shared Bun cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install the root workspace
        run: bun install --frozen-lockfile

      - name: Validate the single clean baseline locally
        run: |
          set -euo pipefail
          mapfile -t migrations < <(
            find apps/web/migrations -mindepth 1 -maxdepth 1 \
              -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort
          )
          test "${#migrations[@]}" = 1
          test "${migrations[0]}" = 0000_clean_multicloud.sql
          rm -rf apps/web/.wrangler/clean-ci-state
          bunx wrangler d1 migrations apply DB \
            --local \
            --config apps/web/wrangler.local.jsonc \
            --persist-to apps/web/.wrangler/clean-ci-state
          schema_sql="SELECT type, name, tbl_name, sql FROM sqlite_schema WHERE type IN ('table', 'index', 'trigger', 'view') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name != 'd1_migrations' ORDER BY type, name"
          bunx wrangler d1 execute DB \
            --local \
            --config apps/web/wrangler.local.jsonc \
            --persist-to apps/web/.wrangler/clean-ci-state \
            --command "${schema_sql}" \
            --json > "${RUNNER_TEMP}/clean-d1-local-schema.json"
          sha256sum apps/web/migrations/0000_clean_multicloud.sql \
            | tee "${RUNNER_TEMP}/clean-d1-baseline.sha256"

      - name: Rehearse the clean bootstrap twice
        run: bun run check:bootstrap

      - name: Verify first-owner bootstrap fences
        run: bun run check:clean-owner-bootstrap

      - name: Verify exact binding, maintenance, and provider-inventory fences
        run: |
          set -euo pipefail
          bash -n \
            tools/cutover/configure-stargate-ssh.sh \
            tools/cutover/deploy-maintenance-fence.sh \
            tools/cutover/prove-legacy-drain.sh
          bun run check:cutover

      - name: Inventory D1 without mutation
        id: inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          inventory="${RUNNER_TEMP}/d1-before.json"
          bunx wrangler d1 list --json > "${inventory}"
          count="$(jq --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)] | length' "${inventory}")"
          test "${count}" -le 1
          observed_id="$(jq -r --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)][0].uuid // [.[] | select(.name == $name)][0].id // ""' "${inventory}")"
          previous_count="$(jq --arg id "${PREVIOUS_DATABASE_ID}" '[.[] | select((.uuid // .id) == $id)] | length' "${inventory}")"
          previous_name="$(jq -r --arg id "${PREVIOUS_DATABASE_ID}" '[.[] | select((.uuid // .id) == $id)][0].name // ""' "${inventory}")"
          if [ "${count}" = 1 ] && [ "${OPERATION}" = apply ]; then
            test -n "${EXPECTED_DATABASE_ID}"
          fi
          if [ -n "${EXPECTED_DATABASE_ID}" ]; then
            [[ "${EXPECTED_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            if [ -n "${observed_id}" ]; then
              test "${observed_id}" = "${EXPECTED_DATABASE_ID}"
            fi
          fi
          if [ "${OPERATION}" = apply ]; then
            test "${previous_count}" = 1
            test -n "${previous_name}"
            test "${observed_id:-not-created}" != "${PREVIOUS_DATABASE_ID}"
            test "${EXPECTED_DATABASE_ID:-not-provided}" != "${PREVIOUS_DATABASE_ID}"
          fi
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "database_id=${observed_id}" >> "${GITHUB_OUTPUT}"
          echo "previous_database_name=${previous_name}" >> "${GITHUB_OUTPUT}"
          {
            printf 'operation=%s\n' "${OPERATION}"
            printf 'database_name=%s\n' "${DATABASE_NAME}"
            printf 'database_present=%s\n' "${count}"
            printf 'database_id=%s\n' "${observed_id:-<not-created>}"
            printf 'baseline_sha256='
            cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Write immutable plan evidence
        if: ${{ inputs.operation == 'plan' }}
        run: |
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg database_id "${{ steps.inventory.outputs.database_id }}" \
            --arg baseline_sha256 "$(cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256")" \
            '{schema_version: 1, operation: "plan", source_sha: $source_sha, database_name: $database_name, database_id: $database_id, baseline_sha256: $baseline_sha256, mutates_production: false}' \
            > "${RUNNER_TEMP}/clean-d1-plan.json"

      - name: Upload plan evidence
        if: ${{ inputs.operation == 'plan' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-plan-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-d1-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Recheck protected mutation window
        if: ${{ inputs.operation != 'plan' }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "intar-dev/intar-dev"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          environment_json="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production")"
          case "${APPROVAL_MODE}" in
            reviewed)
              test -z "${SINGLE_OPERATOR_CONFIRMATION}"
              jq -e '
                .can_admins_bypass == false and
                any(
                  .protection_rules[]?;
                    .type == "required_reviewers" and
                    .prevent_self_review == true and
                    ((.reviewers // []) | length) > 0
                )
              ' <<<"${environment_json}" >/dev/null
              ;;
            single-operator)
              test "${SINGLE_OPERATOR_CONFIRMATION}" = \
                "SINGLE OPERATOR WORKSHOP CONTROL PLANE"
              test "${GITHUB_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${GITHUB_TRIGGERING_ACTOR}" = "${SINGLE_OPERATOR_LOGIN}"
              test "${ACTOR_ID}" = "${SINGLE_OPERATOR_ID}"
              triggering_actor_json="$(gh api "users/${GITHUB_TRIGGERING_ACTOR}")"
              jq -e \
                --arg login "${SINGLE_OPERATOR_LOGIN}" \
                --arg id "${SINGLE_OPERATOR_ID}" '
                  .type == "User" and
                  .login == $login and
                  ((.id | tostring) == $id)
                ' <<<"${triggering_actor_json}" >/dev/null
              jq -e '
                ([.protection_rules[]? | select(.type == "required_reviewers")] | length) == 0
              ' <<<"${environment_json}" >/dev/null
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${SINGLE_OPERATOR_EXPIRES_AT}" +%s)"
              attested_epoch="$(date -u -d "${SINGLE_OPERATOR_ADMIN_ATTESTED_AT}" +%s)"
              remaining_seconds="$((expires_epoch - now_epoch))"
              attestation_age="$((now_epoch - attested_epoch))"
              test "${remaining_seconds}" -gt 0
              test "${remaining_seconds}" -le 604800
              test "${attestation_age}" -ge 0
              test "${attestation_age}" -le 900
              ;;
            *) exit 1 ;;
          esac
          branch_policies="$(gh api "repos/${GITHUB_REPOSITORY}/environments/production/deployment-branch-policies")"
          jq -e '
            (.branch_policies // .) as $policies |
            ($policies | length) == 1 and
            $policies[0].type == "branch" and
            $policies[0].name == "main"
          ' <<<"${branch_policies}" >/dev/null

      - name: Configure the pinned, restricted Stargate drain probe
        if: ${{ inputs.operation == 'apply' }}
        env:
          STARGATE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.STARGATE_DEPLOY_SSH_PRIVATE_KEY }}
          STARGATE_DEPLOY_KNOWN_HOSTS: ${{ secrets.STARGATE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          config="$(tools/cutover/configure-stargate-ssh.sh "${RUNNER_TEMP}/intar-stargate-ssh")"
          test "${config}" = "${RUNNER_TEMP}/intar-stargate-ssh/config"
          printf 'STARGATE_SSH_CONFIG=%s\n' "${config}" >> "${GITHUB_ENV}"

      - name: Prove the old control plane is initially drained
        if: ${{ inputs.operation == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
          CLOUDFLARE_PROVIDER_PROBE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
          PREVIOUS_DATABASE_NAME: ${{ steps.inventory.outputs.previous_database_name }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_D1_API_TOKEN}"
          test -n "${CLOUDFLARE_PROVIDER_PROBE_API_TOKEN}"
          test -n "${PREVIOUS_DATABASE_NAME}"
          test -f "${STARGATE_SSH_CONFIG}"
          tools/cutover/prove-legacy-drain.sh \
            "${PREVIOUS_DATABASE_NAME}" \
            "${PREVIOUS_DATABASE_ID}" \
            initial \
            "${RUNNER_TEMP}/clean-d1-legacy-drain-initial.json"
          jq . "${RUNNER_TEMP}/clean-d1-legacy-drain-initial.json" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Atomically replace the old web with a maintenance fence
        if: ${{ inputs.operation == 'apply' }}
        id: maintenance_fence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
          EXPECTED_PREVIOUS_WEB_VERSION_ID: ${{ inputs.previous_web_version_id }}
          PREVIOUS_DATABASE_NAME: ${{ steps.inventory.outputs.previous_database_name }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          tools/cutover/deploy-maintenance-fence.sh \
            "${PREVIOUS_DATABASE_NAME}" \
            "${PREVIOUS_DATABASE_ID}" \
            "${RUNNER_TEMP}/clean-d1-maintenance-fence.json"
          previous_version_id="$(jq -r '.previous_version_id' "${RUNNER_TEMP}/clean-d1-maintenance-fence.json")"
          maintenance_version_id="$(jq -r '.maintenance_version_id' "${RUNNER_TEMP}/clean-d1-maintenance-fence.json")"
          echo "previous_version_id=${previous_version_id}" >> "${GITHUB_OUTPUT}"
          echo "maintenance_version_id=${maintenance_version_id}" >> "${GITHUB_OUTPUT}"
          jq . "${RUNNER_TEMP}/clean-d1-maintenance-fence.json" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Quiesce old requests and repeat the complete drain under the fence
        if: ${{ inputs.operation == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
          CLOUDFLARE_PROVIDER_PROBE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
          PREVIOUS_DATABASE_NAME: ${{ steps.inventory.outputs.previous_database_name }}
        run: |
          set -euo pipefail
          test -f "${STARGATE_SSH_CONFIG}"
          for pass in 1 2; do
            sleep 15
            tools/cutover/prove-legacy-drain.sh \
              "${PREVIOUS_DATABASE_NAME}" \
              "${PREVIOUS_DATABASE_ID}" \
              "fenced-${pass}" \
              "${RUNNER_TEMP}/clean-d1-legacy-drain-fenced-${pass}.json"
          done
          cp "${RUNNER_TEMP}/clean-d1-legacy-drain-fenced-2.json" \
            "${RUNNER_TEMP}/clean-d1-legacy-drain.json"
          jq . "${RUNNER_TEMP}/clean-d1-legacy-drain.json" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload old-control-plane drain evidence
        if: ${{ always() && inputs.operation == 'apply' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-legacy-drain-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clean-d1-legacy-drain-initial.json
            ${{ runner.temp }}/clean-d1-maintenance-fence.json
            ${{ runner.temp }}/clean-d1-legacy-drain-fenced-1.json
            ${{ runner.temp }}/clean-d1-legacy-drain-fenced-2.json
            ${{ runner.temp }}/clean-d1-legacy-drain.json
          if-no-files-found: warn
          retention-days: 90

      - name: Create the clean D1 when absent
        if: ${{ inputs.operation == 'apply' && steps.inventory.outputs.count == '0' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: bunx wrangler d1 create "${DATABASE_NAME}" --location weur

      - name: Resolve and validate the apply target
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'bootstrap-owner' }}
        id: target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/d1-apply.json"
          bunx wrangler d1 list --json > "${inventory}"
          count="$(jq --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)] | length' "${inventory}")"
          test "${count}" = 1
          database_id="$(jq -r --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)][0].uuid // [.[] | select(.name == $name)][0].id' "${inventory}")"
          [[ "${database_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          test "${database_id}" != "${PREVIOUS_DATABASE_ID}"
          if [ -n "${EXPECTED_DATABASE_ID}" ]; then
            test "${database_id}" = "${EXPECTED_DATABASE_ID}"
          fi
          echo "database_id=${database_id}" >> "${GITHUB_OUTPUT}"
          jq -n \
            --arg name "${DATABASE_NAME}" \
            --arg id "${database_id}" \
            '{name: "intar-clean-d1-cutover", compatibility_date: "2026-07-09", d1_databases: [{binding: "DB", database_name: $name, database_id: $id, migrations_dir: "migrations"}]}' \
            > apps/web/wrangler.cutover.json

      - name: Apply or resume the exact baseline and owner commissioning
        if: ${{ inputs.operation == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          baseline_file="apps/web/migrations/0000_clean_multicloud.sql"
          baseline_sha256="$(cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256")"
          database_id="${{ steps.target.outputs.database_id }}"
          identity="$(
            bun tools/bootstrap/clean-owner-bootstrap.ts identity \
              "${BOOTSTRAP_OWNER_GITHUB_LOGIN}" \
              "${BOOTSTRAP_OWNER_GITHUB_ID}"
          )"
          canonical_login="$(jq -r '.githubLogin' <<<"${identity}")"
          canonical_id="$(jq -r '.githubId' <<<"${identity}")"
          provenance=(
            "${canonical_login}"
            "${canonical_id}"
            "${DATABASE_NAME}"
            "${database_id}"
            "${baseline_sha256}"
            "${GITHUB_SHA}"
            "${GITHUB_RUN_ID}"
          )

          presence="${RUNNER_TEMP}/clean-d1-schema-presence.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "SELECT (SELECT count(*) FROM sqlite_schema WHERE type = 'table' AND name = 'd1_migrations') AS migration_table_count, (SELECT count(*) FROM sqlite_schema WHERE type IN ('table', 'index', 'trigger', 'view') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name != 'd1_migrations') AS application_object_count" \
            --json > "${presence}"
          jq -e '
            length == 1 and
            .[0].success == true and
            (.[0].results | length) == 1 and
            (.[0].results[0].migration_table_count == 0 or .[0].results[0].migration_table_count == 1) and
            .[0].results[0].application_object_count >= 0
          ' "${presence}" >/dev/null
          migration_table_count="$(jq -r '.[0].results[0].migration_table_count' "${presence}")"
          application_object_count="$(jq -r '.[0].results[0].application_object_count' "${presence}")"
          if [ "${application_object_count}" = 0 ]; then
            if [ "${migration_table_count}" = 1 ]; then
              empty_ledger="${RUNNER_TEMP}/clean-d1-empty-ledger.json"
              bunx wrangler d1 execute DB \
                --remote \
                --config apps/web/wrangler.cutover.json \
                --command "SELECT name FROM d1_migrations ORDER BY id" \
                --json > "${empty_ledger}"
              jq -e \
                'length == 1 and .[0].success == true and (.[0].results | length) == 0' \
                "${empty_ledger}" >/dev/null
            fi
            bunx wrangler d1 migrations apply DB \
              --remote \
              --config apps/web/wrangler.cutover.json
          else
            test "${migration_table_count}" = 1
          fi

          remote_schema="${RUNNER_TEMP}/clean-d1-remote-schema.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "SELECT type, name, tbl_name, sql FROM sqlite_schema WHERE type IN ('table', 'index', 'trigger', 'view') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name != 'd1_migrations' ORDER BY type, name" \
            --json > "${remote_schema}"
          bun tools/bootstrap/clean-owner-bootstrap.ts \
            assert-baseline-inventory \
            "${remote_schema}" \
            "${RUNNER_TEMP}/clean-d1-local-schema.json"
          ledger="${RUNNER_TEMP}/clean-d1-ledger.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "SELECT name FROM d1_migrations ORDER BY id" \
            --json > "${ledger}"
          jq -e '
            length == 1 and
            .[0].success == true and
            (.[0].results | length) == 1 and
            .[0].results[0].name == "0000_clean_multicloud.sql"
          ' "${ledger}" >/dev/null

          table_counts_sql="${RUNNER_TEMP}/clean-d1-table-counts.sql"
          table_counts_before="${RUNNER_TEMP}/clean-d1-table-counts-before.json"
          bun tools/bootstrap/clean-owner-bootstrap.ts table-counts-sql \
            "${baseline_file}" > "${table_counts_sql}"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "$(<"${table_counts_sql}")" \
            --json > "${table_counts_before}"
          bun tools/bootstrap/clean-owner-bootstrap.ts \
            assert-apply-table-counts \
            "${table_counts_before}" \
            "${baseline_file}" \
            resumable

          state_sql="${RUNNER_TEMP}/clean-owner-state.sql"
          commissioning_sql="${RUNNER_TEMP}/clean-owner-commissioning.sql"
          before_commissioning="${RUNNER_TEMP}/clean-owner-before-commissioning.json"
          after_commissioning="${RUNNER_TEMP}/clean-owner-after-commissioning.json"
          bun tools/bootstrap/clean-owner-bootstrap.ts state-sql \
            "${canonical_login}" \
            "${canonical_id}" > "${state_sql}"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "$(<"${state_sql}")" \
            --json > "${before_commissioning}"
          bun tools/bootstrap/clean-owner-bootstrap.ts assert-resumable \
            "${before_commissioning}" \
            "${provenance[@]}"
          previous_apply_run_id="$(
            jq -r '.[0].results[0].commissioning_apply_run_id // ""' \
              "${before_commissioning}"
          )"
          if [ -n "${previous_apply_run_id}" ]; then
            test "${previous_apply_run_id}" != "${GITHUB_RUN_ID}"
            current_workflow_id="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                --jq '.workflow_id'
            )"
            [[ "${current_workflow_id}" =~ ^[1-9][0-9]*$ ]]
            previous_run="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_apply_run_id}"
            )"
            jq -e \
              --arg sha "${GITHUB_SHA}" \
              --argjson current_run_id "${GITHUB_RUN_ID}" \
              --argjson workflow_id "${current_workflow_id}" '
                .repository.full_name == "intar-dev/intar-dev" and
                .workflow_id == $workflow_id and
                .event == "workflow_dispatch" and
                .head_branch == "main" and
                .head_sha == $sha and
                .run_attempt == 1 and
                .status == "completed" and
                (.conclusion | IN("failure", "cancelled", "timed_out", "action_required", "stale", "startup_failure")) and
                .id != $current_run_id
              ' <<<"${previous_run}" >/dev/null
          fi
          bun tools/bootstrap/clean-owner-bootstrap.ts resume-sql \
            "${before_commissioning}" \
            "${provenance[@]}" > "${commissioning_sql}"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --file "${commissioning_sql}" \
            --yes >/dev/null
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "$(<"${state_sql}")" \
            --json > "${after_commissioning}"
          bun tools/bootstrap/clean-owner-bootstrap.ts assert-seeded \
            "${after_commissioning}" \
            "${provenance[@]}"
          table_counts_after="${RUNNER_TEMP}/clean-d1-table-counts-after.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "$(<"${table_counts_sql}")" \
            --json > "${table_counts_after}"
          bun tools/bootstrap/clean-owner-bootstrap.ts \
            assert-apply-table-counts \
            "${table_counts_after}" \
            "${baseline_file}" \
            seeded
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg database_id "${database_id}" \
            --arg bootstrap_owner_github_login "${canonical_login}" \
            --arg bootstrap_owner_github_id "${canonical_id}" \
            --arg baseline_sha256 "${baseline_sha256}" \
            --arg apply_run_id "${GITHUB_RUN_ID}" \
            --argjson apply_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg previous_database_name "${{ steps.inventory.outputs.previous_database_name }}" \
            --arg previous_database_id "${PREVIOUS_DATABASE_ID}" \
            --arg previous_web_version_id "${{ steps.maintenance_fence.outputs.previous_version_id }}" \
            --arg maintenance_web_version_id "${{ steps.maintenance_fence.outputs.maintenance_version_id }}" \
            --slurpfile legacy_drain "${RUNNER_TEMP}/clean-d1-legacy-drain.json" \
            --slurpfile maintenance_fence "${RUNNER_TEMP}/clean-d1-maintenance-fence.json" \
            '{schema_version: 3, operation: "apply", source_sha: $source_sha, database_name: $database_name, database_id: $database_id, baseline_sha256: $baseline_sha256, bootstrap_owner_github_login: $bootstrap_owner_github_login, bootstrap_owner_github_id: $bootstrap_owner_github_id, apply_run_id: $apply_run_id, apply_run_attempt: $apply_run_attempt, commissioning_id: "first-owner-v1", commissioning_status: "allowlisted", bootstrap_owner_allowlisted: true, previous_database_name: $previous_database_name, previous_database_id: $previous_database_id, previous_web_version_id: $previous_web_version_id, maintenance_web_version_id: $maintenance_web_version_id, maintenance_fence: $maintenance_fence[0], legacy_drain: $legacy_drain[0], old_database_deleted: false}' \
            > "${RUNNER_TEMP}/clean-d1-apply.json"

      - name: Upload apply evidence
        if: ${{ inputs.operation == 'apply' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-apply-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-d1-apply.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify the successful apply run and immutable evidence
        if: ${{ inputs.operation == 'bootstrap-owner' }}
        id: apply_provenance
        run: |
          set -euo pipefail
          identity="$(
            bun tools/bootstrap/clean-owner-bootstrap.ts identity \
              "${BOOTSTRAP_OWNER_GITHUB_LOGIN}" \
              "${BOOTSTRAP_OWNER_GITHUB_ID}"
          )"
          canonical_login="$(jq -r '.githubLogin' <<<"${identity}")"
          canonical_id="$(jq -r '.githubId' <<<"${identity}")"
          baseline_sha256="$(cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256")"
          current_workflow_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --jq '.workflow_id'
          )"
          [[ "${current_workflow_id}" =~ ^[1-9][0-9]*$ ]]
          apply_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}"
          )"
          jq -e \
            --argjson run_id "${APPLY_RUN_ID}" \
            --argjson workflow_id "${current_workflow_id}" \
            --arg sha "${GITHUB_SHA}" \
            --arg login "${canonical_login}" \
            --arg id "${canonical_id}" '
              .id == $run_id and
              .workflow_id == $workflow_id and
              .repository.full_name == "intar-dev/intar-dev" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $sha and
              .run_attempt == 1 and
              .status == "completed" and
              .conclusion == "success" and
              ((.actor.login | ascii_downcase) == $login) and
              ((.actor.id | tostring) == $id) and
              ((.triggering_actor.login | ascii_downcase) == $login) and
              ((.triggering_actor.id | tostring) == $id)
            ' <<<"${apply_run}" >/dev/null

          artifact_name="clean-d1-apply-${GITHUB_SHA}-${APPLY_RUN_ID}"
          artifacts="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}/artifacts" \
              -f name="${artifact_name}" \
              -f per_page=100
          )"
          jq -e \
            --arg name "${artifact_name}" '
              .total_count == 1 and
              (.artifacts | length) == 1 and
              .artifacts[0].name == $name and
              .artifacts[0].expired == false and
              (.artifacts[0].digest | test("^sha256:[0-9a-f]{64}$"))
            ' <<<"${artifacts}" >/dev/null
          artifact_id="$(jq -r '.artifacts[0].id' <<<"${artifacts}")"
          artifact_digest="$(jq -r '.artifacts[0].digest' <<<"${artifacts}")"
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
          evidence_dir="${RUNNER_TEMP}/successful-apply-evidence"
          mkdir -p "${evidence_dir}"
          gh run download "${APPLY_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact_name}" \
            --dir "${evidence_dir}"
          evidence="${evidence_dir}/clean-d1-apply.json"
          test -f "${evidence}"
          jq -e \
            --arg source_sha "${GITHUB_SHA}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg database_id "${{ steps.target.outputs.database_id }}" \
            --arg baseline_sha256 "${baseline_sha256}" \
            --arg login "${canonical_login}" \
            --arg id "${canonical_id}" \
            --arg apply_run_id "${APPLY_RUN_ID}" '
              .schema_version == 3 and
              .operation == "apply" and
              .source_sha == $source_sha and
              .database_name == $database_name and
              .database_id == $database_id and
              .baseline_sha256 == $baseline_sha256 and
              .bootstrap_owner_github_login == $login and
              .bootstrap_owner_github_id == $id and
              .apply_run_id == $apply_run_id and
              .apply_run_attempt == 1 and
              .commissioning_id == "first-owner-v1" and
              .commissioning_status == "allowlisted" and
              .bootstrap_owner_allowlisted == true and
              (.previous_database_id | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              (.previous_web_version_id | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              (.maintenance_web_version_id | test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) and
              .maintenance_web_version_id != .previous_web_version_id and
              .maintenance_fence.state == "active" and
              .maintenance_fence.database_id == .previous_database_id and
              .maintenance_fence.previous_version_id == .previous_web_version_id and
              .maintenance_fence.maintenance_version_id == .maintenance_web_version_id and
              .maintenance_fence.previous_version_binding_proven == true and
              .maintenance_fence.maintenance_version_binding_proven == true and
              .legacy_drain.schema_version == 3 and
              .legacy_drain.query_succeeded == true and
              .legacy_drain.provider_probe_succeeded == true and
              .legacy_drain.stargate_probe_succeeded == true and
              .legacy_drain.provider_inventory.provenEmpty == true and
              .legacy_drain.stargate.healthy == true and
              .legacy_drain.stargate.drained == true and
              .legacy_drain.drained == true and
              .old_database_deleted == false
            ' "${evidence}" >/dev/null
          echo "artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_digest=${artifact_digest}" >> "${GITHUB_OUTPUT}"

      - name: Promote the sole signed-in clean-database owner
        if: ${{ inputs.operation == 'bootstrap-owner' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          identity="$(
            bun tools/bootstrap/clean-owner-bootstrap.ts identity \
              "${BOOTSTRAP_OWNER_GITHUB_LOGIN}" \
              "${BOOTSTRAP_OWNER_GITHUB_ID}"
          )"
          canonical_login="$(jq -r '.githubLogin' <<<"${identity}")"
          canonical_id="$(jq -r '.githubId' <<<"${identity}")"
          baseline_sha256="$(cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256")"
          provenance=(
            "${canonical_login}"
            "${canonical_id}"
            "${DATABASE_NAME}"
            "${{ steps.target.outputs.database_id }}"
            "${baseline_sha256}"
            "${GITHUB_SHA}"
            "${APPLY_RUN_ID}"
          )
          state_sql="${RUNNER_TEMP}/clean-owner-state.sql"
          finalize_sql="${RUNNER_TEMP}/clean-owner-finalize.sql"
          before_finalize="${RUNNER_TEMP}/clean-owner-before-finalize.json"
          after_finalize="${RUNNER_TEMP}/clean-owner-after-finalize.json"
          bun tools/bootstrap/clean-owner-bootstrap.ts state-sql \
            "${canonical_login}" \
            "${canonical_id}" > "${state_sql}"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "$(<"${state_sql}")" \
            --json > "${before_finalize}"
          owner_user_id="$(
            bun tools/bootstrap/clean-owner-bootstrap.ts assert-finalizable \
              "${before_finalize}" \
              "${provenance[@]}"
          )"
          bun tools/bootstrap/clean-owner-bootstrap.ts finalize-sql \
            "${canonical_login}" \
            "${canonical_id}" \
            "${owner_user_id}" \
            "${DATABASE_NAME}" \
            "${{ steps.target.outputs.database_id }}" \
            "${baseline_sha256}" \
            "${GITHUB_SHA}" \
            "${APPLY_RUN_ID}" > "${finalize_sql}"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --file "${finalize_sql}" \
            --yes >/dev/null
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "$(<"${state_sql}")" \
            --json > "${after_finalize}"
          verified_user_id="$(
            bun tools/bootstrap/clean-owner-bootstrap.ts assert-finalized \
              "${after_finalize}" \
              "${provenance[@]}"
          )"
          test "${verified_user_id}" = "${owner_user_id}"
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg database_id "${{ steps.target.outputs.database_id }}" \
            --arg bootstrap_owner_github_login "${canonical_login}" \
            --arg bootstrap_owner_github_id "${canonical_id}" \
            --arg owner_user_id "${owner_user_id}" \
            --arg baseline_sha256 "${baseline_sha256}" \
            --arg apply_run_id "${APPLY_RUN_ID}" \
            --arg apply_artifact_id "${{ steps.apply_provenance.outputs.artifact_id }}" \
            --arg apply_artifact_digest "${{ steps.apply_provenance.outputs.artifact_digest }}" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version: 2, operation: "bootstrap-owner", source_sha: $source_sha, database_name: $database_name, database_id: $database_id, baseline_sha256: $baseline_sha256, bootstrap_owner_github_login: $bootstrap_owner_github_login, bootstrap_owner_github_id: $bootstrap_owner_github_id, owner_user_id: $owner_user_id, provider_id: "github", account_id: $bootstrap_owner_github_id, role: "admin", commissioning_id: "first-owner-v1", commissioning_status: "owner_finalized", apply_run_id: $apply_run_id, apply_run_attempt: 1, apply_artifact_id: $apply_artifact_id, apply_artifact_digest: $apply_artifact_digest, organization_count: 0, member_count: 0, completed_at: $completed_at}' \
            > "${RUNNER_TEMP}/clean-d1-bootstrap-owner.json"

      - name: Upload first-owner bootstrap evidence
        if: ${{ inputs.operation == 'bootstrap-owner' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-bootstrap-owner-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-d1-bootstrap-owner.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify the rollback unit
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          inventory="${RUNNER_TEMP}/d1-before.json"
          version="${RUNNER_TEMP}/web-rollback-version.json"
          jq -e --arg id "${PREVIOUS_DATABASE_ID}" \
            'any(.[]; (.uuid // .id) == $id)' "${inventory}" >/dev/null
          bunx wrangler versions view "${PREVIOUS_WEB_VERSION_ID}" \
            --name intar-dev \
            --json > "${version}"
          bun tools/cutover/worker-version.ts version-binding \
            "${version}" \
            "${PREVIOUS_DATABASE_ID}" \
            "${PREVIOUS_WEB_VERSION_ID}" >/dev/null

      - name: Restore the previous web version and its previous D1 binding
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler rollback "${PREVIOUS_WEB_VERSION_ID}" \
            --name intar-dev \
            --yes \
            --message "Clean-D1 rollback from ${GITHUB_SHA}; new database retained offline"
          {
            printf 'rolled_back_web_version=%s\n' "${PREVIOUS_WEB_VERSION_ID}"
            printf 'restored_database_id=%s\n' "${PREVIOUS_DATABASE_ID}"
            printf 'new_database_deleted=false\n'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Prove the exact rollback version and D1 binding are active
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
        run: |
          set -euo pipefail
          deployment="${RUNNER_TEMP}/web-rollback-deployment.json"
          version="${RUNNER_TEMP}/web-rollback-active-version.json"
          binding="${RUNNER_TEMP}/web-rollback-binding.json"
          bunx wrangler deployments status --name intar-dev --json > "${deployment}"
          bunx wrangler versions view "${PREVIOUS_WEB_VERSION_ID}" \
            --name intar-dev --json > "${version}"
          bun tools/cutover/worker-version.ts active-binding \
            "${deployment}" "${version}" "${PREVIOUS_DATABASE_ID}" \
            "${PREVIOUS_WEB_VERSION_ID}" > "${binding}"
          jq -e \
            --arg version_id "${PREVIOUS_WEB_VERSION_ID}" \
            --arg database_id "${PREVIOUS_DATABASE_ID}" '
              .versionId == $version_id and .databaseId == $database_id
            ' "${binding}" >/dev/null
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg version_id "${PREVIOUS_WEB_VERSION_ID}" \
            --arg database_id "${PREVIOUS_DATABASE_ID}" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              {
                schema_version: 1,
                operation: "rollback",
                source_sha: $source_sha,
                active_version_id: $version_id,
                active_traffic_percentage: 100,
                database_id: $database_id,
                exact_binding_proven: true,
                new_database_deleted: false,
                observed_at: $observed_at
              }
            ' > "${RUNNER_TEMP}/clean-d1-rollback.json"
          jq . "${RUNNER_TEMP}/clean-d1-rollback.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain rollback activation evidence
        if: ${{ always() && inputs.operation == 'rollback' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-rollback-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-d1-rollback.json
          if-no-files-found: warn
          retention-days: 90
