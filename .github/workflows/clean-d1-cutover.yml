name: Clean D1 cutover
run-name: "Clean D1 ${{ inputs.operation }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Review, apply, or roll back the clean-slate cutover
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - rollback
      database_name:
        description: Explicit name of the new clean production database
        required: true
        default: intar-dev-control-plane-v2-20260801
        type: string
      expected_database_id:
        description: Optional expected new D1 UUID; required when the database already exists
        required: false
        default: ""
        type: string
      previous_database_id:
        description: Old D1 UUID retained for rollback verification
        required: false
        default: ""
        type: string
      previous_web_version_id:
        description: Exact previous intar-dev Worker version for rollback
        required: false
        default: ""
        type: string
      issuance_disabled:
        description: Confirm new Workshop issuance is disabled before rollback
        required: false
        default: false
        type: boolean
      confirmation:
        description: Type PLAN CLEAN D1, APPLY CLEAN D1, or ROLLBACK CLEAN D1
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.operation == 'plan' && format('clean-d1-plan-{0}', github.run_id) || 'intar-control-plane-production' }}
  cancel-in-progress: false
  queue: max

jobs:
  cutover:
    name: ${{ inputs.operation }} clean production D1
    runs-on: namespace-profile-intar-dev
    environment: production
    env:
      OPERATION: ${{ inputs.operation }}
      DATABASE_NAME: ${{ inputs.database_name }}
      EXPECTED_DATABASE_ID: ${{ inputs.expected_database_id }}
      PREVIOUS_DATABASE_ID: ${{ inputs.previous_database_id }}
      PREVIOUS_WEB_VERSION_ID: ${{ inputs.previous_web_version_id }}
      ISSUANCE_DISABLED: ${{ inputs.issuance_disabled }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact main revision
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          persist-credentials: false

      - name: Validate protected request
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "intar-dev/intar-dev"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          [[ "${DATABASE_NAME}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          case "${OPERATION}" in
            plan) test "${CONFIRMATION}" = "PLAN CLEAN D1" ;;
            apply) test "${CONFIRMATION}" = "APPLY CLEAN D1" ;;
            rollback)
              test "${CONFIRMATION}" = "ROLLBACK CLEAN D1"
              test "${ISSUANCE_DISABLED}" = true
              [[ "${PREVIOUS_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              [[ "${PREVIOUS_WEB_VERSION_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
              ;;
            *) exit 1 ;;
          esac

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore shared Bun cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.bun/install/cache

      - name: Install the root workspace
        run: bun install --frozen-lockfile

      - name: Validate the single clean baseline locally
        run: |
          set -euo pipefail
          mapfile -t migrations < <(
            find apps/web/migrations -mindepth 1 -maxdepth 1 \
              -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort
          )
          test "${#migrations[@]}" = 1
          test "${migrations[0]}" = 0000_clean_multicloud.sql
          rm -rf apps/web/.wrangler/clean-ci-state
          bunx wrangler d1 migrations apply DB \
            --local \
            --config apps/web/wrangler.local.jsonc \
            --persist-to apps/web/.wrangler/clean-ci-state
          sha256sum apps/web/migrations/0000_clean_multicloud.sql \
            | tee "${RUNNER_TEMP}/clean-d1-baseline.sha256"

      - name: Rehearse the clean bootstrap twice
        run: bun run check:bootstrap

      - name: Inventory D1 without mutation
        id: inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          inventory="${RUNNER_TEMP}/d1-before.json"
          bunx wrangler d1 list --json > "${inventory}"
          count="$(jq --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)] | length' "${inventory}")"
          test "${count}" -le 1
          observed_id="$(jq -r --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)][0].uuid // [.[] | select(.name == $name)][0].id // ""' "${inventory}")"
          if [ "${count}" = 1 ] && [ "${OPERATION}" = apply ]; then
            test -n "${EXPECTED_DATABASE_ID}"
          fi
          if [ -n "${EXPECTED_DATABASE_ID}" ]; then
            [[ "${EXPECTED_DATABASE_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
            if [ -n "${observed_id}" ]; then
              test "${observed_id}" = "${EXPECTED_DATABASE_ID}"
            fi
          fi
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "database_id=${observed_id}" >> "${GITHUB_OUTPUT}"
          {
            printf 'operation=%s\n' "${OPERATION}"
            printf 'database_name=%s\n' "${DATABASE_NAME}"
            printf 'database_present=%s\n' "${count}"
            printf 'database_id=%s\n' "${observed_id:-<not-created>}"
            printf 'baseline_sha256='
            cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Write immutable plan evidence
        if: ${{ inputs.operation == 'plan' }}
        run: |
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg database_id "${{ steps.inventory.outputs.database_id }}" \
            --arg baseline_sha256 "$(cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256")" \
            '{schema_version: 1, operation: "plan", source_sha: $source_sha, database_name: $database_name, database_id: $database_id, baseline_sha256: $baseline_sha256, mutates_production: false}' \
            > "${RUNNER_TEMP}/clean-d1-plan.json"

      - name: Upload plan evidence
        if: ${{ inputs.operation == 'plan' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-plan-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-d1-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Create the clean D1 when absent
        if: ${{ inputs.operation == 'apply' && steps.inventory.outputs.count == '0' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: bunx wrangler d1 create "${DATABASE_NAME}" --location weur

      - name: Resolve and validate the apply target
        if: ${{ inputs.operation == 'apply' }}
        id: target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/d1-apply.json"
          bunx wrangler d1 list --json > "${inventory}"
          count="$(jq --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)] | length' "${inventory}")"
          test "${count}" = 1
          database_id="$(jq -r --arg name "${DATABASE_NAME}" '[.[] | select(.name == $name)][0].uuid // [.[] | select(.name == $name)][0].id' "${inventory}")"
          [[ "${database_id}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          if [ -n "${EXPECTED_DATABASE_ID}" ]; then
            test "${database_id}" = "${EXPECTED_DATABASE_ID}"
          fi
          echo "database_id=${database_id}" >> "${GITHUB_OUTPUT}"
          jq -n \
            --arg name "${DATABASE_NAME}" \
            --arg id "${database_id}" \
            '{name: "intar-clean-d1-cutover", compatibility_date: "2026-07-09", d1_databases: [{binding: "DB", database_name: $name, database_id: $id, migrations_dir: "migrations"}]}' \
            > apps/web/wrangler.cutover.json

      - name: Apply the single baseline atomically
        if: ${{ inputs.operation == 'apply' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/clean-d1-empty-check.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "SELECT SUM(CASE WHEN name = 'd1_migrations' THEN 1 ELSE 0 END) AS migration_tables, SUM(CASE WHEN name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' AND name != 'd1_migrations' THEN 1 ELSE 0 END) AS application_tables FROM sqlite_master WHERE type = 'table'" \
            --json > "${inventory}"
          jq -e '
            length == 1 and
            .[0].success == true and
            ((.[0].results[0].migration_tables // 0) == 0) and
            ((.[0].results[0].application_tables // 0) == 0)
          ' "${inventory}" >/dev/null
          bunx wrangler d1 migrations apply DB \
            --remote \
            --config apps/web/wrangler.cutover.json
          result="${RUNNER_TEMP}/clean-d1-applied.json"
          bunx wrangler d1 execute DB \
            --remote \
            --config apps/web/wrangler.cutover.json \
            --command "SELECT COUNT(*) AS required_tables FROM sqlite_master WHERE type = 'table' AND name IN ('runtime_provider_allocations', 'runtime_provider_resources', 'provider_price_observations', 'workshop_session_cost_forecasts')" \
            --json > "${result}"
          jq -e \
            'length == 1 and .[0].success == true and .[0].results[0].required_tables == 4' \
            "${result}" >/dev/null
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg database_name "${DATABASE_NAME}" \
            --arg database_id "${{ steps.target.outputs.database_id }}" \
            --arg baseline_sha256 "$(cut -d ' ' -f 1 "${RUNNER_TEMP}/clean-d1-baseline.sha256")" \
            '{schema_version: 1, operation: "apply", source_sha: $source_sha, database_name: $database_name, database_id: $database_id, baseline_sha256: $baseline_sha256, old_database_deleted: false}' \
            > "${RUNNER_TEMP}/clean-d1-apply.json"

      - name: Upload apply evidence
        if: ${{ inputs.operation == 'apply' }}
        uses: actions/upload-artifact@v7
        with:
          name: clean-d1-apply-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/clean-d1-apply.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify the rollback unit
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          inventory="${RUNNER_TEMP}/d1-before.json"
          version="${RUNNER_TEMP}/web-rollback-version.json"
          jq -e --arg id "${PREVIOUS_DATABASE_ID}" \
            'any(.[]; (.uuid // .id) == $id)' "${inventory}" >/dev/null
          bunx wrangler versions view "${PREVIOUS_WEB_VERSION_ID}" \
            --name intar-dev \
            --json > "${version}"
          jq -e --arg id "${PREVIOUS_DATABASE_ID}" \
            '[.. | strings | select(. == $id)] | length > 0' "${version}" >/dev/null

      - name: Restore the previous web version and its previous D1 binding
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ROLLBACK_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler rollback "${PREVIOUS_WEB_VERSION_ID}" \
            --name intar-dev \
            --message "Clean-D1 rollback from ${GITHUB_SHA}; new database retained offline"
          {
            printf 'rolled_back_web_version=%s\n' "${PREVIOUS_WEB_VERSION_ID}"
            printf 'restored_database_id=%s\n' "${PREVIOUS_DATABASE_ID}"
            printf 'new_database_deleted=false\n'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
