name: Release
run-name: >-
  ${{ inputs.resume_tag != ''
      && format('{0} resume {1} from {2}', inputs.project, inputs.resume_tag, github.ref_name)
      || format('{0} release {1} from {2}', inputs.project, inputs.bump, github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      project:
        description: Rust project to release
        required: true
        type: choice
        options:
          - intar-agent
          - intar-builder
          - intar-image-cli
          - kino
          - stargate
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      resume_tag:
        description: Existing project tag to finish publishing; bump is ignored
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.project }}
  cancel-in-progress: false

# This is a shared artifact-release workflow, not a production deployment.
# Keep protected-environment approval on the project-specific install/deploy
# workflow so unrelated release targets do not inherit production approvals.
jobs:
  release:
    name: Bump, tag, and build
    permissions:
      actions: read
      contents: write
    # The jailed agent release needs a host kernel with Landlock enabled.
    # Namespace's runner kernel currently has Landlock disabled at boot, while
    # the other release targets do not execute the privileged jailer smoke.
    runs-on: ${{ inputs.project == 'intar-agent' && 'ubuntu-24.04' || 'namespace-profile-intar-dev' }}

    steps:
      - name: Ensure main
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${RESUME_TAG}" ]; then
            if [ "${RUN_ATTEMPT}" != "1" ]; then
              echo "Do not rerun a failed new release: start a fresh dispatch, or resume the exact tag if one was created." >&2
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "A new release must run from the main branch, got ${GITHUB_REF}." >&2
              exit 1
            fi
          else
            case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
              branch:main|"tag:${RESUME_TAG}") ;;
              *)
                echo "Resume ${RESUME_TAG} from main or from that exact tag, got ${GITHUB_REF}." >&2
                exit 1
                ;;
            esac
          fi

      - name: Checkout on Namespace
        if: inputs.project != 'intar-agent'
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          fetch-depth: 0

      - name: Checkout jailed agent release
        if: inputs.project == 'intar-agent'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Preflight jailed release runner
        if: inputs.project == 'intar-agent'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(ps -p 1 -o comm= | tr -d ' ')" = systemd
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          grep -qw cpu /sys/fs/cgroup/cgroup.controllers
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-intar-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          test -r /dev/kvm
          test -w /dev/kvm
          test -c /dev/net/tun
          test -r /dev/net/tun
          test -w /dev/net/tun
          python3 - <<'PY'
          import ctypes
          import os

          SYS_LANDLOCK_CREATE_RULESET = 444
          LANDLOCK_CREATE_RULESET_VERSION = 1
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          abi = libc.syscall(
              SYS_LANDLOCK_CREATE_RULESET,
              ctypes.c_void_p(),
              ctypes.c_size_t(),
              LANDLOCK_CREATE_RULESET_VERSION,
          )
          if abi < 3:
              error = ctypes.get_errno()
              detail = os.strerror(error) if error else "unsupported ABI"
              raise SystemExit(
                  f"release runner requires Landlock ABI >= 3; got {abi}: {detail}"
              )
          print(f"Landlock ABI {abi}")
          PY

      - name: Resolve project
        id: project
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          case "${PROJECT}" in
            intar-agent)
              manifest="crates/intar-agent/Cargo.toml"
              package="intar-agent"
              binary="intar-agent"
              tag_prefix="agent/"
              ;;
            intar-builder)
              manifest="crates/intar-builder/Cargo.toml"
              package="intar-builder"
              binary="intar-builder"
              tag_prefix="builder/"
              ;;
            intar-image-cli)
              manifest="crates/intar-image-cli/Cargo.toml"
              package="intar-image-cli"
              binary="intar-image-cli"
              tag_prefix="image-cli/"
              ;;
            kino)
              manifest="crates/kino/Cargo.toml"
              package="kino"
              binary="kino"
              tag_prefix="kino/"
              ;;
            stargate)
              manifest="crates/stargate-gateway/Cargo.toml"
              package="stargate-gateway"
              binary="stargate"
              tag_prefix="stargate/"
              ;;
            *)
              echo "unsupported project: ${PROJECT}" >&2
              exit 1
              ;;
          esac
          {
            echo "manifest=${manifest}"
            echo "package=${package}"
            echo "binary=${binary}"
            echo "tag_prefix=${tag_prefix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Determine release tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          MANIFEST: ${{ steps.project.outputs.manifest }}
          PROJECT: ${{ inputs.project }}
          RESUME_TAG: ${{ inputs.resume_tag }}
          TAG_PREFIX: ${{ steps.project.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [ -n "${RESUME_TAG}" ]; then
            version_tag="${RESUME_TAG#"${TAG_PREFIX}"}"
            if [ "${version_tag}" = "${RESUME_TAG}" ] || \
              ! [[ "${version_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Resume tag must match ${TAG_PREFIX}v<major>.<minor>.<patch>." >&2
              exit 1
            fi

            tag_ref="refs/tags/${RESUME_TAG}"
            if ! git rev-parse --verify --quiet "${tag_ref}" >/dev/null; then
              echo "Resume tag ${RESUME_TAG} does not exist." >&2
              exit 1
            fi
            if [ "$(git cat-file -t "${tag_ref}")" != "tag" ]; then
              echo "Resume tag ${RESUME_TAG} must be an annotated release tag." >&2
              exit 1
            fi

            remote_tag_object="$(
              git ls-remote --exit-code --refs origin "${tag_ref}" \
                | awk 'NR == 1 { print $1 }'
            )"
            local_tag_object="$(git rev-parse "${tag_ref}")"
            if [ -z "${remote_tag_object}" ] || \
              [ "${remote_tag_object}" != "${local_tag_object}" ]; then
              echo "Resume tag ${RESUME_TAG} does not match the immutable origin tag." >&2
              exit 1
            fi

            release_sha="$(git rev-parse "${tag_ref}^{commit}")"
            trigger_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            if [ "${trigger_sha}" != "${release_sha}" ]; then
              echo "Resume must use the exact tagged workflow revision ${release_sha}." >&2
              echo "Select ${RESUME_TAG}, or main while it still points at that commit." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${release_sha}" origin/main; then
              echo "Resume tag ${RESUME_TAG} is not reachable from origin/main." >&2
              exit 1
            fi

            tag_subject="$(
              git for-each-ref --format='%(contents:subject)' "${tag_ref}"
            )"
            if [ "${tag_subject}" != "${PROJECT} ${version_tag}" ]; then
              echo "Resume tag annotation does not match ${PROJECT} ${version_tag}." >&2
              exit 1
            fi
            manifest_version="$(
              git show "${release_sha}:${MANIFEST}" \
                | sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' \
                | head -n 1
            )"
            if [ "${manifest_version}" != "${version_tag#v}" ]; then
              echo "Resume tag version does not match ${MANIFEST} at ${release_sha}." >&2
              exit 1
            fi

            tag_contents="$(git for-each-ref --format='%(contents)' "${tag_ref}")"
            payload_run_id="$(
              printf '%s\n' "${tag_contents}" \
                | sed -n 's/^Release-Run-ID: \([0-9][0-9]*\)$/\1/p'
            )"
            payload_id="$(
              printf '%s\n' "${tag_contents}" \
                | sed -n 's/^Release-Artifact-ID: \([0-9][0-9]*\)$/\1/p'
            )"
            payload_name="$(
              printf '%s\n' "${tag_contents}" \
                | sed -n 's/^Release-Artifact-Name: \(.*\)$/\1/p'
            )"
            payload_digest="$(
              printf '%s\n' "${tag_contents}" \
                | sed -n 's/^Release-Artifact-Digest: \(sha256:[0-9a-f]*\)$/\1/p'
            )"
            payload_source_sha="$(
              printf '%s\n' "${tag_contents}" \
                | sed -n 's/^Release-Source-SHA: \([0-9a-f]*\)$/\1/p'
            )"
            expected_payload_name="release-payload-${PROJECT}-${version_tag#v}"
            if ! [[ "${payload_run_id}" =~ ^[0-9]+$ ]] || \
              ! [[ "${payload_id}" =~ ^[0-9]+$ ]] || \
              [ "${payload_name}" != "${expected_payload_name}" ] || \
              ! [[ "${payload_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
              ! [[ "${payload_source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Resume tag ${RESUME_TAG} lacks canonical release payload metadata." >&2
              exit 1
            fi

            git checkout --detach "${release_sha}"
            {
              echo "resume=true"
              echo "release_sha=${release_sha}"
              echo "payload_digest=${payload_digest}"
              echo "payload_id=${payload_id}"
              echo "payload_name=${payload_name}"
              echo "payload_run_id=${payload_run_id}"
              echo "payload_source_sha=${payload_source_sha}"
              echo "version=${version_tag#v}"
              echo "version_tag=${version_tag}"
              echo "tag=${RESUME_TAG}"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_project_tag="$(git tag --list "${TAG_PREFIX}v*" --sort=-v:refname | awk -v prefix="${TAG_PREFIX}" 'index($0, prefix "v") == 1 && $0 ~ /^.+\/v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "${latest_project_tag}" ]; then
            latest_version_tag="${latest_project_tag#"${TAG_PREFIX}"}"
          else
            cargo_version="$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' "${MANIFEST}" | head -n 1)"
            latest_version_tag="v${cargo_version:-0.0.0}"
          fi
          version="${latest_version_tag#v}"
          IFS='.' read -r major minor patch <<<"${version}"
          case "${BUMP}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          next_version="v${major}.${minor}.${patch}"
          next_tag="${TAG_PREFIX}${next_version}"
          if git rev-parse --verify --quiet "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag ${next_tag} already exists." >&2
            exit 1
          fi
          {
            echo "resume=false"
            echo "release_sha="
            echo "payload_digest="
            echo "payload_id="
            echo "payload_name=release-payload-${PROJECT}-${next_version#v}"
            echo "payload_run_id="
            echo "payload_source_sha="
            echo "version=${next_version#v}"
            echo "version_tag=${next_version}"
            echo "tag=${next_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        if: steps.next.outputs.resume != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup component add --toolchain 1.97.0 rustfmt clippy
          rustup target add --toolchain 1.97.0 x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        if: inputs.project != 'intar-agent' && steps.next.outputs.resume != 'true'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: rust

      - name: Install tools
        if: steps.next.outputs.resume != 'true'
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: just@1.58.0,cargo-nextest@0.9.143,cargo-zigbuild@0.23.0

      - name: Install Zig
        if: steps.next.outputs.resume != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Apply release version
        if: steps.next.outputs.resume != 'true'
        env:
          MANIFEST: ${{ steps.project.outputs.manifest }}
          VERSION: ${{ steps.next.outputs.version }}
          PACKAGE: ${{ steps.project.outputs.package }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          manifest = pathlib.Path(os.environ["MANIFEST"])
          version = os.environ["VERSION"]
          text = manifest.read_text()
          match = re.search(r'(?m)^version = "([^"]+)"', text)
          if match is None:
              raise SystemExit(f"failed to update package version in {manifest}")

          def semver(value):
              parsed = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
              if parsed is None:
                  raise SystemExit(f"unsupported package version: {value}")
              return tuple(map(int, parsed.groups()))

          current = match.group(1)
          if semver(current) > semver(version):
              raise SystemExit(
                  f"refusing to downgrade {manifest} from {current} to {version}; "
                  "choose the matching release bump"
              )
          updated = text[:match.start()] + f'version = "{version}"' + text[match.end():]
          manifest.write_text(updated)
          PY
          cargo update -p "${PACKAGE}" --precise "${VERSION}"

      - name: Set up Bun for pinned content hydration
        if: steps.next.outputs.resume != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore shared Bun cache
        if: inputs.project != 'intar-agent' && steps.next.outputs.resume != 'true'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          path: ~/.bun/install/cache

      - name: Run checks
        if: steps.next.outputs.resume != 'true'
        run: just verify

      - name: Build release artifacts
        if: steps.next.outputs.resume != 'true'
        env:
          PACKAGE: ${{ steps.project.outputs.package }}
          BINARY: ${{ steps.project.outputs.binary }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          dist_dir="${PWD}/dist"
          mkdir -p "${dist_dir}"
          # Values are supplied by the step's reviewed env contract.
          # shellcheck disable=SC2153
          build_archive() {
            local arch="$1"
            local target="$2"
            local archive="${BINARY}_${VERSION}_linux_${arch}"
            local target_dir="${PWD}/target/${target}"
            local binary="${target_dir}/${target}/release/${BINARY}"
            local workdir
            CARGO_TARGET_DIR="${target_dir}" cargo zigbuild --locked --release -p "${PACKAGE}" --bin "${BINARY}" --target "${target}"
            file "${binary}"
            workdir="$(mktemp -d)"
            cp "${binary}" "${workdir}/${BINARY}"
            chmod +x "${workdir}/${BINARY}"
            if [ "${PACKAGE}" = "intar-image-cli" ]; then
              cp content/scenarios/base-images.hcl "${workdir}/"
            fi
            if [ "${PACKAGE}" = "intar-agent" ]; then
              if [ "${arch}" != "amd64" ]; then
                echo "Jailed scenario hosts currently support x86_64 only." >&2
                exit 1
              fi
              CARGO_TARGET_DIR="${target_dir}" cargo zigbuild --locked --release -p intar-jailer --bin intar-jailer --target "${target}"
              CARGO_TARGET_DIR="${target_dir}" cargo zigbuild --locked --release -p intar-jailerd --bin intar-jailerd --target "${target}"
              cp "${target_dir}/${target}/release/intar-jailer" "${workdir}/intar-jailer"
              cp "${target_dir}/${target}/release/intar-jailerd" "${workdir}/intar-jailerd"
              chmod +x "${workdir}/intar-jailer" "${workdir}/intar-jailerd"
              curl --fail --location --retry 3 \
                --output "${workdir}/cloud-hypervisor-v53.0" \
                "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v53.0/cloud-hypervisor-static"
              echo "448af3d4e59b22c2987f7df94c213ad40fb53a10d437e42b5ee6c4fce7c29ecc  ${workdir}/cloud-hypervisor-v53.0" | sha256sum --check --strict
              chmod 0555 "${workdir}/cloud-hypervisor-v53.0"
              cp -R crates/intar-jailerd/deploy "${workdir}/deploy"
              cp crates/intar-agent/deploy/intar-agent.service "${workdir}/deploy/intar-agent.service"
              cp crates/intar-agent/deploy/config.example.toml "${workdir}/deploy/intar-agent.config.example.toml"

              # Bundle the exact upstream license set corresponding to the
              # pinned v53.0 source commit used for the static runtime.
              ch_source="${workdir}/cloud-hypervisor-source.tar.gz"
              curl --fail --location --retry 3 \
                --output "${ch_source}" \
                "https://github.com/cloud-hypervisor/cloud-hypervisor/archive/9ed824d6d08df3e96f7d5f50795d9449ac99f431.tar.gz"
              echo "03c2c4d80bb68567835020b2be42dd23177f14d32660a1ce15dd175e2dfdcbbf  ${ch_source}" | sha256sum --check --strict
              license_extract="$(mktemp -d)"
              tar -tzf "${ch_source}" | while IFS= read -r entry; do
                case "${entry}" in
                  /*|../*|*/../*|*/..) echo "unsafe Cloud Hypervisor source path: ${entry}" >&2; exit 1 ;;
                esac
              done
              tar -xzf "${ch_source}" -C "${license_extract}" --no-same-owner
              cp -R \
                "${license_extract}/cloud-hypervisor-9ed824d6d08df3e96f7d5f50795d9449ac99f431/LICENSES" \
                "${workdir}/deploy/cloud-hypervisor-LICENSES"
              rm -rf "${license_extract}" "${ch_source}"

              metadata="$(mktemp)"
              cargo metadata --locked --format-version 1 > "${metadata}"
              python3 crates/intar-jailerd/scripts/generate-dependency-inventory.py \
                "${metadata}" \
                "${workdir}/deploy/intar-rust-dependencies.json"
              rm -f "${metadata}"
              chmod +x \
                "${workdir}/deploy/install.sh" \
                "${workdir}/deploy/intar-jailerd-self-test.sh" \
                "${workdir}/deploy/uninstall.sh"
              (
                cd "${workdir}"
                find . -type f ! -path './deploy/SHA256SUMS' -print0 \
                  | LC_ALL=C sort -z \
                  | xargs -0 sha256sum > deploy/SHA256SUMS
              )
            fi
            tar -C "${workdir}" -czf "${dist_dir}/${archive}.tar.gz" .
            rm -rf "${workdir}"
          }
          build_archive amd64 x86_64-unknown-linux-musl
          if [ "${PACKAGE}" = "intar-builder" ] || [ "${PACKAGE}" = "intar-agent" ]; then
            echo "Skipping arm64 ${PACKAGE} artifact; the current KVM host baseline is x86_64 only."
          else
            build_archive arm64 aarch64-unknown-linux-musl
          fi
          cd "${dist_dir}"
          sha256sum "${BINARY}_${VERSION}_"* > "${BINARY}_${VERSION}_checksums.txt"

      - name: Smoke-test image CLI release package
        if: inputs.project == 'intar-image-cli' && steps.next.outputs.resume != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          cleanup_smoke() {
            rm -rf "${smoke_root}"
          }
          trap cleanup_smoke EXIT

          (
            cd dist
            sha256sum --check --strict "intar-image-cli_${VERSION}_checksums.txt"
          )

          for arch in amd64 arm64; do
            archive="dist/intar-image-cli_${VERSION}_linux_${arch}.tar.gz"
            extract_dir="${smoke_root}/${arch}"
            mkdir -p "${extract_dir}"

            while IFS= read -r entry; do
              entry="${entry#./}"
              case "${entry}" in
                ""|intar-image-cli|base-images.hcl) ;;
                *)
                  echo "unexpected path in ${archive}: ${entry}" >&2
                  exit 1
                  ;;
              esac
            done < <(tar -tzf "${archive}")

            tar -xzf "${archive}" -C "${extract_dir}"
            test -x "${extract_dir}/intar-image-cli"
            cmp content/scenarios/base-images.hcl "${extract_dir}/base-images.hcl"
            mapfile -t packaged_files < <(
              find "${extract_dir}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
                | LC_ALL=C sort
            )
            expected_files=(base-images.hcl intar-image-cli)
            if [ "${packaged_files[*]}" != "${expected_files[*]}" ]; then
              echo "unexpected files in ${archive}: ${packaged_files[*]}" >&2
              exit 1
            fi
          done

          test "$("${smoke_root}/amd64/intar-image-cli" --version)" = \
            "intar-image-cli ${VERSION}"

          fixture_root="${smoke_root}/fixture"
          course_dir="${fixture_root}/courses/release-smoke"
          theory_dir="${course_dir}/00-operating-model"
          lecture_dir="${course_dir}/01-broken-nginx"
          mkdir -p "${theory_dir}" "${lecture_dir}"
          cp content/courses/linux-operations/course.md "${course_dir}/course.md"
          cp content/courses/linux-operations/00-operating-model/lecture.md \
            "${theory_dir}/lecture.md"
          cp content/courses/linux-operations/01-broken-nginx/lecture.md \
            "${lecture_dir}/lecture.md"
          cp content/courses/linux-operations/01-broken-nginx/scenario.hcl \
            "${lecture_dir}/scenario.hcl"

          "${smoke_root}/amd64/intar-image-cli" validate \
            --courses-root "${fixture_root}/courses" \
            --base-images "${smoke_root}/amd64/base-images.hcl"
          "${smoke_root}/amd64/intar-image-cli" bundle \
            --courses-root "${fixture_root}/courses" \
            --base-images "${smoke_root}/amd64/base-images.hcl" \
            --rev release-smoke \
            --output "${fixture_root}/bundle.tar.gz" \
            --no-upload

          bundle_listing="${fixture_root}/bundle-listing.txt"
          tar -tzf "${fixture_root}/bundle.tar.gz" | LC_ALL=C sort > "${bundle_listing}"
          mapfile -t bundled_files < "${bundle_listing}"
          expected_bundle_files=(
            base-images.hcl
            curriculum/catalog.json
            curriculum/release-smoke/00-operating-model/lecture.md
            curriculum/release-smoke/01-broken-nginx/lecture.md
            curriculum/release-smoke/course.md
            scenarios/broken-nginx/scenario.hcl
          )
          if [ "${bundled_files[*]}" != "${expected_bundle_files[*]}" ]; then
            echo "unexpected nested-course bundle paths: ${bundled_files[*]}" >&2
            exit 1
          fi

      - name: Preserve exact release payload
        id: release_payload
        if: steps.next.outputs.resume != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.next.outputs.payload_name }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

      - name: Resolve release payload
        id: payload
        env:
          NEW_DIGEST: ${{ steps.release_payload.outputs.artifact-digest }}
          NEW_ID: ${{ steps.release_payload.outputs.artifact-id }}
          PAYLOAD_NAME: ${{ steps.next.outputs.payload_name }}
          RESUME: ${{ steps.next.outputs.resume }}
          RESUME_DIGEST: ${{ steps.next.outputs.payload_digest }}
          RESUME_ID: ${{ steps.next.outputs.payload_id }}
          RESUME_RUN_ID: ${{ steps.next.outputs.payload_run_id }}
          RESUME_SOURCE_SHA: ${{ steps.next.outputs.payload_source_sha }}
        run: |
          set -euo pipefail
          if [ "${RESUME}" = "true" ]; then
            payload_digest="${RESUME_DIGEST}"
            payload_id="${RESUME_ID}"
            payload_run_id="${RESUME_RUN_ID}"
            payload_source_sha="${RESUME_SOURCE_SHA}"
          else
            case "${NEW_DIGEST}" in
              sha256:*) payload_digest="${NEW_DIGEST}" ;;
              *) payload_digest="sha256:${NEW_DIGEST}" ;;
            esac
            payload_id="${NEW_ID}"
            payload_run_id="${GITHUB_RUN_ID}"
            payload_source_sha="${GITHUB_SHA}"
          fi
          if ! [[ "${payload_id}" =~ ^[0-9]+$ ]] || \
            ! [[ "${payload_run_id}" =~ ^[0-9]+$ ]] || \
            ! [[ "${payload_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
            ! [[ "${payload_source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release payload metadata is not canonical." >&2
            exit 1
          fi
          {
            echo "digest=${payload_digest}"
            echo "id=${payload_id}"
            echo "name=${PAYLOAD_NAME}"
            echo "run_id=${payload_run_id}"
            echo "source_sha=${payload_source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate preserved resume payload
        if: steps.next.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_DIGEST: ${{ steps.payload.outputs.digest }}
          PAYLOAD_ID: ${{ steps.payload.outputs.id }}
          PAYLOAD_NAME: ${{ steps.payload.outputs.name }}
          PAYLOAD_RUN_ID: ${{ steps.payload.outputs.run_id }}
          PAYLOAD_SOURCE_SHA: ${{ steps.payload.outputs.source_sha }}
        run: |
          set -euo pipefail
          artifact_metadata="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ID}" \
              --jq '[.id, .name, (.expired | tostring), .digest, (.workflow_run.id | tostring)] | @tsv'
          )"
          IFS=$'\t' read -r \
            artifact_id artifact_name artifact_expired artifact_digest artifact_run_id \
            <<<"${artifact_metadata}"
          if [ "${artifact_id}" != "${PAYLOAD_ID}" ] || \
            [ "${artifact_name}" != "${PAYLOAD_NAME}" ] || \
            [ "${artifact_expired}" != "false" ] || \
            [ "${artifact_digest}" != "${PAYLOAD_DIGEST}" ] || \
            [ "${artifact_run_id}" != "${PAYLOAD_RUN_ID}" ]; then
            echo "Stored release payload does not match immutable tag metadata." >&2
            exit 1
          fi

          run_metadata="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PAYLOAD_RUN_ID}" \
              --jq '[.id, .event, .head_sha, .path] | @tsv'
          )"
          IFS=$'\t' read -r run_id run_event run_source_sha run_path \
            <<<"${run_metadata}"
          if [ "${run_id}" != "${PAYLOAD_RUN_ID}" ] || \
            [ "${run_event}" != "workflow_dispatch" ] || \
            [ "${run_source_sha}" != "${PAYLOAD_SOURCE_SHA}" ] || \
            [ "${run_path}" != ".github/workflows/release.yml" ]; then
            echo "Stored release payload did not come from the expected release run." >&2
            exit 1
          fi

      - name: Restore exact release payload
        if: steps.next.outputs.resume == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.payload.outputs.id }}
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ steps.payload.outputs.run_id }}

      - name: Commit release version
        id: version_commit
        env:
          MANIFEST: ${{ steps.project.outputs.manifest }}
          RESUME: ${{ steps.next.outputs.resume }}
          RESUME_SHA: ${{ steps.next.outputs.release_sha }}
          VERSION_TAG: ${{ steps.next.outputs.version_tag }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          if [ "${RESUME}" = "true" ]; then
            if [ "$(git rev-parse HEAD)" != "${RESUME_SHA}" ]; then
              echo "Resume checkout moved away from ${RESUME_SHA}." >&2
              exit 1
            fi
            if ! git diff --quiet --exit-code -- "${MANIFEST}" Cargo.lock; then
              echo "Resume verification modified release inputs." >&2
              exit 1
            fi
            echo "sha=${RESUME_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Publish the version commit only after every build and privileged
          # package smoke has passed. Keep it local until the tag and branch
          # can be pushed atomically; a failed release must not mutate main.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- "${MANIFEST}" Cargo.lock; then
            release_sha="$(git rev-parse HEAD)"
          else
            git add "${MANIFEST}" Cargo.lock
            git commit -m "chore(${PROJECT}): release ${VERSION_TAG}"
            release_sha="$(git rev-parse HEAD)"
          fi
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_DIGEST: ${{ steps.payload.outputs.digest }}
          PAYLOAD_ID: ${{ steps.payload.outputs.id }}
          PAYLOAD_NAME: ${{ steps.payload.outputs.name }}
          PAYLOAD_RUN_ID: ${{ steps.payload.outputs.run_id }}
          PAYLOAD_SOURCE_SHA: ${{ steps.payload.outputs.source_sha }}
          PROJECT: ${{ inputs.project }}
          RELEASE_SHA: ${{ steps.version_commit.outputs.sha }}
          RESUME: ${{ steps.next.outputs.resume }}
          TAG: ${{ steps.next.outputs.tag }}
          VERSION_TAG: ${{ steps.next.outputs.version_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          remote_main="$(git rev-parse origin/main)"
          if [ "${RESUME}" = "true" ]; then
            remote_tag_object="$(
              git ls-remote --exit-code --refs origin "refs/tags/${TAG}" \
                | awk 'NR == 1 { print $1 }'
            )"
            local_tag_object="$(git rev-parse "refs/tags/${TAG}")"
            remote_release_sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ -z "${remote_tag_object}" ] || \
              [ "${remote_tag_object}" != "${local_tag_object}" ] || \
              [ "${remote_release_sha}" != "${RELEASE_SHA}" ]; then
              echo "Origin tag ${TAG} changed during resume verification." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "${RELEASE_SHA}" "${remote_main}"; then
              echo "Release commit ${RELEASE_SHA} is no longer reachable from main." >&2
              exit 1
            fi
          else
            if [ "${remote_main}" != "${GITHUB_SHA}" ]; then
              echo "main advanced during release verification; start a fresh dispatch from ${remote_main}." >&2
              exit 1
            fi
            git tag -a "${TAG}" "${RELEASE_SHA}" \
              -m "${PROJECT} ${VERSION_TAG}" \
              -m "Release-Run-ID: ${PAYLOAD_RUN_ID}" \
              -m "Release-Artifact-ID: ${PAYLOAD_ID}" \
              -m "Release-Artifact-Name: ${PAYLOAD_NAME}" \
              -m "Release-Artifact-Digest: ${PAYLOAD_DIGEST}" \
              -m "Release-Source-SHA: ${PAYLOAD_SOURCE_SHA}"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"
          fi

          mapfile -t local_assets < <(
            find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )
          if [ "${#local_assets[@]}" -eq 0 ]; then
            echo "No release assets were built." >&2
            exit 1
          fi
          for asset_name in "${local_assets[@]}"; do
            case "${asset_name}" in
              *[!A-Za-z0-9._-]*)
                echo "Unsafe release asset name: ${asset_name}" >&2
                exit 1
                ;;
            esac
          done

          release_title="${PROJECT} ${VERSION_TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            release_metadata="$(
              gh release view "${TAG}" \
                --json tagName,name,isDraft,isPrerelease \
                --jq '[.tagName, .name, (.isDraft | tostring), (.isPrerelease | tostring)] | @tsv'
            )"
            IFS=$'\t' read -r \
              existing_tag existing_title existing_draft existing_prerelease \
              <<<"${release_metadata}"
            if [ "${existing_tag}" != "${TAG}" ] || \
              [ "${existing_title}" != "${release_title}" ] || \
              [ "${existing_prerelease}" != "false" ]; then
              echo "Existing GitHub release metadata for ${TAG} is not canonical." >&2
              exit 1
            fi
            case "${existing_draft}" in
              true|false) ;;
              *)
                echo "Existing GitHub release draft state is invalid." >&2
                exit 1
                ;;
            esac
          else
            gh release create "${TAG}" \
              --draft \
              --verify-tag \
              --target "${RELEASE_SHA}" \
              --title "${release_title}" \
              --notes "Release ${VERSION_TAG}."
            existing_draft=true
          fi

          mapfile -t remote_assets < <(
            gh release view "${TAG}" --json assets --jq '.assets[].name' \
              | LC_ALL=C sort
          )
          for asset_name in "${remote_assets[@]}"; do
            if ! printf '%s\n' "${local_assets[@]}" \
              | grep -Fqx -- "${asset_name}"; then
              echo "Unexpected existing release asset: ${asset_name}" >&2
              exit 1
            fi
          done

          verify_root="$(mktemp -d)"
          cleanup_release_verify() {
            rm -rf "${verify_root}"
          }
          trap cleanup_release_verify EXIT
          for asset_name in "${local_assets[@]}"; do
            if printf '%s\n' "${remote_assets[@]}" \
              | grep -Fqx -- "${asset_name}"; then
              existing_dir="${verify_root}/existing-${asset_name}"
              mkdir -p "${existing_dir}"
              gh release download "${TAG}" \
                --pattern "${asset_name}" \
                --dir "${existing_dir}"
              if ! cmp --silent \
                "dist/${asset_name}" "${existing_dir}/${asset_name}"; then
                echo "Existing asset ${asset_name} does not match this exact build." >&2
                exit 1
              fi
            else
              gh release upload "${TAG}" "dist/${asset_name}"
            fi
          done

          final_dir="${verify_root}/final"
          mkdir -p "${final_dir}"
          gh release download "${TAG}" --dir "${final_dir}"
          mapfile -t final_assets < <(
            find "${final_dir}" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort
          )
          if [ "${final_assets[*]}" != "${local_assets[*]}" ]; then
            echo "Published release asset set does not match the build." >&2
            exit 1
          fi
          for asset_name in "${local_assets[@]}"; do
            cmp --silent "dist/${asset_name}" "${final_dir}/${asset_name}"
          done

          if [ "${existing_draft}" = "true" ]; then
            gh release edit "${TAG}" --draft=false
          fi
          published_metadata="$(
            gh release view "${TAG}" \
              --json tagName,name,isDraft,isPrerelease \
              --jq '[.tagName, .name, (.isDraft | tostring), (.isPrerelease | tostring)] | @tsv'
          )"
          IFS=$'\t' read -r \
            published_tag published_title published_draft published_prerelease \
            <<<"${published_metadata}"
          if [ "${published_tag}" != "${TAG}" ] || \
            [ "${published_title}" != "${release_title}" ] || \
            [ "${published_draft}" != "false" ] || \
            [ "${published_prerelease}" != "false" ]; then
            echo "Published GitHub release metadata for ${TAG} is not canonical." >&2
            exit 1
          fi
