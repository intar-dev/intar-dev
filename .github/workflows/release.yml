# Generated from ci/workflows/release.cue by cuenv; do not edit manually.
# Regenerate with: cuenv sync codegen
name: Release
"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
permissions: {}
concurrency:
  group: |-
    release-${{ (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
    (github.event_name == 'workflow_run' &&
    github.event.workflow_run.conclusion == 'success' &&
    github.event.workflow_run.event == 'workflow_dispatch' &&
    github.event.workflow_run.head_branch == 'main' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    github.event.workflow_run.head_sha == github.sha)) && 'main' || github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan releases
    if: |-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Install git-cliff
        uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Plan releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: cuenv task -p ci --package ci release-plan
  build:
    name: Build ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    environment: ${{ matrix.project == 'intar-desktop' && 'macos-signing' || '' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout on Namespace
        if: matrix.runner != 'ubuntu-24.04'
        uses: namespacelabs/nscloud-checkout-action@c79409f8642d7fca9c1169a97f84d7ada5de1f9e # v9
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - name: Checkout jailed agent release
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Preflight jailed release runner
        if: matrix.project == 'intar-agent'
        run: cuenv task -p ci --package ci release-preflight-jailed-release-runner
      - name: Set the release version
        env:
          MANIFEST: ${{ matrix.manifest }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-apply-version
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-unknown-linux-musl
          namespace-cache: "false"
      - name: Run checks
        if: matrix.ci_passed != true && matrix.project != 'intar-desktop'
        run: cuenv task verify
      - name: Run the app's Clippy
        if: matrix.ci_passed != true && matrix.project == 'intar-desktop'
        run: cuenv task clippy-app
      - name: Run the app's tests
        if: matrix.ci_passed != true && matrix.project == 'intar-desktop'
        run: cuenv task test-app
      - name: Build the app's bundle
        if: matrix.project == 'intar-desktop'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-build-jumper-macos
      - name: Build release artifacts
        if: matrix.project != 'intar-desktop'
        env:
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-build-release-artifacts
      - name: Test personal-host installer
        if: matrix.project == 'intar-agent'
        run: cuenv task installer-tests
      - name: Run privileged agent package smoke
        if: matrix.project == 'intar-agent'
        env:
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-privileged-agent-package-smoke
      - name: Smoke-test image CLI release package
        if: matrix.project == 'intar-image-cli'
        env:
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-smoke-test-image-cli-package
      - name: Check the release payload
        if: hashFiles('tools/workflows/release/check-release-payload.sh') != ''
        env:
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-check-release-payload
      - name: Save the agent's Cargo cache
        if: matrix.project == 'intar-agent'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |-
            target/x86_64-unknown-linux-musl
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: intar-agent-release-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
      - name: Preserve exact release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.prefix }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
  publish:
    name: Publish ${{ matrix.tag }}
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ matrix.prefix }}
          path: dist/
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/${{ matrix.binary }}_${{ matrix.version }}_checksums.txt
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ matrix.project }} v${{ matrix.version }}
          VERSION: ${{ matrix.version }}
          REF: ${{ matrix.ref }}
          CREATE_TAG: ${{ matrix.create_tag }}
        run: cuenv task -p ci --package ci release-publish-tagged-github-release
  kino:
    name: Store the Kino release in the registry
    needs:
      - plan
      - publish
    if: ${{ !cancelled() && needs.plan.result == 'success' && (contains(needs.plan.outputs.matrix, '"prefix":"kino"') || github.event_name == 'workflow_dispatch') }}
    runs-on: namespace-profile-linux-amd64-smol
    concurrency:
      group: intar-image-catalog-promotion
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
      REGISTRY_URL: https://intar.dev/registry/v1
    environment: production
    permissions:
      attestations: read
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Set up the CI runtime
        uses: ./.github/actions/setup-runtime
      - name: Push the Kino artifact
        run: cuenv task -p ci --package ci release-kino-promote
  redeploy:
    name: Deploy the website with the new releases
    needs:
      - plan
      - publish
      - kino
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.matrix != '[]' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the website deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main
