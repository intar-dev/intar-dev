# Generated from ci/workflows/release.cue by cuenv; do not edit manually.
# Regenerate with: cuenv sync codegen
name: Release
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
permissions: {}
concurrency:
  group: |-
    release-${{ github.event_name == 'push' && 'pr' || ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
    (github.event_name == 'workflow_run' &&
    github.event.workflow_run.conclusion == 'success' &&
    (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
    github.event.workflow_run.head_branch == 'main' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    github.event.workflow_run.head_sha == github.sha)) && 'publish' || github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    name: Plan releases
    if: |-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Install git-cliff
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Plan releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: cuenv task -p ci --package ci release-plan
  release-pr:
    name: Update the release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release-pr
    steps:
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Install git-cliff
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: git-cliff@2.14.2
          fallback: none
      - name: Update the release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: cuenv task -p ci --package ci release-update-pr
  build:
    name: Build ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout on Namespace
        if: matrix.runner != 'ubuntu-24.04'
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false
          ref: ${{ matrix.tag }}
      - name: Checkout jailed agent release
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ matrix.tag }}
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Preflight jailed release runner
        if: matrix.project == 'intar-agent'
        run: cuenv task -p ci --package ci release-preflight-jailed-release-runner
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-unknown-linux-musl
          namespace-cache: ${{ matrix.runner != 'ubuntu-24.04' }}
      - name: Run checks
        if: matrix.ci_passed != true
        run: cuenv task verify
      - name: Build release artifacts
        env:
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-build-release-artifacts
      - name: Test personal-host installer
        if: matrix.project == 'intar-agent'
        run: cuenv task installer-tests
      - name: Run privileged agent package smoke
        if: matrix.project == 'intar-agent'
        env:
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-privileged-agent-package-smoke
      - name: Smoke-test image CLI release package
        if: matrix.project == 'intar-image-cli'
        env:
          VERSION: ${{ matrix.version }}
        run: cuenv task -p ci --package ci release-smoke-test-image-cli-package
      - name: Preserve exact release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.prefix }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
  publish:
    name: Publish ${{ matrix.tag }}
    needs:
      - plan
      - build
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.prefix }}
          path: dist/
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/${{ matrix.binary }}_${{ matrix.version }}_checksums.txt
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          TITLE: ${{ matrix.project }} v${{ matrix.version }}
        run: cuenv task -p ci --package ci release-publish-tagged-github-release
  web-pins:
    name: Pin the website to the new image CLI
    needs:
      - plan
      - publish
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release-pr
    steps:
      - name: Create the release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up cuenv
        uses: ./.github/actions/setup-cuenv
      - name: Open the website pin pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: cuenv task -p ci --package ci release-web-pins
