name: Release
run-name: "${{ format('{0} release {1} from {2}', inputs.project, inputs.bump, github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Rust project to release
        required: true
        type: choice
        options:
          - intar-agent
          - intar-builder
          - kino
          - stargate
      bump:
        description: Semantic version increment
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, and build
    # The jailed agent release needs a host kernel with Landlock enabled.
    # Namespace's runner kernel currently has Landlock disabled at boot, while
    # the other release targets do not execute the privileged jailer smoke.
    runs-on: ${{ inputs.project == 'intar-agent' && 'ubuntu-24.04' || 'namespace-profile-intar-dev' }}

    steps:
      - name: Checkout on Namespace
        if: inputs.project != 'intar-agent'
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0

      - name: Checkout jailed agent release
        if: inputs.project == 'intar-agent'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preflight jailed release runner
        if: inputs.project == 'intar-agent'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(ps -p 1 -o comm= | tr -d ' ')" = systemd
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          grep -qw cpu /sys/fs/cgroup/cgroup.controllers
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-intar-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          test -c /dev/net/tun
          test -r /dev/net/tun
          test -w /dev/net/tun
          python3 - <<'PY'
          import ctypes
          import os

          SYS_LANDLOCK_CREATE_RULESET = 444
          LANDLOCK_CREATE_RULESET_VERSION = 1
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          abi = libc.syscall(
              SYS_LANDLOCK_CREATE_RULESET,
              ctypes.c_void_p(),
              ctypes.c_size_t(),
              LANDLOCK_CREATE_RULESET_VERSION,
          )
          if abi < 3:
              error = ctypes.get_errno()
              detail = os.strerror(error) if error else "unsupported ABI"
              raise SystemExit(
                  f"release runner requires Landlock ABI >= 3; got {abi}: {detail}"
              )
          print(f"Landlock ABI {abi}")
          PY

      - name: Ensure main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must run from main, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Resolve project
        id: project
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          case "${PROJECT}" in
            intar-agent)
              manifest="crates/intar-agent/Cargo.toml"
              package="intar-agent"
              binary="intar-agent"
              tag_prefix="agent/"
              ;;
            intar-builder)
              manifest="crates/intar-builder/Cargo.toml"
              package="intar-builder"
              binary="intar-builder"
              tag_prefix="builder/"
              ;;
            kino)
              manifest="crates/kino/Cargo.toml"
              package="kino"
              binary="kino"
              tag_prefix="kino/"
              ;;
            stargate)
              manifest="crates/stargate-gateway/Cargo.toml"
              package="stargate-gateway"
              binary="stargate"
              tag_prefix="stargate/"
              ;;
            *)
              echo "unsupported project: ${PROJECT}" >&2
              exit 1
              ;;
          esac
          {
            echo "manifest=${manifest}"
            echo "package=${package}"
            echo "binary=${binary}"
            echo "tag_prefix=${tag_prefix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Determine next release tag
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          MANIFEST: ${{ steps.project.outputs.manifest }}
          TAG_PREFIX: ${{ steps.project.outputs.tag_prefix }}
        run: |
          set -euo pipefail
          latest_project_tag="$(git tag --list "${TAG_PREFIX}v*" --sort=-v:refname | awk -v prefix="${TAG_PREFIX}" 'index($0, prefix "v") == 1 && $0 ~ /^.+\/v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "${latest_project_tag}" ]; then
            latest_version_tag="${latest_project_tag#"${TAG_PREFIX}"}"
          else
            cargo_version="$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' "${MANIFEST}" | head -n 1)"
            latest_version_tag="v${cargo_version:-0.0.0}"
          fi
          version="${latest_version_tag#v}"
          IFS='.' read -r major minor patch <<<"${version}"
          case "${BUMP}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          next_version="v${major}.${minor}.${patch}"
          next_tag="${TAG_PREFIX}${next_version}"
          if git rev-parse --verify --quiet "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag ${next_tag} already exists." >&2
            exit 1
          fi
          {
            echo "version=${next_version#v}"
            echo "version_tag=${next_version}"
            echo "tag=${next_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustup show active-toolchain

      - name: Set up Namespace caches
        if: inputs.project != 'intar-agent'
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-zigbuild

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Apply release version
        env:
          MANIFEST: ${{ steps.project.outputs.manifest }}
          VERSION: ${{ steps.next.outputs.version }}
          PACKAGE: ${{ steps.project.outputs.package }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          manifest = pathlib.Path(os.environ["MANIFEST"])
          version = os.environ["VERSION"]
          text = manifest.read_text()
          updated, count = re.subn(r'(?m)^version = "[^"]+"', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit(f"failed to update package version in {manifest}")
          manifest.write_text(updated)
          PY
          cargo update -p "${PACKAGE}" --precise "${VERSION}"

      - name: Run checks
        run: just verify

      - name: Commit release version
        id: version_commit
        env:
          MANIFEST: ${{ steps.project.outputs.manifest }}
          VERSION_TAG: ${{ steps.next.outputs.version_tag }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          # The tag step needs an identity even when the manifest was bumped
          # ahead of the dispatch and there is nothing to commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- "${MANIFEST}" Cargo.lock; then
            release_sha="$(git rev-parse HEAD)"
          else
            git add "${MANIFEST}" Cargo.lock
            git commit -m "chore(${PROJECT}): release ${VERSION_TAG}"
            git push origin HEAD:main
            release_sha="$(git rev-parse HEAD)"
          fi
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Build release artifacts
        env:
          PACKAGE: ${{ steps.project.outputs.package }}
          BINARY: ${{ steps.project.outputs.binary }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          dist_dir="${PWD}/dist"
          mkdir -p "${dist_dir}"
          build_archive() {
            local arch="$1"
            local target="$2"
            local archive="${BINARY}_${VERSION}_linux_${arch}"
            local target_dir="${PWD}/target/${target}"
            local binary="${target_dir}/${target}/release/${BINARY}"
            local workdir
            CARGO_TARGET_DIR="${target_dir}" cargo zigbuild --locked --release -p "${PACKAGE}" --bin "${BINARY}" --target "${target}"
            file "${binary}"
            workdir="$(mktemp -d)"
            cp "${binary}" "${workdir}/${BINARY}"
            chmod +x "${workdir}/${BINARY}"
            if [ "${PACKAGE}" = "intar-agent" ]; then
              if [ "${arch}" != "amd64" ]; then
                echo "Jailed scenario hosts currently support x86_64 only." >&2
                exit 1
              fi
              CARGO_TARGET_DIR="${target_dir}" cargo zigbuild --locked --release -p intar-jailer --bin intar-jailer --target "${target}"
              CARGO_TARGET_DIR="${target_dir}" cargo zigbuild --locked --release -p intar-jailerd --bin intar-jailerd --target "${target}"
              cp "${target_dir}/${target}/release/intar-jailer" "${workdir}/intar-jailer"
              cp "${target_dir}/${target}/release/intar-jailerd" "${workdir}/intar-jailerd"
              chmod +x "${workdir}/intar-jailer" "${workdir}/intar-jailerd"
              curl --fail --location --retry 3 \
                --output "${workdir}/cloud-hypervisor-v53.0" \
                "https://github.com/cloud-hypervisor/cloud-hypervisor/releases/download/v53.0/cloud-hypervisor-static"
              echo "448af3d4e59b22c2987f7df94c213ad40fb53a10d437e42b5ee6c4fce7c29ecc  ${workdir}/cloud-hypervisor-v53.0" | sha256sum --check --strict
              chmod 0555 "${workdir}/cloud-hypervisor-v53.0"
              cp -R crates/intar-jailerd/deploy "${workdir}/deploy"
              cp crates/intar-agent/deploy/intar-agent.service "${workdir}/deploy/intar-agent.service"
              cp crates/intar-agent/deploy/config.example.toml "${workdir}/deploy/intar-agent.config.example.toml"

              # Bundle the exact upstream license set corresponding to the
              # pinned v53.0 source commit used for the static runtime.
              ch_source="${workdir}/cloud-hypervisor-source.tar.gz"
              curl --fail --location --retry 3 \
                --output "${ch_source}" \
                "https://github.com/cloud-hypervisor/cloud-hypervisor/archive/9ed824d6d08df3e96f7d5f50795d9449ac99f431.tar.gz"
              echo "03c2c4d80bb68567835020b2be42dd23177f14d32660a1ce15dd175e2dfdcbbf  ${ch_source}" | sha256sum --check --strict
              license_extract="$(mktemp -d)"
              tar -tzf "${ch_source}" | while IFS= read -r entry; do
                case "${entry}" in
                  /*|../*|*/../*|*/..) echo "unsafe Cloud Hypervisor source path: ${entry}" >&2; exit 1 ;;
                esac
              done
              tar -xzf "${ch_source}" -C "${license_extract}" --no-same-owner
              cp -R \
                "${license_extract}/cloud-hypervisor-9ed824d6d08df3e96f7d5f50795d9449ac99f431/LICENSES" \
                "${workdir}/deploy/cloud-hypervisor-LICENSES"
              rm -rf "${license_extract}" "${ch_source}"

              metadata="$(mktemp)"
              cargo metadata --locked --format-version 1 > "${metadata}"
              python3 crates/intar-jailerd/deploy/generate-dependency-inventory.py \
                "${metadata}" \
                "${workdir}/deploy/intar-rust-dependencies.json"
              rm -f "${metadata}"
              chmod +x \
                "${workdir}/deploy/install.sh" \
                "${workdir}/deploy/intar-jailerd-self-test.sh" \
                "${workdir}/deploy/package-smoke.sh" \
                "${workdir}/deploy/prepare-v6-cutover.py" \
                "${workdir}/deploy/uninstall.sh"
              (
                cd "${workdir}"
                find . -type f ! -path './deploy/SHA256SUMS' -print0 \
                  | LC_ALL=C sort -z \
                  | xargs -0 sha256sum > deploy/SHA256SUMS
              )
            fi
            tar -C "${workdir}" -czf "${dist_dir}/${archive}.tar.gz" .
            rm -rf "${workdir}"
          }
          build_archive amd64 x86_64-unknown-linux-musl
          if [ "${PACKAGE}" = "intar-builder" ] || [ "${PACKAGE}" = "intar-agent" ]; then
            echo "Skipping arm64 ${PACKAGE} artifact; the current KVM host baseline is x86_64 only."
          else
            build_archive arm64 aarch64-unknown-linux-musl
          fi
          cd "${dist_dir}"
          sha256sum "${BINARY}_${VERSION}_"* > "${BINARY}_${VERSION}_checksums.txt"

      - name: Smoke-test jailed scenario-host package
        if: inputs.project == 'intar-agent'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for script in \
            crates/intar-jailerd/deploy/install.sh \
            crates/intar-jailerd/deploy/intar-jailerd-self-test.sh \
            crates/intar-jailerd/deploy/package-smoke.sh \
            crates/intar-jailerd/deploy/uninstall.sh; do
            sh -n "${script}"
            shellcheck "${script}"
          done
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/intar-jailerd/deploy/prepare-v6-cutover.py")
          compile(path.read_text(), str(path), "exec")
          PY

          # Namespace runners are containers and do not use systemd as PID 1.
          # Boot a disposable privileged systemd container so the package smoke
          # exercises the real transient-unit, cgroup-v2, KVM, TUN, and cleanup
          # paths without mutating the runner container itself.
          smoke_image="intar-agent-package-smoke:${GITHUB_RUN_ID}"
          smoke_container="intar-agent-package-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_smoke() {
            status=$?
            trap - EXIT
            if [ "${status}" -ne 0 ] && \
              docker inspect "${smoke_container}" >/dev/null 2>&1; then
              docker logs "${smoke_container}" || true
              docker exec "${smoke_container}" \
                journalctl --boot --no-pager --lines 500 || true
            fi
            docker rm --force --volumes "${smoke_container}" >/dev/null 2>&1 || true
            docker image rm --force "${smoke_image}" >/dev/null 2>&1 || true
            exit "${status}"
          }
          trap cleanup_smoke EXIT

          test -c /dev/kvm
          test -c /dev/net/tun
          docker build \
            --file .github/docker/intar-agent-package-smoke.Dockerfile \
            --tag "${smoke_image}" \
            .github/docker
          docker run \
            --cgroupns=private \
            --detach \
            --device /dev/kvm \
            --device /dev/net/tun \
            --env container=docker \
            --hostname intar-package-smoke \
            --name "${smoke_container}" \
            --privileged \
            --security-opt seccomp=unconfined \
            --stop-signal SIGRTMIN+3 \
            --tmpfs /run:rw,nosuid,nodev,mode=755 \
            --tmpfs /run/lock:rw,nosuid,nodev,noexec,mode=755 \
            "${smoke_image}"

          systemd_ready=false
          for _ in $(seq 1 30); do
            if docker exec "${smoke_container}" \
              systemctl show --property=Version >/dev/null 2>&1 && \
              docker exec "${smoke_container}" \
                test -S /run/dbus/system_bus_socket; then
              systemd_ready=true
              break
            fi
            sleep 1
          done
          if [ "${systemd_ready}" != true ]; then
            docker logs "${smoke_container}" || true
            echo "Disposable package-smoke systemd did not become ready." >&2
            exit 1
          fi
          test "$(docker exec "${smoke_container}" ps -p 1 -o comm= | tr -d ' ')" = systemd
          docker exec "${smoke_container}" test -S /run/dbus/system_bus_socket
          test "$(docker exec "${smoke_container}" stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          docker exec "${smoke_container}" grep -qw cpu /sys/fs/cgroup/cgroup.controllers
          docker exec "${smoke_container}" test -w /sys/fs/cgroup/cgroup.subtree_control
          docker exec "${smoke_container}" test -c /dev/kvm
          docker exec "${smoke_container}" test -r /dev/kvm
          docker exec "${smoke_container}" test -w /dev/kvm
          docker exec "${smoke_container}" test -c /dev/net/tun
          docker exec "${smoke_container}" test -r /dev/net/tun
          docker exec "${smoke_container}" test -w /dev/net/tun

          archive="dist/intar-agent_${VERSION}_linux_amd64.tar.gz"
          docker cp "${archive}" "${smoke_container}:/tmp/intar-agent.tar.gz"
          docker cp \
            crates/intar-jailerd/deploy/package-smoke.sh \
            "${smoke_container}:/root/package-smoke.sh"
          docker exec "${smoke_container}" chmod 0700 /root/package-smoke.sh
          docker exec "${smoke_container}" useradd \
            --system \
            --no-create-home \
            --home-dir /nonexistent \
            --shell /usr/sbin/nologin \
            intar-agent
          docker exec "${smoke_container}" \
            /root/package-smoke.sh /tmp/intar-agent.tar.gz

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
          VERSION_TAG: ${{ steps.next.outputs.version_tag }}
          RELEASE_SHA: ${{ steps.version_commit.outputs.sha }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          git tag -a "${TAG}" "${RELEASE_SHA}" -m "${PROJECT} ${VERSION_TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" dist/* --target "${RELEASE_SHA}" --title "${PROJECT} ${VERSION_TAG}" --notes "Release ${VERSION_TAG}."
