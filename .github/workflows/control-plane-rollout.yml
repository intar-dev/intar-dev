name: Multicloud control-plane rollout
run-name: "Multicloud rollout ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      provider_confirmation:
        description: Type DEPLOY PROVIDER WORKERS
        required: true
        type: string
      gcp_dormant:
        description: Deploy the GCP provider explicitly dormant
        required: true
        default: false
        type: boolean
      gcp_dormant_confirmation:
        description: Type DEPLOY DORMANT GCP PROVIDER when GCP is dormant
        required: false
        default: ""
        type: string
      web_confirmation:
        description: Type DEPLOY WORKSHOP CONTROL PLANE
        required: true
        type: string
      single_operator_confirmation:
        description: Sole-operator confirmation when that production mode is active
        required: false
        default: ""
        type: string
      fresh_d1_cutover:
        description: Perform the protected old-D1 to fresh Drizzle D1 cutover
        required: true
        default: false
        type: boolean
      fresh_d1_cutover_confirmation:
        description: Type CUT OVER FRESH DRIZZLE D1 when fresh_d1_cutover is true
        required: false
        default: ""
        type: string
      source_snapshot_reset_confirmation:
        description: Type ARCHIVE SOURCE SNAPSHOT AND RESET CONTROL PLANE when fresh_d1_cutover is true
        required: false
        default: ""
        type: string
      source_database_id:
        description: UUID currently bound to the active production Worker
        required: false
        default: ""
        type: string
      source_database_name:
        description: Name currently paired with source_database_id
        required: false
        default: ""
        type: string
      target_database_id:
        description: Fresh D1 UUID committed in apps/web/wrangler.jsonc
        required: false
        default: ""
        type: string
      target_database_name:
        description: Name paired with target_database_id in apps/web/wrangler.jsonc
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: intar-control-plane-production
  cancel-in-progress: false
  queue: max

jobs:
  providers:
    name: Deploy both private providers
    uses: ./.github/workflows/provider-workers.yml
    with:
      deploy_hetzner: true
      deploy_gcp: true
      gcp_dormant: ${{ inputs.gcp_dormant }}
      gcp_dormant_confirmation: ${{ inputs.gcp_dormant_confirmation }}
      single_operator_confirmation: ${{ inputs.single_operator_confirmation }}
      parent_holds_control_plane_lock: true
      confirmation: ${{ inputs.provider_confirmation }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HETZNER_PROVIDER_API_TOKEN: ${{ secrets.CLOUDFLARE_HETZNER_PROVIDER_API_TOKEN }}
      CLOUDFLARE_GCP_PROVIDER_API_TOKEN: ${{ secrets.CLOUDFLARE_GCP_PROVIDER_API_TOKEN }}
      CLOUDFLARE_PROVIDER_PROBE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
      HETZNER_PROVIDER_CREDENTIAL_KEK_V1: ${{ secrets.HETZNER_PROVIDER_CREDENTIAL_KEK_V1 }}
      GCP_PROVIDER_CREDENTIAL_KEK_V1: ${{ secrets.GCP_PROVIDER_CREDENTIAL_KEK_V1 }}
      GCP_CATALOG_API_KEY: ${{ secrets.GCP_CATALOG_API_KEY }}

  web:
    name: Deploy web after provider capability gate
    needs: providers
    uses: ./.github/workflows/website-deploy.yml
    with:
      confirmation: ${{ inputs.web_confirmation }}
      single_operator_confirmation: ${{ inputs.single_operator_confirmation }}
      provenance_workflow_path: .github/workflows/control-plane-rollout.yml
      parent_holds_control_plane_lock: true
      fresh_d1_cutover: ${{ inputs.fresh_d1_cutover }}
      fresh_d1_cutover_confirmation: ${{ inputs.fresh_d1_cutover_confirmation }}
      source_snapshot_reset_confirmation: ${{ inputs.source_snapshot_reset_confirmation }}
      source_database_id: ${{ inputs.source_database_id }}
      source_database_name: ${{ inputs.source_database_name }}
      target_database_id: ${{ inputs.target_database_id }}
      target_database_name: ${{ inputs.target_database_name }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PROVIDER_PROBE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROVIDER_PROBE_API_TOKEN }}
      STARGATE_EGRESS_IPV4_CIDRS: ${{ secrets.STARGATE_EGRESS_IPV4_CIDRS }}
      INTAR_IMAGE_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
      BETA_MAINTENANCE_BYPASS_SECRET: ${{ secrets.BETA_MAINTENANCE_BYPASS_SECRET }}
