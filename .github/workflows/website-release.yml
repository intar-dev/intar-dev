name: Website release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Website release manual @ {0}', github.sha)
      || format('Website release main @ {0}', github.sha) }}

# The production release lane. It runs on every push to main that builds a
# website artifact, waits for that website run to finish green, and then
# deploys the artifact it proved.
#
# The split exists because the deploy lane refuses an artifact from a run that
# has not concluded, and a run can not deploy the artifact it is still
# uploading. A manual dispatch of this lane is the deliberate release path: it
# can hold the control plane closed (maintenance=on), return a release to
# service (maintenance=off), or ask for the registry delete campaign. A push
# can ask for none of those.
#
# The runtime ABI pin has one rule for each path. A routine release takes the
# newest verified guest-tools build on main, because the pin describes the
# objects the fleet already runs. A deliberate closed release must take the
# tools built from this exact revision, because that release changes the
# runtime contract.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/website-deploy.yml"
      - ".github/workflows/website-release.yml"
      - ".github/workflows/website.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "package.json"
      - "bun.lock"
      - "tsconfig.base.json"
      - "tools/check-import-boundaries.ts"
      - "tools/database/**"
      - "tools/deploy/**"
      - "tools/flagship/**"
      - "tools/vm-boot-benchmark/**"
      - "tools/vm-boot-benchmark.py"
      - "tools/test_vm_boot_benchmark.py"
      - "crates/intar-image-scenario/**"
      - "apps/web/**"
  workflow_dispatch:
    inputs:
      maintenance:
        description: auto follows pending migrations, on holds the control plane closed for a deliberate release, off returns the release to service
        required: false
        default: auto
        type: choice
        options:
          - auto
          - on
          - off
      registry_cleanup_mode:
        description: Image registry cleanup worker mode for this release
        required: false
        default: preserve
        type: choice
        options:
          - preserve
          - report-only
          - delete
      confirmation:
        description: Type DEPLOY WEB RELEASE
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: namespace-profile-intar-dev
    environment:
      name: production
      url: https://intar.dev
    timeout-minutes: 60
    outputs:
      static_pin_json: ${{ steps.pin.outputs.static_pin_json }}
      maintenance: ${{ steps.request.outputs.maintenance }}
      registry_cleanup_mode: ${{ steps.request.outputs.registry_cleanup_mode }}
      website_dist_run_id: ${{ steps.artifact.outputs.website_dist_run_id }}
    steps:
      - name: Validate the release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REQUESTED_MAINTENANCE: ${{ inputs.maintenance || 'auto' }}
          REQUESTED_CLEANUP_MODE: ${{ inputs.registry_cleanup_mode || 'preserve' }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/main
          case "${EVENT_NAME}" in
            push)
              # A push releases what the tests proved. It never closes the
              # plane on its own and never asks for the delete campaign, so an
              # unattended release can not change the runtime contract or
              # remove registry objects.
              test "${REQUESTED_MAINTENANCE}" = auto
              test "${REQUESTED_CLEANUP_MODE}" = preserve
              ;;
            workflow_dispatch)
              test "${CONFIRMATION}" = 'DEPLOY WEB RELEASE'
              ;;
            *)
              echo "unsupported release event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          case "${REQUESTED_MAINTENANCE}" in
            auto|on|off) ;;
            *) echo 'maintenance must be auto, on, or off' >&2; exit 1 ;;
          esac
          case "${REQUESTED_CLEANUP_MODE}" in
            preserve|report-only|delete) ;;
            *) echo 'registry_cleanup_mode must be preserve, report-only, or delete' >&2; exit 1 ;;
          esac
          {
            printf 'maintenance=%s\n' "${REQUESTED_MAINTENANCE}"
            printf 'registry_cleanup_mode=%s\n' "${REQUESTED_CLEANUP_MODE}"
          } >> "${GITHUB_OUTPUT}"
          printf 'maintenance=%s registry_cleanup_mode=%s\n' \
            "${REQUESTED_MAINTENANCE}" "${REQUESTED_CLEANUP_MODE}"

      - name: Checkout exact main revision
        uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: apps/web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked workspace tools
        run: bun install --frozen-lockfile

      - name: Wait for the tested website artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The deploy lane refuses an artifact from a run that has not
          # concluded, so this waits for the website run of this exact
          # revision and refuses a red one. Nothing is downloaded here.
          deadline=$(( $(date +%s) + 1800 ))
          run_id=""
          while :; do
            runs_json="${RUNNER_TEMP}/website-runs.json"
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/website.yml/runs?head_sha=${GITHUB_SHA}&per_page=10" \
              > "${runs_json}"
            run_id="$(jq -r --arg sha "${GITHUB_SHA}" '
              [ .workflow_runs[]
                | select(.head_sha == $sha and .head_branch == "main")
              ] | .[0].id // ""' "${runs_json}")"
            if [ -n "${run_id}" ]; then
              status="$(jq -r --argjson id "${run_id}" '
                [ .workflow_runs[] | select(.id == $id) ] | .[0].status' \
                "${runs_json}")"
              conclusion="$(jq -r --argjson id "${run_id}" '
                [ .workflow_runs[] | select(.id == $id) ] | .[0].conclusion' \
                "${runs_json}")"
              if [ "${status}" = completed ]; then
                if [ "${conclusion}" != success ]; then
                  echo "The website run for ${GITHUB_SHA} concluded ${conclusion}." >&2
                  echo "Nothing is deployed." >&2
                  exit 1
                fi
                break
              fi
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "No completed website run appeared for ${GITHUB_SHA} in 30 minutes." >&2
              exit 1
            fi
            sleep 20
          done
          printf 'website_dist_run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"
          printf 'Tested artifact run: %s\n' "${run_id}"


      - name: Resolve the verified guest-tools pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_MODE: ${{ steps.request.outputs.maintenance }}
        run: |
          set -euo pipefail
          runs_json="${RUNNER_TEMP}/guest-tools-runs.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/guest-tools-deploy.yml/runs?branch=main&status=success&per_page=20" \
            > "${runs_json}"
          if [ "${MAINTENANCE_MODE}" = auto ]; then
            tools_run_id="$(jq -er '
              [ .workflow_runs[]
                | select(
                    .conclusion == "success" and
                    .head_branch == "main" and
                    .event == "workflow_dispatch" and
                    (.path | endswith("guest-tools-deploy.yml"))
                  )
              ] | .[0].id' "${runs_json}")"
          else
            # A deliberate closed release changes the runtime contract, so the
            # pin must come from a tools build of this exact revision.
            tools_run_id="$(jq -er --arg sha "${GITHUB_SHA}" '
              [ .workflow_runs[]
                | select(
                    .conclusion == "success" and
                    .head_branch == "main" and
                    .head_sha == $sha and
                    .event == "workflow_dispatch" and
                    (.path | endswith("guest-tools-deploy.yml"))
                  )
              ] | .[0].id' "${runs_json}")"
          fi
          artifact_name="guest-tools-deployment-${tools_run_id}"
          artifacts_json="${RUNNER_TEMP}/guest-tools-artifacts.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${tools_run_id}/artifacts" \
            > "${artifacts_json}"
          jq -e --arg name "${artifact_name}" '
            [.artifacts[] | select(.name == $name and .expired == false)] |
            if length == 1 then
              .[0] as $artifact |
              ($artifact.id | type == "number") and
              ($artifact.digest |
                type == "string" and test("^sha256:[0-9a-f]{64}$"))
            else false end
          ' "${artifacts_json}" >/dev/null
          artifact_id="$(jq -er --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name)] | .[0].id' "${artifacts_json}")"
          expected_digest="$(jq -er --arg name "${artifact_name}" \
            '[.artifacts[] | select(.name == $name)] | .[0].digest' \
            "${artifacts_json}" | cut -d: -f2)"
          artifact_zip="${RUNNER_TEMP}/guest-tools-release.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "${artifact_zip}"
          test "$(sha256sum "${artifact_zip}" | cut -d ' ' -f 1)" = "${expected_digest}"
          release_dir="${RUNNER_TEMP}/guest-tools-release"
          mkdir -p "${release_dir}"
          python3 - "${artifact_zip}" "${release_dir}" <<'PY'
          import sys, zipfile
          archive_path, destination = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive_path) as archive:
              for name in archive.namelist():
                  if name.startswith("/") or ".." in name.split("/"):
                      sys.exit("unsafe artifact member: " + name)
              archive.extractall(destination)
          PY
          test -f "${release_dir}/candidate.json"
          jq -e '.schema_version == 1 and .bootstrap_abi == 2' \
            "${release_dir}/candidate.json" >/dev/null
          pin_file="${RUNNER_TEMP}/release-static-pin.json"
          evidence_file="${RUNNER_TEMP}/release-static-pin-evidence.json"
          bun tools/deploy/guest-tools-pin.ts release \
            --manifest "${release_dir}/candidate.json" \
            --disk "${release_dir}/tools.ext4.zst" \
            --kino "${release_dir}/kino" \
            --out "${pin_file}" > "${evidence_file}"
          jq -e '.status == "verified"' "${evidence_file}" >/dev/null
          bun tools/deploy/guest-tools-pin.ts check --pin "${pin_file}" >/dev/null
          {
            printf 'static_pin_json=%s\n' "$(jq -c . "${pin_file}")"
            printf 'tools_run_id=%s\n' "${tools_run_id}"
          } >> "${GITHUB_OUTPUT}"
          jq -c '{static_pin_sha256, compressed_disk_sha256, tools_disk_sha256, kino_sha256}' \
            "${evidence_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Activate the D1 upload admission switch for a delete release
        # An explicit prerequisite: only a dispatch that asked for delete turns
        # this on. It runs before the deploy job closes the plane, because the
        # registry sits behind the maintenance fence.
        if: steps.request.outputs.registry_cleanup_mode == 'delete'
        env:
          REGISTRY_PUBLISH_TOKEN: ${{ secrets.INTAR_IMAGE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          tools/deploy/registry-cleanup-activation.sh enforce \
            "${RUNNER_TEMP}/registry-cleanup-activation.json"
          jq -c '{ok, requested_mode, http_status, problem}' \
            "${RUNNER_TEMP}/registry-cleanup-activation.json" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: website-release-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-static-pin.json
            ${{ runner.temp }}/release-static-pin-evidence.json
            ${{ runner.temp }}/registry-cleanup-activation.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    name: Deploy production
    needs:
      - plan
    uses: ./.github/workflows/website-deploy.yml
    with:
      guest_tools_static_pin_json: ${{ needs.plan.outputs.static_pin_json }}
      maintenance: ${{ needs.plan.outputs.maintenance }}
      registry_cleanup_mode: ${{ needs.plan.outputs.registry_cleanup_mode }}
      website_dist_run_id: ${{ needs.plan.outputs.website_dist_run_id }}
    secrets: inherit
