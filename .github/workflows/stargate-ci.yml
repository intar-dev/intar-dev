name: Stargate Validate
run-name: "${{ github.event_name == 'pull_request' && format('Stargate validate PR #{0}', github.event.pull_request.number) || format('Stargate validate {0}', github.ref_name) }}"

on:
  pull_request:
    paths:
      - ".github/workflows/stargate-ci.yml"
      - ".github/workflows/stargate-release.yml"
      - "projects/stargate/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stargate-ci.yml"
      - ".github/workflows/stargate-release.yml"
      - "projects/stargate/**"

permissions:
  contents: read

jobs:
  verify:
    name: Run stargate checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        working-directory: projects/stargate
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          rustup show active-toolchain

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/stargate

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run checks
        working-directory: projects/stargate
        run: just verify
