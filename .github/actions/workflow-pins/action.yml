name: Rendered workflow pins
description: Never run. Lists the action pins only the rendered workflows use, so Dependabot proposes their updates.

# Dependabot skips the workflows rendered from ci/workflows, so a pin they use
# must also appear in a file it scans: this one, another composite action, or
# scenario-publish.yml. The workflow policy enforces that. After Dependabot bumps
# a pin, replace its SHA and tag in ci/gha/pins.cue in the same pull request,
# then run `cuenv sync codegen`.
runs:
  using: composite
  steps:
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
    - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9
