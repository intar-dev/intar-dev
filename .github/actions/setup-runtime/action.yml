name: Set up the CI runtime
description: Install the pinned Node and Bun toolchains this repository builds with.

# Checkout stays with the caller and nothing is installed here, because docs/ sits
# outside the Bun workspace, the Playwright job needs unzip before Bun, and the
# cleanup status and resolve actions need neither toolchain.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: apps/web/.node-version

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
