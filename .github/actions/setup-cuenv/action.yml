name: Set up cuenv
description: Install the pinned cuenv release and its CUE schema module after checking their SHA-256 digests.

# Checkout stays with the caller.
runs:
  using: composite
  steps:
    - name: Install cuenv
      shell: bash
      env:
        CUENV_VERSION: 0.81.1
        # GitHub's digests for the cuenv-linux-x64, cuenv-linux-arm64 and
        # cuenv-darwin-arm64 assets of that release.
        CUENV_SHA256_X64: f9474ef178a0db827ce5f4f02aac532eb88fb2e21bbb088b2959eb8dd193b3cc
        CUENV_SHA256_ARM64: 287b3e20a643961fab6a6a49718a50ac5c9a28a932f806c3585dbe43dd0a70e8
        CUENV_SHA256_DARWIN_ARM64: 2a1de88e95ab4cf12071ec2d0af93d3412ae464ba3b9daa08bcbb39e707f7244
        # The zip and module.cue layers that registry.cue.works serves for
        # github.com/cuenv/cuenv@v0.81.1, the dependency in cue.mod/module.cue.
        SCHEMA_ZIP_SHA256: f0069932e71b82ae24c650cab08a0730385b200286be34a48df7733fa068735f
        SCHEMA_MOD_SHA256: 77706f46e39a8ece29c2891653131fa6643a964119f4b11aba89da0e4768cbe6
      run: |
        set -euo pipefail
        case "$(uname -sm)" in
          "Linux x86_64") asset=cuenv-linux-x64 CUENV_SHA256="${CUENV_SHA256_X64}" ;;
          "Linux aarch64") asset=cuenv-linux-arm64 CUENV_SHA256="${CUENV_SHA256_ARM64}" ;;
          "Darwin arm64") asset=cuenv-darwin-arm64 CUENV_SHA256="${CUENV_SHA256_DARWIN_ARM64}" ;;
          *) echo "No cuenv binary is pinned for $(uname -sm)." >&2; exit 1 ;;
        esac
        # macOS has shasum where Linux has sha256sum.
        command -v sha256sum > /dev/null || sha256sum() { shasum -a 256 "$@"; }
        bin="${RUNNER_TEMP}/cuenv-${CUENV_VERSION}"
        mkdir -p "${bin}"
        curl -fsSL --retry 3 -o "${bin}/cuenv" \
          "https://github.com/cuenv/cuenv/releases/download/${CUENV_VERSION}/${asset}"
        echo "${CUENV_SHA256}  ${bin}/cuenv" | sha256sum -c -
        chmod +x "${bin}/cuenv"
        "${bin}/cuenv" --version

        # The schema decides what every task runs, and CUE modules have no sum
        # file. Seed a fresh CUE cache with the verified layers and turn the
        # registry off, so a moved tag cannot change a task.
        cache="${RUNNER_TEMP}/cue-cache"
        mod="${cache}/mod/download/github.com/cuenv/cuenv/@v/v${CUENV_VERSION}"
        mkdir -p "$(dirname "${mod}")"
        blobs='https://registry.cue.works/v2/github.com/cuenv/cuenv/blobs/sha256:'
        curl -fsSL --retry 3 -o "${mod}.zip" "${blobs}${SCHEMA_ZIP_SHA256}"
        curl -fsSL --retry 3 -o "${mod}.mod" "${blobs}${SCHEMA_MOD_SHA256}"
        printf '%s  %s\n' "${SCHEMA_ZIP_SHA256}" "${mod}.zip" "${SCHEMA_MOD_SHA256}" "${mod}.mod" | sha256sum -c -
        echo "CUE_CACHE_DIR=${cache}" >> "${GITHUB_ENV}"
        echo 'CUE_REGISTRY=none' >> "${GITHUB_ENV}"
        # Last, so a later always() step cannot find cuenv unless the schema
        # checked out and the registry is off.
        echo "${bin}" >> "${GITHUB_PATH}"
