name: Set up Rust
description: Install the pinned Rust toolchain, Cargo tools, and Zig this repository builds with.

inputs:
  targets:
    description: Extra rustup targets, space-separated, on top of rust-toolchain.toml's.
    required: false
    default: ""
  namespace-cache:
    description: >-
      Use the runner's caches: the Namespace Rust cache, and Zig from the tool
      cache with its global cache. 'false' on a GitHub-hosted runner and for a
      release build, since pull request runs write them.
    required: false
    default: "true"
  desktop-libraries:
    description: >-
      Install the libraries GPUI links on Linux, for a job that builds the
      whole workspace and so apps/jumper. The versions are the runner
      image's; fontconfig, xcb and pkg-config are already on it.
    required: false
    default: "false"

# Checkout stays with the caller. The components and target match
# rust-toolchain.toml; installing them here keeps the first Cargo run from
# installing them implicitly.
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install 1.100.0 --profile minimal
        rustup component add --toolchain 1.100.0 rustfmt clippy
        # TARGETS is word-split on purpose: one argument per target.
        rustup target add --toolchain 1.100.0 x86_64-unknown-linux-musl ${TARGETS}
        rustup show active-toolchain
        # The git CLI clones GPUI's zed repository faster than Cargo's built-in
        # git, which an uncached release build otherwise spends about a
        # minute on.
        echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "${GITHUB_ENV}"

    # apps/jumper builds on GPUI, which links these on Linux. Only a job that
    # builds the whole workspace needs them; a release build builds one
    # product and runs on another image, where these versions do not exist.
    - name: Install the desktop app's system libraries
      if: inputs.desktop-libraries == 'true'
      shell: bash
      run: |
        sudo apt-get update
        # One line: the workflow policy checks the pins line by line.
        sudo apt-get install --yes --no-install-recommends libwayland-dev=1.24.0-2 libxkbcommon-dev=1.13.1-1 libxkbcommon-x11-dev=1.13.1-1 libx11-xcb-dev=2:1.8.13-1ubuntu0.1 libvulkan-dev=1.4.341.0-1

    - name: Set up Namespace caches
      if: inputs.namespace-cache == 'true'
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
      with:
        cache: rust

    - name: Install cargo-nextest, cargo-zigbuild, and cargo-audit
      uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
      with:
        tool: cargo-nextest@0.9.149,cargo-zigbuild@0.24.0,cargo-audit@0.22.2
        fallback: none

    - name: Install Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.17.0
        # Without the tool cache, setup-zig downloads Zig and checks its
        # signature.
        use-cache: ${{ inputs.namespace-cache }}
        use-tool-cache: ${{ inputs.namespace-cache }}
