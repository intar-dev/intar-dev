name: Set up Rust
description: Install the pinned Rust toolchain, Cargo tools, and Zig this repository builds with.

inputs:
  targets:
    description: Extra rustup targets, space-separated, on top of rust-toolchain.toml's.
    required: false
    default: ""
  namespace-cache:
    description: >-
      Use the runner's caches: the Namespace Rust cache, and Zig from the tool
      cache with its global cache. 'false' on a GitHub-hosted runner and for a
      release build, since pull request runs write them.
    required: false
    default: "true"

# Checkout stays with the caller. The components and target match
# rust-toolchain.toml; installing them here keeps the first Cargo run from
# installing them implicitly.
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        rustup toolchain install 1.99.1 --profile minimal
        rustup component add --toolchain 1.99.1 rustfmt clippy
        # TARGETS is word-split on purpose: one argument per target.
        rustup target add --toolchain 1.99.1 x86_64-unknown-linux-musl ${TARGETS}
        rustup show active-toolchain

    - name: Set up Namespace caches
      if: inputs.namespace-cache == 'true'
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
      with:
        cache: rust

    - name: Install cargo-nextest, cargo-zigbuild, and cargo-audit
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
      with:
        tool: cargo-nextest@0.9.149,cargo-zigbuild@0.24.0,cargo-audit@0.22.2
        fallback: none

    - name: Install Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: 0.17.0
        # Without the tool cache, setup-zig downloads Zig and checks its
        # signature.
        use-cache: ${{ inputs.namespace-cache }}
        use-tool-cache: ${{ inputs.namespace-cache }}
